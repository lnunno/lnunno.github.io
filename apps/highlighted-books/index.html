"review":"Lizard fight Rat, big fun.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1761908773l/243404495.jpg","asin":"B0FVXWRSG5","goodreadsUrl":"https://www.goodreads.com/book/show/243404495-starseer-s-ruin","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"scion-1d95acc2","readMonth":{"month":"Apr","year":"2026","day":"07","sort":"2026-04-07"},"title":"Scion","author":"Islington, James","series":"","review":"2.75/5\\n\\nI received a copy of this book on Netgalley in exchange for an honest review.\\n\\nThis one is ok, just below the standard of what I normally read and one of the most underwhelming of the year in terms of quality of the writing and world building. The plot is fine, I just never really found myself wanting to pick this up and find out what was going to happen. For how short this book is, that's a major problem.\\n\\nIf you want a beach read or something that doesn't require much brain power this might be decent to pick up but it felt pretty uninspired to me. I'd recommend Last Contract of Isako instead for a modern fantasy author dipping their toes into Cyberpunk, that was much better.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":2.75,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1771941067l/247756858.jpg","asin":"1668239248","goodreadsUrl":"https://www.goodreads.com/book/show/247756858-scion","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"mystic-river-2f9ebd53","readMonth":{"month":"Apr","year":"2026","day":"10","sort":"2026-04-10"},"title":"Mystic River","author":"Lehane, Dennis","series":"","review":"Amazing character work and dialogue, one of my favorite crime novels of all-time. Will be reading more Lehane this year.","highlightCount":35,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1731838605l/59111197.jpg","asin":"B000JMKNWE","goodreadsUrl":"https://www.goodreads.com/book/show/59111197-mystic-river","kindleUrl":"https://amazon.com/dp/B000JMKNWE","matchMethod":"asin"},{"id":"scar-bf43911a","readMonth":{"month":"Apr","year":"2026","day":"20","sort":"2026-04-20"},"title":"The Scar","author":"Miéville, China","series":"New Crobuzon, #2","review":"I struggled with Perdido and had heard nothing but good things about this one and...it was absolutely true, went above and beyond my high expectations. Absolutely masterful book and perfectly put together, probably will be my favorite book this year. Will be thinking about this one for a long time to come. Amazing world building and some really great subtle character work. Extremely impressive piece of art that was paced extraordinarily well and had such richness, depth, and epic scale. For so much of the ground work he put in on this world to come together in this way is just incredible, cannot recommend this enough.","highlightCount":83,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1603291156l/19882713.jpg","asin":"B000FBFM70","goodreadsUrl":"https://www.goodreads.com/book/show/19882713-the-scar","kindleUrl":"https://amazon.com/dp/B000FBFM70","matchMethod":"asin"},{"id":"termination-shock-30cb31a4","readMonth":{"month":"Apr","year":"2026","day":"22","sort":"2026-04-22"},"title":"Termination Shock","author":"Stephenson, Neal","series":"","review":"Weirdly put together book that doesn't really work. Stephenson is usually a balance of quirkiness and big ideas but this way more on the side of overly quirky and a bit goofy and too light on the ideas.","highlightCount":1,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1622837475l/57357418.jpg","asin":"B08WLWC6GZ","goodreadsUrl":"https://www.goodreads.com/book/show/57357418-termination-shock","kindleUrl":"https://amazon.com/dp/B08WLWC6GZ","matchMethod":"asin"},{"id":"walking-to-aldebaran-abd6d2df","readMonth":{"month":"Apr","year":"2026","day":"24","sort":"2026-04-24"},"title":"Walking to Aldebaran","author":"Tchaikovsky, Adrian","series":"","review":"Fun story. Good balance of humor and sci-fi ideas.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1539510199l/42201505.jpg","asin":"1781087067","goodreadsUrl":"https://www.goodreads.com/book/show/42201505-walking-to-aldebaran","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"one-day-all-this-will-be-yours-d146899c","readMonth":{"month":"Apr","year":"2026","day":"25","sort":"2026-04-25"},"title":"One Day All This Will Be Yours","author":"Tchaikovsky, Adrian","series":"","review":"Really fun time travel story, one of his better novellas","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1593355556l/54303485.jpg","asin":"1781088748","goodreadsUrl":"https://www.goodreads.com/book/show/54303485-one-day-all-this-will-be-yours","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blood-and-bone-novel-of-malazan-empire-9b21cede","readMonth":{"month":"May","year":"2026","day":"01","sort":"2026-05-01"},"title":"Blood and Bone: A Novel of the Malazan Empire","author":"Esslemont, Ian C.","series":"","review":"Esslemont wins my award for most improved author, such a big growth from Night of Knives being kind of bad to Crimson Guard being extremely messy and all over the place but cool and Orb Sceptre Throne and Blood and Bone being just as good or better than some of the main series books.\\n\\nI think it helped that I read this faster than I have the other Esslemont books, there is some trudging through the jungle but reading it quickly probably helped keep things fresh and the momentum going.\\n\\nExtremely compelling lore and world building and characters I cared about, got a little choked up in a couple moments towards the end. Has enough crumbs of answers in the overall Malazan lore but also reveals more mystery behind everything, just a masterfully built universe here that's one of my favorite fantasy settings.","highlightCount":69,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1728764259l/220363083.jpg","asin":"B00AF62ETY","goodreadsUrl":"https://www.goodreads.com/book/show/220363083-blood-and-bone","kindleUrl":"https://amazon.com/dp/B00AF62ETY","matchMethod":"asin"},{"id":"there-is-no-antimemetics-division-5f1d7e5d","readMonth":{"month":"May","year":"2026","day":"05","sort":"2026-05-05"},"title":"There Is No Antimemetics Division","author":"qntm","series":"","review":"Cool sci-fi horror book that delves into memory and human perception in interesting ways. This is more of an ideas book and it struggles a bit in the first half to connect everything together but the second half does a lot better making this a cohesive story.\\n\\nThe way it activates some of the primal horror in our brains is particularly well done in terms of us filtering out the bombardment of our senses, our brains trying to make sense of the world, and what ultimately happens when that fails is really compelling. Also fighting something that kills you if you are aware of it is just a cool concept.\\n\\nSome really cool horror ideas though and you really get a lot of variety in a short book so I definitely recommend it. Scratched some of the same itches that Severance, Uzumaki, and Phillip K Dick often does and would recommend to fans of those.","highlightCount":29,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1741160184l/223469227.jpg","asin":"B0DSJ2LW2Z","goodreadsUrl":"https://www.goodreads.com/book/show/223469227-there-is-no-antimemetics-division","kindleUrl":"https://amazon.com/dp/B0DSJ2LW2Z","matchMethod":"asin"},{"id":"house-of-open-wounds-eb9fbc1b","readMonth":{"month":"May","year":"2026","day":"12","sort":"2026-05-12"},"title":"House of Open Wounds","author":"Tchaikovsky, Adrian","series":"The Tyrant Philosophers #2","review":"","highlightCount":15,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1694565498l/198679312.jpg","asin":"B0CHHZL9KC","goodreadsUrl":"https://www.goodreads.com/book/show/198679312-house-of-open-wounds","kindleUrl":"https://amazon.com/dp/B0CHHZL9KC","matchMethod":"asin"},{"id":"ship-of-fools-d5b7fc09","readMonth":{"month":"May","year":"2026","day":"17","sort":"2026-05-17"},"title":"Ship of Fools","author":"Russo, Richard Paul","series":"","review":"This isn't exactly what I expected but it was quite good. A lot more emphasis on subtle characterization and some interpersonal politics along with interweaving religion and faith with the alien aspects. It did deliver on the reputation it has of sci-fi horror and exploring spooky alien ships but this wasn't really the focus which was a little unexpected.\\n\\nA lot of the mystery and clues don't really lead anywhere or we don't get clear answers so it's very open ended, could sort of be a negative but I think this lends to the idea of certain beings that we can't truly understand, some interesting things to think about, but I definitely won't obsess over anything unresolved. Some good character moments.\\n\\nGood depiction of just how alien other life forms might be and the horror creeping in of something inescapable. The pacing is good and the short chapters kept things fresh and the writing style of first person retrospective was effective, I recommend giving it a shot.","highlightCount":15,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328337821l/6667802.jpg","asin":"B000P46RUI","goodreadsUrl":"https://www.goodreads.com/book/show/6667802-ship-of-fools","kindleUrl":"https://amazon.com/dp/B000P46RUI","matchMethod":"asin"},{"id":"assail-a14f7cd7","readMonth":{"month":"May","year":"2026","day":"27","sort":"2026-05-27"},"title":"Assail","author":"Esslemont, Ian C.","series":"Novels of the Malazan Empire, #6","review":"3.5/5 Solid and enjoyable, had a bit higher expectations for some of the lore implications so it might have let me down a bit there but overall a really fun time on a continent we've never seen before.\\n\\nHis last two books I connected with a bit more but this one had some good stuff, just sort of continues the issues where it'd be a bit stronger if he cut a couple POVs and focused on some a bit more.\\n\\nI'm definitely going to continue with Path to Ascendency and also retry Kharkhanas again in the future, love the Malazan setting and world and it's fun to be more caught up with all the lore.","highlightCount":15,"myGoodreadsRating":4,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1409686248l/20634579.jpg","asin":"B00HXZZXAM","goodreadsUrl":"https://www.goodreads.com/book/show/20634579-assail","kindleUrl":"https://amazon.com/dp/B00HXZZXAM","matchMethod":"asin"},{"id":"inhibitor-phase-d795fe30","readMonth":{"month":"Jun","year":"2026","day":"03","sort":"2026-06-03"},"title":"Inhibitor Phase","author":"Reynolds, Alastair","series":"Revelation Space, #4","review":"This one fits in weirdly to this series because it's basically a retroactive ending of the series where it technically ended with the previous book but this fills in what happened instead of an abrupt epilogue to an unrelated (but good) story.\\n\\nReally enjoyed this one, pretty fun space opera and uses the world building of the series to good effect. Lots of interesting exploration of humanity's survival of extinction events, memory, consciousness.\\n\\nReynolds kind of is best when you view each book as mostly standalone new adventures, although it does build off of everything before. You absolutely need to read all the previous books to have any idea what's happening here.","highlightCount":20,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1710015289l/55954564.jpg","asin":"B08HLQV5ZG","goodreadsUrl":"https://www.goodreads.com/book/show/55954564-inhibitor-phase","kindleUrl":"https://amazon.com/dp/B08HLQV5ZG","matchMethod":"asin"},{"id":"spin-87f1c552","readMonth":{"month":"Jun","year":"2026","day":"07","sort":"2026-06-07"},"title":"Spin","author":"Wilson, Robert Charles","series":"Spin Saga, #1","review":"Really good character-forward sci-fi and has a lot of good ideas that progressively build upon each other and come together in a satisfying way. Enjoyed the writing style as well, I'll be checking out more from this author in the future. I did feel pretty satisfied with the ending and there's more books in this universe so we'll see if I continue this or check out something new by him.","highlightCount":32,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1315804598l/10504636.jpg","asin":"B0016IXMWI","goodreadsUrl":"https://www.goodreads.com/book/show/10504636-spin","kindleUrl":"https://amazon.com/dp/B0016IXMWI","matchMethod":"title-author"}]`),cl=py,wl=new Intl.NumberFormat("en-US"),fy=[0,1,5,10,20,50,75,100,150,200],wy=["5","4","3","2","1"],by=700;function Am(g){return g.toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim()}function Im(g,B){return!!g.includes(B)}function Hm(g){const{month:B,year:C}=g.readMonth;return B&&C?`${B} ${C}`:"Undated"}function vy(g){const{month:B,day:C,year:c,sort:j}=g.readMonth;return B&&C&&c?`${B} ${Number(C)}, ${c}`:j||Hm(g)}function Li(g){return g.replace(/\._S[XY]\d+_?/g,"._SY640_").replace(/\._SL\d+_?/g,"._SL640_").replace(/\._SX\d+_?/g,"._SX420_").replace(/\/books\/(\d+)[a-z]\//,"/books/$1l
