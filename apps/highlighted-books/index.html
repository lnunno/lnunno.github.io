atchMethod":"goodreads-only"},{"id":"parasyte-8-5ec0e146","readMonth":{"month":"Oct","year":"2023","day":"09","sort":"2023-10-09"},"title":"Parasyte Vol. 8","author":"Iwaaki, Hitoshi","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1453649851l/28687638.jpg","asin":"B0184T6U48","goodreadsUrl":"https://www.goodreads.com/book/show/28687638-parasyte-vol-8","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"grey-seer-8f729cfd","readMonth":{"month":"Oct","year":"2023","day":"16","sort":"2023-10-16"},"title":"Grey Seer","author":"Werner, C.L.","series":"Warhammer: Thanquol & Boneripper, #1","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388474211l/6634284.jpg","asin":"1844167399","goodreadsUrl":"https://www.goodreads.com/book/show/6634284-grey-seer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"let-me-in-ea4b0150","readMonth":{"month":"Oct","year":"2023","day":"17","sort":"2023-10-17"},"title":"Let Me In","author":"Ajvide Lindqvist, John","series":"","review":"Visceral, uncomfortable, and disturbing. Feels like a realistic take on what would actually happen if vampires existed. Great small town dynamics and complex characters that have varied motivations. Tackles a lot of uncomfortable topics head on that I imagine will be off putting to a lot of people.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1442621958l/7911377.jpg","asin":"0312656491","goodreadsUrl":"https://www.goodreads.com/book/show/7911377-let-me-in","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"neutronium-alchemist-90101c1f","readMonth":{"month":"Oct","year":"2023","day":"24","sort":"2023-10-24"},"title":"The Neutronium Alchemist","author":"Hamilton, Peter F.","series":"Night's Dawn, #2","review":"Honestly sort of struggled with this one. It also feels like such a middle book where the beginning is a lot of climax and falling action before introducing the main drive for this book. And nothing is really resolved after 1200 pages which can feel a bit unrewarding even though there's a lot of good stuff in between.\\n\\nThe main plot point I did struggle to get motivated by or at least the moment to moment parts were less interesting than the first book, but the drives behind it and the potential consequences are very high.\\n\\nThe horror elements felt a lot less prevalent here as well which I sort of view as a negative since I really enjoyed that in the first book and was missing those here.\\n\\nThe amount of plot lines and the complexity of the world and events almost hit a breaking point for me, but it barely holds things together here and we do get some really good moments and some of the characters we've been interacting with have interesting and high consequence things to do.\\n\\nThere's also a lot of complexity in the motivations and the different factions where even the main protagonist and antagonist factions have many different sub factions who have different motivations and objectives.\\n\\nOverall this is a lot of book and can feel overwhelming a lot of times but it's also really good and so much is left unanswered that I do want to know how PFH wraps it all up.\\n\\nPretty impressed as well how this maintains the brand of big bold and unforgiving science fiction but in a drastically different way from the previous book. Makes it easy to respect the sheer will and ambition of the series even though it can feel like drowning at times.\\n\\nWill take a bit of a breather before I slowly digest the last book and see what's in store for this crazy universe this man has crafted.","highlightCount":29,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328149850l/8140432.jpg","asin":"B002O0Q6ZC","goodreadsUrl":"https://www.goodreads.com/book/show/8140432-the-neutronium-alchemist","kindleUrl":"https://amazon.com/dp/B002O0Q6ZC","matchMethod":"asin"},{"id":"passing-of-dragon-1d5861b6","readMonth":{"month":"Oct","year":"2023","day":"24","sort":"2023-10-24"},"title":"The Passing of the Dragon","author":"Liu, Ken","series":"","review":"A bit too on the nose for me and tries to do too much with its short page count. I'm a huge fan of Liu's other work but this was a miss for me. Having a story be about contemporary online art criticism really doesn't resonate with me unfortunately.","highlightCount":3,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1692979459l/197351497.jpg","asin":"B0CG4L57LK","goodreadsUrl":"https://www.goodreads.com/book/show/197351497-the-passing-of-the-dragon","kindleUrl":"https://amazon.com/dp/B0CG4L57LK","matchMethod":"asin"},{"id":"doctor-sleep-620ca45f","readMonth":{"month":"Oct","year":"2023","day":"27","sort":"2023-10-27"},"title":"Doctor Sleep","author":"King, Stephen","series":"The Shining, #2","review":"Had a good time with this one, not King's absolute best but think it serves as an interesting continuation of the story. King is one of the best at making long time period coming of age feel authentic and this is no exception. Had some great themes to investigate and diving even deeper into King's magic system was fun as it has implications across his multiverse of stories and this has been the most direct look into it that I've seen across his books that I've read. Also had really good thriller aspects that kept me engaged and wanting to know what would happen next.","highlightCount":9,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1730549760l/48904713.jpg","asin":"B00A6CCF0K","goodreadsUrl":"https://www.goodreads.com/book/show/48904713-doctor-sleep","kindleUrl":"https://amazon.com/dp/B00A6CCF0K","matchMethod":"asin"},{"id":"solaris-2d3948bd","readMonth":{"month":"Oct","year":"2023","day":"29","sort":"2023-10-29"},"title":"Solaris","author":"Lem, Stanisław","series":"","review":"**spoiler alert** I was sort of hoping that the book would build more and more on the horror elements but in many ways the focus of this was the love story between Kelvin and Harey which I didn't expect and was a bit strange for me. I don't think I fully bought into the why aspect of this but there was a lot of struggle internally with Kelvin and a lot of ways he was the most unreasonable character and everyone else on the station tries to make him snap out of it (even Harey)\\n\\nI did like the philosophy towards the end about whether God is a clock maker but didn't create time and relating that to some of the impossibility of understanding something completely alien.\\n\\nThe tangents into some of the in world books and science I was sort of eh on and felt like similarly with Lovecraft there's a lot of rumination that sort of makes the pacing of the story stumble a bit\\n\\nOverall pretty solid book","highlightCount":32,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1542980613l/23632478.jpg","asin":"B00Q21MVAI","goodreadsUrl":"https://www.goodreads.com/book/show/23632478-solaris","kindleUrl":"https://amazon.com/dp/B00Q21MVAI","matchMethod":"asin"},{"id":"wizard-of-earthsea-5f4f59d6","readMonth":{"month":"Oct","year":"2023","day":"31","sort":"2023-10-31"},"title":"A Wizard of Earthsea","author":"Le Guin, Ursula K.","series":"Earthsea Cycle, #1","review":"There's beauty in simplicity. Seemingly simple words strung together in a way that can evoke vivid visuals and explore deep and complex themes. The story is also fairly simple but covers a huge amount of ground and is able to explore a huge number of relationships, events, and evolution in Ged's life. The world is rich and detailed without Le Guin really spending a huge amount of time explaining things; instead the reader explores the world with Ged and learns alongside him.\\n\\nI also think the story is unique and Le Guin delves into a lot of the motivation in the afterward as well and how she's able to do that without having war and violence be at the center of the novel (although Ged straight up kills a couple of people lol). Also didn't really feel like this was focused on pandering to teens and it feels like a fully adult novel, just has a character that is coming of age throughout the story but it deals with weighty themes and confronts the reader with big questions about humanity and our place in it relative to nature, among many other things.\\n\\nWasn't really expecting to love this as much as I did, I read the Dispossessed a few years ago and it was very pulled back prose-wise in order to make the politics the center of the novel, this book has no such qualms. Le Guin is only operating in the constraints where she wants the novel to be accessible to a large number of readers, but the language is often strikingly beautiful and vivid. There are some complex sections as well and she doesn't hold back on the world being grand in scale and having a lot of mystery.","highlightCount":44,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1453835082l/16029682.jpg","asin":"B008T9L6AM","goodreadsUrl":"https://www.goodreads.com/book/show/16029682-a-wizard-of-earthsea","kindleUrl":"https://amazon.com/dp/B008T9L6AM","matchMethod":"asin"},{"id":"tombs-of-atuan-dd5c38cb","readMonth":{"month":"Nov","year":"2023","day":"05","sort":"2023-11-05"},"title":"The Tombs of Atuan","author":"Le Guin, Ursula K.","series":"Earthsea Cycle, #2","review":"The atmosphere in this book was incredible and the prose is top notch. I do feel like I wanted a tad more complexity in the plot or characters to push this to five stars but still had a great time reading this. Le Guin gives me a lot to think about, her themes are very complex.","highlightCount":30,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1708731830l/17214743.jpg","asin":"B008GTB52E","goodreadsUrl":"https://www.goodreads.com/book/show/17214743-the-tombs-of-atuan","kindleUrl":"https://amazon.com/dp/B008GTB52E","matchMethod":"asin"},{"id":"scarab-path-c4b54758","readMonth":{"month":"Nov","year":"2023","day":"10","sort":"2023-11-10"},"title":"The Scarab Path","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #5","review":"This might be the best one yet, a lot of payoff on lore and character arcs that have been building up in the previous books in a cool new setting. Also think Tchaikovsky's prose was really nice in this one, had a lot of passages I wanted to highlight and think about.\\n\\nThe series is very military and action focused which at times I feel like I can get fatigued about it but overall the action is very cool and well written.\\n\\nLooking forward to the next one quite a bit, back on the bugbook train, bugman take the wheel!","highlightCount":40,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1635607935l/57136690.jpg","asin":"B003X27L2C","goodreadsUrl":"https://www.goodreads.com/book/show/57136690-the-scarab-path","kindleUrl":"https://amazon.com/dp/B003X27L2C","matchMethod":"title-author"},{"id":"confederation-handbook-07fe9889","readMonth":{"month":"Nov","year":"2023","day":"11","sort":"2023-11-11"},"title":"The Confederation Handbook","author":"Hamilton, Peter F.","series":"","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1344267558l/126413.jpg","asin":"0446610275","goodreadsUrl":"https://www.goodreads.com/book/show/126413.The_Confederation_Handbook","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"dregs-of-empire-ecc44ccc","readMonth":{"month":"Nov","year":"2023","day":"18","sort":"2023-11-18"},"title":"The Dregs of Empire","author":"Ruocchio, Christopher","series":"The Sun Eater, #5.5","review":"I really liked this a lot. Great side story that had really good pacing. Somehow Ruocchio's writing gets better every book and he was already one of the best, this one was really balanced with great prose, impactful character moments, and the plot is also very clear and focused.\\n\\nLorian is such a great character and getting to know him well in this book should payoff in future books as well as enhance re-reads tremendously. I'll be unclear how essential this book will be until I read Disquiet Gods but it's definitely worth anyone's time who has read through Ashes of Man.","highlightCount":41,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1696118464l/199239732.jpg","asin":"B0CK4DRCHD","goodreadsUrl":"https://www.goodreads.com/book/show/199239732-the-dregs-of-empire","kindleUrl":"https://amazon.com/dp/B0CK4DRCHD","matchMethod":"asin"},{"id":"dead-zone-01fefabe","readMonth":{"month":"Nov","year":"2023","day":"20","sort":"2023-11-20"},"title":"The Dead Zone","author":"King, Stephen","series":"","review":"This was solid, definitely very far from my favorite King but I was entertained and glad I read it.\\n\\nThe parts were better than the sum for me, it felt like a slightly disjointed book and wasn't tied together as much as I wanted. Felt like it had concepts for multiple different books that didn't quite fit together and the beginning is very different from the end.\\n\\nI do think I read this at a good time as I've read some of the big King books he's written both prior to and after the Dead Zone and this one sort of sits between a few others in King's multiverse.\\n\\nWhich for that alone I'm glad to have read it as you can see a lot of DNA here for future (and better) King books.","highlightCount":21,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1735729820l/28254557.jpg","asin":"B018ER7L5W","goodreadsUrl":"https://www.goodreads.com/book/show/28254557-the-dead-zone","kindleUrl":"https://amazon.com/dp/B018ER7L5W","matchMethod":"asin"},{"id":"tales-of-sun-eater-3-55f77c97","readMonth":{"month":"Nov","year":"2023","day":"24","sort":"2023-11-24"},"title":"Tales of the Sun Eater, Volume 3","author":"Ruocchio, Christopher","series":"","review":"Every one of these stories were damn good and expanded the world and lore in really cool ways. Also had some awesome action sequences. Definitely think a couple of these are critical before Disquiet Gods, some really big revelations and teasers for the next book. Big HYPE","highlightCount":21,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1693363395l/198175881.jpg","asin":"B0CGVJS91D","goodreadsUrl":"https://www.goodreads.com/book/show/198175881-tales-of-the-sun-eater-volume-3","kindleUrl":"https://amazon.com/dp/B0CGVJS91D","matchMethod":"asin"},{"id":"reversal-0f865205","readMonth":{"month":"Nov","year":"2023","day":"26","sort":"2023-11-26"},"title":"The Reversal","author":"Connelly, Michael","series":"The Lincoln Lawyer, #3; Harry Bosch Universe, #22","review":"Really close to a 5 star read but was hoping to see sort of a different ending. Everything leading up to it was great though. Connelly's attention to detail in both the investigation and trial makes the book feel realistic and engaging. Loved the team up and utilizes the strong characters he's built up in previous books.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1633650879l/59237968.jpg","asin":"B003BW0CB "asin":"B0923CS16Y","goodreadsUrl":"https://www.goodreads.com/book/show/57920420-real-vol-3","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"justice-of-kings-d31f2408","readMonth":{"month":"Nov","year":"2023","day":"30","sort":"2023-11-30"},"title":"The Justice of Kings","author":"Swan, Richard","series":"Empire of the Wolf, #1","review":"I've been wanting to read this book for some time and had high expectations for it. It's met and exceeded them. Now that book 3 is almost out it was a good time to begin the trilogy.\\n\\nLoved the core mystery of the book, the horror elements, and the zoomed-in feeling that soaked in the atmosphere and made the violence very visceral and high stakes.\\n\\nThe characters were also fantastic and had interesting backstories that were quickly told and the pacing of the whole book was perfect, definitely wanted to keep reading and see what would happen next. Excited to read the rest of the trilogy very soon.","highlightCount":30,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1635718816l/58293284.jpg","asin":"B096RTL1DN","goodreadsUrl":"https://www.goodreads.com/book/show/58293284-the-justice-of-kings","kindleUrl":"https://amazon.com/dp/B096RTL1DN","matchMethod":"asin"},{"id":"lord-of-light-e1ce850e","readMonth":{"month":"Dec","year":"2023","day":"01","sort":"2023-12-01"},"title":"Lord of Light","author":"Zelazny, Roger","series":"","review":"","highlightCount":18,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1547173710l/43534546.jpg","asin":"B07MSJZDFX","goodreadsUrl":"https://www.goodreads.com/book/show/43534546-lord-of-light","kindleUrl":"https://amazon.com/dp/B07MSJZDFX","matchMethod":"asin"},{"id":"real-4-389d1cf8","readMonth":{"month":"Dec","year":"2023","day":"01","sort":"2023-12-01"},"title":"Real, Vol. 4","author":"Inoue, Takehiko","series":"リアル / REAL #4","review": ,"review":"Loved this one from beginning to end. Great Bosch backstory and an interesting case with a lot of twists and turns. Really kept me guessing and the way everything came together was masterful.","highlightCount":22,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1633649675l/59237903.jpg","asin":"B000FC1MM8","goodreadsUrl":"https://www.goodreads.com/book/show/59237903-the-last-coyote","kindleUrl":"https://amazon.com/dp/B000FC1MM8","matchMethod":"asin"},{"id":"seven-shades-of-evil-f8b4b801","readMonth":{"month":"Dec","year":"2023","day":"19","sort":"2023-12-19"},"title":"Seven Shades of Evil","author":"McCammon, Robert","series":"Matthew Corbett #9","review":"Great collection of well plotted and entertaining short stories with brilliant writing. McCammon is my guy!! None are absolutely essential to the overall plot of the series but we do get some good moments with characters we don't regularly see in the main series as well as go a little bit outside the lines and have some fun with different types of stories.","highlightCount":14,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1692155251l/196820049.jpg","asin":"B0CFP6CYQC","goodreadsUrl":"https://www.goodreads.com/book/show/196820049-seven-shades-of-evil","kindleUrl":"https://amazon.com/dp/B0CFP6CYQC","matchMethod":"asin"},{"id":"real-9-d6368963","readMonth":{"month":"Dec","year":"2023","day":"21","sort":"2023-12-21"},"title":"Real, Vol. 9","author":"Inoue, Takehiko","series":"リアル / REAL #9","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1620059703l/57933998.jpg","asin":"B0923CHN8X","goodreadsUrl":"https://www.goodreads.com/book/show/57933998-real-vol-9","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"assassins-apprentice-1-4f398b93","readMonth":{"month":"Dec","year":"2023","day":"21","sort":"2023-12-21"},"title":"Assassin's Apprentice #1","author":"Houser, Jody","series":"","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1671007770l/67354321.jpg","asin":"B0BGVTMT7F","goodreadsUrl":"https://www.goodreads.com/book/show/67354321-assassin-s-apprentice-1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"real-10-f30ebb34","readMonth":{"month":"Dec","year":"2023","day":"23","sort":"2023-12-23"},"title":"Real, Vol. 10","author":"Inoue, Takehiko","series":"リアル / REAL #10","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1620059800l/57934012.jpg","asin":"B0923D58GQ","goodreadsUrl":"https://www.goodreads.com/book/show/57934012-real-vol-10","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"real-11-93f4c000","readMonth":{"month":"Dec","year":"2023","day":"23","sort":"2023-12-23"},"title":"Real, Vol. 11","author":"Inoue, Takehiko","series":"リアル / REAL #11","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1620059898l/57934015.jpg","asin":"B0923CDZX4","goodreadsUrl":"https://www.goodreads.com/book/show/57934015-real-vol-11","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"trials-of-empire-868c25b1","readMonth":{"month":"Dec","year":"2023","day":"25","sort":"2023-12-25"},"title":"The Trials of Empire","author":"Swan, Richard","series":"Empire of the Wolf, #3","review":"I received a copy of this book in exchange for an honest review.\\n\\nMan this trilogy rocks. I've been patiently waiting to start it until the release of the third book was in sight and here we are at the end of a satisfying conclusion for the Empire of the Wolf.\\n\\nThis is definitely fantasy horror, more so than the previous two books which had horror elements but less pervasive than this one. I'm personally a horror fan so I loved the inclusion of the horror and visceral violence in this book. I think sci-fi and fantasy needs more of it.\\n\\nI have a hard time ranking the three books in this trilogy as I feel like they're consistently good but also fairly distinct from one another. This one has a bit more focus with the finish line in sight and a clear resolution to wrap things up which means a lot less side stories but it still holds a number of surprises.\\n\\nI think if you liked the previous two books you'll like this one and if you haven't you'll like these if you want a good blend of interesting, morally gray characters, supernatural horror, and great combat and battle scenes along with some mystery.\\n\\nOverall this trilogy has been one of the highlights of my reading year and I highly recommend reading them.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697516081l/60028924.jpg","asin":"0356516474","goodreadsUrl":"https://www.goodreads.com/book/show/60028924-the-trials-of-empire","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"return-of-nagash-bc826f16","readMonth":{"month":"Dec","year":"2023","day":"28","sort":"2023-12-28"},"title":"The Return of Nagash","author":"Reynolds, Joshua","series":"","review":"Super fun audiobook. Probably the largest scale Warhammer book I've read so far. Lots of great races and faction interactions including legendary characters and higher stakes. Probably a bit too large and a bit too much stabby stabby going on and needs a bit of breathing room, but a lot of cool stuff happens.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1408733528l/23008761.jpg","asin":"1849707162","goodreadsUrl":"https://www.goodreads.com/book/show/23008761-the-return-of-nagash","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"poet-022b7925","readMonth":{"month":"Dec","year":"2023","day":"29","sort":"2023-12-29"},"title":"The Poet","author":"Connelly, Michael","series":"Jack McEvoy, #1; Harry Bosch Universe, #5","review":"On a Connelly hot streak, been loving his work lately. This one had more elevated prose in it, especially the beginning really sucked me in and had a great premise with realistic characters and taking place in Denver felt like a nice breath of fresh air.\\n\\nThe plot was pretty much perfect and kept me guessing, had a lot of twists and turns and the details mattered a lot. Highly recommend this one and think it'd also make a good entry point to his work in general, doesn't require any previous books.","highlightCount":17,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500230582l/35688888.jpg","asin":"B000FC1MMI","goodreadsUrl":"https://www.goodreads.com/book/show/35688888-the-poet","kindleUrl":"https://amazon.com/dp/B000FC1MMI","matchMethod":"asin"},{"id":"farthest-shore-b834f01c","readMonth":{"month":"Jan","year":"2024","day":"03","sort":"2024-01-03"},"title":"The Farthest Shore","author":"Le Guin, Ursula K.","series":"Earthsea Cycle, #3","review":"Gorgeous book with a ton of thematic depth. The series feels very mythological in a way, where what is gained from the story are the metaphors we draw from it and how we can apply it to our lives. Definitely some of the best prose I've read, flows really well and lots of great passages to reflect on. I did appreciate some of the darkness that contrasts with the light and beauty we see.\\n\\n\\"He has done with doing. He goes home.\\"","highlightCount":38,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1386379202l/19248602.jpg","asin":"B008GT7L6I","goodreadsUrl":"https://www.goodreads.com/book/show/19248602-the-farthest-shore","kindleUrl":"https://amazon.com/dp/B008GT7L6I","matchMethod":"asin"},{"id":"sea-watch-66a9113e","readMonth":{"month":"Jan","year":"2024","day":"12","sort":"2024-01-12"},"title":"The Sea Watch","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #6","review":"Probably my favorite one so far. Everything Tchaikovsky built up in previous books reaps a lot of rewards here with the world building, politics, characters while he expands the scope in interesting ways. Some beautiful visuals in this one too. Looking forward to the next book even though everyone I know hates it","highlightCount":31,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1635607571l/57136691.jpg","asin":"B004LROOYG","goodreadsUrl":"https://www.goodreads.com/book/show/57136691-the-sea-watch","kindleUrl":"https://amazon.com/dp/B004LROOYG","matchMethod":"title-author"},{"id":"green-mile-53837394","readMonth":{"month":"Jan","year":"2024","day":"16","sort":"2024-01-16"},"title":"The Green Mile","author":"King, Stephen","series":"","review":"I'm not crying, you're crying. King and prisons, name a better combo. Just amazing character work. I definitely am rewatching the movie after this!","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1373903563l/11566.jpg","asin":"0451933028","goodreadsUrl":"https://www.goodreads.com/book/show/11566.The_Green_Mile","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"tehanu-9b940f45","readMonth":{"month":"Jan","year":"2024","day":"17","sort":"2024-01-17"},"title":"Tehanu","author":"Le Guin, Ursula K.","series":"Earthsea Cycle, #4","review":"Honestly not sure what to rate this, don't take my rating too seriously\\n\\nDefinitely glad I read the book even though it was sort of a bleak tough read with a lot of anger and fear towards how our society (and the society of Earthsea) is structured and the power imbalances that arise from this structure.\\n\\nAfter the previous books being epic and mythological this book is very grounded and mundane, it's also the darkest one yet and there's quite a lot of \\"sociological horror\\" surrounding what it's like to be a woman, child, or the poor in this society and how grim the prospects really are in these circumstances.\\n\\nHowever there's still moments of beauty and light. I did find this as an interesting meditation on what it's like to be past your prime and aging and thinking about what happens when you feel inadequate and fixating on past failures.\\n\\nLe Guin really gives me a lot to think about and I think I'll sit on this one for a while and digest it a bit before continuing to her short stories but I always find something in her works to ponder deeply. She definitely has a lot of wisdom and has some great ideas about a large swath of themes and topics.\\n\\nThis sort of feels like a sister novel to Left Hand of Darkness even though I haven't read it, but makes me more interested in what she has to say about gender in her other works.","highlightCount":17,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1504380310l/8138026.jpg","asin":"B001D1YCJ0","goodreadsUrl":"https://www.goodreads.com/book/show/8138026-tehanu","kindleUrl":"https://amazon.com/dp/B001D1YCJ0","matchMethod":"asin"},{"id":"do-androids-dream-of-electric-sheep-9ac38a4a","readMonth":{"month":"Jan","year":"2024","day":"19","sort":"2024-01-19"},"title":"Do Androids Dream of Electric Sheep?","author":"Dick, Philip K.","series":"","review":"**spoiler alert** I do think PKD plots leave me a bit unsatisfied but with Ubik at least I felt like it's grown on me and needed to be digested a bit as sort of a mental time bomb\\n\\nThe scene that stuck out to me the most was the android snipping off the spider's legs, that was fucked up and they ended up being pretty messed up even laughing that they may have killed the last spider on earth.\\n\\nIsidore was a pretty sympathetic character and it was also hard to tell whether he was reacting to the inhumanity of the androids or his mental impairment really caused him to act pretty inconsistently but he was an interesting POV to analyze how empathy looked between humans and androids.\\n\\nI have no idea what the Mercer plot line is supposed to mean, that was pretty trippy and also I didn't understand it 😂","highlightCount":7,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1753307553l/57460539.jpg","asin":"B000SEGTI0","goodreadsUrl":"https://www.goodreads.com/book/show/57460539-do-androids-dream-of-electric-sheep","kindleUrl":"https://amazon.com/dp/B000SEGTI0","matchMethod":"asin"},{"id":"real-12-63748b3c","readMonth":{"month":"Jan","year":"2024","day":"22","sort":"2024-01-22"},"title":"Real, Vol. 12","author":"Inoue, Takehiko","series":"リアル / REAL #12","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1620059993l/57934026.jpg","asin":"B0923DVKD4","goodreadsUrl":"https://www.goodreads.com/book/show/57934026-real-vol-12","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"real-13-c0c779d3","readMonth":{"month":"Jan","year":"2024","day":"22","sort":"2024-01-22"},"title":"Real, Vol. 13","author":"Inoue, Takehiko","series":"リアル / REAL #13","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1620060068l/57934034.jpg","asin":"B0923CWZ98","goodreadsUrl":"https://www.goodreads.com/book/show/57934034-real-vol-13","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"real-14-ef0b5c78","readMonth":{"month":"Jan","year":"2024","day":"24","sort":"2024-01-24"},"title":"Real, Vol. 14","author":"Inoue, Takehiko","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1619520051l/57874143.jpg","asin":"B0923CWB2Q","goodreadsUrl":"https://www.goodreads.com/book/show/57874143-real-vol-14","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shamanslayer-ca219fc2","readMonth":{"month":"Jan","year":"2024","day":"27","sort":"2024-01-27"},"title":"Shamanslayer","author":"Long, Nathan","series":"Gotrek & Felix, #11","review":"Had fun with this one. Sort of felt like a bit of a side quest but we got a lot of cool Beastmen lore and even some character development! Woah! As always has some amusing dialogue and Keeble is the goat narrator so the audiobook is an absolute treat.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348732072l/6433652.jpg","asin":"1844167739","goodreadsUrl":"https://www.goodreads.com/book/show/6433652-shamanslayer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"real-15-669372f6","readMonth":{"month":"Jan","year":"2024","day":"27","sort":"2024-01-27"},"title":"Real, Vol. 15","author":"Inoue, Takehiko","series":"","review":"This series has been a bit up and down for me but this latest volume was fantastic. The themes it deals with are frustration and failure so it can be a bit hard to read sometimes because it ends up being frustrating since it can feel like not a lot of progress is made in the story. I was honestly pretty close to souring on the series but this volume reminded me of all the things I love in it.\\n\\nHowever the latest volume gives me a lot of hope that when the series continues that things will pick up and start anew.\\n\\nThe series is at its best when it deals with the trauma of the characters and their motivations when they face adversity.\\n\\nInoue has this habit of absolutely crushing the last released volumes of his manga and hitting hard with deep impactful themes. I felt similarly about the ending of Vagabond and its takeaways about community and the vulnerability of asking for help and this volume of Real hit on similar levels.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1630251358l/56898049.jpg","asin":"1974724603","goodreadsUrl":"https://www.goodreads.com/book/show/56898049-real-vol-15","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"disquiet-gods-fd21e093","readMonth":{"month":"Jan","year":"2024","day":"30","sort":"2024-01-30"},"title":"Disquiet Gods","author":"Ruocchio, Christopher","series":"The Sun Eater, #6","review":"July 2025 review:\\nYes this continues to be one of my favorite books. Both insanely rich but also incredibly well paced. Having some of the series details fresher makes this even more rewarding. So ready to read Shadows Upon Time.\\n\\nJanuary 2024 review:\\nMasterpiece. This is why I read. If you're not reading this series what are you doing?\\n\\nHowling Dark was my favorite Sun Eater book yet and this is twice as good and has the craziness dialed up to 11. The prose is immaculate, the politics complex, the horror utterly terrifying and deeply disturbing, the strange is otherworldly and mind expanding.\\n\\nOnly sad thing is that this is probably going to be the best book I've read all year and I have to wait for Ruocchio's next book.\\n\\nThis feels like both the most unique entry yet but also distinctly Sun Eater and walks a high wire teetering on the edge of disaster that somehow holds it all together and is immensely satisfying, surprising, and rewarding for what has been teased before, and what is promised after.\\n\\nI shall go on alone.","highlightCount":149,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1690034659l/176443792.jpg","asin":"1982193328","goodreadsUrl":"https://www.goodreads.com/book/show/176443792-disquiet-gods","kindleUrl":"","matchMethod":"title-author"},{"id":"lord-fouls-bane-b65d7083","readMonth":{"month":"Feb","year":"2024","day":"07","sort":"2024-02-07"},"title":"Lord Foul's Bane","author":"Donaldson, Stephen R.","series":"The Chronicles of Thomas Covenant the Unbeliever, #1","review":"\\"Hellfire! Don't touch me, I'm a leper!\\". Thomas Covenant is one of the most petulant, cowardly, and reluctant protagonists you'll meet.\\n\\nA lot of this book feels heavily inspired by Lord of the rings, at a point that I feel like how similar it is must be intentional and trying to offer some commentary by having such an unlikable protagonist in a fairly vanilla fantasy world.\\n\\nThe book is also much longer than the page count indicates and also feels very long and can be dense with the lore and the word choice in the prose. The pace is also pretty slow, Donaldson has a habit of rehashing the plot every few chapters.\\n\\nI did like the world of the Land and the scenery descriptions were often nice and immersive.\\n\\nThis book is in a weird point in time between classical quest fantasy and more modern works where it feels like the grandfather of grimdark with a pinky toe into some of those ideas but the characters can feel fairly flat and not that complex.\\n\\nOverall pretty mixed on this. I do think the central mystery is compelling but also the plot beats and the characters I was hoping to be much stronger.\\n\\nThe foundation of the book and world does seem fairly solid so with more interesting plot and characters I could see this getting better as the series continues.\\n\\nWill give book 2 a shot and hope it improves.","highlightCount":53,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1570452468l/52570911.jpg","asin":"B007WKEM9Q","goodreadsUrl":"https://www.goodreads.com/book/show/52570911-lord-foul-s-bane","kindleUrl":"https://amazon.com/dp/B007WKEM9Q","matchMethod":"title-author"},{"id":"river-of-stars-4a6190a1","readMonth":{"month":"Feb","year":"2024","day":"14","sort":"2024-02-14"},"title":"River of Stars","author":"Kay, Guy Gavriel","series":"Under Heaven, #2","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1356089847l/15808474.jpg","asin":"0451464974","goodreadsUrl":"https://www.goodreads.com/book/show/15808474-river-of-stars","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vinland-saga-omnibus-1-ed31b24e","readMonth":{"month":"Feb","year":"2024","day":"14","sort":"2024-02-14"},"title":"Vinland Saga Omnibus, Vol. 1","author":"Yukimura, Makoto","series":"","review":"Really good start. Great action, interesting characters, and the themes it hinted at exploring all have me eager to continue. Some minor anime tropes here but they kind of add some additional flavor to the Viking story.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1623122286l/19087989.jpg","asin":"B00CCOO6RK","goodreadsUrl":"https://www.goodreads.com/book/show/19087989-vinland-saga-omnibus-vol-1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"mine-88277869","readMonth":{"month":"Feb","year":"2024","day":"17","sort":"2024-02-17"},"title":"Mine","author":"McCammon, Robert","series":"","review":"3.5/5 I do have some plot criticisms. The prose was great as per usual for RMC. Fairly standard thriller but some interesting elements and the character of Mary was absolutely unhinged but wish we had a bit more depth overall in some of the characters. Glad I read this overall.","highlightCount":43,"myGoodreadsRating":4,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1530655333l/40712323.jpg","asin":"B005T54HYG","goodreadsUrl":"https://www.goodreads.com/book/show/40712323-mine","kindleUrl":"https://amazon.com/dp/B005T54HYG","matchMethod":"asin"},{"id":"vinland-saga-omnibus-2-680f195b","readMonth":{"month":"Feb","year":"2024","day":"17","sort":"2024-02-17"},"title":"Vinland Saga Omnibus, Vol. 2","author":"Yukimura, Makoto","series":"","review":"Love it. Feels sufficiently different from other viking stories that I don't feel burned out and a lot of great themes and complexity here with some dark things happening. Really interested to see where this goes.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554095107l/17857681.jpg","asin":"1612624219","goodreadsUrl":"https://www.goodreads.com/book/show/17857681-vinland-saga-omnibus-vol-2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"naked-god-ec58ca70","readMonth":{"month":"Feb","year":"2024","day":"26","sort":"2024-02-26"},"title":"The Naked God","author":"Hamilton, Peter F.","series":"Night's Dawn, #3","review":"","highlightCount":45,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328310559l/8161932.jpg","asin":"B001RTC100","goodreadsUrl":"https://www.goodreads.com/book/show/8161932-the-naked-god","kindleUrl":"https://amazon.com/dp/B001RTC100","matchMethod":"asin"},{"id":"vinland-saga-omnibus-3-b91b18bf","readMonth":{"month":"Feb","year":"2024","day":"27","sort":"2024-02-27"},"title":"Vinland Saga Omnibus, Vol. 3","author":"Yukimura, Makoto","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1623122326l/22018898.jpg","asin":"B00J7V9E9Q","goodreadsUrl":"https://www.goodreads.com/book/show/22018898-vinland-saga-omnibus-vol-3","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"harry-potter-and-sorcerers-stone-8f59fa5a","readMonth":{"month":"Mar","year":"2024","day":
