.jpg","asin":"1478929693","goodreadsUrl":"https://www.goodreads.com/book/show/20981355-the-churn","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"cibola-burn-3a4eb05c","readMonth":{"month":"Feb","year":"2019","day":"16","sort":"2019-02-16"},"title":"Cibola Burn","author":"Corey, James S.A.","series":"The Expanse, #4","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1729035804l/18656030.jpg","asin":"B0FSKRWWST","goodreadsUrl":"https://www.goodreads.com/book/show/18656030-cibola-burn","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"nemesis-games-724e7b58","readMonth":{"month":"Mar","year":"2019","day":"24","sort":"2019-03-24"},"title":"Nemesis Games","author":"Corey, James S.A.","series":"The Expanse, #5","review":"This is the best book in the series yet. The tone of this entry is different from previous entries and does a much better job of providing depth to the characters of the Rocinante that we've spent time with but have never really gotten to get to know beyond Holden. The writing style has been refined and really rounded out some of the weaker points of some of the other novels in the series.\\n\\nPrevious entries while entertaining and knowing where the plot should go slightly struggled in the characterization of some of the individuals involved. Hopefully the series keeps up with providing better motivations for its characters, this entry was stellar and really ups the stakes. The biggest con of this entry is the major event that occurs is somewhat hard to believe would happen in a technologically advanced planet, but has eerie parallels to 9/11 that kind of brings up the plausibility in a strange way. The series does have a problem with antagonist motivations, hopefully this is elucidated more as the plot continues.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1654567652l/22886612.jpg","asin":"B0157VRVVC","goodreadsUrl":"https://www.goodreads.com/book/show/22886612-nemesis-games","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blink-power-of-thinking-without-thinking-d505903b","readMonth":{"month":"Apr","year":"2019","day":"27","sort":"2019-04-27"},"title":"Blink: The Power of Thinking Without Thinking","author":"Gladwell, Malcolm","series":"","review":"I listened to this book via the audiobook. I enjoyed the first half of the book and then it does become a little repetitive and easy to zone out listening to. It was enjoyable as a kind of extended podcast, but there aren't many conclusions that fall out from the book that you can really take action on in terms of our unconscious decision making, just more about being aware of your unconscious decision making, which can be unfulfilling. The book is worth listening to, but it can have a bit of filler content.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1440763417l/40102.jpg","asin":"0316010669","goodreadsUrl":"https://www.goodreads.com/book/show/40102.Blink","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"east-of-eden-d1baaefc","readMonth":{"month":"Apr","year":"2019","day":"29","sort":"2019-04-29"},"title":"East of Eden","author":"Steinbeck, John","series":"","review":"I originally read this book about 10 years ago when I was starting college and for some reason felt compelled to read again. This is a book that really sticks with you, it is stark reflection of the human condition and the battle we all face between choosing to be good or choosing to be evil. It's one of those books that takes on different meanings in different phases of life, and I feel like I have new things to take away from this book after reading it in this phase of life that I didn't have when I read it 10 years ago.\\n\\nThe only real criticism I have of this book is that I wish it was longer; which is strange to say, since it's not a short book, but you do grow attached to these characters and want to continue to see what happens to them. There's also a few points where characters are at seemingly critical turning points but then meet an early demise, usually due to sickness or accidents. This part does reflect early 20th century life where disease and accidents were a more regular occurrence, but it does make you wonder what could have been. Perhaps this is another lesson to take away from this book as well, where your story can end where you don't expect.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1639969375l/4406.jpg","asin":"0142000655","goodreadsUrl":"https://www.goodreads.com/book/show/4406.East_of_Eden","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"cannery-row-4e6b8fef","readMonth":{"month":"Jun","year":"2019","day":"08","sort":"2019-06-08"},"title":"Cannery Row","author":"Steinbeck, John","series":"Cannery Row, #1","review":"The slice of life described in Cannery Row is a contrast to the epic East of Eden, but I wanted to read more Steinbeck and explore his poetic descriptions of Monterey. Although Cannery Row doesn't have a conventional plot with a traditional beginning, middle, and end you do get the experience of accompanying several characters that are all fairly down on their luck and struggling to find meaning in life.\\n\\nThere are themes of these characters pining for the fleeting moments in their past where they experienced beauty either in the love of a beautiful woman, a marriage that was brief and tumultuous, or lucrative business deals that turned sour. The Cannery Row district is fairly rough and tumble as described here, but there is an unbridled optimism that shines through in classic Steinbeck fashion in the societal ties that bind this nontraditional community.\\n\\nThere are some real poetic passages in this novel that are quite lovely to experience and in general this book is just a pleasure to read as long as you have the expectation that it's not about the destination but of being a part of this community and peering through the briefly illuminated windows in these characters' lives.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388188936l/4799.jpg","asin":"014200068X","goodreadsUrl":"https://www.goodreads.com/book/show/4799.Cannery_Row","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"bad-blood-secrets-and-lies-in-silicon-valley-startup-1873854a","readMonth":{"month":"Jun","year":"2019","day":"15","sort":"2019-06-15"},"title":"Bad Blood: Secrets and Lies in a Silicon Valley Startup","author":"Carreyrou, John","series":"","review":"I would recommend watching the HBO special over this book if you're interested in the subject matter and want a more concise overview. However, a lot of the details of this book are fascinating and disturbing that were never mentioned in the HBO documentary.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1523311515l/37976541.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/37976541-bad-blood","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"never-lost-again-google-mapping-revolution-that-sparked-new-industries-and-augme-3397a6a6","readMonth":{"month":"Jul","year":"2019","day":"07","sort":"2019-07-07"},"title":"Never Lost Again: The Google Mapping Revolution That Sparked New Industries and Augmented Our Reality – The Essential Application's Creation Story from Keyhole","author":"Kilday, Bill","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1519634010l/35820393.jpg","asin":"0062673041","goodreadsUrl":"https://www.goodreads.com/book/show/35820393-never-lost-again","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"babylons-ashes-6a2d8017","readMonth":{"month":"Jul","year":"2019","day":"23","sort":"2019-07-23"},"title":"Babylon’s Ashes","author":"Corey, James S.A.","series":"The Expanse, #6","review":"Almost did not finish, the quality of this entry compared to the previous is jarring. Not a ton of interesting events happen compared to Nemesis Games and the personal motivations of the crew of the Rocinante are almost completely discarded aside from Naomi. The number of POV characters in this novel also work against it as we're spending time with characters which are frankly not as interesting or invested in as the core cast and don't have a lasting impact on the outcome.\\n\\nThe ending was also not very surprising and could see it coming from about the book's midpoint with only a couple of minor surprises along the way. Overall, pretty disappointing book compared to the quality of Nemesis Games. I think I'll be taking a break from this series for awhile since the quality is so inconsistent.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1442247299l/25877663.jpg","asin":"0356504263","goodreadsUrl":"https://www.goodreads.com/book/show/25877663-babylon-s-ashes","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"winter-of-our-discontent-dc2b5792","readMonth":{"month":"Aug","year":"2019","day":"22","sort":"2019-08-22"},"title":"The Winter of Our Discontent","author":"Steinbeck, John","series":"","review":"This was my least favorite Steinbeck novel so far. The theme of the novel has a lot of potential but the execution is a bit shoddy and most of the moral ambiguity is dealt with in the last third of the book without much build up and a lot of things sort of happen \\"off-camera\\" with multiple time skips that leave the reader puzzled about what happened.\\n\\nWhat's disappointing about this novel is I didn't feel connected to any of the characters the way that I have in other Steinbeck novels. Ethan Allen Hawley's motivations are subtle and unclear most of the time as are Margie's as his feminine foil. The contrast between Ethan and Samuel in East of Eden is quite stark where even though Samuel was not present in most of Eden, the reader understands him deeply and feels the ripples of his influence throughout the novel. In The Winter of Out Discontent Ethan does not have that same effect and neither do the supporting characters as they do in Cannery Row which makes this novel overall disappointing.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388197029l/4796.jpg","asin":"0143039482","goodreadsUrl":"https://www.goodreads.com/book/show/4796.The_Winter_of_Our_Discontent","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"nausea-be0a442e","readMonth":{"month":"Sep","year":"2019","day":"03","sort":"2019-09-03"},"title":"Nausea","author":"Sartre, Jean-Paul","series":"","review":"Nausea is an introspective, lonely look into a life where a man starts to question the meaning of things around him and morosely views his past and contemplates revisiting a once long term relationship that ended slowly and quietly. It isn't a good feeling to relate to the book, but in some ways I think we all do. I read Camus' The Stranger a while ago and think that book overall will stick with me more than Nausea, but Nausea does arrive at an interesting point in my life where it's easy to relate to the character and their situation which makes it more relatable and induces more thought. There are some stretches of the book that aren't as consistently interesting and more mundane parts of the main character's life, but I guess it all can't be a morose slog through a lonely miserable\\nexistential existence. So it is odd how the book does feel longer than it is, probably due to the heavy subject matter, but there also a few tangents that I found didn't add to my overall experience of the novel.","highlightCount":15,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1386058231l/19138824.jpg","asin":"B00COG0EWC","goodreadsUrl":"https://www.goodreads.com/book/show/19138824-nausea","kindleUrl":"https://amazon.com/dp/B00COG0EWC","matchMethod":"title-only-unique"},{"id":"gardens-of-moon-b527bf69","readMonth":{"month":"Sep","year":"2019","day":"22","sort":"2019-09-22"},"title":"Gardens of the Moon","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #1","review":"Never read anything quite like this book. This is an incredibly dense fantasy novel and I have been warned about this multiple times both in person and online that this can be difficult to get through.\\n\\nI actually found the writing to be \\"fast\\" to read and enjoyed Erikson's style of shorter POV sections that hop to different characters at interesting points in their stories, I never felt like it was dragging at all, but quite the opposite where sometimes it's challenging to keep up. The difficult part of the book in my mind is the number of characters, the mechanics of the world, and the emerging politics. This is truly a window to another world which is tonally different than an author like Brandon Sanderson, nothing will be explained to you; you have to absorb it from the world and the interactions of the characters.\\n\\nSucceeding at reading this book is accepting that you won't know everything and recognizing that events happened even though you might not understand how or why that event happened. I struggled the most during action scenes with the magic mechanics, I don't really understand how Warrens work yet and had to slowly read through the action scenes to not miss anything. They do take unexpected turns than simply action scenes with sword fights and the world is so different than our own that the outcomes are quite different than what you expect which can be challenging, but also is engaging.\\n\\nMy worry going forward with the series is the amount of Deus Ex Machina in the plot, there were a few times where a character would be saved by other characters that I either couldn't remember were in close proximity or swooped in at the last second that was a little unrealistic. Warrens also as a plot device makes me concerned, because it's effectively teleporting and I don't understand the limits to this or if there are any. Magic systems in general make me skeptical of the plot, but it will be interesting to see if this can be refined in later entries in the series.","highlightCount":21,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1419867362l/8134944.jpg","asin":"B002KYHZLQ","goodreadsUrl":"https://www.goodreads.com/book/show/8134944-gardens-of-the-moon","kindleUrl":"https://amazon.com/dp/B002KYHZLQ","matchMethod":"asin"},{"id":"deadhouse-gates-b3eadc30","readMonth":{"month":"Oct","year":"2019","day":"12","sort":"2019-10-12"},"title":"Deadhouse Gates","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #2","review":"Exponentially better than the first book, I immediately got hooked and devoured this book a lot faster than I expected despite its length. Erikson really has come into his own in this entry and the character development is a lot stronger here than Gardens of the Moon by removing some of the complexity and trimming down the number of parallel storylines to a more manageable number you are able to build better connections to the characters and the storylines often overlap and then diverge again which is exciting and unexpected in many ways.\\n\\nI am a huge fan of the structure of the book and the way Erikson changes point of view, you always seem to get enough time with your favorite characters and the transition points are often satisfying where you're not waiting long periods of time to figure out what happened to them after ending on a cliffhanger. You're provided with enough information to form theories in your head of where their story might go, but also left at good stopping points for their characters.\\n\\nThere's a few fantastic twists in this entry that are frankly jaw-dropping and unexpected and subvert fantasy tropes.\\n\\nThe way the world is described and the events that unfold color the story in such a way that you really feel like you are there with these characters in a beautiful, brutal, and horrifying world. There's so many instances where the contrast of the beauty and horror often are orchestrated in the same setting, it's truly masterful storytelling and pushes you forward to continue reading and learn more about this world. The complexity of the world is astounding, but the way it is threaded by Erikson builds trust in the author that even if something is confusing or mysterious it's meant to be that way for now and might become clearer later on in the series. Most major events are comprehensible although there is usually some aspect of things that may not be completely clear but don't distract enough to damper the overarching narrative.\\n\\nI complained about the Deus Ex Machina of the last entry and in this one it's gotten better, but not completely fixed. In some ways it seems you have to accept the magic and the gods as a reality of this universe and that means that characters can be saved in their time of need or travel large distances quickly. I don't think this was as jarring as in Gardens of the Moon; you often accompany these characters when they are traveling in warrens so it does help paint a better picture of how these systems work. The warrens and magic are often mysterious and not even completely understood by the characters using them, which is fascinating as well.","highlightCount":67,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328364133l/9754945.jpg","asin":"B002S6UNRE","goodreadsUrl":"https://www.goodreads.com/book/show/9754945-deadhouse-gates","kindleUrl":"https://amazon.com/dp/B002S6UNRE","matchMethod":"title-candidate-author"},{"id":"memories-of-ice-b0d397ae","readMonth":{"month":"Nov","year":"2019","day":"02","sort":"2019-11-02"},"title":"Memories of Ice","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #3","review":"**spoiler alert** Overall I enjoyed Deadhouse Gates more, but this entry has more of a traditional epic fantasy feel that puts its own spin on it. I don't want to understate the epic scale of this book however, the siege battle of Capustan was incredible and visceral and the ending stretch of the battle of Coral is one of my favorite stretches of 200 or so pages of the whole series so far and is simply jaw dropping in the increasing stakes and sheer scale.\\n\\nI was expecting more main character deaths in this entry just based on things I had heard about online, Whiskeyjack's death is major and he was definitely more fleshed out in this entry and his death is truly tragic, however was expecting even more fallout from the battle of Coral.\\n\\nI enjoyed the overall theme of forgiveness in this book and can't overstate how unique this is. This is personified by Itkovian, but a lot of the characters struggle with finding their place in the world in this entry and their redemption is often in forgiving their enemies. The theme of this entry really makes the world richer and the moral complexity going forward much higher.\\n\\nThere was enough cryptic magical happenings that put a slight damper on it for me that I think Deadhouse Gates managed better; there were a lot of dream sequences and teleportation that aren't really explained that put this below DG for me.\\n\\nSilverfox's arc really fell short for me, was expecting her to be a more central character in this book and it kind of just fizzled out. Maybe that was the point, but wasn't expecting her to refuse to lift the curse from the T'lan Imass, however it was confusing how she waffled on this but then they decide to go south to save some of their kin. Just overall somewhat of a confusing and unsatisfying story arc on Silverfox's side.\\n\\nReally enjoyed the storyline with Lady Envy, Tool, and Toc, the group of traveling companions just had really interesting dialogue and chemistry; Tool is one of the most unexpected favorite characters as a seemingly unfeeling undead character that eventually it's apparent has more and more of a personality.\\n\\nI really loved Itkovian's arc as a character, at first I wasn't really sure how he connected with the rest of the story and was just a generic soldier in Capustan. During the siege battle, his interaction with Gruntle, and his identity crisis with Fener entering the mortal realm was well articulated and gave the character a lot of depth. I hope this trend continues and Erikson continues to build rich characters like this.\\n\\nOn the flipside, I didn't feel a lot of connection to many of the Bridgeburners. Picker is only the real one that stands out to me, maybe Spindle as well, but they don't have fully formed personalities in my mind and are somewhat interchangeable. I felt a lot closer to the newer characters than the Bridgeburners.\\n\\nThings I'm unsure about after reading:\\n\\n- Why the love for Itkovian from other soldiers? Didn't he effectively prevent the T'lan Imass from fighting the K'Chain Che'Malle and thus cause a lot of excess casualties from Dujek's army?\\n- How did Tool turn back into a human at the end of the book? Was this from Itkovian taking the burden of the T'lan Imass? I'm still unsure what taking their burden means, I thought they'd disappear into dust like earlier in the book.\\n- I'm generally confused about Toc the Younger's ending arc, I'm not sure why he needed to change bodies and killed himself at the end of the book and his real connection to the wolf god. Overall confused of all the rules in this universe about rebirth and seems somewhat inconsistent compared to how Tattersail's rebirth was handled.","highlightCount":177,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1736883511l/10377639.jpg","asin":"B004JXVYO0","goodreadsUrl":"https://www.goodreads.com/book/show/10377639-memories-of-ice","kindleUrl":"https://amazon.com/dp/B004JXVYO0","matchMethod":"asin"},{"id":"how-to-lie-with-maps-dcf05a6c","readMonth":{"month":"Nov","year":"2019","day":"02","sort":"2019-11-02"},"title":"How to Lie with Maps","author":"Monmonier, Mark","series":"","review":"In a word: antiquated. Even with the allegedly updated third edition of the book, most of the examples are about drawing maps with pen and paper, something that isn't done often in this day and age. The examples of lying with maps are also often pretty elementary -- such as a map maker adding places that don't exist or low resolution satellite images. Not very compelling to read about and there aren't good strategies mentioned for mitigating these \\"lies\\". There are some interesting thoughts on feature selection in the book and what information to convey to readers that save this book from being a waste of time, however they are pretty few and far between.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328872315l/1005549.jpg","asin":"0226534219","goodreadsUrl":"https://www.goodreads.com/book/show/1005549.How_to_Lie_with_Maps","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"watchmen-bddcd13c","readMonth":{"month":"Nov","year":"2019","day":"06","sort":"2019-11-06"},"title":"Watchmen","author":"Moore, Alan","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1609224375l/46256302.jpg","asin":"B07ST6DPBQ","goodreadsUrl":"https://www.goodreads.com/book/show/46256302-watchmen","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"house-of-chains-91e7d3c4","readMonth":{"month":"Nov","year":"2019","day":"17","sort":"2019-11-17"},"title":"House of Chains","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #4","review":"**spoiler alert** Although I rated this a 3/5 and Gardens of the Moon a 4/5, I liked this entry more than the first, but my expectations have been adjusted as I've gotten deeper into the series.\\n\\nThings I liked about this entry:\\n\\n- Karsa Orlong: I enjoyed the focus on this character in the beginning and his overall arc in this entry. Having more time with a subset of the characters is why I liked Deadhouse Gates so much and the story is the strongest and most coherent when we're not constantly jumping around (although there is probably the most jumping around since Gardens in the second half of the book). Icarium vs Karsa was probably my favorite part of the book and made me really nervous since I'm a big fan of them both (and Mappo of course), I hope the series continues to have main characters at odds with each other. If anything, this novel could have been more aggressive with that, there seemed to be some pretty obvious baddies here on Shaik's side with Korbolo Dom and Bidithal, would be more interesting to have main characters be on opposite sides with a more dedicated view that their side is right.\\n- Theme and imagery: Just really strong images of chains and the thematic cohesion around slavery in society and to gods was really great here. I like this trend that Erikson has of making each entry thematically distinct while also adding little nuggets here and there of ice, dust, etc that you can guess are the thematic core of future entries based on their titles.\\n- Heboric: I'm really interested in the development in his character, and his dream / trip with the tea was one of my favorite parts of the series and seemed to really pull back the curtain on some of the larger conflicts going on in the series. Heboric just seems like a very flawed character but inherently good with an interesting background that makes for developments surrounding him to be unexpected.\\n- Larger scope: It's interesting that this series starts with a very narrow scope; a single character who is naive of the larger world, its history, and even themselves and then explodes into a multi-realm power struggle. Erikson comes close to tipping his hand here where you can see some of the larger threads of the story connecting between gods. I get the feeling that Osric, Cotillion, and some other gods that are alluded to will become bigger players in future entries.\\n\\nThings I'm indifferent to:\\n\\n- Crokus and Apsalar: Had potential, but kind of fell flat, not sure where they are really going and some of their time together wasn't that interesting, but I did like their interactions with Cotillion even though I don't really buy their relationship to him. Shouldn't Apsalar hate Cotillion? Especially after he possessed her and destroyed her whole fishing village?\\n- Shaik vs Tavore: Felt pretty anticlimactic after everything after the first book onward foreshadows the clash between them only to have it end so quickly and no real character developments follow from it. Felisin elder felt kind of wasted here, she didn't have many meaningful decisions to make and didn't seem to particularly take a stance about why the Malazan empire was evil.\\n\\nThings I didn't like:\\n\\n- Trull Sengar and Onrack: Just not very invested in this storyline and it wasn't particularly interesting. Hopefully the development of these characters continues more throughout the series to make sense of their appearance here. Was just pretty bored with their adventures in this one.\\n- Pearl and Lostara: Felt like a pretty pointless side quest here and wasted potential. Might have accomplished some world building, but I would have been fine with this being left out of the book. I was hoping for some interaction between Pearl and Kalam after their encounter in Deadhouse Gates.","highlightCount":101,"myGoodreadsRating":3,"myReviewRating":3,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328313081l/8177008.jpg","asin":"B000SEIKBY","goodreadsUrl":"https://www.goodreads.com/book/show/8177008-house-of-chains","kindleUrl":"https://amazon.com/dp/B000SEIKBY","matchMethod":"asin"},{"id":"animal-farm-850c4f00","readMonth":{"month":"Dec","year":"2019","day":"05","sort":"2019-12-05"},"title":"Animal Farm","author":"Orwell, George","series":"","review":"**spoiler alert** Despite having read 1984 around 3 times previously for some reason I hadn't read Animal Farm until now. I definitely wasn't expecting it to be quite so similar to 1984 and so bleak. Boxer's story of being a hardworking idealistic workhorse that is looking forward to retirement and sent to the glue factory is all too relevant in present day as well despite being written in 1945.\\n\\nIt's an easy read, but the themes of the book definitely hit you by the end of the novel and the hope for society is greatly diminished after reading. As is the seemingly inevitable erosion of rights by the ruling class that rules absolutely as we go from \\"Four legs good! Two legs bad!\\" to the haunting image of the pigs learning to walk on two legs and being indistinguishable from men. \\"The creatures outside looked from pig to man, and from man to pig; but already it was impossible to say which was which\\". I think I'll need a pick me up after this one.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1325861570l/170448.jpg","asin":"B0D7LQMF4N","goodreadsUrl":"https://www.goodreads.com/book/show/170448.Animal_Farm","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"midnight-tides-f39b2050","readMonth":{"month":"Dec","year":"2019","day":"08","sort":"2019-12-08"},"title":"Midnight Tides","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #5","review":"**spoiler alert** My ranking of the series so far from best to worst:\\n\\n- Deadhouse Gates\\n- Memories of Ice\\n- Midnight Tides\\n- House of Chains\\n- Gardens of the Moon\\n\\nI was really concerned about this entry starting out, it's really bold and unnerving for Erikson to again change the location and introduce mostly all new characters. However, this is one of the most self contained stories in this series so far and echoes similar to what I enjoyed about Deadhouse Gates so much, tight storylines that eventually converge.\\n\\nThis series is really challenging with how much it alternates from the best thing I've ever read to incoherent magical drivel, I'm not sold on the magic system or the gods yet and my favorite parts of the series almost always do not involve magic or the gods.\\n\\nThings I liked about this entry:\\n\\n- Trull Sengar: Wow, what a turnaround for a character, from pretty uneventful and boring in the last book to a deep character in Midnight Tides. The journey to recover the sword was where I started getting engaged with the book at around the 200 page mark, just a beautifully described passage of Trull fending off the Jheck and then Rhulad getting resurrected was very unexpected and disturbing.\\n- Tehol and Bugg: Ok, I had no idea this series could be this funny. Their banter was just amazing and bizarre. From Tehol's uneven trousers to Bugg seducing a woman with a dead fish on a date, these guys have it all. Bugg being Mael was an interesting reveal, I don't really get all the implications, but seemed fitting and was hinted at that while they appear to be foolish characters they also outwit everyone they encounter and have knowledge about things that most people in the world do not.\\n- Lilac: The sympathetic demons are some of my favorite characters in these books. Trull saving Lilac and sending him back to his realm was incredibly heartwarming, I'm assuming we'll see him in the future since he's soulbound to Trull.\\n- Brother dynamics: I felt that the symmetry in this book was pretty astounding, Erikson really plays off the two sets of brothers from the Edur in the Sengars and Letherii in the Beddicts and sort of turns it on its head with having some of the Beddicts embedded with the Edur with varying motivations. Erikson kind of cheats and gets some character backstory \\"for free\\" by having them be brothers from the same family but I really enjoyed having this relationship between the characters and it gave them a lot of depth, Fear Sengar in particular.\\n- The battle of Letheras (Battle of Brans Keep): Hannan Mosag just unleashing a huge amount of sorcery on the Letherii soldiers was disturbing and grandiose, especially since it wiped out thousands of their own troops.\\n\\nThings I'm confused about / didn't like:\\n\\n- The Champion that pulled up Brys Beddict at the ending seemingly appeared out of nowhere and I didn't remember him appearing earlier in the book, just seemed like a random event that I felt wasn't explained well.\\n- Udinaas: Him being possesed by the Wyval and its motivations just seemed very ill explained. I enjoyed Udinaas' role as Rhulad's Eunuch, but his end of the book just wasn't explained very well. Also by extension, Feather Witch's part of the story was disjointed as well, not the strongest parts of the book.\\n- Rhulad's ascension to the throne: The scene of him taking power seemed unbelievable to me. I'm not sure why no-one would contest this, Rhulad didn't seem particularly powerful even if he was immortal, he wasn't a particularly good fighter even after having the power of the Crippled God.","highlightCount":114,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328300817l/8119976.jpg","asin":"B000UZJRH2","goodreadsUrl":"https://www.goodreads.com/book/show/8119976-midnight-tides","kindleUrl":"https://amazon.com/dp/B000UZJRH2","matchMethod":"asin"},{"id":"last-wish-f320b686","readMonth":{"month":"Dec","year":"2019","day":"14","sort":"2019-12-14"},"title":"The Last Wish","author":"Sapkowski, Andrzej","series":"The Witcher, #0.5","review":"**spoiler alert** After getting through 5 books in the Malazan series, I needed a more character focused fantasy read. With the Witcher show about to premiere on Netflix and having played the Witcher 3, thought I would give this a read. Overall I enjoyed my time and plan on continuing the series, but this entry was far from perfect.\\n\\nWasn't a big fan of the short story format of the book, it didn't ruin it by any stretch, but it made the narrative less cohesive and some of the stories didn't build Geralt or the world beyond being an interesting monster hunt.\\n\\nI thought that there would be more to the beginning of Geralt and Yennefer's relationship and it didn't really make a whole lot of sense why he was drawn to her even though she did actively betray him, maybe this will make more sense in future books.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1529591917l/40603587.jpg","asin":"B0DWV5GL95","goodreadsUrl":"https://www.goodreads.com/book/show/40603587-the-last-wish","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"bonehunters-e3514211","readMonth":{"month":"Dec","year":"2019","day":"31","sort":"2019-12-31"},"title":"The Bonehunters","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #6","review":"Steven Erikson is a mad genius. My favorite entry yet, possibly one of the best books I've ever read. Characters that you've grown with over the series all come together in surprising and sometimes heartbreaking ways. Convergence with a capital \\"C\\", I'm awestruck by how well things came together and the foresight that Erikson had to set up some of the dominoes that he's begun to knock over.\\n\\nAnd there's a sense that the best is yet to come. Hyped.","highlightCount":197,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387752682l/19746283.jpg","asin":"B003L1ZZEQ","goodreadsUrl":"https://www.goodreads.com/book/show/19746283-the-bonehunters","kindleUrl":"https://amazon.com/dp/B003L1ZZEQ","matchMethod":"asin"},{"id":"everything-is-f-cked-about-hope-de9cb413","readMonth":{"month":"Jan","year":"2020","day":"21","sort":"2020-01-21"},"title":"Everything Is F*cked: A Book About Hope","author":"Manson, Mark","series":"","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1550685003l/43808723.jpg","asin":"0062955934","goodreadsUrl":"https://www.goodreads.com/book/show/43808723-everything-is-f-cked","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"reapers-gale-d93f83a8","readMonth":{"month":"Jan","year":"2020","day":"23","sort":"2020-01-23"},"title":"Reaper's Gale","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #7","review":"**spoiler alert** Much slower start than The Bonehunters, but the emotional weight and stakes of the story increases substantially in this entry and the payoff at the end is incredible. However, I do wonder if some of the traveling and sub-plots could have been shortened to make getting to the \\"good stuff\\" faster.\\n\\nSome of the most heart-wrenching moments of the series yet, the death of major characters was pretty surprising but pulled off in ways that made sense. Particularly the deaths of Toc and Trull hit me the hardest, which isn't to say that Beak's death wasn't majorly impactful as well.\\n\\nRedmask\\n\\nI thought Redmask's story was compelling but didn't have much of the emotional weight of the other storylines aside from, of course, Toc the Younger. I have mixed feelings about his battle failing due to a mistimed cavalry charge and am confused about why the K'Chain Che'malle turned on him (just because he was losing the battle?). Toc has to be one of the most unlucky people in the Malazan universe. Also, Tool arriving just after his best friend died is so depressing.\\n\\nBeak\\n\\nErikson flexes his short story writing skills with Beak in this book, a truly tragic character with a heart of gold that ends up saving his friends and dying in the process. I could see his death coming, but it was really well written and him meeting up with his brother in the afterlife is bittersweet.\\n\\nIcarium and Tarlack Veed, Karsa\\n\\nThis story line in Lether really dragged in the first 3/4 of the book and wish a lot more had been cut. Karsa, Icarium, and Tarlack Veed didn't have a whole lot to do in Letheras for most of the book. Karsa fighting Rhulad towards the end of the book was exciting and awesome, but Erikson really teased us with this fight for a bit too long. I'm still trying to make sense of what happened to Icarium, maybe it will be explained better later in the series. I actually grew more sympathetic to Tarlack in this book, I don't think he's a bad person, he's in a tough spot and his death scene was tragic with him picturing his home town and his old life. Working for the Nameless Ones seems like a no-win scenario for anyone and I could see him becoming as sympathetic as Mappo given time.\\n\\nSilchas Ruin and co\\n\\nThis storyline did feel like it dragged a bit, but I did enjoy the dynamics of the traveling group and it gave some contrast to the bromances that Erikson sprinkles in regularly with a group that has major reservations about eachother and in the end fights to the death. The moral complexity with Silchas Ruin is interesting, I'm still not sure if he is truly a villain or not and the story of Scabandari and whether Blood Eye was totally in the wrong or if Silchas Ruin was always a bit of a bastard.\\n\\nThe parallel of Fear Sengar about to stab Silchas in the back was well done, that scene with the convergence of Trull, Fear, Silchas and company was hair raising and made me fear for all the characters that I've grown close to.\\n\\nQuick Ben\\n\\nWhat a badass, we see Quick Ben's true power here. Him blasting Silchas Ruin with Fiddler was so awesome as was his quip \\"Fucking dragon\\". Unexpected, because in a traditional fantasy book we'd probably see Silchas Ruin be a big villain with a harder fight, but Steven Erikson subverts expectations yet again (although this is similar to what he did with Raest in Garden's of the Moon).\\n\\nFiddler and the Bonehunters\\n\\nNothing too far from the norm from Fiddler which is good, but we did get to see the marines in action and see Fiddler show the boys how it's done and set bombs like the best of them. The demon farmers was a highlight and just really painted their whole campaign gray especially after we interacted with demons with hearts of gold with Trull in Midnight Tides, it seemed like they just wanted to settle down but were dragged into this conflict.\\n\\nFeather Witch and the Errant\\n\\nI guess Feather Witch is a full fledged baddie now, her eating the eye of the Errant was a great scene. However, I in general have a hard time keeping context of Feather Witch's state of mind in the series especially since it can be awhile between times that we catch up with her, especially since Midnight Tides, so I'll have to go back and see what happened where she got so extreme in her beliefs.","highlightCount":198,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328342379l/8623112.jpg","asin":"B003JH8M74","goodreadsUrl":"https://www.goodreads.com/book/show/8623112-reaper-s-gale","kindleUrl":"https://amazon.com/dp/B003JH8M74","matchMethod":"asin"},{"id":"toll-hounds-8196487e","readMonth":{"month":"Feb","year":"2020","day":"09","sort":"2020-02-09"},"title":"Toll the Hounds","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #8","review":"","highlightCount":358,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328313115l/8177049.jpg","asin":"B003GY0K02","goodreadsUrl":"https://www.goodreads.com/book/show/8177049-toll-the-hounds","kindleUrl":"https://amazon.com/dp/B003GY0K02","matchMethod":"asin"},{"id":"dust-of-dreams-5590df44","readMonth":{"month":"Mar","year":"2020","day":"01","sort":"2020-03-01"},"title":"Dust of Dreams","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #9","review":"","highlightCount":235,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328358143l/9414479.jpg","asin":"B0034184W8","goodreadsUrl":"https://www.goodreads.com/book/show/9414479-dust-of-dreams","kindleUrl":"https://amazon.com/dp/B0034184W8","matchMethod":"asin"},{"id":"slaughterhouse-five-bd77a873","readMonth":{"month":"Mar","year":"2020","day":"06","sort":"2020-03-06"},"title":"Slaughterhouse-Five","author":"Vonnegut Jr., Kurt","series":"","review":"Read this initially in high school as \\"required\\" reading and loved it. Revisiting this years later and it still holds up. This the ultimate distilled Vonnegut novel and the story flows easily between chapters. Great introduction to the Vonnegut literary universe.","highlightCount":32,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1440319389l/4981.jpg","asin":"B000SEGHT6","goodreadsUrl":"https://www.goodreads.com/book/show/4981.Slaughterhouse_Five","kindleUrl":"https://amazon.com/dp/B000SEGHT6","matchMethod":"title-only-unique"},{"id":"crippled-god-68a3002e","readMonth":{"month":"Mar","year":"2020","day":"22","sort":"2020-03-22"},"title":"The Crippled God","author":"Erikson, Steven","series":"Malazan Book of the Fallen, #10","review":"","highlightCount":249,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328318915l/10697676.jpg","asin":"B004H1TQA8","goodreadsUrl":"https://www.goodreads.com/book/show/10697676-the-crippled-god","kindleUrl":"https://amazon.com/dp/B004H1TQA8","matchMethod":"asin"},{"id":"old-man-and-sea-c20792e0","readMonth":{"month":"Mar","year":"2020","day":"24","sort":"2020-03-24"},"title":"The Old Man and the Sea","author":"Hemingway, Ernest","series":"","review":"","highlightCount":15,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1763156597l/6396997.jpg","asin":"B000FC0SH8","goodreadsUrl":"https://www.goodreads.com/book/show/6396997-the-old-man-and-the-sea","kindleUrl":"https://amazon.com/dp/B000FC0SH8","matchMethod":"asin"},{"id":"blade-itself-a9d4219d","readMonth":{"month":"Apr","year":"2020","day":"09","sort":"2020-04-09"},"title":"The Blade Itself","author":"Abercrombie, Joe","series":"The First Law, #1","review":"Character focused fantasy that feels like a living, breathing world. I feel like other reviews focus too much on how this is \\"grimdark\\" when it doesn't feel dark for the sake of being dark, but because that's the way this world is and it has moments of beauty and splendor and it has moments of darkness and violence.\\n\\nAbercrombie balances the tightrope between a gritty realistic world and comedy with mastery, often you are laughing one minute and then on the edge of your seat the next. The comedy never cheapens the payoffs of characters or plot events.\\n\\nMy only criticism of this would only be that this novel is mostly setup of what I'm assuming are longer arcs, but the setup feels great. It never feels like you're in a rush to get somewhere like other fantasy novels and you get to soak in the atmosphere of the world. However you lose some of what epic fantasy offers with global moving pieces and it's all a bit of a blur at the macroscopic level, but the relationships between characters is crystal clear, ever evolving, and intriguing.","highlightCount":72,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1654730743l/50009069.jpg","asin":"B00TOT9LDK","goodreadsUrl":"https://www.goodreads.com/book/show/50009069-the-blade-itself","kindleUrl":"https://amazon.com/dp/B00TOT9LDK","matchMethod":"asin"},{"id":"storm-front-01f00585","readMonth":{"month":"Apr","year":"2020","day":"14","sort":"2020-04-14"},"title":"Storm Front","author":"Butcher, Jim","series":"The Dresden Files, #1","review":"","highlightCount":16,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1506892083l/6219313.jpg","asin":"B000WH7PLS","goodreadsUrl":"https://www.goodreads.com/book/show/6219313-storm-front","kindleUrl":"https://amazon.com/dp/B000WH7PLS","matchMethod":"asin"},{"id":"before-they-are-hanged-71e63ad3","readMonth":{"month":"Apr","year":"2020","day":"23","sort":"2020-04-23"},"title":"Before They Are Hanged","author":"Abercrombie, Joe","series":"The First Law, #2","review":"Doesn't deliver on the promise of the first novel and there's some character development that seemed somewhat unearned and a little jarring. Biggest gripe is that many of the characters don't have that much of an impact on the overarching plot so it can seem fairly anticlimactic and the world building continues to not be a focus. The main villains are also not too fleshed out and a little generic.\\n\\nIt is a little puzzling that this series is compared to a Song of Ice and Fire when it doesn't come close to the highs of that series so far. That being said, I do enjoy the moment to moment reading of the series and a lot of the characters are fantastic. Hoping that further entries payoff from this slightly awkward middle book.","highlightCount":55,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1487135489l/26248534.jpg","asin":"B00TOT9LIA","goodreadsUrl":"https://www.goodreads.com/book/show/26248534-before-they-are-hanged","kindleUrl":"https://amazon.com/dp/B00TOT9LIA","matchMethod":"title-author"},{"id":"fool-moon-4e86abe6","readMonth":{"month":"Apr","year":"2020","day":"23","sort":"2020-04-23"},"title":"Fool Moon","author":"Butcher, Jim","series":"The Dresden Files, #2","review":"","highlightCount":1,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1767357683l/6488124.jpg","asin":"B001BPYD2O","goodreadsUrl":"https://www.goodreads.com/book/show/6488124-fool-moon","kindleUrl":"https://amazon.com/dp/B001BPYD2O","matchMethod":"asin"},{"id":"grave-peril-05544b27","readMonth":{"month":"Apr","year":"2020","day":"28","sort":"2020-04-28"},"title":"Grave Peril","author":"Butcher, Jim","series":"The Dresden Files, #3","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1579186079l/7021986.jpg","asin":"B001650UDA","goodreadsUrl":"https://www.goodreads.com/book/show/7021986-grave-peril","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"last-argument-of-kings-4078eee2","readMonth":{"month":"May","year":"2020","day":"05","sort":"2020-05-05"},"title":"Last Argument of Kings","author":"Abercrombie, Joe","series":"The First Law, #3","review":"Liked it, didn't love it. More like 3.75 stars than 3. Things from the last book make more sense now and are more or less wrapped up thankfully. The ending was somewhat overly long and overstayed its welcome a bit, could have been a bit tighter wrapping things up, didn't have to know every last detail of how things ended up for the B and C plots.\\n\\nThis series is a bit overhyped in my opinion, had a lot more enjoyment from a Song of Ice and Fire and Malazan at their highs than this series. I did enjoy my time with some of the characters, world building here was not too great and the political intrigue leaves a lot to be desired.","highlightCount":11,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1457429241l/25434380.jpg","asin":"B00TOT9LDA","goodreadsUrl":"https://www.goodreads.com/book/show/25434380-last-argument-of-kings","kindleUrl":"https://amazon.com/dp/B00TOT9LDA","matchMethod":"title-author"},{"id":"lions-of-al-rassan-861b5ef9","readMonth":{"month":"May","year":"2020","day":"11","sort":"2020-05-11"},"title":"The Lions of Al-Rassan","author":"Kay, Guy Gavriel","series":"","review":"","highlightCount":31,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1341037328l/15729014.jpg","asin":"B00851M70C","goodreadsUrl":"https://www.goodreads.com/book/show/15729014-the-lions-of-al-rassan","kindleUrl":"https://amazon.com/dp/B00851M70C","matchMethod":"asin"},{"id":"summer-knight-67aac26a","readMonth":{"month":"May","year":"2020","day":"11","sort":"2020-05-11"},"title":"Summer Knight","author":"Butcher, Jim","series":"The Dresden Files, #4","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1576549278l/6527661.jpg","asin":"B000OCXG46","goodreadsUrl":"https://www.goodreads.com/book/show/6527661-summer-knight","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"assassins-apprentice-245d7fd8","readMonth":{"month":"May","year":"2020","day":"20","sort":"2020-05-20"},"title":"Assassin's Apprentice","author":"Hobb, Robin","series":"Farseer Trilogy, #1","review":"","highlightCount":28,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1547938114l/43618653.jpg","asin":"B000FBFMG6","goodreadsUrl":"https://www.goodreads.com/book/show/43618653-assassin-s-apprentice","kindleUrl":"https://amazon.com/dp/B000FBFMG6","matchMethod":"title-only-unique"},{"id":"modern-romance-5238e1ad","readMonth":{"month":"May","year":"2020","day":"22","sort":"2020-05-22"},"title":"Modern Romance","author":"Ansari, Aziz","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1432335014l/23453112.jpg","asin":"1594206279","goodreadsUrl":"https://www.goodreads.com/book/show/23453112-modern-romance","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"lies-of-locke-lamora-f87291a4","readMonth":{"month":"May","year":"2020","day":"23","sort":"2020-05-23"},"title":"The Lies of Locke Lamora","author":"Lynch, Scott","series":"Gentleman Bastard, #1","review":"Who doesn't love a heist? Perfectly put together story that keeps you guessing and caring about the characters. The audiobook narration is perfection; Michael Page's inflection of characters pretending to be other characters has to be heard to be believed. Just on a completely otherworldly level narration-wise. Also, the story is self contained even though this is a series, so you don't feel obligated to keep going and can take a break.","highlightCount":2,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1458646334l/29588376.jpg","asin":"B000JMKNJ2","goodreadsUrl":"https://www.goodreads.com/book/show/29588376-the-lies-of-locke-lamora","kindleUrl":"https://amazon.com/dp/B000JMKNJ2","matchMethod":"title-author"},{"id":"death-masks-779f1313","readMonth":{"month":"May","year":"2020","day":"26","sort":"2020-05-26"},"title":"Death Masks","author":"Butcher, Jim","series":"The Dresden Files, #5","review":"Hells bells. When will you grow up, Harry Dresden? Really no character development to be seen 5 books in and just way too cheesy for my taste. The chauvinism in this entry seems particularly noticeable as well and just lots of cringey moments sprinkled throughout.\\n\\nThink I'm done with this series; they seem to keep treading the same ground and aren't pushing me to keep going. Dresden can be a bit of a dumbass a lot of times and can be difficult to root for.","highlightCount":0,"myGoodreadsRating":1,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1661016943l/91479.jpg","asin":"0451459407","goodreadsUrl":"https://www.goodreads.com/book/show/91479.Death_Masks","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"royal-assassin-a8c200ef","readMonth":{"month":"Jun","year":"2020","day":"02","sort":"2020-06-02"},"title":"Royal Assassin","author":"Hobb, Robin","series":"Farseer Trilogy, #2","review":"","highlightCount":39,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1428234219l/25300956.jpg","asin":"B000FBFMFW","goodreadsUrl":"https://www.goodreads.com/book/show/25300956-royal-assassin","kindleUrl":"https://amazon.com/dp/B000FBFMFW","matchMethod":"title-only-unique"},{"id":"11-22-63-d33392e7","readMonth":{"month":"Jun","year":"2020","day":"03","sort":"2020-06-03"},"title":"11/22/63","author":"King, Stephen","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1327876792l/10644930.jpg","asin":"1451627289","goodreadsUrl":"https://www.goodreads.com/book/show/10644930-11-22-63","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"night-of-knives-83b57841","readMonth":{"month":"Jun","year":"2020","day":"05","sort":"2020-06-05"},"title":"Night of Knives","author":"Esslemont, Ian C.","series":"Novels of the Malazan Empire, #1","review":"","highlightCount":14,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328313236l/8177158.jpg","asin":"B002HRY18Q","goodreadsUrl":"https://www.goodreads.com/book/show/8177158-night-of-knives","kindleUrl":"https://amazon.com/dp/B002HRY18Q","matchMethod":"asin"},{"id":"assassins-quest-d7343afb","readMonth":{"month":"Jun","year":"2020","day":"13","sort":"2020-06-13"},"title":"Assassin's Quest","author":"Hobb, Robin","series":"The Farseer Trilogy, #3","review":"August 2025:\\nStill an amazing read. Knowing the full story makes me appreciate everything Hobb set up here that pays off in later books.\\n\\nJuly 2020:\\nRobin Hobb makes you care about her characters so much that it hurts a little bit. The way she writes just completely transports my mind into her world; it's wonderful. Fitz gets metaphorically and sometimes literally kicked in the balls repeatedly but he endures. This entry changes up from the previous two in the titular 'quest' fashion, it's a peek from the peephole of Fitz's perspective to a larger world and is refreshing. There is a bit of bloat in this entry and could have been condensed some, but honestly it's nice to spend time with these characters even if they're doing mundane things such as setting up camp or surviving in the wilderness. I ravenously consumed this one and still want more.","highlightCount":51,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1615957897l/57438365.jpg","asin":"B000FBFMFM","goodreadsUrl":"https://www.goodreads.com/book/show/57438365-assassin-s-quest","kindleUrl":"https://amazon.com/dp/B000FBFMFM","matchMethod":"asin"},{"id":"ship-of-magic-dd701c05","readMonth":{"month":"Jun","year":"2020","day":"27","sort":"2020-06-27"},"title":"Ship of Magic","author":"Hobb, Robin","series":"Liveship Traders, #1","review":"","highlightCount":37,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1674925924l/12479384.jpg","asin":"B000FC0XV4","goodreadsUrl":"https://www.goodreads.com/book/show/12479384-ship-of-magic","kindleUrl":"https://amazon.com/dp/B000FC0XV4","matchMethod":"title-author"},{"id":"red-seas-under-red-skies-937c06be","readMonth":{"month":"Jun","year":"2020","day":"28","sort":"2020-06-28"},"title":"Red Seas Under Red Skies","author":"Lynch, Scott","series":"Gentleman Bastard, #2","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1769467139l/887877.jpg","asin":"0553804685","goodreadsUrl":"https://www.goodreads.com/book/show/887877.Red_Seas_Under_Red_Skies","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"way-of-kings-53db8d1e","readMonth":{"month":"Jul","year":"2020","day":"06","sort":"2020-07-06"},"title":"The Way of Kings","author":"Sanderson, Brandon","series":"The Stormlight Archive, #1","review":"It seems like I'm one of the few that isn't in love with this book, I enjoyed it but didn't think it was a revelation by any stretch. Interestingly, Sanderson seems to gravitate towards classic fantasy tropes in this book and mostly eschews modern fantasy trends.\\n\\nI didn't think the budget in terms of page count was used in the way I usually look for in books. This is a massive book! I expect a lot to happen with a page count like this and major events to occur. The characters don't tend to change a whole lot from the beginning of the novel (or at least past the 10% mark) to at least the 85% mark and the pages mainly are involved with exploring the history of the world or flashback sequences for the characters. I'm personally not a huge fan of flashbacks / visions unless used sparingly, they were done well here and were interesting, but a large portion of the book is taken up by them.\\n\\nI'm also not completely immersed in the world, it doesn't feel quite \\"real\\" to me yet. The ideas are interesting and the fauna and weather are interesting but it doesn't seem to permeate society in the way that I'd expect. I also cringe a little bit whenever someone says \\"Storm off!\\".\\n\\nAll that being said, I'm continuing on with Words of Radiance and hoping the world and narrative grabs me more. For what it's worth the prose is pretty strong and understated, I also got really invested in some of the characters and they're all fairly interesting even though they didn't grow as much as I'd like.","highlightCount":11,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1730464382l/53463056.jpg","asin":"B003P2WO5E","goodreadsUrl":"https://www.goodreads.com/book/show/53463056-the-way-of-kings","kindleUrl":"https://amazon.com/dp/B003P2WO5E","matchMethod":"asin"},{"id":"mad-ship-708a00ef","readMonth":{"month":"Jul","year":"2020","day":"26","sort":"2020-07-26"},"title":"Mad Ship","author":"Hobb, Robin","series":"Liveship Traders, #2","review":"","highlightCount":48,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1654640427l/6462121.jpg","asin":"B000FBJF4Q","goodreadsUrl":"https://www.goodreads.com/book/show/6462121-mad-ship","kindleUrl":"https://amazon.com/dp/B000FBJF4Q","matchMethod":"asin"},{"id":"ship-of-destiny-8d07b5db","readMonth":{"month":"Aug","year":"2020","day":"27","sort":"2020-08-27"},"title":"Ship of Destiny","author":"Hobb, Robin","series":"Liveship Traders, #3","review":"The trilogy transcends the Fantasy genre and is elevated to one of the finest literary trilogies of all time in my mind. Hobb tackles weighty topics fundamental to the core of what it means to be human and challenges the reader to think deeply about a number of timeless issues (slavery, family honor, coming of age).\\n\\nShe builds multifaceted characters like none other that force the reader to be invested and care about her characters as people and not as fictional beings. It's honestly astounding the amount these characters go through and how much they change throughout this trilogy.\\n\\nHobb has architected an epic narrative with a large cast of characters that all fit together and evolve in a way that makes sense. The events of this trilogy have huge implications for her sprawling world and the larger series.","highlightCount":81,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1296245443l/6487698.jpg","asin":"B000FBJF50","goodreadsUrl":"https://www.goodreads.com/book/show/6487698-ship-of-destiny","kindleUrl":"https://amazon.com/dp/B000FBJF50","matchMethod":"asin"},{"id":"words-of-radiance-1e01b295","readMonth":{"month":"Aug","year":"2020","day":"28","sort":"2020-08-28"},"title":"Words of Radiance","author":"Sanderson, Brandon","series":"The Stormlight Archive, #2","review":"I can definitively say that Brandon Sanderson is not for me.","highlightCount":9,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1728768241l/17332218.jpg","asin":"B00DA6YEKS","goodreadsUrl":"https://www.goodreads.com/book/show/17332218-words-of-radiance","kindleUrl":"https://amazon.com/dp/B00DA6YEKS","matchMethod":"title-candidate-author"},{"id":"road-4dc92d08","readMonth":{"month":"Sep","year":"2020","day":"02","sort":"2020-09-02"},"title":"The Road","author":"McCarthy, Cormac","series":"","review":"","highlightCount":16,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1589154118l/53368275.jpg","asin":"B000OI0G1Q","goodreadsUrl":"https://www.goodreads.com/book/show/53368275-the-road","kindleUrl":"https://amazon.com/dp/B000OI0G1Q","matchMethod":"asin"},{"id":"fools-errand-0757c62a","readMonth":{"month":"Sep","year":"2020","day":"05","sort":"2020-09-05"},"title":"Fool's Errand","author":"Hobb, Robin","series":"Tawny Man, #1","review":"You can't go home again. However, we go back to Fitz in this book and it feels an awful lot like home. It's good to be back with Fitz after being away from him on the Liveship trilogy. This book hits a lot of classic fantasy notes but the execution here is exemplary; showing that you don't have to always do an edgy modern take to have a story with impact.\\n\\nHobb's prose is flowery while being as precise as a surgeon's knife. She always has the perfect word to describe something and paint the scene. I'll never get tired of her descriptions of her characters eating an extravagant meal or setting up camp. It always feels visceral and real. She brings us into the world of the Six Duchies in what seems like an effortless stroke of her pen.\\n\\nUnder a less masterful writer this story would be tedious, under Hobb it is transcendent.","highlightCount":16,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1482254848l/33521885.jpg","asin":"B000FBFMIO","goodreadsUrl":"https://www.goodreads.com/book/show/33521885-fool-s-errand","kindleUrl":"https://amazon.com/dp/B000FBFMIO","matchMethod":"title-candidate-author"},{"id":"golden-fool-ff15a730","readMonth":{"month":"Sep","year":"2020","day":"13","sort":"2020-09-13"},"title":"Golden Fool","author":"Hobb, Robin","series":"Tawny Man, #2","review":"Very much a transitionary entry that wraps up some events in the first book and sets up the conflict for the final book in the trilogy.\\n\\nHas some hard hitting moments, but definitely suffers from middle book syndrome. However, I've grown to trust Hobb to lay the foundation that will eventually pay off. This book is a lot of foundation building of things that are bound to be epic in the next book.","highlightCount":22,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1462633906l/30128044.jpg","asin":"B000FBFML6","goodreadsUrl":"https://www.goodreads.com/book/show/30128044-golden-fool","kindleUrl":"https://amazon.com/dp/B000FBFML6","matchMethod":"title-candidate-author"},{"id":"fools-fate-020e0054","readMonth":{"month":"Sep","year":"2020","day":"28","sort":"2020-09-28"},"title":"Fool's Fate","author":"Hobb, Robin","series":"Tawny Man #3","review":"","highlightCount":55,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1548437632l/43704256.jpg","asin":"B000FC0ZEO","goodreadsUrl":"https://www.goodreads.com/book/show/43704256-fool-s-fate","kindleUrl":"https://amazon.com/dp/B000FC0ZEO","matchMethod":"title-only-unique"},{"id":"dragon-keeper-c0e56e28","readMonth":{"month":"Oct","year":"2020","day":"08","sort":"2020-10-08"},"title":"The Dragon Keeper","author":"Hobb, Robin","series":"Rain Wild Chronicles, #1","review":"Definitely Hobb's weakest book by a longshot. Still decent to read, but she isn't true to the form we've come to expect in previous books. Returning characters are also woefully underutilized and we end up spending most of our time with new characters which is a bit disappointing, was hoping that we would get more time with the characters from the Liveship trilogy and build on them. Also the book sort of...just ends? Not a satisfying conclusion or self-contained story, makes more sense when you finish the second one.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1330079386l/4703450.jpg","asin":"0007273746","goodreadsUrl":"https://www.goodreads.com/book/show/4703450-the-dragon-keeper","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"dragon-haven-326a9dd1","readMonth":{"month":"Oct","year":"2020","day":"17","sort":"2020-10-17"},"title":"Dragon Haven","author":"Hobb, Robin","series":"Rain Wild Chronicles #2","review":"3.5/5 Better than the first book. Hobb *heavily* uses romantic relationships in this series as a device to tackle issues such as society, co-evolution of the Rainwilders and dragons, coming of age, and tradition vs making your own rules. Usually the romantic relationships are central to the plot which is a stark contrast to her other works.\\n\\nI could see this making it challenging to read or not fitting most reader's tastes, although I think it worked pretty well and the romances are usually in the context of building a new society, thinking about the construct of marriage, and even LGBTQ relationships and the ethics involved there. It was close to being overly fetishized, but to me it didn't cross any barriers there and was still tastefully done. It felt like these relationships were used in an effective way to provide thinking points for the reader, but is a stark contrast to her other books where romance was used sparingly.\\n\\nHer prose is surprisingly less pronounced in these novels, but there is a distinct survival theme in this book that is interesting and provides more color to her world. Overall, I liked it but I definitely don't think it's at the bar of her other books, although it is enjoyable and does provide things to think about.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328217924l/11104429.jpg","asin":"B003B5M0UO","goodreadsUrl":"https://www.goodreads.com/book/show/11104429-dragon-haven","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"city-of-dragons-cc7cba05","readMonth":{"month":"Oct","year":"2020","day":"23","sort":"2020-10-23"},"title":"City of Dragons","author":"Hobb, Robin","series":"Rain Wild Chronicles, #3","review":"Hobb trims a lot of the fat here and the novel is more concise while still having a lot happening. Characters in the Liveship trilogy have more to do here and have an interesting role in the overarching story.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1322613975l/11801463.jpg","asin":"0061561630","goodreadsUrl":"https://www.goodreads.com/book/show/11801463-city-of-dragons","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blood-of-dragons-a68b7d11","readMonth":{"month":"Oct","year":"2020","day":"30","sort":"2020-10-30"},"title":"Blood of Dragons","author":"Hobb, Robin","series":"Rain Wild Chronicles, #4","review":"Pretty solid quadrilogy, however doesn't have the impact of Hobb's other series. Has some really interesting world building and major events the impact the world writ large in this series, so by no means is this skippable in the larger Realm of the Elderlings books without missing out.\\n\\nThe characters in this series end up being fairly interesting, but we don't reach the depths of her other books unfortunately, so while this is a decent series by any other standard, it's the weakest of Hobb's.\\n\\nThe characterization of the dragons, however, is excellent and probably the strongest part of the series as is delving more into the complicated history of the Elderlings.\\n\\nThis series definitely leans more closely to YA than her other books simply due to the age of a lot of her characters which can get a bit tiring, but she does explore interesting ideas using romance as a plot device so I didn't find it as grating as other readers seemed to.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1341265576l/13109291.jpg","asin":"0062116851","goodreadsUrl":"https://www.goodreads.com/book/show/13109291-blood-of-dragons","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"fools-assassin-7bfa7d56","readMonth":{"month":"Nov","year":"2020","day":"08","sort":"2020-11-08"},"title":"Fool's Assassin","author":"Hobb, Robin","series":"The Fitz and the Fool, #1","review":"","highlightCount":50,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1533132942l/41021196.jpg","asin":"B00HBQUF8S","goodreadsUrl":"https://www.goodreads.com/book/show/41021196-fool-s-assassin","kindleUrl":"https://amazon.com/dp/B00HBQUF8S","matchMethod":"asin"},{"id":"library-at-mount-char-01624366","readMonth":{"month":"Nov","year":"2020","day":"08","sort":"2020-11-08"},"title":"The Library at Mount Char","author":"Hawkins, Scott","series":"","review":"","highlightCount":1,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1453225113l/26892110.jpg","asin":"B00NRQRWAA","goodreadsUrl":"https://www.goodreads.com/book/show/26892110-the-library-at-mount-char","kindleUrl":"https://amazon.com/dp/B00NRQRWAA","matchMethod":"title-candidate-author"},{"id":"dune-d9740a85","readMonth":{"month":"Nov","year":"2020","day":"13","sort":"2020-11-13"},"title":"Dune","author":"Herbert, Frank","series":"Dune, #1","review":"This book is undoubtedly a classic and I really loved it the first time I read it in high school. Right now I think it's a fairly solid book, but I think what really brought it over the edge for my in previous reads was Dune Messiah and Children of Dune rounding out the setup in Dune proper. On its own there's some stumbles along the way, especially in the beginning of the book, things are very slow to get started. Also the ending just sort of happens and some major events happen offscreen which is a little disappointing. From what I remember, the story seems more complete after the second and third books where Herbert's pessimistic sirens against organized religion and politics hits full blast.\\n\\nWhat's exceptional about this book however is the theme of prophecy and visions as seen through Paul. There is an inevitable march towards disaster that no character can seem to derail and Herbert tackles topics such as religion, politics, and socio-economics through a critical lens. I definitely appreciated this book on the first read more than this read, now that I've read more science fiction and fantasy this one seems less groundbreaking, but given the time period this was written in it's foundational to a huge swath of SFF, and you can see its influences in a lot of speculative fiction that's currently being written.","highlightCount":69,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1546269682l/43419431.jpg","asin":"B00B7NPRY8","goodreadsUrl":"https://www.goodreads.com/book/show/43419431-dune","kindleUrl":"https://amazon.com/dp/B00B7NPRY8","matchMethod":"asin"},{"id":"best-served-cold-a7cddf76","readMonth":{"month":"Nov","year":"2020","day":"18","sort":"2020-11-18"},"title":"Best Served Cold","author":"Abercrombie, Joe","series":"","review":"4.5/5\\n\\nThis is my favorite Abercrombie book so far. He excels when the stories are smaller and the stakes are lower. The First Law trilogy really struggled trying to fill the boots of epic fantasy, this one doesn't try to do that and it results in a better story that's more focused in what it wants to accomplish.\\n\\nThe dialogue in this book is amazing and sharply written, there's a lot of laugh out loud moments and the characters jump out of the page and are well defined. You can often tell what character is talking based on just how they're talking which is really impressive. The characters are really well developed and complex here, the world is very gray and often completely black where everyone is sort of awful all the time, but there are some moments of friendship; before they turn around and try to kill each-other that is.\\n\\nThis is one of the best audiobooks I've ever listened to. Steven Pacey deserves heaps of praise, every character sounds unique and he brings the story to life as a play performed by one man. I have no idea how he pulls it off but he often goes from one character to another mid-breath and even in certain moments has characters pretending to be other characters...just amazing.","highlightCount":10,"myGoodreadsRating":4,"myReviewRating":4.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1618589625l/40651772.jpg","asin":"B002GUK7JQ","goodreadsUrl":"https://www.goodreads.com/book/show/40651772-best-served-cold","kindleUrl":"https://amazon.com/dp/B002GUK7JQ","matchMethod":"asin"},{"id":"heroes-a7e1e7bc","readMonth":{"month":"Nov","year":"2020","day":"30","sort":"2020-11-30"},"title":"The Heroes","author":"Abercrombie, Joe","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1375671200l/9300768.jpg","asin":"0316123358","goodreadsUrl":"https://www.goodreads.com/book/show/9300768-the-heroes","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"fools-quest-30786d5d","readMonth":{"month":"Dec","year":"2020","day":"02","sort":"2020-12-02"},"title":"Fool's Quest","author":"Hobb, Robin","series":"The Fitz and the Fool, #2","review":"","highlightCount":59,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1529677338l/40610956.jpg","asin":"B00PP3AHIM","goodreadsUrl":"https://www.goodreads.com/book/show/40610956-fool-s-quest","kindleUrl":"https://amazon.com/dp/B00PP3AHIM","matchMethod":"asin"},{"id":"malice-3868e1f5","readMonth":{"month":"Dec","year":"2020","day":"06","sort":"2020-12-06"},"title":"Malice","author":"Gwynne, John","series":"The Faithful and the Fallen, #1","review":"Malice is an adrenaline shot straight to the heart of the modern Fantasy genre; things happen in Malice and they happen fast. If you're tired of lots of filler and events taking a long time to happen in the Fantasy books you're reading Malice is the antidote to that fatigue.\\n\\nGwynne time skips aggressively to get past the boring parts and get right to the good stuff, and it works well. He's playing a balancing act here and it's artfully pulled off where he risks making the story confusing or rushed, but it never feels that way. You can tell that he's confident in his ability to pull off the story and he does so. My biggest concern going forward is if he's used up most of the twist and turns for the first book because it moves so fast, but we will see.\\n\\nThe story is fairly standard good vs evil at the surface level but there is a lot of mystery in the mythology and politics of the world where things are not quite as they seem. Gwynne uses prophecy here excellently to move the plot forward and make the motivations of the characters complex.\\n\\nThe characters are well done and have a surprising amount of depth given how fast the plot moves. This book is purposely eschewing grimdark trends in modern Fantasy and it's refreshing to have characters that you can actually root for, are intrinsically good, and care about their family and friends; it makes their losses matter and their triumphs sweeter. This is more in the vein of classic Fantasy, but Gwynne has a modern take on it.\\n\\nMy favorite part about Gwynne so far is that it feels like he values your time and is very efficient with the page count of this book. Enough happens in this book to have been a trilogy in the hands of other authors but he maintains the delicate act of hitting you with well-developed characters and not losing you in the details.","highlightCount":81,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1373010036l/16300835.jpg","asin":"B00AER8240","goodreadsUrl":"https://www.goodreads.com/book/show/16300835-malice","kindleUrl":"https://amazon.com/dp/B00AER8240","matchMethod":"title-candidate-author"},{"id":"valor-a52ddfc4","readMonth":{"month":"Dec","year":"2020","day":"22","sort":"2020-12-22"},"title":"Valor","author":"Gwynne, John","series":"The Faithful and the Fallen, #2","review":"","highligh
