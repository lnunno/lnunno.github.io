tCount":59,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1530056552l/40651803.jpg","asin":"B00GG0GM28","goodreadsUrl":"https://www.goodreads.com/book/show/40651803-valor","kindleUrl":"https://amazon.com/dp/B00GG0GM28","matchMethod":"asin"},{"id":"red-country-59a08826","readMonth":{"month":"Dec","year":"2020","day":"22","sort":"2020-12-22"},"title":"Red Country","author":"Abercrombie, Joe","series":"","review":"","highlightCount":4,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1333663008l/13521459.jpg","asin":"B0076DEJMO","goodreadsUrl":"https://www.goodreads.com/book/show/13521459-red-country","kindleUrl":"https://amazon.com/dp/B0076DEJMO","matchMethod":"title-author"},{"id":"hyperion-291f4cc7","readMonth":{"month":"Jan","year":"2021","day":"02","sort":"2021-01-02"},"title":"Hyperion","author":"Simmons, Dan","series":"Hyperion Cantos, #1","review":"The humanity shines through despite this being in the far future and a world apart from where we are now. It does this in a realistic way, humans still act similar to how they do today but with access to a swathe of futuristic technology that is indistinguishable from magic. The characters are more well done than a lot of other science fiction stories; Simmons is able to portray his vision for the future in multiple distinct perspectives. The structure of this story is really well done and the memoir-like chapters take very unexpected turns and connect to each-other in interesting ways so there's a ton of variety here.\\n\\nSomething that really stood out to me are the elements of horror in the book, the Shrike is very spooky and mysterious, so you also get elements of a great horror novel intermixed with the memoir and sci-fi elements that are wholly unique.\\n\\nIt's also interesting how prominent the alien worlds' fauna and creatures are. The atmosphere of these worlds are all different and dangerous despite how advanced the technology is, our characters can come to harm from the natural forces as well.\\n\\nMy biggest knock against this is it feels like half the book is missing and just ends abruptly, but planning on reading the next book immediately to hopefully get a satisfying conclusion.","highlightCount":8,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1592234429l/45064996.jpg","asin":"B004G60EHS","goodreadsUrl":"https://www.goodreads.com/book/show/45064996-hyperion","kindleUrl":"https://amazon.com/dp/B004G60EHS","matchMethod":"asin"},{"id":"assassins-fate-33dadccd","readMonth":{"month":"Jan","year":"2021","day":"03","sort":"2021-01-03"},"title":"Assassin's Fate","author":"Hobb, Robin","series":"The Fitz and the Fool, #3","review":"Thank you Robin Hobb for writing these books. This is the best series I have ever read.","highlightCount":86,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1654573518l/30698254.jpg","asin":"B01GYPQRYM","goodreadsUrl":"https://www.goodreads.com/book/show/30698254-assassin-s-fate","kindleUrl":"https://amazon.com/dp/B01GYPQRYM","matchMethod":"asin"},{"id":"ruin-c4479528","readMonth":{"month":"Jan","year":"2021","day":"10","sort":"2021-01-10"},"title":"Ruin","author":"Gwynne, John","series":"The Faithful and the Fallen, #3","review":"This book is absolutely epic in every way, the number of POVs has increased steadily from the first book and you get to see all sides of the conflict in interesting ways. There's some great character moments that have been building throughout the series and finally pay off here and some twists that you don't see coming.\\n\\nThis one has one of the best duels I've ever read and multiple large scale battles that are all distinct from one-another, Gwynne does action sequences exceptionally well and they're easy to visualize what exactly is going on.","highlightCount":79,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1437062982l/23524878.jpg","asin":"B00SRVAAWC","goodreadsUrl":"https://www.goodreads.com/book/show/23524878-ruin","kindleUrl":"https://amazon.com/dp/B00SRVAAWC","matchMethod":"title-author"},{"id":"fall-of-hyperion-9bf73fb5","readMonth":{"month":"Jan","year":"2021","day":"15","sort":"2021-01-15"},"title":"The Fall of Hyperion","author":"Simmons, Dan","series":"Hyperion Cantos, #2","review":"The scale of this book is pretty huge which is both a pro and a con to this entry, you lose some of the intimacy with the first book and the stakes get raised massively in the second part of this story. The themes in this book regarding environmentalism, technology, and human nature are extremely poignant and relevant to this day. It's pretty mind-blowing that Simmons wrote this before the internet surged in popularity and scale, a lot that's in this book could be seen as commentary on today's world of instant communication and technological intrusion into our daily lives.\\n\\nThe book isn't perfect and I think some of the characterization that was done so well in the first book sort of suffers here, but it's done at the expense of telling a huge, universe-impacting story so it makes sense why this is the case. One other thing I would add is that the line between futuristic technology and magic here becomes very blurred and the mysticism of this book can be a bit heavy, but it's usually done to serve an analysis on religion and human nature. The world feels very real and impossibly plausible for how the future might look like which is a huge accomplishment given just how advanced this future society is.","highlightCount":6,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1300719157l/10429950.jpg","asin":"B004G60FWM","goodreadsUrl":"https://www.goodreads.com/book/show/10429950-the-fall-of-hyperion","kindleUrl":"https://amazon.com/dp/B004G60FWM","matchMethod":"asin"},{"id":"wrath-f76fcba8","readMonth":{"month":"Jan","year":"2021","day":"18","sort":"2021-01-18"},"title":"Wrath","author":"Gwynne, John","series":"The Faithful and the Fallen, #4","review":"","highlightCount":65,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1464179284l/27411345.jpg","asin":"B017RQP306","goodreadsUrl":"https://www.goodreads.com/book/show/27411345-wrath","kindleUrl":"https://amazon.com/dp/B017RQP306","matchMethod":"title-author"},{"id":"beowulf-d5df7b6a","readMonth":{"month":"Jan","year":"2021","day":"19","sort":"2021-01-19"},"title":"Beowulf","author":"Unknown","series":"","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1327878125l/52357.jpg","asin":"0393320979","goodreadsUrl":"https://www.goodreads.com/book/show/52357.Beowulf","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"red-rising-b7495ad8","readMonth":{"month":"Jan","year":"2021","day":"21","sort":"2021-01-21"},"title":"Red Rising","author":"Brown, Pierce","series":"Red Rising Saga, #1","review":"I really enjoyed this one and blew through it in a few days. The reviews that mention that this is a blend of Hunger Games, Ender's Game, and Lord of the Flies are spot on. There's also an interesting blend of class warfare in here too, and some pretty great twists that keep you guessing. It stays fresh throughout and there's a major revelation / turn that mixes up the dynamics of the book every few chapters that pushes you forward, wanting to know what happens. The story can be pretty dark too, which I love. No one is safe!","highlightCount":28,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/boo Rising, #3","review":"I was beginning to get a little burnt out on this series towards the end, there's probably more padding in this book than the other two books. Although the ending is really well done and some of the twists and betrayals are pretty great. This book always tries to be a little bit deeper than just a fun action romp, it's partially successful, but there's some descriptions and themes that pull me out of it a little bit since they're not executed quite as well as they could be.\\n\\nI will probably pick up the follow up trilogy once that's completed, the world is interesting and there's enough fallout *cough* to deal with after the events of the finale that I will be curious to see how they're handled in the next set of books.","highlightCount":9,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1654571654l/24685115.jpg","asin":"B00SPVPX2G","goodreadsUrl":"https://www.goodreads.com/book/show/24685115-morning-star","kindleUrl":"https://amazon.com/dp/B00SPVPX2G","matchMethod":"asin"},{"id":"one-piece-1-romance-dawn-12085659","readMonth":{"month":"Feb","year":"2021","day":"12","sort":"2021-02-12"},"title":"One Piece, Vol. 1: Romance Dawn","author":"Oda, Eiichiro","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1572272554l/19007070.jpg","asin":"B00F3HG7ES","goodreadsUrl":"https://www.goodreads.com/book/show/19007070-one-piece-vol-1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"one-piece-2-buggy-clown-30c11cd5","readMonth":{"month":"Feb","year":"2021","day":"13","sort":"2021-02-13"},"title":"One Piece, Volume 2: Buggy the Clown","author":"Oda, Eiichiro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388531494l/364956.jpg","asin":"159116057X","goodreadsUrl":"https://www.goodreads.com/book/show/364956.One_Piece_Volume_2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shadow-of-torturer-55a32df0","readMonth":{"month":"Feb","year":"2021","day":"22","sort":"2021-02-22"},"title":"The Shadow of the Torturer","author":"Wolfe, Gene","series":"","review":"If there's one thing to say about The Shadow of the Torturer, it's that it is unique and also challenges the reader profusely. Although it's barely over 200 pages, it demands a lot of thought from the reader untying the Gordian Knot that is the narrative where you feel like you are immersed in a three dimensional alien puzzle where you don't know the rules and you don't even have all the pieces yet.\\n\\nReading this book is like accidentally stumbling into the dreams of another person that is barely keeping their sanity intact.\\n\\nThe plot is distinctly non-linear and postmodern in many ways and will not hold your hand or explain what is happening for better or worse. The benefits of this are that you are immediately immersed in Severian's head and his working knowledge of the world around him.\\n\\nThis work is also extremely metatextual, allegorical, and metaphorical from a wide variety of cultures, religions, and languages. This makes the text incredibly rich and dense which also makes the book feel a lot longer than it actually is, because you can read a single sentence and extract multiple meanings from it. Likely this means that every person reading it will get something unique from it, which is not easy to do by any means. Gene Wolfe does have passages in this book where he nods to the reader and sort of breaks the fourth wall, at one point even telling you that he understands if you don't continue reading Severian's journey.\\n\\nThat being said there is an actual plot which can be understood in the reality this takes place in, although it's certainly fair to say that you will not have a clear picture of how this world works or that Severian will actively tell you conflicting information in which you need to decide for yourself what is this novel's reality and which is distorted from his perspective on events. In effect, this means that the world will feel \\"fuzzy\\" or cloudy and you won't have a full picture of the rules of the world or what's even possible in this world by the end of the book.\\n\\nThe more I think about this book the more that I like it. However, it'll most likely depend on how the series develops and if things actually start making sense or not. I could see myself finishing the series and looking back on this book as a piece of genius or as an impenetrable mess. Or possibly get frustrated and not finish the whole thing. At this point all the outcomes seem equally likely.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1329650008l/60211.jpg","asin":"0671540661","goodreadsUrl":"https://www.goodreads.com/book/show/60211.The_Shadow_of_the_Torturer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"dragonbone-chair-e47f3b32","readMonth":{"month":"Feb","year":"2021","day":"26","sort":"2021-02-26"},"title":"The Dragonbone Chair","author":"Williams, Tad","series":"Memory, Sorrow, and Thorn, #1","review":"March 2023 Re-read in preparation for reading Last King of Osten Ard for the first time.\\n\\nOne of my favorite first books of a series, up there with Fellowship of the Ring in terms of coziness especially the first part of the book is so soothing and nice.\\n\\nTad does an incredible job with the world building and introducing a world with a huge amount of history and lore.\\n\\nAlthough I love this book I do think it has some fairly obvious flaws and doesn't introduce the politics and make you care as much as A Song of Ice and Fire does, where some of the storylines have a bit awkward beginnings here and you wonder why they're there. These were a bit better on a re-read but I still think this could have been done a bit better.\\n\\nTad also is definitely overlong and that's definitely his biggest flaw. However the prose is absolutely gorgeous and there's some sections of the book that are incredibly beautiful, deep, and profound. His foreshadowing is also really good and makes a re-read really interesting to examine what he told you and when.\\n\\nOsten Ard is one of my favorite fantasy worlds and I'm grateful to spend more time in it, really excited for the sequel series and to see how things have changed and what's next in the series.","highlightCount":35,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1511909117l/8242507.jpg","asin":"B00316UMPS","goodreadsUrl":"https://www.goodreads.com/book/show/8242507-the-dragonbone-chair","kindleUrl":"https://amazon.com/dp/B00316UMPS","matchMethod":"asin"},{"id":"one-piece-3-dont-get-fooled-again-04f96596","readMonth":{"month":"Feb","year":"2021","day":"27","sort":"2021-02-27"},"title":"One Piece, Volume 3: Don't Get Fooled Again","author":"Oda, Eiichiro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388531492l/364957.jpg","asin":"1591161843","goodreadsUrl":"https://www.goodreads.com/book/show/364957.One_Piece_Volume_3","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"claw-of-conciliator-f0dcbebd","readMonth":{"month":"Feb","year":"2021","day":"28","sort":"2021-02-28"},"title":"The Claw of the Conciliator","author":"Wolfe, Gene","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1332036282l/463376.jpg","asin":"0671416162","goodreadsUrl":"https://www.goodreads.com/book/show/463376.The_Claw_of_the_Conciliator","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"stone-of-farewell-1f1a4208","readMonth":{"month":"Mar","year":"2021","day":"07","sort":"2021-03-07"},"title":"Stone of Farewell","author":"Williams, Tad","series":"Memory, Sorrow, and Thorn, #2","review":"Re-read. Definitely a middle book but a lot more happens than I remember. There's an overarching theme of \\"these characters need to move from where they're not supposed to be to where they are supposed to be\\" but actually a lot more happens than I remembered. The world of Osten Ard can be a dangerous and scary place, especially when larger events are causing the world to become undone.\\n\\nI'm very excited for the conclusion and there's a lot of climactic moments that I remember that I'm interested in re-experiencing. One of my favorite series and have been very happy with my decision to re-read before the last book comes out in November.","highlightCount":23,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1551172940l/8498843.jpg","asin":"B0031AI0E4","goodreadsUrl":"https://www.goodreads.com/book/show/8498843-stone-of-farewell","kindleUrl":"https://amazon.com/dp/B0031AI0E4","matchMethod":"asin"},{"id":"to-green-angel-tower-d31bfe4b","readMonth":{"month":"Mar","year":"2021","day":"27","sort":"2021-03-27"},"title":"To Green Angel Tower","author":"Williams, Tad","series":"Memory, Sorrow, and Thorn, #3","review":"Re-reading this series was an absolute treat. My favorite classical fantasy series just behind Lord of the Rings. Very excited to read the sequel series very soon.\\n\\nA lot of great scenes in this book and it uses the page count well even though it's one of the largest fantasy books written. Love the immersion and moments of horror Tad has in his stories.","highlightCount":28,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1551173082l/44141054.jpg","asin":"B002SV37EA","goodreadsUrl":"https://www.goodreads.com/book/s GL","goodreadsUrl":"https://www.goodreads.com/book/show/36153880-rogue-protocol","kindleUrl":"https://amazon.com/dp/B0756JSWGL","matchMethod":"asin"},{"id":"children-of-time-4eb1f11d","readMonth":{"month":"May","year":"2021","day":"02","sort":"2021-05-02"},"title":"Children of Time","author":"Tchaikovsky, Adrian","series":"Children of Time, #1","review":"I don't want to over praise this book due to recency bias, but it's good. Really good. I think it will be cemented for me as a science fiction classic. Tchaikovsky explores a lot of interesting ideas with nuance and care. Nothing seems ham-fisted and both sides of the conflict or differing philosophies are fairly represented and have you empathizing with both sides which is not easy to pull off.\\n\\nThis also is one of the best if not the absolute best description of aliens I have read. His zoological background makes the encounters and progression of the aliens pretty mind bending and engaging. Feels very realistic and plausible that if the cast of the evolutionary dice were different it could have ended up like this instead.","highlightCount":14,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1545337652l/40514364.jpg","asin":"B07DN8BQMD","goodreadsUrl":"https://www.goodreads.com/book/show/40514364-children-of-time","kindleUrl":"https://amazon.com/dp/B07DN8BQMD","matchMethod":"asin"},{"id":"time-of-blood-b1c3bdc5","readMonth":{"month":"May","year":"2021","day":"06","sort":"2021-05-06"},"title":"A Time of Blood","author":"Gwynne, John","series":"Of Blood and Bone, #2","review":"","highlightCount":42,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1549450446l/40190653.jpg","asin":"B07CWQ5QL8","goodreadsUrl":"https://www.goodreads.com/book/show/40190653-a-time-of-blood","kindleUrl":"https://amazon.com/dp/B07CWQ5QL8","matchMethod":"asin"},{"id":"children-of-ruin-aa ort":"2021-06-29"},"title":"The Darkness That Comes Before","author":"Bakker, R. Scott","series":"The Prince of Nothing, #1","review":"Wanted to write down a couple of things just to encourage you to give these books a try. This is a criminally overlooked series and the Goodreads ratings for it are a travesty.\\n\\nThis series is dark, epic, and has great and nuanced characters. Definitely not for the faint of heart or easily offended, but if you are looking for a mature book with amazing writing, deep philosophical questions, and complex political machinations this may be the series for you.\\n\\nBakker is a masterclass writer and this series has some of the most compelling mysteries I've ever read, I absolutely devour these books and want to know what happens next so badly. His approach to a book epic in scope is really well done, he eases you into the world piece by piece in this book before the main drive of the series takes place.","highlightCount":72,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1547939599l/43618803.jpg","asin":"B07MXCRKVQ","goodreadsUrl":"https://www.goodreads.com/book/show/43618803-the-darkness-that-comes-before","kindleUrl":"https://amazon.com/dp/B07MXCRKVQ","matchMethod":"asin"},{"id":"project-hail-mary-58aeb578","readMonth":{"month":"Jun","year":"2021","day":"29","sort":"2021-06-29"},"title":"Project Hail Mary","author":"Weir, Andy","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1764703833l/54493401.jpg","asin":"0593135202","goodreadsUrl":"https://www.goodreads.com/book/show/54493401-project-hail-mary","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"eaters-of-dead-9a48d445","readMonth":{"month":"Jul","year":"2021","day":"01","sort":"2021-07-01"},"title":"Eaters of the Dead","author":"Crichton, Michael","series":"","review":"","highlig nstein","author":"Swallow, James","series":"The Horus Heresy, #4","review":"The best 40k book I've read yet, this one has it all: spaceship battles, creepy mechanized aliens, creepy chaos space creatures, moral dilemmas, politics, great characters and shows important events in a new light.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387725809l/80155.jpg","asin":"1844164594","goodreadsUrl":"https://www.goodreads.com/book/show/80155.The_Flight_of_the_Eisenstein","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"one-punch-man-2-secret-to-strength-5fd478ef","readMonth":{"month":"Aug","year":"2021","day":"02","sort":"2021-08-02"},"title":"One-Punch Man, Vol. 2: The Secret to Strength","author":"ONE","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1397608755l/21936131.jpg","asin":"B00IU3DW8G","goodreadsUrl":"https://www.goodreads.com/book/show/21936131-one-punch-man-vol-2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"god-is-not-willing-fa1240b5","readMonth":{"month":"Aug","year":"2021","day":"04","sort":"2021-08-04"},"title":"The God is Not Willing","author":"Erikson, Steven","series":"Witness, #1","review":"Pretty good, not my favorite Malazan book by far but overall fairly solid. Was definitely missing the epic scale of the other books and even though the book is a lot shorter than the others it does feel like it's treading water a bit waiting for the main events to come about. The writing, especially in the beginning, is excellent. I like Erikson having a more focused story but the actual plot could have had a bit more happen, I'm hoping the next book is a bit faster paced.\\n\\nOne of the biggest negatives for me is there is _a lot_ of marine banter in this one that I enjoyed in the beginning but it just keeps happening and loses its effect after awhile and started to grate on me by the end. Also has some of the weakest characters Erikson has done so far with a couple of notable exceptions. I don't think this one lived up to the amount of hype it had and the payoff wasn't as big as I'd hoped.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1622571633l/41555932.jpg","asin":"0765323591","goodreadsUrl":"https://www.goodreads.com/book/show/41555932-the-god-is-not-willing","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"winter-king-d5e962f1","readMonth":{"month":"Aug","year":"2021","day":"07","sort":"2021-08-07"},"title":"The Winter King","author":"Cornwell, Bernard","series":"The Warlord Chronicles, #1","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1311987677l/68520.jpg","asin":"B0FSL3721D","goodreadsUrl":"https://www.goodreads.com/book/show/68520.The_Winter_King","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"thousandfold-thought-a97d7ddb","readMonth":{"month":"Aug","year":"2021","day":"14","sort":"2021-08-14"},"title":"The Thousandfold Thought","author":"Bakker, R. Scott","series":"The Prince of Nothing, #3","review":"","highlightCount":63,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1548110795l/43670655.jpg","asin":"B07MXDLDC3","goodreadsUrl":"https://www.goodreads.com/book/show/43670655-the-thousandfold-thought","kindleUrl":"https://amazon.com/dp/B07MXDLDC3","matchMethod":"asin"},{"id":"soul-hunter-e1005c1c","readMonth":{"month":"Aug","year":"2021","day":"16","sort":"2021-08-16"},"title":"Soul Hunter","author":"Dembski-Bowden, Aaron","series":"Night Lords, #1","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1333913209l/7000922.jpg","asin":"1844168115","goodreadsUrl":"https://www.goodreads.com/book/show/7000922-soul-hunter","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"expert-systems-brother-62fddf8a","readMonth":{"month":"Aug","year":"2021","day":"17","sort":"2021-08-17"},"title":"The Expert System's Brother","author":"Tchaikovsky, Adrian","series":"Expert System, #1","review":"Tchaikovsky is so creative and each book of his feels distinct and well written in its own way. This one delves into societal aspects and is more of a mix of Fantasy and Sci-fi.\\n\\nThe world also feels real and brutal with some of the best descriptions of various creatures and fauna that are otherworldly and weird but feel realistic. Can't wait to read the next one.","highlightCount":17,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1517500030l/38321266.jpg","asin":"B0791K4V2F","goodreadsUrl":"https://www.goodreads.com/book/show/38321266-the-expert-system-s-brother","kindleUrl":"https://amazon.com/dp/B0791K4V2F","matchMethod":"asin"},{"id":"congo-b2ee4e07","readMonth":{"month":"Aug","year":"2021","day":"17","sort":"2021-08-17"},"title":"Congo","author":"Crichton, Michael","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1385169362l/18892810.jpg","asin":"B007UH4FK2","goodreadsUrl":"https://www.goodreads.com/book/show/18892810-congo","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"one-punch-man-3-f2deb5bc","readMonth":{"month":"Aug","year":"2021","day":"19","sort":"2021-08-19"},"title":"One-Punch Man, Vol. 3","author":"ONE","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1443734725l/25784126.jpg","asin":"1421564610","goodreadsUrl":"https://www.goodreads.com/book/show/25784126-one-punch-man-vol-3","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"enemy-of-god-cb7e4f79","readMonth":{"month":"Aug","year":"2021","day":"20","sort":"2021-08-20"},"title":"Enemy of God","author":"Cornwell, Bernard","series":"The Warlord Chronicles, #2","review":"","highlightCount":28,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1332187227l/13553133.jpg","asin":"B006WOVIRC","goodreadsUrl":"https://www.goodreads.com/book/show/13553133-enemy-of-god","kindleUrl":"https://amazon.com/dp/B006WOVIRC","matchMethod":"asin"},{"id":"one-punch-man-4-ab2bee9b","readMonth":{"month":"Aug","year":"2021","day":"20","sort":"2021-08-20"},"title":"One-Punch Man, Vol. 4","author":"ONE","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1444017081l/25784128.jpg","asin":"1421569205","goodreadsUrl":"https://www.goodreads.com/book/show/25784128-one-punch-man-vol-4","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"expert-systems-champion-32311446","readMonth":{"month":"Aug","year":"2021","day":"23","sort":"2021-08-23"},"title":"The Expert System’s Champion","author":"Tchaikovsky, Adrian","series":"Expert System #2","review":"The story went in a direction I wasn't expecting and didn't build off my favorite parts of the first book. Still good writing but didn't quite land completely for me. Reading it back to back it seemed like it didn't quite have continuity with the first one especially in terms of the themes. Almost felt like a different story","highlightCount":8,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1648758440l/50663061.jpg","asin":"B088Q8RZ18","goodreadsUrl":"https://www.goodreads.com/book/show/50663061-the-expert-system-s-champion","kindleUrl":"https://amazon.com/dp/B088Q8RZ18","matchMethod":"asin"},{"id":"little-hatred-2fc2f814","readMonth":{"month":"Aug","year":"2021","day":"24","sort":"2021-08-24"},"title":"A Little Hatred","author":"Abercrombie, Joe","series":"The Age of Madness, #1","review":"This is peak Abercrombie. His writing has improved so much since the initial First Law book. He plays to his strengths here and has a big cast of interesting and funny characters that are morally gray to a tee. Some of the best dialogue in any book.\\n\\nThe plot is also unique and relevant to current day events and has well rounded perspectives on all sides of the issues of industrialization, corruption, power, poor vs rich.\\n\\nGreat first entry that builds off all of the books before so well without rehashing anything that came before. Excited to see where this series goes.","highlightCount":32,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1653610899l/43539308.jpg","asin":"B07MJ656W9","goodreadsUrl":"https://www.goodreads.com/book/show/43539308-a-little-hatred","kindleUrl":"https://amazon.com/dp/B07MJ656W9","matchMethod":"asin"},{"id":"consider-phlebas-52059b32","readMonth":{"month":"Aug","year":"2021","day":"27","sort":"2021-08-27"},"title":"Consider Phlebas","author":"Banks, Iain M.","series":"Culture, #1","review":"","highlightCount":16,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1622022819l/8279737.jpg","asin":"B0013TX6FI","goodreadsUrl":"https://www.goodreads.com/book/show/8279737-consider-phlebas","kindleUrl":"https://amazon.com/dp/B0013TX6FI","matchMethod":"asin"},{"id":"made-things-2abc960d","readMonth":{"month":"Aug","year":"2021","day":"27","sort":"2021-08-27"},"title":"Made Things","author":"Tchaikovsky, Adrian","series":"Made Things, #1","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1557991956l/44581532.jpg","asin":"1250232996","goodreadsUrl":"https://www.goodreads.com/book/show/44581532-made-things","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"greenlights-02bf85c2","readMonth":{"month":"Aug","year":"2021","day":"27","sort":"2021-08-27"},"title":"Greenlights","author":"McConaughey, Matthew","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1604281659l/52838315.jpg","asin":"0593139135","goodreadsUrl":"https://www.goodreads.com/book/show/52838315-greenlights","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-22-0f578046","readMonth":{"month":"Aug","year":"2021","day":"29","sort":"2021-08-29"},"title":"Berserk, Vol. 22","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1403207741l/2571920.jpg","asin":"1593078633","goodreadsUrl":"https://www.goodreads.com/book/show/2571920-berserk-vol-22","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"excalibur-novel-of-arthur-b94af3ba","readMonth":{"month":"Aug","year":"2021","day":"30","sort":"2021-08-30"},"title":"Excalibur: A Novel of Arthur","author":"Cornwell, Bernard","series":"","review":"This trilogy is a masterpiece for sure. So good. Feels real and is way darker than I thought it would be.\\n\\nThe interaction between Paganism, Christianity, and the Saxon religion are so compelling and bring a blend of magic that you're never sure if it's superstition or actually having an effect on the plot.\\n\\nGreat characters that you learn to love, hate, and some that are redeemed and some that fall to the temptation of evil.","highlightCount":18,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1335193441l/13613945.jpg","asin":"B006WOVIWW","goodreadsUrl":"https://www.goodreads.com/book/show/13613945-excalibur","kindleUrl":"https://amazon.com/dp/B006WOVIWW","matchMethod":"title-author"},{"id":"trouble-with-peace-8065ca41","readMonth":{"month":"Sep","year":"2021","day":"03","sort":"2021-09-03"},"title":"The Trouble with Peace","author":"Abercrombie, Joe","series":"The Age of Madness, #2","review":"Too much focus on things I didn't care for and didn't play to Abercrombie's strengths. Definitely enjoyed certain parts but overall much weaker than ALH to me.\\n\\nNot bad by any means, but I did expect a lot more. Abercrombie is pulling a lot of punches in scenes that could be pivotal and it's losing the impact that they could have had.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1591713509l/51789182.jpg","asin":"B0847KH373","goodreadsUrl":"https://www.goodreads.com/book/show/51789182-the-trouble-with-peace","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"falling-free-8bede14c","readMonth":{"month":"Sep","year":"2021","day":"04","sort":"2021-09-04"},"title":"Falling Free","author":"Bujold, Lois McMaster","series":"Vorkosigan Saga, #4","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348353067l/2684544.jpg","asin":"1416555463","goodreadsUrl":"https://www.goodreads.com/book/show/2684544-falling-free","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"later-f8650dc4","readMonth":{"month":"Sep","year":"2021","day":"05","sort":"2021-09-05"},"title":"Later","author":"King, Stephen","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1596448456l/54798175.jpg","asin":"B08F4GYM8W","goodreadsUrl":"https://www.goodreads.com/book/show/54798175-later","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"player-of-games-967afb99","readMonth":{"month":"Sep","year":"2021","day":"07","sort":"2021-09-07"},"title":"The Player of Games","author":"Banks, Iain M.","series":"Culture, #2","review":"I'd recommend you to just read Ender's Game instead, it executes an idea like this a lot better.\\n\\nIt's a weird way to tell a story without that much tension or really not explaining the game that well in a book called \\"Player of Games\\"\\n\\nI was tempted to DNF Player of Games, Banks has some of the most bland writing I've ever read. It's neither offensibly bad or good in any way. It's really sort of amazing how the plot is moving forward without much character motivation.\\n\\nI was thinking it was a 3/5 for awhile but I realized that I wouldn't care if I never found out how it ended. Banks doesn't excel at one thing in particular so the result is that there's many sci-fi authors that you should look to for better humor, world building, ideas.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":3,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387743443l/19819475.jpg","asin":"B002WM3HC2","goodreadsUrl":"https://www.goodreads.com/book/show/19819475-the-player-of-games","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"judging-eye-b39c61df","readMonth":{"month":"Sep","year":"2021","day":"09","sort":"2021-09-09"},"title":"The Judging Eye","author":"Bakker, R. Scott","series":"Aspect-Emperor, #1","review":"Bakker keeps getting better. This is way more of a slow burn, but you spend a lot of time developing and catching up on characters you spent time with in the first trilogy and dealing with the fallout from it.\\n\\nThe world building and lore in this one is next level, also has some deeply disturbing and horrifying scenes; great stuff for grimdark fans.\\n\\nThe writing is some of the best, silky smooth prose and the scenery descriptions really pop and immerse you deeply into the world. Really can't say enough good things, I want to find out what happens really badly.","highlightCount":82,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1550363912l/44028562.jpg","asin":"B07NQBR99K","goodreadsUrl":"https://www.goodreads.com/book/show/44028562-the-judging-eye","kindleUrl":"https://amazon.com/dp/B07NQBR99K","matchMethod":"asin"},{"id":"fulgrim-46fcf415","readMonth":{"month":"Sep","year":"2021","day":"12","sort":"2021-09-12"},"title":"Fulgrim","author":"McNeill, Graham","series":"The Horus Heresy, #5","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1403985069l/957931.jpg","asin":"1844164764","goodreadsUrl":"https://www.goodreads.com/book/show/957931.Fulgrim","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"trollslayer-860c3bd8","readMonth":{"month":"Sep","year":"2021","day":"13","sort":"2021-09-13"},"title":"Trollslayer","author":"King, William","series":"Gotrek & Felix, #1","review":"Not high-literature by any stretch of the imagination, but a lot of fun. Hits a lot of the notes in Fantasy that I'm looking for, the stories start feeling somewhat similar by the end, but you get a lot of fun monster slaying along the way with the varied factions in the Warhammer world and get to see a couple of iconic locations. Keeble's narration of the audiobook is amazing as well.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1177284384l/691915.jpg","asin":"1844160025","goodreadsUrl":"https://www.goodreads.com/book/show/691915.Trollslayer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"exhalation-abf85312","readMonth":{"month":"Sep","year":"2021","day":"13","sort":"2021-09-13"},"title":"Exhalation","author":"Chiang, Ted","series":"","review":"Inconsistent. Some stories are great, some are pretty meh. One is so generic I had to DNF it and it was the longest one by a large margin.\\n\\nThis is heavily driven by ideas over characters and the ideas in this one aren't as interesting as Stories of Your Life and Others. The characters are pretty shallow too and hard to connect to.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1534388394l/41160292.jpg","asin":"B0DWTQM8GW","goodreadsUrl":"https://www.goodreads.com/book/show/41160292-exhalation","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shards-of-honour-f4764d0a","readMonth":{"month":"Sep","year":"2021","day":"14","sort":"2021-09-14"},"title":"Shards of Honour","author":"Bujold, Lois McMaster","series":"Vorkosigan Saga, #1","review":"","highlightCount":23,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1444991620l/12282943.jpg","asin":"B005BH9T86","goodreadsUrl":"https://www.goodreads.com/book/show/12282943-shards-of-honour","kindleUrl":"https://amazon.com/dp/B005BH9T86","matchMethod":"asin"},{"id":"wisdom-of-crowds-5d5be2c4","readMonth":{"month":"Sep","year":"2021","day":"17","sort":"2021-09-17"},"title":"The Wisdom of Crowds","author":"Abercrombie, Joe","series":"The Age of Madness #3","review":"Abercrombie grins as he stares at you across the room. The smell is awful. Shit is scattered throughout the room as a giant metal fan sprays it continuously as it pours from buckets above. The only pause is for Abercrombie to fill another bucket, trudge up the stairs and continue the foul smelling onslaught. Needless to say, shit really hits the fan in this book and it just keeps hitting. This is the darkest First Law book yet and is nearly continuous action and has multiple climaxes spaced throughout the novel.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compre htCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1407107780l/68527.jpg","asin":"0060887184","goodreadsUrl":"https://www.goodreads.com/book/show/68527.The_Last_Kingdom","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"white-luck-warrior-a122b8b0","readMonth":{"month":"Sep","year":"2021","day":"28","sort":"2021-09-28"},"title":"The White-Luck Warrior","author":"Bakker, R. Scott","series":"Aspect-Emperor, #2","review":"This is one of the densest and metaphorical of the series so far which made it a bit of a challenge to read (and required re-reads of many sections), but this series continues to be one of my favorite series. It's getting so dark and bleak, but Bakker's writing remains some of the most beautiful and deep I've read.\\n\\nThis book also has some of the best action in the entire series so far. Each book in the series doesn't end cleanly and makes you want to pick up the next book immediately, so I've found it a challenge to take breaks in-between the books in this second series. This definitely feels like one big story and not individual episodes.\\n\\nBakker definitely keeps dangling the promise of answers as a carrot to keep you trudging along the slog of slogs!","highlightCount":102,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1549588589l/43887891.jpg","asin":"B07MW8N3N1","goodreadsUrl":"https://www.goodreads.com/book/show/43887891-the-white-luck-warrior","kindleUrl":"https://amazon.com/dp/B07MW8N3N1","matchMethod":"asin"},{"id":"dracula-75f2b2c3","readMonth":{"month":"Oct","year":"2021","day":"04","sort":"2021-10-04"},"title":"Dracula","author":"Stoker, Bram","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387151694l/17245.jpg","asin":"0393970124","goodreadsUrl": tps://www.goodreads.com/book/show/2322177.Battle_for_the_Abyss","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"tiamats-wrath-c65b61b1","readMonth":{"month":"Dec","year":"2021","day":"10","sort":"2021-12-10"},"title":"Tiamat's Wrath","author":"Corey, James S.A.","series":"The Expanse, #8","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1522779721l/28335698.jpg","asin":"0316332879","goodreadsUrl":"https://www.goodreads.com/book/show/28335698-tiamat-s-wrath","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"auberon-7b82993f","readMonth":{"month":"Dec","year":"2021","day":"12","sort":"2021-12-12"},"title":"Auberon","author":"Corey, James S.A.","series":"The Expanse, #7.5","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1654567333l/51209450.jpg","asin":"B0CVJ2Z41D","goodreadsUrl":"https://www.goodreads.com/book/show/51209450-auberon","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"jade-legacy-f5116e54","readMonth":{"month":"Dec","year":"2021","day":"14","sort":"2021-12-14"},"title":"Jade Legacy","author":"Lee, Fonda","series":"The Green Bone Saga, #3","review":"There's a lot packed into this book, and the sheer ambition, character work, and plot is enough to make this a five star read. I wouldn't say this is one of my all time favorite reads, or even up there with the best I've read this year, but I did enjoy my time with it. This one reads as a number of story vignettes that utilize the characters we're familiar with through a large chunk of time that has some characters grow old, some grow up, and some die, horribly and tragically.\\n\\nOne of my critiques is that it doesn't feel like a cohesive narrative as much, that while it's very interesting and engaging, what it's building towards thematically doesn't connect with me as much as some of my favorite books. While I admire the ambition here, what the author is trying to comment on and build outside of the plot isn't done as well as some of my other favorite authors might do. That being said, the plot and characters are all really well done and it's fun to read having no idea what can happen next is compelling.","highlightCount":37,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1618202056l/57703904.jpg","asin":"B091PQZFWY","goodreadsUrl":"https://www.goodreads.com/book/show/57703904-jade-legacy","kindleUrl":"https://amazon.com/dp/B091PQZFWY","matchMethod":"asin"},{"id":"leviathan-falls-c1810068","readMonth":{"month":"Dec","year":"2021","day":"16","sort":"2021-12-16"},"title":"Leviathan Falls","author":"Corey, James S.A.","series":"The Expanse, #9","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1600283641l/28335699.jpg","asin":"0356510395","goodreadsUrl":"https://www.goodreads.com/book/show/28335699-leviathan-falls","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"guns-of-dawn-c78b0c55","readMonth":{"month":"Dec","year":"2021","day":"17","sort":"2021-12-17"},"title":"Guns of the Dawn","author":"Tchaikovsky, Adrian","series":"","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1421364877l/23524779.jpg","asin":"0230770037","goodreadsUrl":"https://www.goodreads.com/book/show/23524779-guns-of-the-dawn","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"steel-remains-ff4fd106","readMonth":{"month":"Dec","year":"2021","day":"18","sort":"2021-12-18"},"title":"The Steel Remains","author":"Morgan, Richard K.","series":"A Land Fit for Heroes, #1","review":"This one's hard to assign any sort of rating to as it's very out there and weird, but also some of the most graphic content I've ever read. It definitely descends into nihilism at times and almost didn't want to continue the series, but there's enough unique here that I want to give the next one a try at some point.\\n\\nI didn't think it was as \\"trope smashing\\" as others have praised this as being, since there's definitely similar structure to other fantasy books, but maybe the level of depravity counts as smashing tropes? I'm not sure.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1708892689l/3314369.jpg","asin":"0575084812","goodreadsUrl":"https://www.goodreads.com/book/show/3314369-the-steel-remains","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"empire-of-vampire-3821fc88","readMonth":{"month":"Dec","year":"2021","day":"19","sort":"2021-12-19"},"title":"Empire of the Vampire","author":"Kristoff, Jay","series":"Empire of the Vampire, #1","review":"","highlightCount":108,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1612491568l/56386317.jpg","asin":"B08R2K5LRM","goodreadsUrl":"https://www.goodreads.com/book/show/56386317-empire-of-the-vampire","kindleUrl":"https://amazon.com/dp/B08R2K5LRM","matchMethod":"asin"},{"id":"first-and-only-5431f84a","readMonth":{"month":"Dec","year":"2021","day":"20","sort":"2021-12-20"},"title":"First and Only","author":"Abnett, Dan","series":"Gaunt's Ghosts #1","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1480517808l/33164783.jpg","asin":"B01N942H0T","goodreadsUrl":"https://www.goodreads.com/book/show/33164783-first-and-only","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"brothers-of-wind-94d042f3","readMonth":{"month":"Dec","year":"2021","day":"21","sort":"2021-12-21"},"title":"Brothers of the Wind","author":"Williams, Tad","series":"The Last King of Osten Ard, #0.75","review":"4.5/5 I'm all in on Osten Ard. This is my 7th Osten Ard book I've read this year and the 5th one I've re-read, you could say I'm a fan.\\n\\nThis is an essential novel either before starting Last King of Osten Ard or before Navigator's Children. It's hard to stress just how relevant this book is to that series and I had no idea how much it was until reading Witchwood Crown and Empire of Grass.\\n\\nThese books reward immersion and attention to detail as new mysteries emerge and the lore gets deeper and richer since this is the only prequel novella so far. It's incredibly interesting what the intrinsic mysteries of this world are that even the ancient Zadaya, Hikadaya, and Zinukadaya races disagree and debate on.\\n\\nThe characters Tad creates and has perspectives on here are some of his best where they're easy to empathize with and they're usually trying to do the right thing but go through terrible hardships that they must overcome, great stuff.\\n\\nCan't praise the series highly enough, some of the most beautiful writing I've ever read and one of the best worlds I've been immersed in in any fantasy series.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":4.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1621627380l/57282621.jpg","asin":"0756412684","goodreadsUrl":"https://www.goodreads.com/book/show/57282621-brothers-of-the-wind","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"king-of-thorns-af755d68","readMonth":{"month":"Dec","year":"2021","day":"28","sort":"2021-12-28"},"title":"King of Thorns","author":"Lawrence, Mark","series":"Broken Empire, #2","review":"","highlightCount":30,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1719945169l/15765129.jpg","asin":"B0072NWJ3Y","goodreadsUrl":"https://www.goodreads.com/book/show/15765129-king-of-thorns","kindleUrl":"https://amazon.com/dp/B0072NWJ3Y","matchMethod":"title-author"},{"id":"empire-of-silence-5f3cdc4c","readMonth":{"month":"Dec","year":"2021","day":"28","sort":"2021-12-28"},"title":"Empire of Silence","author":"Ruocchio, Christopher","series":"The Sun Eater, #1","review":"**spoiler alert** Re-read in 2023 and it was awesome, especially with having the context of later books.\\n\\nReview is from original 2021 read:\\n\\nWhat an awesome book. Didn't expect it to be as dark as it was, I thought the beginning and ending were very strong, the middle parts weren't as smooth but I liked where it was building towards.\\n\\nI wasn't expecting the 1984 like surveillance state, thought that was a really cool aspect. I liked how all the influences were worn on its sleeve and definitely got the references to Book of the New Sun (especially the ending where Hadrian says you don't have to read any further, references to torturers, lictors, probably more that I missed).\\n\\nAnd the Dune references - fear is a poison, shields and sword combat, thinking machines being illegal, the Chantry being the overarching authority of the universe with atomic weapons.\\n\\nDidn't think this was overdone and was mixed into a world that made sense and also there was a lot of fucked up social dynamics with class disparity being a huge deal that we see while Hadrian is homeless for a few years and his privilege of being in the upper social class with the contrast of the plague going on only for the plebian class was really interesting and messed up.\\n\\nI'm definitely interested in what is going on with the Quiet, the part where Hadrian trips balls in the hidden chamber in the ruins was probably my favorite part of the book. The parts with the Cielcin were awesome and learning more about them is really cool and compelling. Also the fact that they're not completely buddy buddy with Hadrian makes sense and they actively try to kill him because he promised they'd be released and not killed.\\n\\nThe politics in the book was great, want to learn more about all the houses and figure out more about the religion that considers Earth a God and what actually happened there.\\n\\nI liked how I didn't really know where the book was going to go and for the most part characters you meet are only there transiently and you don't know who's going to stick around and for how long.","highlightCount":28,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1523897945l/36454667.jpg","asin":"B07693PKH7","goodreadsUrl":"https://www.goodreads.com/book/show/36454667-empire-of-silence","kindleUrl":"https://amazon.com/dp/B07693PKH7","matchMethod":"asin"},{"id":"lesser-devil-5443fbef","readMonth":{"month":"Dec","year":"2021","day":"29","sort":"2021-12-29"},"title":"The Lesser Devil","author":"Ruocchio, Christopher","series":"The Sun Eater, #1.5","review":"3.5/5 sort of skippable but there is some interesting stuff in here. Mainly how Crispin and Sabine view Hadrian and their father outside of Hadrian's POV. Some interesting world building, plot was on the weaker side. Some of the world building I sort of had to suspend disbelief that some of the world religions are actually intact in the way we view them today and was hoping for more changes there.\\n\\nMaybe will appreciate this one more depending on what's in Howling Dark.","highlightCount":1,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1590633476l/53536557.jpg","asin":"B0852RDGDH","goodreadsUrl":"https://www.goodreads.com/book/show/53536557-the-lesser-devil","kindleUrl":"https://amazon.com/dp/B0852RDGDH","matchMethod":"asin"},{"id":"revival-f125b46d","readMonth":{"month":"Dec","year":"2021","day":"31","sort":"2021-12-31"},"title":"Revival","author":"King, Stephen","series":"","review":"","highlightCount":15,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1414478443l/20942904.jpg","asin":"B00ILHW6AG","goodreadsUrl":"https://www.goodreads.com/book/show/20942904-revival","kindleUrl":"https://amazon.com/dp/B00ILHW6AG","matchMethod":"asin"},{"id":"two-towers-6260f5b1","readMonth":{"month":"Jan","year":"2022","day":"02","sort":"2022-01-02"},"title":"The Two Towers","author":"Tolkien, J.R.R.","series":"The Lord of the Rings, #2","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1486871714l/222910.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/222910.The_Two_Towers","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"cirque-du-freak-living-nightmare-5e617d89","readMonth":{"month":"Jan","year":"2022","day":"03","sort":"2022-01-03"},"title":"Cirque Du Freak: A Living Nightmare","author":"Shan, Darren","series":"Cirque Du Freak, #1","review":"I'm not sure if I'll rate these, but I have a lot of nostalgia for this series and there's an excellent audio version narrated by Ralph Lister for free on Audible Plus which has been an excellent way to re-read these. The first entry held up really well and I can see why I loved these as a kid. They are surprisingly dark books and very fast paced which makes you want to read them in a single day. Perfect for emerging and existing fans of horror. Very simple and easy to understand writing that doesn't pander down to its intended audience.","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1369529571l/1066078.jpg","asin":"0316605107","goodreadsUrl":"https://www.goodreads.com/book/show/1066078.Cirque_Du_Freak","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vampires-assistant-69e61c60","readMonth":{"month":"Jan","year":"2022","day":"04","sort":"2022-01-04"},"title":"The Vampire's Assistant","author":"Shan, Darren","series":"Cirque Du Freak, #2","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328305324l/8138512.jpg","asin":"B000SHMSXC","goodreadsUrl":"https://www.goodreads.com/book/show/8138512-the-vampire-s-assistant","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"curse-of-chalion-9d90ebb1","readMonth":{"month":"Jan","year":"2022","day":"09","sort":"2022-01-09"},"title":"The Curse of Chalion","author":"Bujold, Lois McMaster","series":"World of the Five Gods, #1","review":"This is a mixture of literature and fantasy and it's good to know that going in. I have similar feelings for this book as I had for Ursula K Le Guin's The Dispossessed where it's not exactly an easy book to read and you have to take it slow to really absorb what's going on. There's also a fair amount of challenge in navigating how all the characters are addressed, their titles, etc are fairly different and all the relationships between the characters takes a while to get used to. This is a politics heavy book as well, which made some parts drag a bit for me. Most of the time is spent on court politics so if you're not invested in that it can be a bit of a challenge.\\n\\nThe writing is absolutely amazing and one of the best parts of the book. Bujold is a master wordsmith and there's some jaw droppingly gorgeous sections of prose here. Some of the descriptions here are best when you read them slow and deeply imagine the scene and what's going on, it's an immersive read and the world here feels real while also being very strange, and it gets stranger.\\n\\nThe story and plot are slow, really slow. Slower than the Farseer trilogy by far which is part of why this isn't 5 stars for me. Once the plot gets going it's really interesting and there's some unexpected plot elements that are fairly unique and the way magic and the Gods work in this universe is different from how other fantasy books usually work. I'm hoping for successive books that the plot moves a bit quicker and the setting is outside of a royal court which could make for one of my favorite reads if that all lines up with my preferences later on in the series.","highlightCount":73,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1332210432l/6492981.jpg","asin":"B000FC11AQ","goodreadsUrl":"https://www.goodreads.com/book/show/6492981-the-curse-of-chalion","kindleUrl":"https://amazon.com/dp/B000FC11AQ","matchMethod":"asin"},{"id":"howling-dark-b53f1eaf","readMonth":{"month":"Jan","year":"2022","day":"12","sort":"2022-01-12"},"title":"Howling Dark","author":"Ruocchio, Christopher","series":"The Sun Eater #2","review":"Re-read 2024:\\nJust as good or better than I remembered it. Definitely one of my favorite sci-fi books. The experience of exploration and discovery in a richly built universe is incredibly powerful. The re-read was very rewarding and glad I did it before I get the ARC for Disquiet Gods. The foreshadowing is also so clever and hard to notice until you know what you know from later books. Highly highly recommend the series.\\n\\nOriginal read 2022:\\nPlease read this series. Weird, epic, philosophical, dark, action packed, introspective, spooky, mysterious, ethereal. This series really comes into its own here and it needs to become way more popular, this entry really blew me away from beginning to end, I enjoyed every minute of this and had no idea where the story would go.\\n\\nIt's always full of surprises and extremely well put together in a way that is internally consistent. I can't wait to read the next one and see where it's going to go. Enjoying the ride.","highlightCount":50,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1563298830l/42298449.jpg","asin":"B07J48PWT5","goodreadsUrl":"https://www.goodreads.com/book/show/42298449-howling-dark","kindleUrl":"https://amazon.com/dp/B07J48PWT5","matchMethod":"asin"},{"id":"tunnels-of-blood-4499f7b1","readMonth":{"month":"Jan","year":"2022","day":"14","sort":"2022-01-14"},"title":"Tunnels of Blood","author":"Shan, Darren","series":"Cirque Du Freak, #3","review":"The audiobook for this was absolutely stellar. Ralph Lister's performance is fantastic.","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348716566l/156172.jpg","asin":"0316607630","goodreadsUrl":"https://www.goodreads.com/book/show/156172.Tunnels_of_Blood","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vampire-mountain-c3cfa20a","readMonth":{"month":"Jan","year":"2022","day":"14","sort":"2022-01-14"},"title":"Vampire Mountain","author":"Shan, Darren","series":"Cirque Du Freak, #4","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1389488195l/1066082.jpg","asin":"0316608068","goodreadsUrl":"https://www.goodreads.com/book/show/1066082.Vampire_Mountain","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"anxious-people-c151e725","readMonth":{"month":"Jan","year":"2022","day":"14","sort":"2022-01-14"},"title":"Anxious People","author":"Backman, Fredrik","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1594234890l/53799686.jpg","asin":"1982121602","goodreadsUrl":"https://www.goodreads.com/book/show/53799686-anxious-people","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"trials-of-death-d17e275c","readMonth":{"month":"Jan","year":"2022","day":"15","sort":"2022-01-15"},"title":"Trials of Death","author":"Shan, Darren","series":"Cirque Du Freak, #5","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1389488192l/698144.jpg","asin":"0316603678","goodreadsUrl":"https://www.goodreads.com/book/show/698144.Trials_of_Death","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"gates-of-fire-86c0b7ed","readMonth":{"month":"Jan","year":"2022","day":"17","sort":"2022-01-17"},"title":"Gates of Fire","author":"Pressfield, Steven","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1386924869l/1305.jpg","asin":"055338368X","goodreadsUrl":"https://www.goodreads.com/book/show/1305.Gates_of_Fire","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"sailing-to-sarantium-195d2b20","readMonth":{"month":"Jan","year":"2022","day":"23","sort":"2022-01-23"},"title":"Sailing to Sarantium","author":"Kay, Guy Gavriel","series":"The Sarantine Mosaic, #1","review":"","highlightCount":64,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1459869341l/9746671.jpg","asin":"B00452V3DC","goodreadsUrl":"https://www.goodreads.com/book/show/9746671-sailing-to-sarantium","kindleUrl":"https://amazon.com/dp/B00452V3DC","matchMethod":"asin"},{"id":"demon-in-white-2dbe5b6a","readMonth":{"month":"Jan","year":"2022","day":"24","sort":"2022-01-24"},"title":"Demon in White","author":"Ruocchio, Christopher","series":"The Sun Eater, #3","review":"March 2025 re-read:\\n\\nEven better on re-read, appreciate the politics way more and so much foreshadowing and lore that's easier to appreciate knowing where things are going. Still like Howling Dark more but this book still slaps.\\n\\nJanuary 2022 review:\\n\\nThe last book set an incredibly high bar, this one is overall a fantastic entry and Ruocchio packs enough in a single book to warrant trilogies in other series. There's a huge amount of variety and even if certain parts don't click with you it changes things up pretty frequently.\\n\\nI do prefer Howling Dark to this one, but that's most likely going to be one of if not my favorite book of the year.\\n\\nSome things that didn't quite land for me were some of the political machinations and times where first person narrative was detrimental to the story being told. Also this does feel like a bit of a middle book where it's connecting the ground shaking changes from Howling Dark and setting up Kingdoms of Death so certain parts can feel reminiscent of what's been done prior in the series.\\n\\nHowever, the ambition remains huge here and the scale really gets turned up a notch and there's some crazy stuff that happens that connects to all the books before really well.\\n\\nThe universe that's being built here is so cool and there's a lot that can still be done. I'm anxiously awaiting for the next entry.","highlightCount":23,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1574314340l/48906413.jpg","asin":"B081M784DV","goodreadsUrl":"https://www.goodreads.com/book/show/48906413-demon-in-white","kindleUrl":"https://amazon.com/dp/B081M784DV","matchMethod":"asin"},{"id":"storyteller-tales-of-life-and-music-e1ad1636","readMonth":{"month":"Jan","year":"2022","day":"25","sort":"2022-01-25"},"title":"The Storyteller: Tales of Life and Music","author":"Grohl, Dave","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1617714166l/57648017.jpg","asin":"0063076098","goodreadsUrl":"https://www.goodreads.com/book/show/57648017-the-storyteller","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vampire-prince-7a47ce45","readMonth":{"month":"Jan","year":"2022","day":"26","sort":"2022-01-26"},"title":"The Vampire Prince","author":"Shan, Darren","series":"Cirque Du Freak, #6","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348633565l/1066084.jpg","asin":"0316607096","goodreadsUrl":"https://www.goodreads.com/book/show/1066084.The_Vampire_Prince","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"ogres-a99918aa","readMonth":{"month":"Jan","year":"2022","day":"27","sort":"2022-01-27"},"title":"Ogres","author":"Tchaikovsky, Adrian","series":"","review":"I received a free copy of this book in exchange for an honest review.\\n\\nThis is another excellent Tchaikovsky novella that does a lot in the limited amount of pages. Tchaikovsky is one of my favorite discoveries of the past year and the amount of inventiveness and creativity he has is staggering. Each book I read of his is unique and tackles different ideas.\\n\\nThis book focuses a lot on various classes in this world and the inequality that follows, how the upper class controls the poor through religion, economics, and pure brutalism.\\n\\nThere are a lot of twists and turns along the way, the writing is very tight and effective of conveying the deep ideas that are packed in with a level of nuance and subtlety of his previous works.\\n\\nHighly recommend, this one is really interesting and very relevant to society today. Another great science fiction book that explores the big ideas and muddy ethics that face us today.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1624807279l/58438207.jpg","asin":"1786185288","goodreadsUrl":"https://www.goodreads.com/book/show/58438207-ogres","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"mechanicum-6e93e00c","readMonth":{"month":"Jan","year":"2022","day":"29","sort":"2022-01-29"},"title":"Mechanicum","author":"McNeill, Graham","series":"The Horus Heresy, #9","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348447118l/2941259.jpg","asin":"1844166066","goodreadsUrl":"https://www.goodreads.com/book/show/2941259-mechanicum","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"beastslayer-bdb3c5ba","readMonth":{"month":"Jan","year":"2022","day":"30","sort":"2022-01-30"},"title":"Beastslayer","author":"King, William","series":"Gotrek & Felix, #5","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1182101374l/1232148.jpg","asin":"0743411617","goodreadsUrl":"https://www.goodreads.com/book/show/1232148.Beastslayer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"afghan-campaign-55a7d974","readMonth":{"month":"Jan","year":"2022","day":"31","sort":"2022-01-31"},"title":"The Afghan Campaign","author":"Pressfield, Steven","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388458696l/1315.jpg","asin":"038551641X","goodreadsUrl":"https://www.goodreads.com/book/show/1315.The_Afghan_Campaign","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"black-stone-heart-12a60444","readMonth":{"month":"Feb","year":"2022","day":"02","sort":"2022-02-02"},"title":"Black Stone Heart","author":"Fletcher, Michael R.","series":"The Obsidian Path, #1","review":"3.5/5\\n\\nThe food and booze descriptions are the standout here, let's be real.\\n\\nWorld building and magic system were interesting. Definitely some gray morality in this one but could have used some more subtlety. Book 2 will be make or break for sure, the main plot needed a bit more meat here but for the first 60% I was very invested.\\n\\nOverall solid in my book but not as dark as I was expecting or hoping. Lots of opportunities to grow into a solid series, maybe tripped up on execution a little bit, but I can see later entries either running with it or fumbling. Interested to read the next book in the next month.","highlightCount":53,"myGoodreadsRating":4,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1582549717l/50537594.jpg","asin":"B083Y748QX","goodreadsUrl":"https://www.goodreads.com/book/show/50537594-black-stone-heart","kindleUrl":"https://amazon.com/dp/B083Y748QX","matchMethod":"title-author"},{"id":"kings-of-paradise-ebc07621","readMonth":{"month":"Feb","year":"2022","day":"04","sort":"2022-02-04"},"title":"Kings of Paradise","author":"Nell, Richard","series":"Ash and Sand, #1","review":"Really great character work. The structure of the book is very well done as well, it kind of starts off with only the two main POVs and branches out from there which is a great way to build out the world and plot.\\n\\nAlso you tend to stick with the same character for much longer than other epic fantasy books and you get to see a whole arc from them before it shifts perspective which is a great way to handle a big story.\\n\\nOverall this book is impressive for a new author and incredibly dark, often bleak, but there's hints of lightness peaking through no matter how narrow the odds of that panning out.","highlightCount":13,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1548867620l/35994830.jpg","asin":"B074PD12C3","goodreadsUrl":"https://www.goodreads.com/book/show/35994830-kings-of-paradise","kindleUrl":"https://amazon.com/dp/B074PD12C3","matchMethod":"asin"},{"id":"kings-of-ash-c4b51fba","readMonth":{"month":"Feb","year":"2022","day":"11","sort":"2022-02-11"},"title":"Kings of Ash","author":"Nell, Richard","series":"Ash and Sand, #2","review":"Amazing, phenomenal, epic, intimate. No middle book syndrome here, actually whatever the opposite of middle book syndrome is what this is. I usually have mixed feelings on \\"subvert expectations\\" but this does that in incredibly smart ways that retroactively makes the first book richer. Adds many layers and shades of gray to existing characters and plot points that may have seemed straightforward in the first book but now they're anything but.\\n\\nI thought the writing was already strong in the first book, but in this one you get really awesome and rousing speeches, great internal monologues, and interesting political machinations. Nell continues to play with the structure of traditional fantasy in interesting ways that makes it exciting to see what's going to happen next, but he does it in a way that is internally consistent and starts panning out to reveal the tapestry of the story that he's revealed slowly and deliberately.\\n\\nThis is very character driven and the characters are one of the huge strengths here, Nell takes a lot of risks with how he divides his time up between his characters, but the result is one of my favorite conflicted characters in all of fantasy that has a lot more layers than initially thought. Maybe one of the downsides is that we get less of some of the other characters, but a lot more focus in the main plot thread also allows for more depth and nuance.\\n\\nCan't wait to see how it ends.","highlightCount":37,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1542495490l/42853887.jpg","asin":"B07KMTW9BB","goodreadsUrl":"https://www.goodreads.com/book/show/42853887-kings-of-ash","kindleUrl":"https://amazon.com/dp/B07KMTW9BB","matchMethod":"asin"},{"id":"kings-of-heaven-2b90d916","readMonth":{"month":"Feb","year":"2022","day":"13","sort":"2022-02-13"},"title":"Kings of Heaven","author":"Nell, Richard","series":"Ash and Sand, #3","review":"A lot more plot focused than the previous books, the finish line is in sight and most of the book is a mad dash to get there. This book could (should?) have been twice as long and focused on the characters a bit more.\\n\\nHowever, there's some really cool moments, world building, and politics here, I've been extremely impressed with how different each book in the trilogy has been. This really nails the landing and is a very satisfying trilogy that doesn't overstay its welcome.\\n\\nRichard Nell has become an automatic day one buy and read for me, he hits a lot of the notes I'm looking for in dark epic fantasy and his character work is very well done and highly nuanced. I want more! Will be reading the rest of his work soon.","highlightCount":18,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1597084335l/46033361.jpg","asin":"B08FHPYXLL","goodreadsUrl":"https://www.goodreads.com/book/show/46033361-kings-of-heaven","kindleUrl":"https://amazon.com/dp/B08FHPYXLL","matchMethod":"asin"},{"id":"citadel-of-autarch-94c54144","readMonth":{"month":"Feb","year":"2022","day":"14","sort":"2022-02-14"},"title":"The Citadel of the Autarch","author":"Wolfe, Gene","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1332036031l/299758.jpg","asin":"0671496662","goodreadsUrl":"https://www.goodreads.com/book/show/299758.The_Citadel_of_the_Autarch","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"hunters-of-dusk-a39dd454","readMonth":{"month":"Feb","year":"2022","day":"15","sort":"2022-02-15"},"title":"Hunters of the Dusk","author":"Shan, Darren","series":"Cirque Du Freak, #7","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1266708751l/1066071.jpg","asin":"0316605964","goodreadsUrl":"https://www.goodreads.com/book/show/1066071.Hunters_of_the_Dusk","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"elric-of-melnibon-eca461cf","readMonth":{"month":"Feb","year":"2022","day":"16","sort":"2022-02-16"},"title":"Elric of Melniboné","author":"Moorcock, Michael","series":"The Elric Saga, #1","review":"Pretty basic story, didn't feel like it did anything in particular that well compared to its peers, hasn't aged that well. Would hope that it either stands out with humor, world-building, magic, or action but doesn't really stand out in any of those aspects but is passable in all of these areas. Hoping the next book fleshes out things more, a bit barebones so far.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1771080631l/445211.jpg","asin":"0586203265","goodreadsUrl":"https://www.goodreads.com/book/show/445211.Elric_of_Melnibon_","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"fortress-of-pearl-9ab13f0e","readMonth":{"month":"Feb","year":"2022","day":"19","sort":"2022-02-19"},"title":"The Fortress of the Pearl","author":"Moorcock, Michael","series":"The Elric Saga, #8","review":"A lot more interesting and weird (in a good way) than the first book. Now it's clear that the initial book is just all of Elric's backstory, but it wasn't that unique and fairly formulaic.\\n\\nThis one definitely changes it up, although it seems like a side quest, there are a lot of interesting explorations of the themes in the novel that resonate with me and how to reconcile identity and justice in a culture that may be fundamentally evil. Elric also is exploring more of who he wants to be although he is partially still a slave to Chaos.\\n\\nElric is sort of an idiot many times where the only reason he survives is dumb luck or someone swooping in and saving him at the last second as if he's a damsel in distress. That happens a few times here, but Moorcock is growing on me more here and it's becoming more clear what he's trying to say and meditate on here in his series.\\n\\nI'm more encouraged to continue on now, this series is a weird blend of pulp, dark, and philosophical and with this one it worked for me and I enjoyed it.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-ass
