a bigger concept that can really shake things up.\\n\\nThis was more of a plot focused book, I do think the ideas in Dogs of War and Bear Head were a bit more interesting and novel but the world and interaction of the factions here was the strong point.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":4.25,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1738902493l/217387776.jpg","asin":"1035901455","goodreadsUrl":"https://www.goodreads.com/book/show/217387776-bee-speaker","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"house-of-assassins-40a436fa","readMonth":{"month":"Mar","year":"2025","day":"26","sort":"2025-03-26"},"title":"House of Assassins","author":"Correia, Larry","series":"Saga of the Forgotten Warrior, #2","review":"So fun, badass, and metal. Exceeded expectations.","highlightCount":32,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1598840934l/43671252.jpg","asin":"B07MXN71HD","goodreadsUrl":"https://www.goodreads.com/book/show/43671252-house-of-assassins","kindleUrl":"https://amazon.com/dp/B07MXN71HD","matchMethod":"asin"},{"id":"running-man-dc2b886b","readMonth":{"month":"Apr","year":"2025","day":"02","sort":"2025-04-02"},"title":"The Running Man","author":"Bachman, Richard","series":"","review":"Raw and full of rage. Great dystopian \\"futuristic\\" thriller. Was fun to read this in 2025 - when the book takes place. I imagine this book gets a lot of flak for the (mis?)handling of some of the racial elements but I thought it matched the sort of raw energy that the early Bachman books have. It also seemed like a core part of the book, so not sure how you would take it out, but we'll see how the movies handle it. Looking forward to watching the adaptations soon.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1450878355l/28274420.jpg","asin":"B018ER7JWW","goodreadsUrl":"https://www.goodreads.com/book/show/28274420-the-running-man","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"second-foundation-beada336","readMonth":{"month":"Apr","year":"2025","day":"04","sort":"2025-04-04"},"title":"Second Foundation","author":"Asimov, Isaac","series":"Foundation, #3","review":"This series is a miss for me. The premise is never really believable and even the plot twists are a bit abrupt and comical at times. Was expecting a lot more. Book 1 was pretty decent but man this series just doesn't really seem to understand humans and the characters are very cardboard and sterile. For being an ideas book, I found the ideas and philosophy quite shallow, maybe interesting in the basic premise but not built off of substantially and didn't prompt deeper thoughts.","highlightCount":5,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1661015922l/29580.jpg","asin":"B000FC1PWU","goodreadsUrl":"https://www.goodreads.com/book/show/29580.Second_Foundation","kindleUrl":"https://amazon.com/dp/B000FC1PWU","matchMethod":"title-author"},{"id":"buffalo-hunter-hunter-a64423d9","readMonth":{"month":"Apr","year":"2025","day":"07","sort":"2025-04-07"},"title":"The Buffalo Hunter Hunter","author":"Jones, Stephen Graham","series":"","review":"Really good. The only previous SGJ book I've read is The Only Good Indians and I maintain that is one of the worst books I've read so it was pretty risky for me to pick up another SGJ book. This is very different thankfully. The writing is pretty good and he created a lot of atmosphere in the scenes and really made some of them really creepy. I do think the tension in some of the flashbacks could have been higher and the stakes could have been more prominent and more integrated across the timelines in the story the events in the flashbacks didn't have immediate impacts in the present and didn't have revelations that made me eager to see what happened in another POV but were good in isolation.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1779114576l/214565614.jpg","asin":"1668075083","goodreadsUrl":"https://www.goodreads.com/book/show/214565614-the-buffalo-hunter-hunter","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"war-masters-gate-8c1164c8","readMonth":{"month":"Apr","year":"2025","day":"16","sort":"2025-04-16"},"title":"War Master's Gate","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #9","review":"Battle fatigue: the series","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1677811083l/23035682.jpg","asin":"0230771408","goodreadsUrl":"https://www.goodreads.com/book/show/23035682-war-master-s-gate","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"cryptonomicon-a2c3e19a","readMonth":{"month":"Apr","year":"2025","day":"17","sort":"2025-04-17"},"title":"Cryptonomicon","author":"Stephenson, Neal","series":"","review":"Profound work of genius. Technological epic. Took me two months to read it but I loved every minute of it. One of the best books I've read.","highlightCount":146,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1519944111l/38897904.jpg","asin":"B000FC11A6","goodreadsUrl":"https://www.goodreads.com/book/show/38897904-cryptonomicon","kindleUrl":"https://amazon.com/dp/B000FC11A6","matchMethod":"asin"},{"id":"destroyer-of-worlds-4ad6c74f","readMonth":{"month":"Apr","year":"2025","day":"23","sort":"2025-04-23"},"title":"Destroyer of Worlds","author":"Correia, Larry","series":"Saga of the Forgotten Warrior, #3","review":"Great series that respects your time.\\n\\nKind of tough to rate this one because the beginning was sort of 3/5 and solid but slow to get rolling but the ending climax and falling action was amazing and makes me want to pick up the next one immediately. Seriously had one of the best duels I've read and he showed that he can do larger scale action well.\\n\\nThis series overall has a lot of heart, the characters all have good and often conflicting motivations, and the dialog has the right amount of humor and weight.\\n\\nThe world building is also well done and has enough mystery to keep me engaged, feels like it is unique in the fantasy genre. Very curious to see where things go.","highlightCount":40,"myGoodreadsRating":4,"myReviewRating":3,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1598840961l/55013874.jpg","asin":"B08FVJ6YYR","goodreadsUrl":"https://www.goodreads.com/book/show/55013874-destroyer-of-worlds","kindleUrl":"https://amazon.com/dp/B08FVJ6YYR","matchMethod":"asin"},{"id":"darkness-more-than-night-250b51a3","readMonth":{"month":"Apr","year":"2025","day":"24","sort":"2025-04-24"},"title":"A Darkness More Than Night","author":"Connelly, Michael","series":"Harry Bosch, #7; Harry Bosch Universe, #10","review":"This is a Mccaleb book, make sure you read Blood Work first. Impressed with Connelly putting a Bosch book on its head and us getting an outside look at him that recontextualizes a lot of the events previously in the series.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1437930956l/76867.jpg","asin":"0446667900","goodreadsUrl":"https://www.goodreads.com/book/show/76867.A_Darkness_More_Than_Night","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"city-of-bones-77897d56","readMonth":{"month":"May","year":"2025","day":"09","sort":"2025-05-09"},"title":"City of Bones","author":"Connelly, Michael","series":"Harry Bosch, #8; Harry Bosch Universe, #11","review":"Very uninspired first 70% but the last 30% saves it, definitely bottom tier Bosch","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1441057369l/84777.jpg","asin":"0446699535","goodreadsUrl":"https://www.goodreads.com/book/show/84777.City_of_Bones","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"seveneves-e07c899a","readMonth":{"month":"May","year":"2025","day":"16","sort":"2025-05-16"},"title":"Seveneves","author":"Stephenson, Neal","series":"","review":"Amazing book. Really captured my imagination at a deep level. The combination of interesting ideas and technical depth really clicked with me, Stephenson is one of the smartest authors I've read and have been massively impressed by both this and Cryptonomicon.\\n\\nThis book has some dark moments that had a big impact that I haven't felt from hard sci-fi since I read Three Body Problem.\\n\\nI get why some people might have issues with parts of this book, the politics in the book do reflect the state of the world at that time (2015) before *gestures broadly* and he does sort of have a level of optimism at times that felt a little unrealistic but I do think it may be due to the perspectives we're privy to in the book and there's more to it than meets the eye, just takes a while to show some of that complexity.\\n\\nStephenson also does go on a couple of asides on orbital mechanics, genetics and pretty in-depth about the world building in part 3 that isn't completely seamless in the narrative. However, it is cool and I enjoyed it so it didn't cause issues for me, could definitely see other people having issues with those sections. Him fleshing out the world and mentioning the real science for me makes it feel more grounded in reality and brings the hard sci-fi elements to the forefront. I think it's a treat to hear from someone who is well versed and read in the science about how this actually might work in these fictional scenarios and that's one of the strengths of this genre for me.\\n\\nI do think Stephenson is very much a \\"fill in the gaps\\" author where he'll give you parts of the narrative but you can/have to fill in parts with your imagination either from events or mysteries that happen between the pages or imagining what happens next in his sort of abrupt endings. I'd be eager to read more in this universe.\\n\\nI'll be reading more from him very soon.","highlightCount":60,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1449142000l/22816087.jpg","asin":"B00LZWV8JO","goodreadsUrl":"https://www.goodreads.com/book/show/22816087-seveneves","kindleUrl":"https://amazon.com/dp/B00LZWV8JO","matchMethod":"asin"},{"id":"lost-light-2650a470","readMonth":{"month":"May","year":"2025","day":"16","sort":"2025-05-16"},"title":"Lost Light","author":"Connelly, Michael","series":"Harry Bosch, #9; Harry Bosch Universe, #13","review":"Bosch is back after a pretty middling entry","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388241213l/126507.jpg","asin":"0446611638","goodreadsUrl":"https://www.goodreads.com/book/show/126507.Lost_Light","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"tower-of-silence-1e3a4ece","readMonth":{"month":"May","year":"2025","day":"24","sort":"2025-05-24"},"title":"Tower of Silence","author":"Correia, Larry","series":"Saga of the Forgotten Warrior, #4","review":"Amazing book, easily the best of the series so far. So much payoff from everything from the world building, plot, and character development. Even when you think there can't possibly be more it keeps delivering and delivering. All gas from beginning to end but somehow never got fatigued reading it because it changes up perspectives at good times. Really excited to read the last two books.","highlightCount":27,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1664063297l/62707391.jpg","asin":"B0BF8Y54MS","goodreadsUrl":"https://www.goodreads.com/book/show/62707391-tower-of-silence","kindleUrl":"https://amazon.com/dp/B0BF8Y54MS","matchMethod":"asin"},{"id":"all-that-we-see-or-seem-7123a80c","readMonth":{"month":"May","year":"2025","day":"25","sort":"2025-05-25"},"title":"All That We See or Seem","author":"Liu, Ken","series":"Julia Z, #1","review":"I received a copy of this book in exchange for an honest review.\\n\\nSad to say that this is such a big step down from Dandelion Dynasty, which is one of my favorite series. The writing style didn't work for me at all, feels sort of YA or something, it lacks any sort of subtlety and the dialogue is very on the nose. It's possible that I don't really like this style and it's done well, I don't know, but feels like more of a contemporary YA accessible style as opposed to the gorgeous and poetic Dandelion Dynasty style, and I definitely prefer the latter exponentially more.\\n\\nIt also does not have much subtlety about the themes it's tackling: AI and LLMs. There's definitely a lot to explore there but I didn't find the ideas that interesting or to have that much depth to them.\\n\\nIt's a near future story about a young hacker who is trying to help a man find his missing wife. I didn't really connect with the characters or find their relationships believable. I won't be continuing this series I'm sad to say.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1739810337l/224050174.jpg","asin":"B0DV6766HN","goodreadsUrl":"https://www.goodreads.com/book/show/224050174-all-that-we-see-or-seem","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shattered-shields-2341f734","readMonth":{"month":"May","year":"2025","day":"30","sort":"2025-05-30"},"title":"Shattered Shields","author":"Brozek, Jennifer","series":"","review":"Read the Keeper of Names and really liked it, good Keta and Ratul backstory","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1395683888l/16368455.jpg","asin":"1476737010","goodreadsUrl":"https://www.goodreads.com/book/show/16368455-shattered-shields","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blood-music-24f2f599","readMonth":{"month":"Jun","year":"2025","day":"07","sort":"2025-06-07"},"title":"Blood Music","author":"Bear, Greg","series":"","review":"","highlightCount":4,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1516834952l/38197113.jpg","asin":"B00J48FHRA","goodreadsUrl":"https://www.goodreads.com/book/show/38197113-blood-music","kindleUrl":"https://amazon.com/dp/B00J48FHRA","matchMethod":"asin"},{"id":"graveyard-of-demons-3ffbde09","readMonth":{"month":"Jun","year":"2025","day":"24","sort":"2025-06-24"},"title":"Graveyard of Demons","author":"Correia, Larry","series":"Saga of the Forgotten Warrior, #5","review":"4.25/5 really good","highlightCount":37,"myGoodreadsRating":4,"myReviewRating":4.25,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1717510720l/214216171.jpg","asin":"B0D5ZK5DCW","goodreadsUrl":"https://www.goodreads.com/book/show/214216171-graveyard-of-demons","kindleUrl":"https://amazon.com/dp/B0D5ZK5DCW","matchMethod":"asin"},{"id":"dark-half-894a5c88","readMonth":{"month":"Jun","year":"2025","day":"25","sort":"2025-06-25"},"title":"The Dark Half","author":"King, Stephen","series":"","review":"3.5/5 solid but definitely middle tier King. Premise is really good but needed a little more development in either the characters or less focus on the police procedural part. Has some good body horror moments.","highlightCount":7,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1632321198l/59053873.jpg","asin":"B018ER7L7U","goodreadsUrl":"https://www.goodreads.com/book/show/59053873-the-dark-half","kindleUrl":"https://amazon.com/dp/B018ER7L7U","matchMethod":"asin"},{"id":"fires-of-heaven-51d8d948","readMonth":{"month":"Jun","year":"2025","day":"30","sort":"2025-06-30"},"title":"The Fires of Heaven","author":"Jordan, Robert","series":"The Wheel of Time, #5","review":"Begrudgingly giving this a 4, the climax was insanely good as was one of the other battles towards the end.\\n\\nHaven't been so mixed on a series probably ever, meaning that some aspects I love and some I hate, truly some epic moments that are the peak of the genre but also the bickering between the characters can be insanely grating and hard to get through. Jordan's writing tics get really pronounced in this one and the interactions between men and women in this book are so cringey and juvenile, even between characters that are supposed to be friends they often don't seem to care about each other and talk about beating each other with a stick or spanking them (ugh).\\n\\nI honestly haven't come as close to dropping this series as I have in this one. However the plot continues to be awesome as does the political maneuvering at a grand scale, we're also getting lots of character change and big moments in their arcs. There's some moments that I'm on the edge of my seat and nervously turning the pages and there's others where my eyes are rolling and it's physically cringe worthy to imagine these interactions as between adults.\\n\\nThere is a ton of setup here, some was paid off in this book but there's also a lot I want to see what happens. I think I'm invested enough in some characters and plot lines that it'll keep me going but some of them can be painful at times.","highlightCount":65,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1659904164l/140975.jpg","asin":"B0037V18D2","goodreadsUrl":"https://www.goodreads.com/book/show/140975.The_Fires_of_Heaven","kindleUrl":"https://amazon.com/dp/B0037V18D2","matchMethod":"title-candidate-author"},{"id":"flow-my-tears-policeman-said-78c4e3e7","readMonth":{"month":"Jul","year":"2025","day":"06","sort":"2025-07-06"},"title":"Flow My Tears, the Policeman Said","author":"Dick, Philip K.","series":"","review":"F Scott Fitzgerald rich guy carousing in a police state dystopia world mixed with an Orwellian surveillance police procedural and a dash of psychedelics.\\n\\nThis was a bit of a mixed bag and had a lot of elements that I enjoy about PKD but it didn't really come together in a smooth way, I think it's a bit skippable as his ideas are better presented in some of his other books (Ubik, Palmer Eldritch).\\n\\nThe ending is very strong and had a subtle mind bending that I will be thinking about and trying to understand. There was just a lot of badly aged and uninteresting sex stuff in the book that took away all of the tension of this world forgetting about the main character. I do think the premise and ideas are good, just needed to be presented in a different way, has a lot of good philosophy but it's usually just kind of dropped in randomly and doesn't make sense in the context of the plot.\\n\\nOverall I still really like PKD, just don't think this is his best.","highlightCount":20,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1357439906l/17211557.jpg","asin":"B005LVR6V4","goodreadsUrl":"https://www.goodreads.com/book/show/17211557-flow-my-tears-the-policeman-said","kindleUrl":"https://amazon.com/dp/B005LVR6V4","matchMethod":"asin"},{"id":"coalescent-5b29e9af","readMonth":{"month":"Jul","year":"2025","day":"15","sort":"2025-07-15"},"title":"Coalescent","author":"Baxter, Stephen","series":"Destiny's Children #1","review":"4.25/5 wildly ambitious. Baxter is becoming cemented as one of my favorite sci-fi authors. This is wild. He manages to tie together historical fiction with a contemporary fiction and it somehow ties into the epicly huge space opera that has a complete future history (Xeelee). This is also probably the darkest book of his I've read yet and I'm here for it. This kind of gives me a Neal Stephenson flavor of the rogue hacker group mixed with the impacts of history.\\n\\nThis really shows his range as an author as all the previous Xeelee books have been primarily idea focused and this is much more character driven. Baxter has underrated characters even in Xeelee and the ones in this are quite good.\\n\\nI do think not everything is neatly tied up and some of the premise does require some healthy amount of suspension of disbelief but I was really engaged by the book from beginning to end. I actually learned a lot about ancient Rome here and got to see some classic stories from a different angle.","highlightCount":45,"myGoodreadsRating":5,"myReviewRating":4.25,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328323992l/6572580.jpg","asin":"B000FBJDQG","goodreadsUrl":"https://www.goodreads.com/book/show/6572580-coalescent","kindleUrl":"https://amazon.com/dp/B000FBJDQG","matchMethod":"asin"},{"id":"tales-of-sun-eater-4-904d2ca8","readMonth":{"month":"Jul","year":"2025","day":"20","sort":"2025-07-20"},"title":"Tales of the Sun Eater, Vol. 4","author":"Ruocchio, Christopher","series":"","review":"Some were a bit weaker than Tales 3 but The Acosmist was amazing and seems to have huge lore implications that I don't fully understand yet.\\n\\nFangs of Oannos is also a highlight and also the longest story, we get a really fun Jadd adventure with lots of political intrigue. Always good to see more of Jadd and I think this one actually has really strong hints for Ruocchio writing historical fiction next? He mentions Hadrian having a lot of interest in Persia, Babylon, etc and I think this is a hint that Ruocchio himself is currently obsessed with the topic, maybe tinfoil hat.\\n\\nThis collection being sort of a mishmash of stories collected from other special editions definitely makes it less of a cohesive collection compared to Tales 3 being such a good transition from Ashes of Man to Disquiet Gods. This one fills in some gaps from across the timeline so I kind of think only super fans will benefit from it.\\n\\nI'm thinking the Acosmist and Prince of Man might be the most relevant for Shadows Upon Time but we shall see. This is a short read and Ruocchio is getting better at short form content but hoping Tales 5 is a bit more cohesive.","highlightCount":13,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1747050402l/233830049.jpg","asin":"B0F83V8TZY","goodreadsUrl":"https://www.goodreads.com/book/show/233830049-tales-of-the-sun-eater-vol-4","kindleUrl":"https://amazon.com/dp/B0F83V8TZY","matchMethod":"asin"},{"id":"heart-of-mountain-0e01723f","readMonth":{"month":"Jul","year":"2025","day":"22","sort":"2025-07-22"},"title":"Heart of the Mountain","author":"Correia, Larry","series":"Saga of the Forgotten Warrior Book 6","review":"4.25/5 really good series, definitely recommend. Everything got wrapped up, maybe a bit too tidily but awesome final battle and very satisfying character arcs.","highlightCount":28,"myGoodreadsRating":4,"myReviewRating":4.25,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1731346889l/221431712.jpg","asin":"B0DMPK7W4D","goodreadsUrl":"https://www.goodreads.com/book/show/221431712-heart-of-the-mountain","kindleUrl":"https://amazon.com/dp/B0DMPK7W4D","matchMethod":"asin"},{"id":"blame-1-4f788c48","readMonth":{"month":"Jul","year":"2025","day":"25","sort":"2025-07-25"},"title":"BLAME! Vol. 1","author":"Nihei, Tsutomu","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1469098938l/31188025.jpg","asin":"B01INYEW1W","goodreadsUrl":"https://www.goodreads.com/book/show/31188025-blame-vol-1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-42-39a34ad9","readMonth":{"month":"Jul","year":"2025","day":"25","sort":"2025-07-25"},"title":"Berserk Volume 42","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1734717733l/222726255.jpg","asin":"B0DQSHZ6NY","goodreadsUrl":"https://www.goodreads.com/book/show/222726255-berserk-volume-42","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"climber-1-98b6dd7d","readMonth":{"month":"Jul","year":"2025","day":"26","sort":"2025-07-26"},"title":"The Climber, Vol. 1","author":"Sakamoto, Shin'ichi","series":"","review":"I had lower expectations since I've been told it takes a couple of volumes to get going but I really liked this a lot. I didn't end up liking Innocent but this has a better and more straight forward plotline and also has great art.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1741656030l/214213094.jpg","asin":"B0D61HRBYH","goodreadsUrl":"https://www.goodreads.com/book/show/214213094-the-climber-vol-1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"climber-2-923dc5a0","readMonth":{"month":"Jul","year":"2025","day":"28","sort":"2025-07-28"},"title":"The Climber, Vol. 2","author":"Sakamoto, Shin'ichi","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1740492789l/220161209.jpg","asin":"1974755169","goodreadsUrl":"https://www.goodreads.com/book/show/220161209-the-climber-vol-2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"orb-sceptre-throne-7ba2f04e","readMonth":{"month":"Aug","year":"2025","day":"13","sort":"2025-08-13"},"title":"Orb Sceptre Throne","author":"Esslemont, Ian C.","series":"Novels of the Malazan Empire, #4","review":"We're so back, that was awesome. Good job Mr Esslemont. One of the best paced books of Malazan for sure and the convergence was badass as hell. Getting lots of lore about factions we don't learn a lot about in the main series was also greatly appreciated and satisfying. We get a lot of familiar faces here too which helps.","highlightCount":55,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1414760062l/23483329.jpg","asin":"B0071NOJYC","goodreadsUrl":"https://www.goodreads.com/book/show/23483329-orb-sceptre-throne","kindleUrl":"https://amazon.com/dp/B0071NOJYC","matchMethod":"asin"},{"id":"passage-c6124d3c","readMonth":{"month":"Aug","year":"2025","day":"15","sort":"2025-08-15"},"title":"The Passage","author":"Cronin, Justin","series":"The Passage, #1","review":"One of the best books I've read this year easily. The people who say this drops off after the time skip can't be trusted. Even with a little bit of patience it's clear how it relates to the parts before and the ending ties everything together brilliantly. Will be continuing the series immediately.","highlightCount":35,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1457027857l/8145855.jpg","asin":"B003F3PM7A","goodreadsUrl":"https://www.goodreads.com/book/show/8145855-the-passage","kindleUrl":"https://amazon.com/dp/B003F3PM7A","matchMethod":"asin"},{"id":"dagger-in-vichy-2ea0868a","readMonth":{"month":"Aug","year":"2025","day":"15","sort":"2025-08-15"},"title":"The Dagger in Vichy","author":"Reynolds, Alastair","series":"","review":"3.5/5\\n\\nI received a copy of this book in exchange for an honest review.\\n\\nThis was a solid little novella, I enjoyed reading it but it didn't really blow me away. The mixture of sci-fi and fantasy was pretty good and the sci-fi elements are more explicitly called out than other genre bending books that make the line between magic and technology more fuzzy. So the approach is fairly unique. I just think the plot wasn't that interesting and the themes didn't really have a lot to say so I was whelmed but think this is a bit skippable.\\n\\nI've enjoyed Reynolds' work in the past and will continue to read more by him in the future.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1755689094l/228837191.jpg","asin":"1645242803","goodreadsUrl":"https://www.goodreads.com/book/show/228837191-the-dagger-in-vichy","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"exultant-76e0c79b","readMonth":{"month":"Aug","year":"2025","day":"28","sort":"2025-08-28"},"title":"Exultant","author":"Baxter, Stephen","series":"Destiny's Children, #2","review":"I liked this. Major whiplash in tone from Coalescent, this doesn't feel like the sequel to that at all aside from some world building consistencies. Some moments did feel like he was throwing a ton of concepts on the wall and seeing what sticked. The final part of this book is awesome and has some really cool space stuff. I like Timelike Infinity and Ring more, those are a bit tighter narratives. I also think I like Coalescent more as it was a very different style from the rest of the series and the characters felt more fleshed out there.\\n\\nThis has the big sci-fi concepts we come to expect to Baxter and it uses a lot of the world building from the many Xeelee books before to great effect as well as telling an interesting new story about mankind and Xeelee going toe to toe, which we don't really get to see in the main series.","highlightCount":48,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387784691l/6572577.jpg","asin":"B000FC2K2O","goodreadsUrl":"https://www.goodreads.com/book/show/6572577-exultant","kindleUrl":"https://amazon.com/dp/B000FC2K2O","matchMethod":"asin"},{"id":"twelve-9a633e60","readMonth":{"month":"Aug","year":"2025","day":"31","sort":"2025-08-31"},"title":"The Twelve","author":"Cronin, Justin","series":"The Passage, #2","review":"Really liked this overall, but I have more issues with it than book 1.\\n\\nHad some plot developments that kinda stretched my suspension of disbelief and wasn't what I was thinking would happen but the moment to moment writing and a lot of scenes were still really good. Not sure I really liked the ending and this sort of felt weirdly like a middle book at times but also concluded an arc in a really rushed way that also retread some ground from book 1.\\n\\nI appreciate the grand scale he was going for but I felt like not all the pieces fit together smoothly and there was a lot of arcs that I was hoping for more on, as well as some character motivations that needed a bit more depth.","highlightCount":6,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1333041398l/13565543.jpg","asin":"B007GBTBMY","goodreadsUrl":"https://www.goodreads.com/book/show/13565543-the-twelve","kindleUrl":"https://amazon.com/dp/B007GBTBMY","matchMethod":"asin"},{"id":"lathe-of-heaven-a229a986","readMonth":{"month":"Sep","year":"2025","day":"02","sort":"2025-09-02"},"title":"The Lathe of Heaven","author":"Le Guin, Ursula K.","series":"","review":"","highlightCount":21,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1603037001l/53513520.jpg","asin":"B087X6Z1GS","goodreadsUrl":"https://www.goodreads.com/book/show/53513520-the-lathe-of-heaven","kindleUrl":"https://amazon.com/dp/B087X6Z1GS","matchMethod":"asin"},{"id":"kagen-damned-b4e0a960","readMonth":{"month":"Sep","year":"2025","day":"11","sort":"2025-09-11"},"title":"Kagen the Damned","author":"Maberry, Jonathan","series":"Kagen the Damned, #1","review":"Some good moments, but definitely pretty clumsy at times. Sort of throws a lot at the wall and sees what sticks. The writing and dialogue can be a little stilted at times and some of the grimdark elements can feel out of place with the tone where the story seems more sword and sorcery. The world building is pretty good and interesting.\\n\\nSort of on the fence for whether to try book 2 or not, but some of the reveals were pretty good and it might play up some of the moral complexities and Eldritch horror to be a compelling sequel.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1642407170l/58724994.jpg","asin":"1250783976","goodreadsUrl":"https://www.goodreads.com/book/show/58724994-kagen-the-damned","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"tailchasers-song-c7f868a8","readMonth":{"month":"Sep","year":"2025","day":"14","sort":"2025-09-14"},"title":"Tailchaser's Song","author":"Williams, Tad","series":"","review":"","highlightCount":20,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1600894106l/9412403.jpg","asin":"B002SV374K","goodreadsUrl":"https://www.goodreads.com/book/show/9412403-tailchaser-s-song","kindleUrl":"https://amazon.com/dp/B002SV374K","matchMethod":"asin"},{"id":"shadowmarch-78f09d31","readMonth":{"month":"Sep","year":"2025","day":"26","sort":"2025-09-26"},"title":"Shadowmarch","author":"Williams, Tad","series":"Shadowmarch, #1","review":"Tad Williams is a master of epic fantasy and this is probably his best book 1. It's sad how unappreciated and under the radar this series is, even among the Osten Ard superfans (me included). I think people might see 4 ginormous books in a series they never hear anything about and get intimidated which is fair, but if you enjoy his Osten Ard series or really any dark epic fantasy, I highly recommend this. He's actually improved quite a bit from Memory Sorrow and Thorn, in particular the court politics here is stellar where in MST I thought it was a weak point.\\n\\nEverything I love about his writing is here and incredibly strong. Beautiful writing that grabbed me from page one and flowed beautifully until the epic and harrowing conclusion, deep and mysterious world building in a dark and brutal world, complex and interesting characters, nuanced and conniving court politics, everything you could want, really.\\n\\nAnd it feels like the best is yet to come. I'm ready for it.","highlightCount":77,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1316006018l/9551125.jpg","asin":"B00452V3ZA","goodreadsUrl":"https://www.goodreads.com/book/show/9551125-shadowmarch","kindleUrl":"https://amazon.com/dp/B00452V3ZA","matchMethod":"asin"},{"id":"kafka-on-shore-77c2864e","readMonth":{"month":"Sep","year":"2025","day":"30","sort":"2025-09-30"},"title":"Kafka on the Shore","author":"Murakami, Haruki","series":"","review":"","highlightCount":3,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1529183566l/6564051.jpg","asin":"B000FC2ROU","goodreadsUrl":"https://www.goodreads.com/book/show/6564051-kafka-on-the-shore","kindleUrl":"https://amazon.com/dp/B000FC2ROU","matchMethod":"asin"},{"id":"books-of-blood-1-0fe3133a","readMonth":{"month":"Oct","year":"2025","day":"12","sort":"2025-10-12"},"title":"Books of Blood, Vol. 1","author":"Barker, Clive","series":"","review":"","highlightCount":3,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1366436243l/17832519.jpg","asin":"B00BT52DA0","goodreadsUrl":"https://www.goodreads.com/book/show/17832519-books-of-blood-vol-1","kindleUrl":"https://amazon.com/dp/B00BT52DA0","matchMethod":"asin"},{"id":"shadows-upon-time-6346f6e6","readMonth":{"month":"Oct","year":"2025","day":"19","sort":"2025-10-19"},"title":"Shadows Upon Time","author":"Ruocchio, Christopher","series":"The Sun Eater, #7","review":"You know where this ends.\\n\\nOr do you?\\n\\nThank you to Head of Zeus for the early copy of this book (and thank you DAW for declining me).\\n\\nHonestly I was really worried about the final book. The premise of the whole series is that Hadrian \\"spoils\\" the ending in the first chapter, this works pretty well for books that aren't the final one.\\n\\nBut now we're here at the end.\\n\\nOh and also, the previous book, Disquiet Gods, is a masterpiece and one of my favorite books of all time, the expectations don't get higher.\\n\\nWas it just a zip to the end, blow up the sun, and move on to the next series? Read and find out, but there's plenty of surprises ahead.\\n\\nI do think the pacing of this one is pretty different from Disquiet Gods, I'd say there's times where it's a slower burn and less punchy than previous books, but the flipside of that is we get some great prose illuminating some philosophical and psychedelic scenes that all get moments to breathe. The breadth and variety of the book and series is just fantastic, the balance is something Ruocchio excels at and he continues that here.\\n\\nI got to the end of the book and if there was a whole sequel series I'd pick it up immediately, it was that good and there's enough left open to the world building and plot that I'm still completely invested in the series. I'm also really satisfied with the resolution.\\n\\nI also think this entry is fairly unique to Sun Eater, we get a lot of high fidelity plot here and not a lot of time skips which is more typical of the series previously.\\n\\nThe politics and real world messiness is done really well here, some truly enraging moments from backstabbing politics.\\n\\nSo yes, absolutely loved this beginning to end for the series overall and also the book itself. Reading doesn't get much better than this. This series has a special place in my heart and reading it was an amazing experience, definitely one of my all-time favorites.\\n\\nI shall go on alone.","highlightCount":127,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1740399833l/222685709.jpg","asin":"B0DVFFLLMR","goodreadsUrl":"https://www.goodreads.com/book/show/222685709-shadows-upon-time","kindleUrl":"","matchMethod":"title-author"},{"id":"scour-d6ea88b7","readMonth":{"month":"Oct","year":"2025","day":"21","sort":"2025-10-21"},"title":"The Scour","author":"Swan, Richard","series":"Empire of the Wolf, #0.5","review":"","highlightCount":5,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1751372054l/222387349.jpg","asin":"B0DPNRLM3Y","goodreadsUrl":"https://www.goodreads.com/book/show/222387349-the-scour","kindleUrl":"https://amazon.com/dp/B0DPNRLM3Y","matchMethod":"asin"},{"id":"fellowship-of-ring-0456199f","readMonth":{"month":"Oct","year":"2025","day":"25","sort":"2025-10-25"},"title":"The Fellowship of the Ring","author":"Tolkien, J.R.R.","series":"The Lord of the Rings, #1","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1594152110l/49392854.jpg","asin":"0008376123","goodreadsUrl":"https://www.goodreads.com/book/show/49392854-the-fellowship-of-the-ring","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shadowplay-3fdbeb9b","readMonth":{"month":"Oct","year":"2025","day":"29","sort":"2025-10-29"},"title":"Shadowplay","author":"Williams, Tad","series":"Shadowmarch, #2","review":"Really great series. This definitely feels like a middle book but the scope gets expanded significantly and there's still a lot of great moments, just less of a clear beginning and end goal with a lot set up for the conclusion of the story.\\n\\nHas one storyline that's one of the best Tad's written so far but also a couple that are treading water the whole book. However, even some of the slower ones have high moments and all the POVs end up in pretty interesting spots.\\n\\nTad makes some major world building choices here that are great and really commit the series to an interesting direction, still a lot of mystery left to uncover.\\n\\nLooking forward to continuing, definitely one of the most overlooked series by a master of dark epic fantasy.","highlightCount":83,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1587386553l/10296742.jpg","asin":"B004IATDM4","goodreadsUrl":"https://www.goodreads.com/book/show/10296742-shadowplay","kindleUrl":"https://amazon.com/dp/B004IATDM4","matchMethod":"asin"},{"id":"king-sorrow-bb2211bb","readMonth":{"month":"Nov","year":"2025","day":"07","sort":"2025-11-07"},"title":"King Sorrow","author":"Hill, Joe","series":"","review":"3.5/5 really enjoyed some of the moments of the book but as a cohesive work it has some major issues. Weirdly needs to be longer or change what it focuses on as some of the aspects of the book don't feel connected and doesn't have a solid through line from beginning to end.\\n\\nThe focus of current events and politics was kind of a big miss for me, was more interested in the ties to mythology and Arthurian tales, but it's definitely a weird balance between the two that's not always effective.\\n\\nJoe Hill is really good at mixing the grittyness of real life with some of the fantasy/mythology elements though so I thought these parts were well done. The depth of the characters was weirdly inconsistent though, sometimes they felt deep and rich and other times they felt like shallow caricatures.","highlightCount":21,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1737211589l/223459264.jpg","asin":"B0DSLC1D51","goodreadsUrl":"https://www.goodreads.com/book/show/223459264-king-sorrow","kindleUrl":"https://amazon.com/dp/B0DSLC1D51","matchMethod":"asin"},{"id":"no-life-forsaken-48e324e8","readMonth":{"month":"Nov","year":"2025","day":"10","sort":"2025-11-10"},"title":"No Life Forsaken","author":"Erikson, Steven","series":"Witness #2","review":"Great book, don't think I understood all the implications but thought it was a lot closer to classic Malazan and had really awesome world building elements. I liked The God is not Willing quite a bit but liked this substantially more.\\n\\nAlso the prose is top tier Erikson at the top of his game, definitely wish it was larger and even more epic.","highlightCount":68,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1745199688l/224097650.jpg","asin":"B0DV4C2H22","goodreadsUrl":"https://www.goodreads.com/book/show/224097650-no-life-forsaken","kindleUrl":"https://amazon.com/dp/B0DV4C2H22","matchMethod":"asin"},{"id":"narrows-be640be4","readMonth":{"month":"Nov","year":"2025","day":"18","sort":"2025-11-18"},"title":"The Narrows","author":"Connelly, Michael","series":"Harry Bosch, #10; Harry Bosch Universe, #14","review":"Nexus point of the Bosch, Mccaleb, Macavoy storylines of the Bosch universe which was cool to see. Definitely rewards and sort of expects you to read the rest of the series beforehand which can be different from a lot of the entries of this series which are more standalone.\\n\\nA bit of a slow burn but really brought a lot of good stuff set up from previous books and also seems like a good bridge point to future books.","highlightCount":1,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1482914941l/6465037.jpg","asin":"B000FC1MNW","goodreadsUrl":"https://www.goodreads.com/book/show/6465037-the-narrows","kindleUrl":"https://amazon.com/dp/B000FC1MNW","matchMethod":"asin"},{"id":"snow-crash-756ed8be","readMonth":{"month":"Nov","year":"2025","day":"23","sort":"2025-11-23"},"title":"Snow Crash","author":"Stephenson, Neal","series":"","review":"4.25/5 Great book. Stephenson continues throwing a lot of wild ideas into a single novel and seeing what sticks.\\n\\nI'm happy this exists as proof that I don't dislike the Cyberpunk genre, just the attempts that I've read of it before. Would definitely try more books in the genre, love the corporate dystopia and integration of high technology to question the path we're going down.\\n\\nI do think some aspects worked better than others, the tone can be a bit dissonant at times between the satirical cyberpunk pizza delivery dystopia and the deep philosophical and religious connection to computers and humanity itself.\\n\\nThe latter felt a little underdeveloped but the ideas are incredibly unique and interesting, I hope he digs into this deeper in another book of his I haven't read or a future book.\\n\\nIf anything, this book could have been twice as long and weaved some of the ideas, exposition, and world building more seamlessly into the story.\\n\\nThe world building of this futuristic Cyberpunk dystopia is incredibly interesting overall, especially for when this was written. Obviously there's aspects that did not come to pass but some of the ideas about the metaverse and how technology and corporations might shape us are very prescient and relevant. It's interesting to get these predictions from someone very technically savvy and compare what was predicted and how our current 2025 world differs.\\n\\nReally good overall and cements Stephenson as my favorite discovery of the year. Can't wait to dig more into his other works and be challenged and entertained by the way his brain works.","highlightCount":60,"myGoodreadsRating":4,"myReviewRating":4.25,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1672824396l/75565875.jpg","asin":"B000FBJCJE","goodreadsUrl":"https://www.goodreads.com/book/show/75565875-snow-crash","kindleUrl":"https://amazon.com/dp/B000FBJCJE","matchMethod":"asin"},{"id":"homunculus-1-2-488c927c","readMonth":{"month":"Nov","year":"2025","day":"28","sort":"2025-11-28"},"title":"Homunculus (Omnibus), Vol. 1-2","author":"Yamamoto, Hideo","series":"","review":"Trippy, weird, a little disturbing and great art. Interesting start to the series","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1690975575l/65796277.jpg","asin":"B0C2JM1ZYS","goodreadsUrl":"https://www.goodreads.com/book/show/65796277-homunculus-omnibus-vol-1-2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shadowrise-74a92013","readMonth":{"month":"Dec","year":"2025","day":"05","sort":"2025-12-05"},"title":"Shadowrise","author":"Williams, Tad","series":"Shadowmarch, #3","review":"Trust in Tad.\\n\\nThis is definitely a really slow burn but the highs here can be unparalleled. In book 2 we sort of have an explosion of POV characters which took away a bit of the focus from what made book 1 so effective, mostly a single setting and intricate politics.\\n\\nIf you're used to his pacing from his other series you know what to expect, his series reward patience and have the feeling of a rich, alive world that doesn't always have high octane events firing on all cylinders constantly like some modern fantasy can be.\\n\\nSome of the POVs here don't have a ton of progression and can feel at times like we're inching slowly to where they need to be on the huge map for the finale, however some of the moment to moment stuff continues to be fantastic. At times it feels like there's too much packed into a four book trilogy and some of the elements need room to breathe or even be in a much longer series.\\n\\nOne storyline in particular is one of the best fantasy storylines I've experienced, and I've read a lot of fantasy.\\n\\nThe writing continues to be poetic and weighty, Tad is a master at his craft and the sentence to sentence level of prose is immaculate.\\n\\nThe world building is intricate and deep, we're finally getting some answers to mysteries that have been ongoing for the whole series and also get some juicy Osten Ard connections.\\n\\nThis makes me really excited for the final book as this is essentially the first half of the final book in his 4 book trilogy. He's doing something special here and it brings in a lot of elements of fantasy that I love and brings a unique perspective to them, the darker tone and elements of horror really hit well for me.","highlightCount":73,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1296361304l/9683141.jpg","asin":"B00338QEHE","goodreadsUrl":"https://www.goodreads.com/book/show/9683141-shadowrise","kindleUrl":"https://amazon.com/dp/B00338QEHE","matchMethod":"asin"},{"id":"city-of-mirrors-cd67275e","readMonth":{"month":"Dec","year":"2025","day":"09","sort":"2025-12-09"},"title":"The City of Mirrors","author":"Cronin, Justin","series":"The Passage, #3","review":"Beautiful and epic post apocalyptic trilogy. This has to be one of the best \\"what comes after\\" stories I've read, the apocalypse is just the beginning. Would love to read a book 4, please write more Cronin! That being said the ending is very satisfying.\\n\\nThe general take online is that the series gets worse as it goes which is a very perplexing take, I thought the quality of the series was pretty consistent (great) throughout. We get some amazing background into the antagonist and this makes the previous entries better due to the elements of the world building that are fleshed out.","highlightCount":18,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1450533562l/26791287.jpg","asin":"B015BCWZWW","goodreadsUrl":"https://www.goodreads.com/book/show/26791287-the-city-of-mirrors","kindleUrl":"https://amazon.com/dp/B015BCWZWW","matchMethod":"asin"},{"id":"closers-cddc4fc7","readMonth":{"month":"Dec","year":"2025","day":"22","sort":"2025-12-22"},"title":"The Closers","author":"Connelly, Michael","series":"Harry Bosch, #11; Harry Bosch Universe, #15","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388262627l/32505.jpg","asin":"0446699551","goodreadsUrl":"https://www.goodreads.com/book/show/32505.The_Closers","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"transcendent-c06b3889","readMonth":{"month":"Dec","year":"2025","day":"28","sort":"2025-12-28"},"title":"Transcendent","author":"Baxter, Stephen","series":"Destiny's Children, #3","review":"This had a lot going on but really good entry and finish to the trilogy while leaving plenty of the timeline open for future books.\\n\\nThis is also heavy and depressing on multiple levels but has the smallest throughline of hope.\\n\\nBook 1 in this trilogy is probably my favorite but this is a solid second place.","highlightCount":58,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387726582l/6572579.jpg","asin":"B000FCKKMQ","goodreadsUrl":"https://www.goodreads.com/book/show/6572579-transcendent","kindleUrl":"https://amazon.com/dp/B000FCKKMQ","matchMethod":"asin"},{"id":"wool-omnibus-ad77a9b4","readMonth":{"month":"Jan","year":"2026","day":"05","sort":"2026-01-05"},"title":"Wool Omnibus","author":"Howey, Hugh","series":"Silo, #1","review":"3.5/5 this was good and I liked it but there were some parts that were a little dull and had a strange amount of detail about trudging up and down stairways. The core mystery was pretty good and how the reveals were doled out throughout the book. I'm hoping there's more depth to the mystery but I'm not sure there actually will be.\\n\\nThere's also a couple jumps in plot that seemed a bit hand-wavy and either there was more mystery that could have been expanded on or some questionable character motivation that should have been set up earlier. The characters are serviceable but wish we got some more there and some were a bit forgettable or didn't have properly fleshed out history or back story.\\n\\nWas hoping for more dark turns, especially in the ending but there was a couple surprising moments and some good horror at times, just nothing mind blowing. Overall a solid story and having Eduardo Ballerini narrate the audiobook definitely makes it easier for me to push through the slower parts.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1349614200l/13453029.jpg","asin":"B0DSZW7GZ1","goodreadsUrl":"https://www.goodreads.com/book/show/13453029-wool-omnibus","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"magician-apprentice-e2b408fa","readMonth":{"month":"Jan","year":"2026","day":"14","sort":"2026-01-14"},"title":"Magician: Apprentice","author":"Feist, Raymond E.","series":"The Riftwar Saga, #1","review":"3.5/5 solid intro to fantasy book, at times a bit simple and straightforward but the driving central conflict of the series is intriguing and I will definitely read book 2 (which is basically the second half of a larger book anyway). Sometimes skips over some things that don't feel as earned and it does lull a bit and feel a little aimless at times. I'm actually more excited for the Empire series with Wurts and Feist and I think this will give good context for that, the antagonist faction is very mysterious and interesting and I want to learn more, so it did its job there at least for setting up the larger series.","highlightCount":4,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1655656552l/13812.jpg","asin":"B073TJ3J3J","goodreadsUrl":"https://www.goodreads.com/book/show/13812.Magician","kindleUrl":"https://amazon.com/dp/B073TJ3J3J","matchMethod":"title-author"},{"id":"shadowheart-45953cb5","readMonth":{"month":"Jan","year":"2026","day":"16","sort":"2026-01-16"},"title":"Shadowheart","author":"Williams, Tad","series":"Shadowmarch, #4","review":"Ugh, so good. Incredibly satisfied with how this converged and came together. Tad can try your patience at times but he delivers and he delivers big. The climactic moments were bombastic and epic and the character moments were intimate and emotional.\\n\\nI would not in any way call this a lesser series than Osten Ard. This has its own darker flavor but also familiar reflections and reverberations of what makes Osten Ard great.\\n\\nThe pacing throughout has been very deliberate and the reveals of the mysteries he's kept close to his chest until late in the series but I think it finished brilliantly.\\n\\nThe world building continues to be next level and deep, I have a lot of questions and will be putting on my tinfoil hat and theorizing about some of the implications.\\n\\nAmazing ending to the series and I'd love to see more in this world in the future but this is also a good ending point that ties up the threads cleanly while leaving some things a little open for the future of this world.","highlightCount":96,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1587386660l/10250724.jpg","asin":"B0046ECJ6O","goodreadsUrl":"https://www.goodreads.com/book/show/10250724-shadowheart","kindleUrl":"https://amazon.com/dp/B0046ECJ6O","matchMethod":"asin"},{"id":"steel-gods-6473937e","readMonth":{"month":"Jan","year":"2026","day":"21","sort":"2026-01-21"},"title":"Steel Gods","author":"Swan, Richard","series":"The Great Silence, #2","review":"3.5/5 I received a copy of this book on Netgalley in exchange for an honest review.\\n\\nDefinitely some middle book syndrome. I do have some whiplash reviewing this as I was pretty whelmed but not blown away by the first half of this book and then the second half is a big improvement and made me question how I felt about the first half (in a good way) even at the point where it was overwhelming how cool some of the stuff happening was and it felt like a tidal wave of crazy stuff that was hard to keep track of.\\n\\nFor the first half, the writing was good and there were some flashes of horror and interesting bits that reminded me of the strengths of Grave Empire. There's a lot of council meetings and international politics in the first half of the book and I just don't think that's Swan's strength.\\n\\nThe second half is really quite good however, I do have some reservations for just how wild it's getting, the amount of things that come a little out of left field, and the amount of magic artifacts that drive the plot, but some really epic moments and some cool ideas, I do just worry there's too much going on and not enough breathing room for everything packed in here.\\n\\nSwan seems to struggle a bit with book 2s, Tyranny of Faith is my least favorite of his, I still rated it a 4/5 but there are definitely pacing issues with it as well as one of the big main mysteries falls flat by the end and is unsatisfying. I like this one more than Tyranny of Faith, but I'm going to opt for a 3/5 because I have higher expectations after Grave Empire and I hold Swan up to a higher standard after enjoying his books quite a bit.\\n\\nGrave Empire was such a hit for me because I felt like the stories began at a smaller scale and progressively built up at a good pace before they all simultaneously dialed up the stakes and levels of horror. Steel Gods has more pacing issues for me. I sort of feel like the time jump should have been farther in the future to skip over some of the less exciting events and set-up. For some of the characters it does feel like they loop back around to rehash some elements of book 1 which sort of makes it feel like we're not making progress.\\n\\nThe pace is a big issue for me in this one, some of the character moments didn't really land for me, there wasn't much breathing room to get connected to the characters and some of the moments felt a little unearned or sudden.\\n\\nWorld building is definitely a weakness for the series and this one relies the most on it to make the book interesting. One of the nations is basically just France and not that interesting. The pantheon of the gods and the lore there I was hoping to see it be a bit deeper and more interesting, feels a little barebones at times. The schism of religion parts of the book are compelling but again I don't think we really see a lot of depth here beyond kind of the surface level differences.\\n\\nThe world building definitely tends to go wide instead of deep which is not usually my preference, book 1 set up a lot of cool elements and was hoping to dive more into them, instead we get even more piled on here with varying levels of success, it can feel a weird combination of both overwhelming but also some parts seem a little underdeveloped.\\n\\nCool climax, awesome use of necromancy and zombies at a large scale. I'm a big zombie and necromancy fan so this is a big plus for the series for me. Swan has hinted at the ways this might be used in the last book and really curious to see where it goes, hoping for big things here.\\n\\nThe best POV in book 1 is a bit more restrained here and the build up is less exciting, but still a really good character and interested to see where he goes for book 3, lots of things set up that will be interesting to explore. The new characters and POV didn't do a lot for me and I had a lot more of a hard time connecting with the characters in this book in general than in book 1.\\n\\nOverall, I definitely enjoyed this, I just had pretty high expectations for it. I will be reading book 3 either on release or as soon as I get an ARC.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1752247933l/238142645.jpg","asin":"0316577030","goodreadsUrl":"https://www.goodreads.com/book/show/238142645-steel-gods","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shift-82a4c77e","readMonth":{"month":"Jan","year":"2026","day":"25","sort":"2026-01-25"},"title":"Shift","author":"Howey, Hugh","series":"Silo, #2","review":"Huge improvement over book one. Biggest improvement in a sequel that I can think of.\\n\\nThis shows how the apocalypse came about in a believable and (horrifically) satisfying way. Loved the themes of complicity in an evil system and our roles in them and if it's possible to break these systems or not. Also has a great storyline about isolation with some major horror elements. Whereas book one had some pacing issues and some plot developments that strained my suspension of disbelief this one shows major maturation of his talent and is a much smoother experience.\\n\\nMakes the previous book better in retrospect and sets up the final book extremely well, itching to read the conclusion now.\\n\\nAll your baskets in one egg.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1379003176l/17306293.jpg","asin":"B00B6Z6HI2","goodreadsUrl":"https://www.goodreads.com/book/show/17306293-shift","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"last-contract-of-isako-5a30d985","readMonth":{"month":"Feb","year":"2026","day":"01","sort":"2026-02-01"},"title":"The Last Contract of Isako","author":"Lee, Fonda","series":"","review":"4.25/5 Cyberpunk samurai Succession in Space!\\n\\nI received a copy of this book on Netgalley in exchange for an honest review.\\n\\nI read all of Greenbone Saga a few years ago and thought it got progressively better so I was excited to read this one and see what Fonda Lee can do with a sci-fi Cyberpunk setting, really good premise and world.\\n\\nThe immediate hook of the book I thought was quite good and it pulled me in quickly, the character of Isako is compelling as a samurai contractor past her prime, aging, and recently failed her last big contract is the sort of protagonist we don't get often.\\n\\nThe mystery set up was compelling and kept me turning the pages, I was impressed with how Lee kept the scope of the story controlled where sometimes with sci-fi settings there's a tendency to go huge and epic right away which can rob the build up.\\n\\nThe book does a good job of focusing on the political complexities of the various factions in this world and all the competing motivations, in particular there's a number of characters that you're trying to figure out the whole book and the way she slow rolls their motivations and gray morality was very well done, there's a tendency to paint leaders as always corrupt and morally bankrupt but I think she treats the motivations of them with a lot of nuance that makes it complex and interesting to think about.\\n\\nShe also uses perspective in a really great way and the book turns on its head at one point that really surprised me. This was probably my favorite part and was really compelling to read, loved the tackling of this mystery from multiple angles and her challenging what we think we know.\\n\\nThe ending was pretty solid, think I wanted some more at certain points in the book, there's some decent ideas in the book but if you're looking for mind shattering sci-fi ideas you're probably looking in the wrong place here.\\n\\nMy recommendation for something similar that is one of my favorite sci-fi standalones is Chasm City by Alastair Reynolds, it has a lot more complexity and mind blowing moments. Isako is a lot more approachable and does the politics and characters better however. \\n\\nI also was a bit surprised that the action was not that prevalent being a samurai story so you might be disappointed if you're looking for that. It's more restrained there and it builds up with more personal politics and had some moments of action but nothing that jaw dropping and not much spectacle. \\n\\nOverall I really enjoyed this a lot as a character focused political Cyberpunk sci-fi story and would love to read more in this setting. I also think this is ripe for adaptation and would make a great movie/TV show/video game. Really good foundation for further exploration of this setting.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":4.25,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1763645919l/123161631.jpg","asin":"0356526712","goodreadsUrl":"https://www.goodreads.com/book/show/123161631-the-last-contract-of-isako","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"magician-master-49186519","readMonth":{"month":"Feb","year":"2026","day":"02","sort":"2026-02-02"},"title":"Magician: Master","author":"Feist, Raymond E.","series":"The Riftwar Saga, #2","review":"3.75/5 a step up from book 1. Some events happen too abruptly but very enjoyable classic fantasy. Can't say that I care too much about the politics in the series but definitely has some cool world building and magic. Definitely a bit messy at times but enjoyable.","highlightCount":21,"myGoodreadsRating":4,"myReviewRating":3.75,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1677579200l/13882.jpg","asin":"B073TK6VPC","goodreadsUrl":"https://www.goodreads.com/book/show/13882.Magician","kindleUrl":"https://amazon.com/dp/B073TK6VPC","matchMethod":"title-author"},{"id":"night-in-chile-a6323f46","readMonth":{"month":"Feb","year":"2026","day":"04","sort":"2026-02-04"},"title":"By Night in Chile","author":"Bolaño, Roberto","series":"","review":"Sort of literary wank but some good poetry and visuals. Definitely doesn't hit like Remains of the Day but I think you can read between the lines and some of the themes are definitely understated in a way that I'll be thinking about it.","highlightCount":24,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1719798957l/204337107.jpg","asin":"B0CQHMJRG1","goodreadsUrl":"https://www.goodreads.com/book/show/204337107-by-night-in-chile","kindleUrl":"https://amazon.com/dp/B0CQHMJRG1","matchMethod":"asin"},{"id":"echo-park-7b904191","readMonth":{"month":"Feb","year":"2026","day":"05","sort":"2026-02-05"},"title":"Echo Park","author":"Connelly, Michael","series":"Harry Bosch, #12; Harry Bosch Universe, #17","review":"Perfectly executed thriller / police procedural with a lot of great twists and turns. Think the only thing I would have liked more of is thematic depth or more writing flourishes that are present in other Connelly books, but plot wise it's pretty flawless, good stuff. I've read over 20 Connelly books now and I'm a big fan!","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1633650469l/59237942.jpg","asin":"B000OT8GDA","goodreadsUrl":"https://www.goodreads.com/book/show/59237942-echo-park","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"as-i-lay-dying-fec17a7b","readMonth":{"month":"Feb","year":"2026","day":"07","sort":"2026-02-07"},"title":"As I Lay Dying","author":"Faulkner, William","series":"","review":"Some good prose and I was really interested in the multi POV first person angle but I don't think it was effectively used here. The voice of the narrative sounds very similar between the characters and you don't really get much difference depending on whose head you're in. The plot is also not that interesting and thematically didn't feel much depth.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1757102388l/77013.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/77013.As_I_Lay_Dying","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"starship-troopers-4f1663a8","readMonth":{"month":"Feb","year":"2026","day":"10","sort":"2026-02-10"},"title":"Starship Troopers","author":"Heinlein, Robert A.","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1614054412l/17214.jpg","asin":"0441783589","goodreadsUrl":"https://www.goodreads.com/book/show/17214.Starship_Troopers","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"dust-847bf1f4","readMonth":{"month":"Feb","year":"2026","day":"18","sort":"2026-02-18"},"title":"Dust","author":"Howey, Hugh","series":"Silo, #3","review":"Not sure if all the world building really makes sense but I really enjoyed this for the most part. Some threads didn't get resolved and some mysteries needed more clarification but it had some good moments and a lot of surprises. Also the ending was good, felt like it needed some additional layers but was a decent note to end on.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1436806122l/18866705.jpg","asin":"B0DWV1JSPB","goodreadsUrl":"https://www.goodreads.com/book/show/18866705-dust","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"overlook-4a07cb43","readMonth":{"month":"Feb","year":"2026","day":"23","sort":"2026-02-23"},"title":"The Overlook","author":"Connelly, Michael","series":"Harry Bosch, #13; Harry Bosch Universe, #18","review":"Solid Bosch but nothing extraordinary, good mystery and the terrorism angle is different from the other entries. Some of the characterization is a bit more grating than the other ones and was unclear if it was intentional.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1442875969l/84785.jpg","asin":"0316018953","goodreadsUrl":"https://www.goodreads.com/book/show/84785.The_Overlook","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"children-of-strife-a726b336","readMonth":{"month":"Feb","year":"2026","day":"24","sort":"2026-02-24"},"title":"Children of Strife","author":"Tchaikovsky, Adrian","series":"Children of Time, #4","review":"I received a copy of this book on Netgalley in exchange for an honest review.\\n\\nAll hail the Bugman. Best entry in the series since the first one and a return to form after Children of Memory - which I liked but is definitely the odd one out for the series.\\n\\nTchaikovsky does non human POVs one of the best in the genre and he really goes wild with the ideas and world building in this entry. It already had a wild level of imagination in the series that's built up more and more with each book, so it's cool to see him be able to build off of that in a way that explores new ground. Just a really masterful handle on what makes a story work and what makes sci-fi in general so compelling.\\n\\nThe way I'd describe this series in general is a celebration and exploration of the variety of different lifeforms and how crazy biology can and might get, how the initial conditions and influence of the environment and different chaotic conditions affect these lifeforms, and how that affects sentience and cognition as it develops across huge scales of time and space.\\n\\nThis one sort of returns back to first principles of the series in really cool ways and explores the consequences of terraforming from interesting angles. In many ways it's sort of a soft reset in one storyline because previous books have gotten so wild that we need to go back in order to go forward.\\n\\nThe amount of books Tchaikovsky outputs continues to be insane and I was beginning to be skeptical that the quality would continue to be high, but this is one of my favorites of his. Love the way this man's brain works and I will continue to keep an eye on his many new releases in the future.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1762866145l/231953328.jpg","asin":"B0FSJSRTMV","goodreadsUrl":"https://www.goodreads.com/book/show/231953328-children-of-strife","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"hedge-knight-f3be7329","readMonth":{"month":"Feb","year":"2026","day":"25","sort":"2026-02-25"},"title":"The Hedge Knight","author":"Martin, George R.R.","series":"The Tales of Dunk and Egg, #1","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1661025252l/11970747.jpg","asin":"B0FSKWRRZ1","goodreadsUrl":"https://www.goodreads.com/book/show/11970747-the-hedge-knight","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"sworn-sword-4e214e08","readMonth":{"month":"Mar","year":"2026","day":"03","sort":"2026-03-03"},"title":"The Sworn Sword","author":"Martin, George R.R.","series":"The Tales of Dunk and Egg, #2","review":"The background world building is really good but the plot sort of fizzles by the end a bit","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1661021151l/11985631.jpg","asin":"B0DTRYTD9T","goodreadsUrl":"https://www.goodreads.com/book/show/11985631-the-sworn-sword","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"exodus-archimedes-engine-b286e269","readMonth":{"month":"Mar","year":"2026","day":"22","sort":"2026-03-22"},"title":"Exodus: The Archimedes Engine","author":"Hamilton, Peter F.","series":"Archimedes Engine, #1","review":"4.5/5 Pretty much everything you could want in a space opera, was absolutely glued to this since I started it. The dialogue missed a few times with me and I was hoping to be a little more connected to the characters, but this is probably the best paced Hamilton I've read. For a massive book it was hard to put down and continuously had interesting things happening.\\n\\nNext level world building, seriously impressive. There's a fully developed future history across 40k+ years just to get started. The number of factions that all have their own motivations and are competing against each other in the Great Game is pretty mind boggling and complex but it really makes the universe feel alive, it also makes for a really compelling plot. Feel like we scratched the surface of what we've seen in this universe, and we saw a lot!","highlightCount":77,"myGoodreadsRating":5,"myReviewRating":4.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1707575188l/205774097.jpg","asin":"B0CSW9BK5C","goodreadsUrl":"https://www.goodreads.com/book/show/205774097-exodus","kindleUrl":"https://amazon.com/dp/B0CSW9BK5C","matchMethod":"asin"},{"id":"scarecrow-1cddf23d","readMonth":{"month":"Mar","year":"2026","day":"30","sort":"2026-03-30"},"title":"The Scarecrow","author":"Connelly, Michael","series":"Jack McEvoy, #2; Harry Bosch Universe, #20","review":"Decent but big step down from The Poet, the setup is a bit contrived and some of the developments require a lot of chance that stretch believability.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1581206278l/51085470.jpg","asin":"B0029KHTA8","goodreadsUrl":"https://www.goodreads.com/book/show/51085470-the-scarecrow","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"exodus-helium-sea-ef4f0c06","readMonth":{"month":"Apr","year":"2026","day":"04","sort":"2026-04-04"},"title":"Exodus: The Helium Sea","author":"Hamilton, Peter F.","series":"Archimedes Engine, #2","review":"4.75/5\\n\\nI received a copy of this book on Netgalley in exchange for an honest review.\\n\\nMassive and expansive but surprisingly focused space opera. This takes the build up of Archimedes Engine and runs with it beautifully. It is a masterfully plotted adventure that takes the many threads built up over the series and weaves them together in an intricate and satisfying way while leaving plenty on the table to explore in the future.\\n\\nFrom the get-go we're picking up where Archimedes Engine left off and we get immediate payoff from what it set up in awe inspiring and, often terrifying, moments.\\n\\nI don't think I can emphasize enough how good the politics are. The many different factions, their motivations, their hidden schemes, and the dynamic nature of the alliances that form and break over the story is seriously impressive, it has to be some of my favorite politics in fiction.\\n\\nIt makes it fairly complex to keep track of, but it is very rewarding and engaging and made the world feel real and deep. It also makes the plot extremely compelling, as I was constantly thinking about what was going to happen and how these various factions might interact and conflict with each other. Often the characters involved are very long-lived so these Great Games they've been playing have been set up for millennia.\\n\\nThe world building is impressive and well thought out. It's clear Hamilton put a lot of legwork into the world and he is disciplined enough to maintain focus on telling the story he set out to tell in a way that reasonably wraps up in the 1600 or so page budget for the duology.\\n\\nWhile this is by no means a short story, if anything, I think this could have been a 5+ book series and in a lot of ways it could have benefitted from a bigger page count, but I do appreciate that we weren't left waiting for years and years for the resolution to the story. So while I do want more, I am satisfied with what I've read so far and will be thinking of this world for quite some time to come.\\n\\nSome of the plot points resolve a bit too quickly, it needed some breathing room after big climactic moments. In some ways some of the big confrontations resolve a bit too easily but it keeps the story moving and we don't get hung up on any particular plotline. This makes some of the moments with the characters not hit as hard as I think they could have, it's sort of a tradeoff for a faster moving plot and the consequence is we don't connect with the characters as much and don't have as much of an emotional connection with them.\\n\\nI do think Hamilton could have added some more pages to make these moments a bit harder hitting when they happen but I was able to connect some of the dots in my head to put myself in the shoes of the characters, but it's definitely not the focus for the story. This is consistent with other Hamilton series so I'm not surprised but it could have been an area of improvement.\\n\\nOne of the technologies is used as a bit of a crutch multiple times (3 times that I remember) and in very similar ways to give insight into the antagonist factions without having as much at stake. This particular technology is a pretty interesting idea, I'm just not sure the implications of it were explored fully and it was a pretty convenient plot device at times, it wasn't a deal breaker for me however.\\n\\nI do think the plot felt like you could tell it was set up to play out a particular way at times and could have been a little more dynamic and messy, but there were also plenty of surprises along the way, so not that big of a negative against the series.\\n\\nOverall this is one of my favorite space operas and one of my favorite reads of this year. Really looking forward to the video game and hope it lives up to the story and world in the books.","highlightCount":68,"myGoodreadsRating":5,"myReviewRating":4.75,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1759375707l/241716143.jpg","asin":"0593357698","goodreadsUrl":"https://www.goodreads.com/book/show/241716143-exodus","kindleUrl":"","matchMethod":"title-candidate-author-last"},{"id":"starseers-ruin-29d1be36","readMonth":{"month":"Apr","year":"2026","day":"07","sort":"2026-04-07"},"title":"Starseer's Ruin","author":"Tchaikovsky, Adrian","series":"",
