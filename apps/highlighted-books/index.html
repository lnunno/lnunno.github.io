ets.com/images/S/compressed.photo.goodreads.com/books/1265756984l/594574.jpg","asin":"0441248667","goodreadsUrl":"https://www.goodreads.com/book/show/594574.The_Fortress_of_the_Pearl","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"allies-of-night-9b0b2a0c","readMonth":{"month":"Feb","year":"2022","day":"20","sort":"2022-02-20"},"title":"Allies of the Night","author":"Shan, Darren","series":"Cirque du Freak, #8","review":"Maybe one of the weaker entries, one plot line was pretty dull, but a number of great character moments","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348387594l/963479.jpg","asin":"0316155705","goodreadsUrl":"https://www.goodreads.com/book/show/963479.Allies_of_the_Night","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"killers-of-dawn-9a4ea6d5","readMonth":{"month":"Feb","year":"2022","day":"21","sort":"2022-02-21"},"title":"Killers of the Dawn","author":"Shan, Darren","series":"Cirque Du Freak, #9","review":"😭","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1266708743l/1066067.jpg","asin":"0316156264","goodreadsUrl":"https://www.goodreads.com/book/show/1066067.Killers_of_the_Dawn","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"hellmouth-79992f90","readMonth":{"month":"Feb","year":"2022","day":"26","sort":"2022-02-26"},"title":"Hellmouth","author":"Kristian, Giles","series":"","review":"Great lil grimdark novella. Kristian describes horrific, dark, and terrifying things in a beautiful way. I need to read more by this author, thought this was fantastic and would have read a full novel based on this story. Reminded me a lot of Between Two Fires, Berserk, and Dark Souls in the best ways.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1613711007l/57124219.jpg","asin":"B08WJHY48M","goodreadsUrl":"https://www.goodreads.com/book/show/57124219-hellmouth","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"endymion-af9e669e","readMonth":{"month":"Feb","year":"2022","day":"27","sort":"2022-02-27"},"title":"Endymion","author":"Simmons, Dan","series":"Hyperion Cantos, #3","review":"","highlightCount":8,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1493235740l/10294361.jpg","asin":"B004G606I0","goodreadsUrl":"https://www.goodreads.com/book/show/10294361-endymion","kindleUrl":"https://amazon.com/dp/B004G606I0","matchMethod":"asin"},{"id":"lake-of-souls-e839b49a","readMonth":{"month":"Feb","year":"2022","day":"28","sort":"2022-02-28"},"title":"The Lake of Souls","author":"Shan, Darren","series":"Cirque du Freak, #10","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1255988654l/8951.jpg","asin":"0316016659","goodreadsUrl":"https://www.goodreads.com/book/show/8951.The_Lake_of_Souls","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"sailor-on-seas-of-fate-eb7bc0e7","readMonth":{"month":"Mar","year":"2022","day":"03","sort":"2022-03-03"},"title":"The Sailor on the Seas of Fate","author":"Moorcock, Michael","series":"The Elric Saga, #2","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1618575954l/60154.jpg","asin":"0586208771","goodreadsUrl":"https://www.goodreads.com/book/show/60154.The_Sailor_on_the_Seas_of_Fate","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"lord-of-shadows-e930adae","readMonth":{"month":"Mar","year":"2022","day":"04","sort":"2022-03-04"},"title":"Lord of the Shadows","author":"Shan, Darren","series":"Cirque Du Freak, #11","review":"","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388251260l/8949.jpg","asin":"0316156280","goodreadsUrl":"https://www.goodreads.com/book/show/8949.Lord_of_the_Shadows","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"sons-of-destiny-0881870d","readMonth":{"month":"Mar","year":"2022","day":"05","sort":"2022-03-05"},"title":"Sons of Destiny","author":"Shan, Darren","series":"Cirque du Freak, #12","review":"Man, I really liked all of the books before this but the ending was just not good. Going to pretend that it ended a different way","highlightCount":0,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1344270002l/8948.jpg","asin":"0316156299","goodreadsUrl":"https://www.goodreads.com/book/show/8948.Sons_of_Destiny","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"upgrade-e5bb4736","readMonth":{"month":"Mar","year":"2022","day":"05","sort":"2022-03-05"},"title":"Upgrade","author":"Crouch, Blake","series":"","review":"I received a copy of this book in exchange for an honest review.\\n\\nFirst off, if you're exhausted by COVID or current world events, I'd probably steer clear of this one as it is very clearly inspired by COVID and extrapolates to the near future of the implications of COVID and genetic engineering. The main premise of this is \\"what if COVID, but it makes you stronger, better, faster, stronger?\\" Also can be a bit of a downer about the path we're headed down as a species, which is fine, but if you're looking for an escape might not be the best way to do that.\\n\\nCrouch writes a good thriller and it's easy to read and get through a bunch of chapters in no time, this would make for a good beach read that challenges your thinking a little bit but not too much.\\n\\nSome of the ideas here are interesting but feel a little rushed and they definitely needed more room to breathe and more page time to get more connected to the characters and dig into the ideas a bit deeper.\\n\\nIt was definitely enjoyable to read, but I'll probably forget about it pretty quickly. It all does feel a bit too familiar of a movie you've seen before but with more of a COVID and current events angle that never feels completely believable in the way that Crichton books can feel.\\n\\nWould recommend this book to anyone who wants a quick read with a lot of action that does a decent job of creating a near future world and asks some interesting questions about genetic engineering and what it means to be human. Didn't blow me away but I enjoyed my time with it.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1643994317l/59838811.jpg","asin":"0593157532","goodreadsUrl":"https://www.goodreads.com/book/show/59838811-upgrade","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"city-of-golden-shadow-602b9817","readMonth":{"month":"Mar","year":"2022","day":"08","sort":"2022-03-08"},"title":"City of Golden Shadow","author":"Williams, Tad","series":"Otherland, #1","review":"This is really like ten books in one, every chapter changes it up and is often in a completely different genre. One of the most ambitious book ones I've read, there's a huge amount of disparate storylines that are distinct and hugely different and it's not clear how they'll all converge, but they're all enjoyable and crafted with care.\\n\\nHas some pacing issues like pretty much every Tad Williams book I've read which is the biggest issue, but doesn't impact the novel that significantly. The writing is beautiful. Tad Williams is one of my favorite authors for setting a scene and immersing you in a moment, even though the world is strange and often horrifying there's moments of serenity and beauty that take your breath away with how they're described.","highlightCount":1,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1587449195l/12806720.jpg","asin":"B005IUDRV6","goodreadsUrl":"https://www.goodreads.com/book/show/12806720-city-of-golden-shadow","kindleUrl":"https://amazon.com/dp/B005IUDRV6","matchMethod":"asin"},{"id":"devil-all-time-3535fe1e","readMonth":{"month":"Mar","year":"2022","day":"09","sort":"2022-03-09"},"title":"The Devil All the Time","author":"Pollock, Donald Ray","series":"","review":"Super dark and bleak. There's not really good people in this book, mostly bad people doing bad and trying to get away with it. Also tons of violence, sometimes justified, often not. If there was more internal struggle in the characters would have rated it higher, still really good and entertaining read.\\n\\nThe prose was pretty well done and understated as well. Pollock did a great job at introducing characters and giving them a lot of backstory in a short amount of time. Thematically I think the novel could have done more but there was a fair amount of subtlety to give the senseless violence meaning and you have to look for it to get it; it's not spelled out to you for better or worse.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1638973129l/55709871.jpg","asin":"B004J4WM9A","goodreadsUrl":"https://www.goodreads.com/book/show/55709871-the-devil-all-the-time","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"lord-of-emperors-44c9e8f6","readMonth":{"month":"Mar","year":"2022","day":"12","sort":"2022-03-12"},"title":"Lord of Emperors","author":"Kay, Guy Gavriel","series":"The Sarantine Mosaic, #2","review":"","highlightCount":74,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1583768415l/9746672.jpg","asin":"B0043RSISW","goodreadsUrl":"https://www.goodreads.com/book/show/9746672-lord-of-emperors","kindleUrl":"https://amazon.com/dp/B0043RSISW","matchMethod":"asin"},{"id":"blood-eye-c51288cd","readMonth":{"month":"Mar","year":"2022","day":"12","sort":"2022-03-12"},"title":"Blood Eye","author":"Kristian, Giles","series":"Raven, #1","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1320998299l/6082119.jpg","asin":"0593061624","goodreadsUrl":"https://www.goodreads.com/book/show/6082119-blood-eye","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"river-of-blue-fire-b5234ae1","readMonth":{"month":"Mar","year":"2022","day":"15","sort":"2022-03-15"},"title":"River of Blue Fire","author":"Williams, Tad","series":"Otherland, #2","review":"Sort of a love/hate relationship with this one to be totally honest. It's longer than it has any right to be, really and a lot of the plot is wandering around different VR worlds and somehow escaping at the last minute.\\n\\nHowever, it's Tad Williams and there's beautiful writing and he's very good at what he does, even though sometimes he needs to move on to the next thing. There's also really cool ideas being explored and still very ambitious. Feels a bit like a middle book because it definitely is, although there's some cool revelations and character moments, but the tension isn't kept up throughout the book, the stakes are high but the characters sort of go on an adventure and usually totally fine by the end of that \\"episode\\".\\n\\nHoping that the next book is an improvement, I thought the first book was better balanced, still interested to see how things develop in later books. There's really cool and interesting sci-fi concepts being explored and interesting mysteries yet to unfold.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1309992269l/10084.jpg","asin":"0886778441","goodreadsUrl":"https://www.goodreads.com/book/show/10084.River_of_Blue_Fire","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"interview-with-vampire-36b47fa6","readMonth":{"month":"Mar","year":"2022","day":"16","sort":"2022-03-16"},"title":"Interview with the Vampire","author":"Rice, Anne","series":"The Vampire Chronicles #1","review":"The first half was fantastic and one of the best vampire stories I've read. It was an intimate, personal story with interesting philosophical questions and Rice made New Orleans come alive. The second half wasn't as good, sort of takes a weird turn and didn't care for the plot as much. Still very good story, interested to see what happens next at some point in the future.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1750279664l/2924362.jpg","asin":"0345256085","goodreadsUrl":"https://www.goodreads.com/book/show/2924362-interview-with-the-vampire","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"senlin-ascends-93eec5b4","readMonth":{"month":"Mar","year":"2022","day":"18","sort":"2022-03-18"},"title":"Senlin Ascends","author":"Bancroft, Josiah","series":"The Books of Babel, #1","review":"This was a great read, pacing was just right. Got a good balance of world building, character development, and the plot clips away at a steady pace where it's clear that we're making progress towards a larger ending. A weak point was that the action writing wasn't as clear as I would have liked at the end and things got a bit muddled, but prior to that didn't have any issues with the writing and I think in particular the structure of the book is really well done where Bancroft is slowly revealing aspects of the world and characters that make you more invested and not overwhelmed.\\n\\nExcited to see where the plot goes from here! Really easy to read and I sort of flew through this one unintentionally which is a good sign.","highlightCount":9,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1654572641l/36111562.jpg","asin":"B074M62D7Y","goodreadsUrl":"https://www.goodreads.com/book/show/36111562-senlin-ascends","kindleUrl":"https://amazon.com/dp/B074M62D7Y","matchMethod":"asin"},{"id":"breakfast-at-tiffanys-and-three-stories-929cf553","readMonth":{"month":"Mar","year":"2022","day":"19","sort":"2022-03-19"},"title":"Breakfast at Tiffany’s and Three Stories","author":"Capote, Truman","series":"","review":"I don't get it. Holly is insufferable. It would be an absolute nightmare to know her in real life.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1739711613l/251688.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/251688.Breakfast_at_Tiffany_s_and_Three_Stories","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"black-echo-1bf5d801","readMonth":{"month":"Mar","year":"2022","day":"21","sort":"2022-03-21"},"title":"The Black Echo","author":"Connelly, Michael","series":"Harry Bosch, #1; Harry Bosch Universe, #1","review":"Bank heists, Vietnam tunnels, crooked cops, the concrete jungle of Los Angeles: all excellent ingredients to a fantastically executed crime story.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1344265342l/32508.jpg","asin":"B007CIMPC4","goodreadsUrl":"https://www.goodreads.com/book/show/32508.The_Black_Echo","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"lincoln-lawyer-5fb1993c","readMonth":{"month":"Mar","year":"2022","day":"23","sort":"2022-03-23"},"title":"The Lincoln Lawyer","author":"Connelly, Michael","series":"The Lincoln Lawyer, #1; Harry Bosch Universe, #16","review":"One of my favorite books I've read this year. Liked this more than the first Bosch book that was already fantastic. Mickey Haller is such a great character. \\"A scumbag defense attorney that's still loved by his two ex-wives and his daughter.\\"\\n\\nConnelly wrote a hell of a page turner, didn't want to put it down. His pacing is next level good. Thrilling from beginning to end. Only question now is whether to do the next Bosch or Haller book next 🤔","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1529686346l/40612032.jpg","asin":"B000FCKG1G","goodreadsUrl":"https://www.goodreads.com/book/show/40612032-the-lincoln-lawyer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"sins-of-our-fathers-74072714","readMonth":{"month":"Mar","year":"2022","day":"23","sort":"2022-03-23"},"title":"The Sins of Our Fathers","author":"Corey, James S.A.","series":"The Expanse, #9.5","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1640579304l/59548471.jpg","asin":"B098TJGV62","goodreadsUrl":"https://www.goodreads.com/book/show/59548471-the-sins-of-our-fathers","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"kingdoms-of-death-7016ac97","readMonth":{"month":"Mar","year":"2022","day":"28","sort":"2022-03-28"},"title":"Kingdoms of Death","author":"Ruocchio, Christopher","series":"The Sun Eater, #4","review":"June 2025 review:\\nYep, still amazing. Agree with everything I wrote in my original review still. If anything this got better with re-read. The beginning of the book hit better this time, I was less in a rush to get to the good bits. I have such a better connection with the side characters on this read knowing where everything is going and their arcs. Just peak sci-fi, very special series. Looking forward to Shadows Upon Time so so much.\\n\\nMarch 2022 review:\\nEven though my expectations were already sky high this book exceeded them. Has amazing lore and world building, great dark moments, and lots of emotional impact. Eagerly awaiting the next book, this is easily one of the best sci-fi series I've read.\\n\\nRuocchio's writing has gotten even better, the prose is beautiful even when the subject matter is terrifying and bleak. Can't recommend this series enough, I have my full faith in Ruocchio to deliver a great read.","highlightCount":25,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1634104594l/58420375.jpg","asin":"B096WYRG91","goodreadsUrl":"https://www.goodreads.com/book/show/58420375-kingdoms-of-death","kindleUrl":"https://amazon.com/dp/B096WYRG91","matchMethod":"asin"},{"id":"sons-of-thunder-f7c66386","readMonth":{"month":"Mar","year":"2022","day":"29","sort":"2022-03-29"},"title":"Sons of Thunder","author":"Kristian, Giles","series":"Raven, #2","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1320533072l/7770954.jpg","asin":"0593061640","goodreadsUrl":"https://www.goodreads.com/book/show/7770954-sons-of-thunder","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"black-ice-99edf9fa","readMonth":{"month":"Apr","year":"2022","day":"02","sort":"2022-04-02"},"title":"The Black Ice","author":"Connelly, Michael","series":"Harry Bosch, #2; Harry Bosch Universe, #2","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1372241876l/24244.jpg","asin":"0446613444","goodreadsUrl":"https://www.goodreads.com/book/show/24244.The_Black_Ice","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pillars-of-earth-3bf4a340","readMonth":{"month":"Apr","year":"2022","day":"10","sort":"2022-04-10"},"title":"The Pillars of the Earth","author":"Follett, Ken","series":"Kingsbridge, #1","review":"","highlightCount":26,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1595748671l/50881608.jpg","asin":"B003TO5GXU","goodreadsUrl":"https://www.goodreads.com/book/show/50881608-the-pillars-of-the-earth","kindleUrl":"https://amazon.com/dp/B003TO5GXU","matchMethod":"asin"},{"id":"mountain-of-black-glass-0ba73d96","readMonth":{"month":"Apr","year":"2022","day":"10","sort":"2022-04-10"},"title":"Mountain of Black Glass","author":"Williams, Tad","series":"Otherland, #3","review":"A step in the right direction, liked this a lot more than the second book. I'm sort of both relieved to finish and interested in what's going to happen next, but will be taking a break before the last book. These books are still too long, but I enjoyed a good majority of this one. Some good plot progression, but there's just a lot of threads going on at once which can get tiring.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1309992323l/10090.jpg","asin":"0886779065","goodreadsUrl":"https://www.goodreads.com/book/show/10090.Mountain_of_Black_Glass","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"arm-of-sphinx-5ccc2096","readMonth":{"month":"Apr","year":"2022","day":"13","sort":"2022-04-13"},"title":"Arm of the Sphinx","author":"Bancroft, Josiah","series":"The Books of Babel, #2","review":"Disappointing. I really loved the first book and this was a massive step down. Really did not like the plot and the way the character development and world building was done in this one. Overall felt clumsy and uninteresting to me. I might still try the third book, but the overall tone and themes in this book are a big miss for me.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1509574820l/35959733.jpg","asin":"031651795X","goodreadsUrl":"https://www.goodreads.com/book/show/35959733-arm-of-the-sphinx","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"player-piano-2081f16f","readMonth":{"month":"Apr","year":"2022","day":"14","sort":"2022-04-14"},"title":"Player Piano","author":"Vonnegut Jr., Kurt","series":"","review":"","highlightCount":51,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1598907389l/55196549.jpg","asin":"B002QJZ9V8","goodreadsUrl":"https://www.goodreads.com/book/show/55196549-player-piano","kindleUrl":"https://amazon.com/dp/B002QJZ9V8","matchMethod":"asin"},{"id":"shadow-of-what-was-lost-50b7238b","readMonth":{"month":"Apr","year":"2022","day":"17","sort":"2022-04-17"},"title":"The Shadow of What Was Lost","author":"Islington, James","series":"The Licanius Trilogy, #1","review":"Read about 60% of this, don't want to finish. This series isn't for me. It's decent but nothing about it is that interesting to me and for the most part aside from some twists is fairly standard fantasy genre fare. Reminds me the most of Stormlight Archive and the Lord of the Rings. Has a lot of the things that make Sanderson not click with me.\\n\\nIf I had read this as one of my first fantasy series would probably have been more interested. The writing overall is fairly amateur, the dialog is pretty awkward, and the characters are thin. I'm not as driven by the plot of books so much as the quality of the writing, characters, and the world so this one doesn't have what I'm looking for.","highlightCount":2,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1468943304l/31176818.jpg","asin":"B01HMRF5FI","goodreadsUrl":"https://www.goodreads.com/book/show/31176818-the-shadow-of-what-was-lost","kindleUrl":"https://amazon.com/dp/B01HMRF5FI","matchMethod":"asin"},{"id":"berserk-24-8b554f4b","readMonth":{"month":"Apr","year":"2022","day":"17","sort":"2022-04-17"},"title":"Berserk Volume 24","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500659273l/35718851.jpg","asin":"B073ZJZPNP","goodreadsUrl":"https://www.goodreads.com/book/show/35718851-berserk-volume-24","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-25-cd98b28e","readMonth":{"month":"Apr","year":"2022","day":"17","sort":"2022-04-17"},"title":"Berserk Volume 25","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500646710l/35717341.jpg","asin":"B073ZJNMZ6","goodreadsUrl":"https://www.goodreads.com/book/show/35717341-berserk-volume-25","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-26-d79ad8e3","readMonth":{"month":"Apr","year":"2022","day":"18","sort":"2022-04-18"},"title":"Berserk Volume 26","author":"Miura, Kentaro","series":"","review":"Badass","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500646817l/35717350.jpg","asin":"B0743JWPHF","goodreadsUrl":"https://www.goodreads.com/book/show/35717350-berserk-volume-26","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"knockemstiff-8425c742","readMonth":{"month":"Apr","year":"2022","day":"18","sort":"2022-04-18"},"title":"Knockemstiff","author":"Pollock, Donald Ray","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1424959738l/1704719.jpg","asin":"0385523823","goodreadsUrl":"https://www.goodreads.com/book/show/1704719.Knockemstiff","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-27-acc0b9af","readMonth":{"month":"Apr","year":"2022","day":"21","sort":"2022-04-21"},"title":"Berserk Volume 27","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500646841l/35717354.jpg","asin":"B0743HVN4V","goodreadsUrl":"https://www.goodreads.com/book/show/35717354-berserk-volume-27","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"grace-of-kings-f20b44f7","readMonth":{"month":"Apr","year":"2022","day":"22","sort":"2022-04-22"},"title":"The Grace of Kings","author":"Liu, Ken","series":"The Dandelion Dynasty, #1","review":"I absolutely loved every minute of this book. Ken Liu has the potential to be one of my favorite writers. I have major respect for authors with a strong vision of what they want their story and narrative to be even if it's a little outside of normal conventions and sticking with it without any compromises.\\n\\nThis is definitely a dense and challenging read and demands that you pay attention to get the full experience, often Liu will not re-introduce characters even though there are a lot of them, and you often get a short flashback that fleshes out their backstory after being introduced to them. I'm in love with his writing style and he gets me to care about new characters faster than pretty much any author I've read before.\\n\\nLiu's prose is top notch, I'm a self-admitted prose snob and there's no faster way to get me to quit a book than poor writing. Grace of Kings has gorgeous sections that relate humanity to nature, have deep introspective looks into family, nobility, philosophy and they're all interweaved flawlessly.\\n\\nI'm also a theme-driven reader and the themes Liu explores in this book are tremendous, there's a ton of subtext in the book which rewards an attentive read. I was thinking of listening to this on audio but I'd highly recommend against that, there's a lot of section breaks and pauses that only really come across well in the physical text.\\n\\nThis felt like a whole trilogy or series in a single book, a lot happens and the third person omniscient perspective really helps move things along, I can see this being contentious, but I personally love the risk Liu takes with this perspective since it's not common. It allows Liu to jump around and give the important events in the plot without restrictions.\\n\\nHighly recommend this book, it's among the best I've read. Can't wait to continue the series, it's been the most excited I've been about an author's work in quite some time.","highlightCount":159,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1407568889l/22887541.jpg","asin":"B00KU4O1CY","goodreadsUrl":"https://www.goodreads.com/book/show/22887541-the-grace-of-kings","kindleUrl":"https://amazon.com/dp/B00KU4O1CY","matchMethod":"asin"},{"id":"berserk-28-45f4bf1f","readMonth":{"month":"Apr","year":"2022","day":"23","sort":"2022-04-23"},"title":"Berserk Volume 28","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500646856l/35717355.jpg","asin":"B0743JBL9G","goodreadsUrl":"https://www.goodreads.com/book/show/35717355-berserk-volume-28","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-29-7d281c8a","readMonth":{"month":"Apr","year":"2022","day":"24","sort":"2022-04-24"},"title":"Berserk Volume 29","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500619536l/35715667.jpg","asin":"B0743JN7GT","goodreadsUrl":"https://www.goodreads.com/book/show/35715667-berserk-volume-29","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"childhoods-end-2264c600","readMonth":{"month":"Apr","year":"2022","day":"25","sort":"2022-04-25"},"title":"Childhood's End","author":"Clarke, Arthur C.","series":"","review":"","highlightCount":24,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1567725118l/50783631.jpg","asin":"B07XG6MG3Y","goodreadsUrl":"https://www.goodreads.com/book/show/50783631-childhood-s-end","kindleUrl":"https://amazon.com/dp/B07XG6MG3Y","matchMethod":"asin"},{"id":"concrete-blonde-d0faea8c","readMonth":{"month":"Apr","year":"2022","day":"30","sort":"2022-04-30"},"title":"The Concrete Blonde","author":"Connelly, Michael","series":"Harry Bosch, #3; Harry Bosch Universe, #3","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388241215l/49350.jpg","asin":"044661758X","goodreadsUrl":"https://www.goodreads.com/book/show/49350.The_Concrete_Blonde","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"flowers-for-algernon-446ff708","readMonth":{"month":"May","year":"2022","day":"01","sort":"2022-05-01"},"title":"Flowers for Algernon","author":"Keyes, Daniel","series":"","review":"","highlightCount":18,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1658183334l/36512332.jpg","asin":"B003WJQ74E","goodreadsUrl":"https://www.goodreads.com/book/show/36512332-flowers-for-algernon","kindleUrl":"https://amazon.com/dp/B003WJQ74E","matchMethod":"title-candidate-author"},{"id":"wall-of-storms-1e4566f6","readMonth":{"month":"May","year":"2022","day":"07","sort":"2022-05-07"},"title":"The Wall of Storms","author":"Liu, Ken","series":"The Dandelion Dynasty, #2","review":"For people who struggled with the first book I think this one might be more in the wheelhouse of a traditional fantasy narrative and be more appealing to people who had issues with the Grace of Kings. It's less of a fable and legend like the first book and more of a modern plot structure. Also the female characters are way better in this one and often overshadow the male characters in most ways.\\n\\nI really loved every moment of this one again, even though it's almost a thousand pages I didn't want it to end. I do think I personally liked the structure and themes of the first book more but this one had a superior plot and really interesting politics.\\n\\nExcited to continue the series and see how it all ends. Liu is really good at giving a full cohesive narrative per book so it doesn't leave you hanging and a lot of the threads are wrapped up with enough to make you interested in the next books.\\n\\nThe battles in this book are some of the best I've read, I really didn't expect that from the series but it's been a nice surprise. The technology and war dynamics are always getting changed up which keeps things fresh from battle to battle and book to book.\\n\\nThe prose is also gorgeous as in the first book, but it felt like Liu pulled back in a lot of ways from the first book and delves less into descriptions and poetic nature metaphors. Maybe some people thought it was self indulgent, but I never did and I loved it. I really liked those sections in the first book, but they're less present here and the plot takes more of a center stage for better or worse.","highlightCount":112,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1456819685l/29007322.jpg","asin":"B01BKR14LK","goodreadsUrl":"https://www.goodreads.com/book/show/29007322-the-wall-of-storms","kindleUrl":"https://amazon.com/dp/B01BKR14LK","matchMethod":"asin"},{"id":"she-dreams-in-blood-5cbddc51","readMonth":{"month":"May","year":"2022","day":"13","sort":"2022-05-13"},"title":"She Dreams in Blood","author":"Fletcher, Michael R.","series":"The Obsidian Path, #2","review":"There's definitely cool moments and interesting ideas in this book, more so than the first book. In isolation I like this one more than the first one. However overall as a series I'm souring on it.\\n\\nThe main character and first person POV is frustrating to read about. His internal struggle is just not compelling and his romance interests are fairly juvenile. The character development was poorly done, the plot didn't move far enough in this one. It's more about the spectacle here and the themes and overarching narrative are falling flat.","highlightCount":34,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1611989950l/53166542.jpg","asin":"B08TVTF17J","goodreadsUrl":"https://www.goodreads.com/book/show/53166542-she-dreams-in-blood","kindleUrl":"https://amazon.com/dp/B08TVTF17J","matchMethod":"asin"},{"id":"world-without-end-e5da1bbb","readMonth":{"month":"May","year":"2022","day":"21","sort":"2022-05-21"},"title":"World Without End","author":"Follett, Ken","series":"Kingsbridge, #2","review":"An epic tome of historical fiction. Pillars of the Earth made a big impression on me and I liked this even more. It took a while to get going but Follett does an incredible job developing rich characters and torturing them in dastardly ways. He writes one of the most evil characters I've ever read here and does it in a way that you love to hate.\\n\\nHighly recommend this series and will be reading a lot of Follett in the future. The audiobooks narrated by John Lee are oddly soothing and easy to get through despite the book being absolutely massive. Pillars was a quicker read but this one was more complex and varied. I had a lot of connections with the characters and some of the plot lines were very compelling.","highlightCount":12,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1595748531l/45145958.jpg","asin":"B000W93CHC","goodreadsUrl":"https://www.goodreads.com/book/show/45145958-world-without-end","kindleUrl":"https://amazon.com/dp/B000W93CHC","matchMethod":"asin"},{"id":"curse-of-mistwraith-83efd6e3","readMonth":{"month":"May","year":"2022","day":"23","sort":"2022-05-23"},"title":"The Curse of the Mistwraith","author":"Wurts, Janny","series":"Wars of Light and Shadow, #1","review":"Very enjoyable first book, I definitely read this faster than I normally do which is a good sign. This book is closer to classical fantasy than modern fantasy but there's hints that things might get more complex as the series goes on.\\n\\nI don't think this would really work as a standalone even though on Goodreads it says that this is the first arc. There's so many unresolved questions that it'd be pretty unsatisfying to stop here. The book ends at a logical point, but it's clear that there's a lot that needs to happen for things to be wrapped up.\\n\\nThe writing style is complex and dense but also usually stems from the word choice and sentence structure than the actual plot. Sometimes the narrative and dialog blend together with the third person omniscient perspective, so it's not the best execution of this style. However the prose is gorgeous. Some of the best landscape and scenery descriptions I've read as well as some fantastic dialog. This is probably the main draw for me and is very immersive.\\n\\nThe magic is awesome in this book. Very high magic series with big impact in the plot and the world. The action is also really well done which was a bit of a surprise to me, but the battles and even smaller scale events have a lot of tense moments.","highlightCount":154,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1587959815l/10482146.jpg","asin":"B00457WT8K","goodreadsUrl":"https://www.goodreads.com/book/show/10482146-the-curse-of-the-mistwraith","kindleUrl":"https://amazon.com/dp/B00457WT8K","matchMethod":"asin"},{"id":"brass-verdict-4a3a7052","readMonth":{"month":"May","year":"2022","day":"23","sort":"2022-05-23"},"title":"The Brass Verdict","author":"Connelly, Michael","series":"The Lincoln Lawyer, #2; Harry Bosch Universe, #19","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1442889420l/2761626.jpg","asin":"0316166294","goodreadsUrl":"https://www.goodreads.com/book/show/2761626-the-brass-verdict","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"odins-wolves-d7cabf82","readMonth":{"month":"May","year":"2022","day":"25","sort":"2022-05-25"},"title":"Odin's Wolves","author":"Kristian, Giles","series":"Raven, #3","review":"Some great fart jokes","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1344371525l/13531842.jpg","asin":"034553509X","goodreadsUrl":"https://www.goodreads.com/book/show/13531842-odin-s-wolves","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"all-seas-of-world-fcf32b9f","readMonth":{"month":"May","year":"2022","day":"29","sort":"2022-05-29"},"title":"All the Seas of the World","author":"Kay, Guy Gavriel","series":"","review":"I would not recommend reading this before reading Lions, Sarantine Mosaic, Children of Earth and Sky, and A Brightness Long Ago. There's a lot of references and building off those books. I read all of these and was still lost at times. I also probably missed a lot doing audio on this one, there's the most POV shifts and nuance in the narrative than all the books of his I've read so far.\\n\\nProbably the most dense and complex GGK book yet for better or worse. The writing is still beautiful, the plot is a bit overly complicated, and the character moments are pretty good. Not my favorite GGK, but still pretty good. Was hoping for something as good as A Brightness Long Ago, but that's my favorite of his so it's a high bar.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1646026102l/58863528.jpg","asin":"0593441044","goodreadsUrl":"https://www.goodreads.com/book/show/58863528-all-the-seas-of-the-world","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"only-good-indians-51e73f8d","readMonth":{"month":"May","year":"2022","day":"30","sort":"2022-05-30"},"title":"The Only Good Indians","author":"Jones, Stephen Graham","series":"The Only Good Indians, #1","review":"Man this is really bad. Not convinced this wasn't ghostwritten by three sixth graders in a trench coat.","highlightCount":0,"myGoodreadsRating":1,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1601545259l/52180399.jpg","asin":"1982136456","goodreadsUrl":"https://www.goodreads.com/book/show/52180399-the-only-good-indians","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"gunslinger-5b9c78d6","readMonth":{"month":"Jun","year":"2022","day":"04","sort":"2022-06-04"},"title":"The Gunslinger","author":"King, Stephen","series":"The Dark Tower, #1","review":"Really good the second time around, caught a lot more of the references and knowing where the story is going makes it make a lot more sense.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554220416l/43615.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/43615.The_Gunslinger","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"count-of-monte-cristo-442c23cf","readMonth":{"month":"Jun","year":"2022","day":"08","sort":"2022-06-08"},"title":"The Count of Monte Cristo","author":"Dumas, Alexandre","series":"","review":"Masterpiece. A classic in every sense of the word. So many layers and also very engaging to read. Just absolutely outstanding and hard to put down.","highlightCount":10,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1724863997l/7126.jpg","asin":"B002RI9KL8","goodreadsUrl":"https://www.goodreads.com/book/show/7126.The_Count_of_Monte_Cristo","kindleUrl":"https://amazon.com/dp/B002RI9KL8","matchMethod":"title-author"},{"id":"veiled-throne-1a14358c","readMonth":{"month":"Jun","year":"2022","day":"10","sort":"2022-06-10"},"title":"The Veiled Throne","author":"Liu, Ken","series":"The Dandelion Dynasty, #3","review":"The first 60% is some of the best in the whole series.\\n\\nThe last 40% was more uneven with one storyline taking a lot of page time. I might have snipped out part of this and made it a novella because it was just very different and a big page count, but it does matter for the narrative, just the level of detail was very different from the rest of the series.\\n\\nThe ending was really good despite this being a split book. Really good set up for the final book.\\n\\nOverall very good for me despite one storyline that wasn't my favorite but I think compared to everything else I've read this book is in the upper tier and I'm looking forward to Speaking Bones.\\n\\nThis has some amazing villains that I love to hate and so many of the characters get great development in this entry. Liu made me feel a lot of things, his thematic writing is some of the best I've read and the way he develops technology and integrates it in the story is mind blowing and unique.\\n\\nKen Liu is a massive talent and this is becoming one of my favorite series.","highlightCount":175,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1603292737l/54919156.jpg","asin":"B075RND5N7","goodreadsUrl":"https://www.goodreads.com/book/show/54919156-the-veiled-throne","kindleUrl":"https://amazon.com/dp/B075RND5N7","matchMethod":"asin"},{"id":"man-at-arms-18afa927","readMonth":{"month":"Jun","year":"2022","day":"11","sort":"2022-06-11"},"title":"A Man at Arms","author":"Pressfield, Steven","series":"","review":"The Road with the Roman Terminator across ancient Israel.\\n\\nPretty different from Pressfield's other works, always feel entertained and learn something at the same time. More of an intimate story with fewer characters and interesting stakes. Great meditations on the intersection of religion and history.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1608832155l/53404244.jpg","asin":"0393540979","goodreadsUrl":"https://www.goodreads.com/book/show/53404244-a-man-at-arms","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"equal-rites-89a3f301","readMonth":{"month":"Jun","year":"2022","day":"12","sort":"2022-06-12"},"title":"Equal Rites","author":"Pratchett, Terry","series":"Discworld, #3; Witches, #1","review":"Even though I've heard that this is one of the weaker Discworld books I really liked it. The plot is one of the weaker aspects but the imagination, wit, and humor of Pratchett is on full display.\\n\\nI listened to the new audiobooks recently made and the production quality is great as well as the narration, where otherwise it's harder to work these in between my more \\"serious\\" reads. Planning to continue with the Witches Discworld books here soon.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1404329159l/6567830.jpg","asin":"B000W9393Y","goodreadsUrl":"https://www.goodreads.com/book/show/6567830-equal-rites","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"drawing-of-three-3cbd0e85","readMonth":{"month":"Jun","year":"2022","day":"12","sort":"2022-06-12"},"title":"The Drawing of the Three","author":"King, Stephen","series":"The Dark Tower, #2","review":"Second time I've read this and enjoyed it a lot more this time. This book is nuts and never read anything like it before or since. Lots of good fish out of water moments and humor. King is the master of character development and these moments are even better on a re-read.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1450644818l/28253762.jpg","asin":"B018ER7IRI","goodreadsUrl":"https://www.goodreads.com/book/show/28253762-the-drawing-of-the-three","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"court-of-broken-knives-96eb1114","readMonth":{"month":"Jun","year":"2022","day":"15","sort":"2022-06-15"},"title":"The Court of Broken Knives","author":"Spark, Anna Smith","series":"Empires of Dust, #1","review":"I liked this overall but there's a few fairly significant issues with the series. The writing style is very good and she mixes the grotesque and the beautiful very well, it's clear that Spark has a deep understanding of what grimdark is.\\n\\nMy big issues are with the instalove in the plot, the character work with the two main characters, and the world building. The secondary characters are all pretty well done but the world never quite makes complete sense and the two main characters I don't have much connection with and it's difficult to say what is actually motivating them.\\n\\nOverall this book is just ok for me and definitely in a tier below Bakker or Ash and Sand (grimdark I consider to be the pinnacle of the genre).","highlightCount":78,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1511998523l/36687417.jpg","asin":"B06XCM66BC","goodreadsUrl":"https://www.goodreads.com/book/show/36687417-the-court-of-broken-knives","kindleUrl":"https://amazon.com/dp/B06XCM66BC","matchMethod":"asin"},{"id":"wyrd-sisters-789d490f","readMonth":{"month":"Jun","year":"2022","day":"19","sort":"2022-06-19"},"title":"Wyrd Sisters","author":"Pratchett, Terry","series":"Discworld, #6; Witches, #2","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1275974472l/34504.jpg","asin":"0061020664","goodreadsUrl":"https://www.goodreads.com/book/show/34504.Wyrd_Sisters","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"waste-lands-7fd2ef49","readMonth":{"month":"Jun","year":"2022","day":"19","sort":"2022-06-19"},"title":"The Waste Lands","author":"King, Stephen","series":"Dark Tower, #3","review":"Probably the most cliffhanger ending I've ever read but the rest is fantastic.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1532334476l/34084.jpg","asin":"0670032565","goodreadsUrl":"https://www.goodreads.com/book/show/34084.The_Waste_Lands","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"charlie-choo-choo-617bc8a3","readMonth":{"month":"Jun","year":"2022","day":"20","sort":"2022-06-20"},"title":"Charlie the Choo-Choo","author":"Evans, Beryl","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1475459287l/32198259.jpg","asin":"1534401237","goodreadsUrl":"https://www.goodreads.com/book/show/32198259-charlie-the-choo-choo","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"ships-of-merior-13bd5c40","readMonth":{"month":"Jun","year":"2022","day":"21","sort":"2022-06-21"},"title":"The Ships of Merior","author":"Wurts, Janny","series":"Wars of Light and Shadow, #2","review":"I'm really disappointed in this one. I really liked the first book and I felt like this was completely bungled in execution.\\n\\nThe sentence to sentence structure is well done but the overarching plot and characters did not move forward enough. Really slow and I had to force myself through parts of this.\\n\\nI'm not feeling that connected to the characters and the main driver for me in this series is the magic and the mysteries going on in the background. Those elements were very minor in this entry. Also there were a few moments that were supposed to have more impact where I just didn't feel anything.\\n\\nI'll give the third book a try but I really did not click with how this story was told.","highlightCount":68,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl ","readMonth":{"month":"Jul","year":"2022","day":"03","sort":"2022-07-03"},"title":"Saga, Volume 4","author":"Vaughan, Brian K.","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1642413536l/23093367.jpg","asin":"1632150778","goodreadsUrl":"https://www.goodreads.com/book/show/23093367-saga-volume-4","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"bear-head-d8c434e1","readMonth":{"month":"Jul","year":"2022","day":"04","sort":"2022-07-04"},"title":"Bear Head","author":"Tchaikovsky, Adrian","series":"Dogs of War, #2","review":"This is one of Tchaikovsky's best. Very different from Dogs of War but builds off and expands on the themes of the previous books. Really awesome blend of great characters and cool ideas which is what made Dogs of War one of my all time favorite sci-fi books.\\n\\nThe political and social commentary isn't subtle here but I liked it even though it's clear what current political atmosphere he is commenting on, but I could see that bothering some people. It's easy to get inspiration from the real world for villains in a fictional book unfortunately for us.\\n\\nTchaikovsky is a massive talent and the extent of his imagination and creativity is mind blowing. Love his work.","highlightCount":70,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1606647678l/56082145.jpg","asin":"B08DJBQ1M8","goodreadsUrl":"https://www.goodreads.com/book/show/56082145-bear-head","kindleUrl":"https://amazon.com/dp/B08DJBQ1M8","matchMethod":"asin"},{"id":"genghis-birth-of-empire-513518ea","readMonth":{"month":"Jul","year":"2022","day":"04","sort":"2022-07-04"},"title":"Genghis: Birth of an Empire","author":"Iggulden, Conn","series":"Conqueror, #1","review":"I liked this and think it's competently written but didn't have much of an emotional connection with the characters or p
