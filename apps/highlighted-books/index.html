 and philosophy","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554095160l/20600391.jpg","asin":"1612624243","goodreadsUrl":"https://www.goodreads.com/book/show/20600391-vinland-saga-omnibus-vol-5","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"god-emperor-of-dune-72b3c886","readMonth":{"month":"Mar","year":"2024","day":"06","sort":"2024-03-06"},"title":"God Emperor of Dune","author":"Herbert, Frank","series":"Dune #4","review":"I attempted this one about 15 years ago and glad I gave it another shot. Really liked the themes and philosophy.\\n\\nThe scale of this one is also surprisingly small and the most common scene is two characters talking to each-other in a room, not a lot of action but liked a lot of the subtlety and nuance between the character relationships even though the character writing is a bit dry as it was in previous books.\\n\\nThe series goes in really cool directions and I absolutely love the world-building done, feels like a very rich, expansive universe with a lot of potential.\\n\\nPlanning on continuing and finally finishing up this series for the first time.","highlightCount":10,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1603035693l/55712106.jpg","asin":"B001F0WXX6","goodreadsUrl":"https://www.goodreads.com/book/show/55712106-god-emperor-of-dune","kindleUrl":"https://amazon.com/dp/B001F0WXX6","matchMethod":"asin"},{"id":"vinland-saga-omnibus-6-5ba4565b","readMonth":{"month":"Mar","year":"2024","day":"08","sort":"2024-03-08"},"title":"Vinland Saga Omnibus, Vol. 6","author":"Yukimura, Makoto","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554095180l/21971622.jpg","asin":"1612628036","goodreadsUrl":"https://www.goodreads.com/book/show/21971622-vinland-saga-omnibus-vol-6","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"illearth-war-f3785d30","readMonth":{"month":"Mar","year":"2024","day":"10","sort":"2024-03-10"},"title":"The Illearth War","author":"Donaldson, Stephen R.","series":"The Chronicles of Thomas Covenant the Unbeliever, #2","review":"DNF 45% Donaldson failed to make me care about the Land or anyone in it in 1.5 books, I'm done","highlightCount":8,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1570452753l/52572965.jpg","asin":"B007WKELXS","goodreadsUrl":"https://www.goodreads.com/book/show/52572965-the-illearth-war","kindleUrl":"https://amazon.com/dp/B007WKELXS","matchMethod":"title-author"},{"id":"vinland-saga-omnibus-7-d56c2999","readMonth":{"month":"Mar","year":"2024","day":"11","sort":"2024-03-11"},"title":"Vinland Saga Omnibus, Vol. 7","author":"Yukimura, Makoto","series":"","review":"First half was amazingly good, not sure how I feel about the second but interested to see where the story goes from here","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554095190l/25649494.jpg","asin":"1632360098","goodreadsUrl":"https://www.goodreads.com/book/show/25649494-vinland-saga-omnibus-vol-7","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"fall-630a7856","readMonth":{"month":"Mar","year":"2024","day":"12","sort":"2024-03-12"},"title":"The Fall","author":"Cahill, Ryan","series":"The Bound and the Broken, #0.5","review":"Just what I needed: to enjoy another big unfinished fantasy series! Feels like a climax to a book you haven't read.\\n\\nThe action was quite fun and really liked the high magic aspects and the dragon fights were very cool. The writing is far from flowery but felt very clear on what was happening and has some nice environment descriptions that were efficient.\\n\\nThe world seems cool and interested to learn more about some of these factions and the people in them.\\n\\nDefinitely interested to pick up the first book and this was a great idea by Cahill as a sampler before going full bore into a big first book and series.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1681891836l/136017402.jpg","asin":"B0DVDSQ2DN","goodreadsUrl":"https://www.goodreads.com/book/show/136017402-the-fall","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"temple-of-serpent-daf3d354","readMonth":{"month":"Mar","year":"2024","day":"16","sort":"2024-03-16"},"title":"Temple of the Serpent","author":"Werner, C.L.","series":"Warhammer: Thanquol & Boneripper, #2","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348913003l/7171918.jpg","asin":"1844168735","goodreadsUrl":"https://www.goodreads.com/book/show/7171918-temple-of-the-serpent","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"of-blood-and-fire-b1081a51","readMonth":{"month":"Mar","year":"2024","day":"18","sort":"2024-03-18"},"title":"Of Blood and Fire","author":"Cahill, Ryan","series":"The Bound and the Broken, #1","review":"Familiar and comfortable. And a bit cozy at times which was nice. Had some good action and planted the seeds for future character development. The magic usage is also pretty cool and not overly explained. I do wish some of the races and creatures had a bit more meat to them.\\n\\nTook a bit to get going and compared with The Fall I definitely enjoyed this less and it stumbled a bit in places but not majorly, could definitely just tell this was Cahill's first book.\\n\\nDefinitely showed some promise for future books. The world building is fairly vanilla which can be something that really elevates book 1s for me but fairly standard fantasy fare.\\n\\nI do think this series will hinge on the characters and how it explores both sides of this conflict, some of the antagonist POVs are particularly good even though we don't get a lot of them.\\n\\nThis was easy to read and I did find myself really wanting to pick it back up again and again which is a good sign. I've already started book 2 as well which is a good endorsement, I want to see where this goes and if it hits the level of The Fall in the main novels.","highlightCount":22,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1611043983l/56750401.jpg","asin":"B08ZDCN3GQ","goodreadsUrl":"https://www.goodreads.com/book/show/56750401-of-blood-and-fire","kindleUrl":"https://amazon.com/dp/B08ZDCN3GQ","matchMethod":"asin"},{"id":"vinland-saga-omnibus-8-ab0e40bd","readMonth":{"month":"Mar","year":"2024","day":"25","sort":"2024-03-25"},"title":"Vinland Saga Omnibus, Vol. 8","author":"Yukimura, Makoto","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554095202l/30027206.jpg","asin":"1632363720","goodreadsUrl":"https://www.goodreads.com/book/show/30027206-vinland-saga-omnibus-vol-8","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"of-darkness-and-light-d5a1212b","readMonth":{"month":"Mar","year":"2024","day":"29","sort":"2024-03-29"},"title":"Of Darkness and Light","author":"Cahill, Ryan","series":"The Bound and the Broken, #2","review":"Huge step up from book one, exponentially better. And I liked book 1! Had a great time with this one and loved the epic scale, the characters, and action.\\n\\nSets up some really cool stuff for the next book and has a lot of great moments.\\n\\nA couple of stumbles along the way mainly with some dialogue and some of the prose being a little awkward still but not as frequent as book 1. Also a couple of the storylines were much weaker than the rest, but all of them definitely have moments where they shine so not suffering through it by any stretch.\\n\\nDefinitely a fun series that takes what makes fantasy great, doesn't do anything too crazy with it but ends up being a satisfying and engaging read. I think Cahill will get even better as he gets more experience.","highlightCount":41,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1623939848l/58360991.jpg","asin":"B096L8T4JB","goodreadsUrl":"https://www.goodreads.com/book/show/58360991-of-darkness-and-light","kindleUrl":"https://amazon.com/dp/B096L8T4JB","matchMethod":"asin"},{"id":"vinland-saga-omnibus-9-ac6b2207","readMonth":{"month":"Mar","year":"2024","day":"30","sort":"2024-03-30"},"title":"Vinland Saga Omnibus, Vol. 9","author":"Yukimura, Makoto","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554095221l/32592597.jpg","asin":"163236445X","goodreadsUrl":"https://www.goodreads.com/book/show/32592597-vinland-saga-omnibus-vol-9","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"exile-d39fe8c0","readMonth":{"month":"Apr","year":"2024","day":"02","sort":"2024-04-02"},"title":"The Exile","author":"Cahill, Ryan","series":"The Bound and the Broken, #2.5","review":"","highlightCount":19,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1653098099l/61137621.jpg","asin":"B0B1W75TV7","goodreadsUrl":"https://www.goodreads.com/book/show/61137621-the-exile","kindleUrl":"https://amazon.com/dp/B0B1W75TV7","matchMethod":"asin"},{"id":"heretics-of-dune-e5e2e4e2","readMonth":{"month":"Apr","year":"2024","day":"02","sort":"2024-04-02"},"title":"Heretics of Dune","author":"Herbert, Frank","series":"Dune, #5","review":"","highlightCount":5,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1603035876l/55712125.jpg","asin":"B001L10ZIO","goodreadsUrl":"https://www.goodreads.com/book/show/55712125-heretics-of-dune","kindleUrl":"https://amazon.com/dp/B001L10ZIO","matchMethod":"asin"},{"id":"vinland-saga-omnibus-10-fe3e8905","readMonth":{"month":"Apr","year":"2024","day":"02","sort":"2024-04-02"},"title":"Vinland Saga Omnibus, Vol. 10","author":"Yukimura, Makoto","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554095231l/38608163.jpg","asin":"1632366304","goodreadsUrl":"https://www.goodreads.com/book/show/38608163-vinland-saga-omnibus-vol-10","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"trunk-music-25d191f7","readMonth":{"month":"Apr","year":"2024","day":"22","sort":"2024-04-22"},"title":"Trunk Music","author":"Connelly, Michael","series":"Harry Bosch, #5; Harry Bosch Universe, #6","review":"definitely a good one, probably liked a little bit less than the last few Connelly books I've read but still really good\\n\\nThe plot kept me guessing and had a satisfying conclusion. Didn't really resonate on themes or attempt anything that deep here but a fun mystery and adventure for our hero Detective Bosch.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1386926044l/58962.jpg","asin":"0312941919","goodreadsUrl":"https://www.goodreads.com/book/show/58962.Trunk_Music","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"revelation-space-a6a55e80","readMonth":{"month":"Apr","year":"2024","day":"28","sort":"2024-04-28"},"title":"Revelation Space","author":"Reynolds, Alastair","series":"","review":"This was awesome. Felt satisfied with the ending and there's a lot more of the series left which I'm excited to read. Really great balance of mind blowing ideas, cool plot, and interesting world building. Reynolds is probably my favorite space opera author and this might be my favorite book of his I've read so far.\\n\\nSort of feel similarly towards this as I do Three Body Problem where I don't think it's for everyone and some people will bounce off of it hard but for me personally it's right up my alley. It's also very technical at times and you can tell it was written by an astrophysicist, but I loved this aspect and feels very grounded in real science but expanded in a huge way to explore big ideas.\\n\\nThe characters and exposition dumps are probably the weak parts but some of this can sort of be handwaved away by the amount of post humanism the characters have undergone.\\n\\nPretty hooked by this and eager to read Chasm City SOOOON","highlightCount":50,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1610464023l/49015373.jpg","asin":"B0819W19WD","goodreadsUrl":"https://www.goodreads.com/book/show/49015373-revelation-space","kindleUrl":"https://amazon.com/dp/B0819W19WD","matchMethod":"title-author"},{"id":"god-of-vengeance-7242ff29","readMonth":{"month":"May","year":"2024","day":"07","sort":"2024-05-07"},"title":"God of Vengeance","author":"Kristian, Giles","series":"The Rise of Sigurd, #1","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387147657l/18332123.jpg","asin":"0593066189","goodreadsUrl":"https://www.goodreads.com/book/show/18332123-god-of-vengeance","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"dead-mans-walk-54da901f","readMonth":{"month":"May","year":"2024","day":"17","sort":"2024-05-17"},"title":"Dead Man's Walk","author":"McMurtry, Larry","series":"","review":"","highlightCount":14,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1586270539l/53024817.jpg","asin":"B003NE6HHA","goodreadsUrl":"https://www.goodreads.com/book/show/53024817-dead-man-s-walk","kindleUrl":"https://amazon.com/dp/B003NE6HHA","matchMethod":"asin"},{"id":"chasm-city-f6d108b3","readMonth":{"month":"May","year":"2024","day":"19","sort":"2024-05-19"},"title":"Chasm City","author":"Reynolds, Alastair","series":"The Inhibitor Series 2","review":"Pretty invested in the series now that this one also blew me away and is also quite different from Revelation Space. So he's now 2/2 for the Revelation Space series and I've really enjoyed the standalones of his that I've read. Shows the range of Reynolds well.\\n\\nThe way things clicked together by the end was really impressive and well planned out. You do sort of have to trust the author in the beginning and there can be some confusing elements to the story but by the end it's very clear why it is told this way.\\n\\nOnly some minor flaws here with some of the plotting and side characters, but was engaged with this from beginning to end.\\n\\nThe scope ended up being a lot bigger than I thought and still tackled some expansive sci-fi ideas well fleshing out the already excellent world building from the first book.\\n\\nThe environments, cityscapes, and straight up weird stuff in this one was really good and unique. Planning to read the whole series as well as the optional side novellas / short stories, haven't been this hot on a sci-fi series in a while, definitely has what I'm looking for in the genre as well as incorporating dark and fantastic and dark elements from horror.","highlightCount":69,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1624120051l/50191771.jpg","asin":"B0819TXR83","goodreadsUrl":"https://www.goodreads.com/book/show/50191771-chasm-city","kindleUrl":"https://amazon.com/dp/B0819TXR83","matchMethod":"asin"},{"id":"vinland-saga-omnibus-11-a96f1e4a","readMonth":{"month":"May","year":"2024","day":"21","sort":"2024-05-21"},"title":"Vinland Saga Omnibus, Vol. 11","author":"Yukimura, Makoto","series":"","review":"This series sort of lost me, don't know if I'll finish it","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1567547348l/44779737.jpg","asin":"163236803X","goodreadsUrl":"https://www.goodreads.com/book/show/44779737-vinland-saga-omnibus-vol-11","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"diamond-dogs-turquoise-days-60f53e52","readMonth":{"month":"May","year":"2024","day":"22","sort":"2024-05-22"},"title":"Diamond Dogs, Turquoise Days","author":"Reynolds, Alastair","series":"","review":"3.5/5 so I did really like this but sort of rating it against the enjoyment and satisfaction I had with Revelation Space & Chasm City it's definitely below those both by a fair bit. Did get some interesting stories with quite different flavors from anything I've read from Reynolds so far and some world building that should be helpful to know when continuing the main series.\\n\\nI do think the mysteries and reveals aren't as good as the main books, maybe due to page count, maybe not. It does overall provide me with more questions than answers about the universe of this world.\\n\\nWould probably say that these are skippable but maybe my opinion will change after reading more books in the series but glad I read them and they're roughly of equal quality to each-other with maybe a slight preference for the plot of Diamond Dogs.","highlightCount":14,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1596142181l/49093654.jpg","asin":"B0819V8434","goodreadsUrl":"https://www.goodreads.com/book/show/49093654-diamond-dogs-turquoise-days","kindleUrl":"https://amazon.com/dp/B0819V8434","matchMethod":"asin"},{"id":"heirs-of-blade-f2042df2","readMonth":{"month":"May","year":"2024","day":"26","sort":"2024-05-26"},"title":"Heirs of the Blade","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #7","review":"This was just ok. My expectations were sufficiently in check too since a lot of people I've been reading this series with said this was probably the worst book.\\n\\nDefinitely a bit of a bummer after loving the last two books but there's some good stuff here. Just the main focus of the book follows a character that I don't really enjoy and her motivations are pretty perplexing and not particularly well done.\\n\\nI do like the tendency of these books of going darker and more complex plot lines, and I also think the prose keeps getting better, some nice passages in the book.\\n\\nThis is probably the most middle book in the series but some of the follow on stuff from Scarab Path and the setup for the last trilogy is some of the best stuff in this one so I feel optimistic about the final trilogy of books.","highlightCount":14,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1635608188l/57136692.jpg","asin":"B005HPMAV0","goodreadsUrl":"https://www.goodreads.com/book/show/57136692-heirs-of-the-blade","kindleUrl":"https://amazon.com/dp/B005HPMAV0","matchMethod":"title-author"},{"id":"air-war-dd0e7417","readMonth":{"month":"Jun","year":"2024","day":"14","sort":"2024-06-14"},"title":"The Air War","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt #8","review":"3.75/5","highlightCount":9,"myGoodreadsRating":4,"myReviewRating":3.75,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1652541569l/58320915.jpg","asin":"B008I33YW2","goodreadsUrl":"https://www.goodreads.com/book/show/58320915-the-air-war","kindleUrl":"https://amazon.com/dp/B008I33YW2","matchMethod":"title-author"},{"id":"you-like-it-darker-1759c9f0","readMonth":{"month":"Jun","year":"2024","day":"16","sort":"2024-06-16"},"title":"You Like It Darker","author":"King, Stephen","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1699311050l/201242757.jpg","asin":"1668037718","goodreadsUrl":"https://www.goodreads.com/book/show/201242757-you-like-it-darker","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"balkans-captivating-guide-to-history-of-balkan-peninsula-starting-from-classical-efa74af1","readMonth":{"month":"Jun","year":"2024","day":"23","sort":"2024-06-23"},"title":"The Balkans: A Captivating Guide to the History of the Balkan Peninsula, Starting from Classical Antiquity through the Middle Ages to the Modern Period","author":"History, Captivating","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1650533628l/60855369.jpg","asin":"B09Y97VM12","goodreadsUrl":"https://www.goodreads.com/book/show/60855369-the-balkans","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"redemption-ark-850a0cca","readMonth":{"month":"Jun","year":"2024","day":"24","sort":"2024-06-24"},"title":"Redemption Ark","author":"Reynolds, Alastair","series":"","review":"This definitely has some flaws but the amount of cool stuff in it makes it a great read and I'm happy I spent most of my reading time this month on it.\\n\\nI do prefer the intricate mystery puzzle box of Revelation Space and Chasm City to the style of this book where it's more plot centric and getting from A to B, however Reynolds does flesh out one of the factions in a really interesting and well done way as well as develop the characters a bit better than Revelation Space.\\n\\nI do sort of feel like the overall plan for the series isn't as planned out as individual books and some parts were seemingly glossed over and skipped while characters later fill us in on what happened and I don't like that way of storytelling.\\n\\nIf I could have Reynolds re-write this book before releasing I think it needed a lot more pages to fully flesh everything out in a way I'd find completely satisfying. I'm not sure if there was publisher pressure to keep it shorter but it's something I noticed.\\n\\nCompared to someone like Peter F Hamilton who has these massive books where some things probably should have been cut out, this feels like the opposite problem. I can sort of fill in the gaps mentally but I think it'd make the book a lot more satisfying in the end.\\n\\nHowever we do get big cool sci-fi ideas and there's a lot of nuance in the factions that feels very realistic to me and even for alien races or advanced humans, there's a lot of infighting and differences of opinion that can lead to violence.\\n\\nThe theme of redemption is also explored but I do wish it was a bit more subtle as some of the characters do talk about it explicitly a few times and that makes it not land as well for me. Also some of the character actions don't really feel consistent with who they are for me which can make it feel less believable, sometimes it feels like it's just to serve the plot.\\n\\nInterested to see where the series goes but taking a little breather from the series before continuing. It doesn't feel as planned out as I thought after finishing the other books but I enjoy my time in this universe.","highlightCount":92,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1675445398l/48893829.jpg","asin":"B0819V9WPD","goodreadsUrl":"https://www.goodreads.com/book/show/48893829-redemption-ark","kindleUrl":"https://amazon.com/dp/B0819V9WPD","matchMethod":"asin"},{"id":"berserk-36-8eca1fec","readMonth":{"month":"Jun","year":"2024","day":"29","sort":"2024-06-29"},"title":"Berserk Volume 36","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500647683l/35717430.jpg","asin":"B0743J2KG6","goodreadsUrl":"https://www.goodreads.com/book/show/35717430-berserk-volume-36","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-37-49cabfc9","readMonth":{"month":"Jun","year":"2024","day":"29","sort":"2024-06-29"},"title":"Berserk Volume 37","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500647680l/35717429.jpg","asin":"B0743HXRZS","goodreadsUrl":"https://www.goodreads.com/book/show/35717429-berserk-volume-37","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"navigators-children-5ccabee9","readMonth":{"month":"Jul","year":"2024","day":"06","sort":"2024-07-06"},"title":"The Navigator's Children","author":"Williams, Tad","series":"","review":"4.5/5\\n\\nNo spoilers or any mention of any plot points in any of the books, only high level thoughts on this book and the series as a whole are in this review.\\n\\nThank you to DAW books and Netgalley for this early copy. I received a copy of this book in exchange for an honest review.\\n\\nThe main plot ended on a very satisfying and exciting climax, probably one of the biggest and best stretches of action in any Tad Williams book that I've read. The complexity of the lore that has always been present but is just now being revealed is incredible. Like an intricate puzzle box hiding deep secrets in plain sight, it'll be interesting to re-read the series in the future now that we know some of the big answers to the questions that have been asked years ago.\\n\\nThe mysteries in this series are great. I do think a couple of the mysteries didn't have as satisfying of a resolution and were a little simple with not much payoff, but one of the big main ones, wow, I've been thinking about had so many big moments of payoff in this book that I could barely put the book down and stop reading.\\n\\nThe prose is incredible and some of the best in the fantasy genre, period. Tad writes in such a visual, evocative way that blends the surreal and fantastical in ways that also hits a lot of emotion, just superb. Honestly I expect this from him at this point after the whole series has had gorgeous writing and it doesn't disappoint here.\\n\\nSome of the side stories I do wish had more complex resolutions or were folded into the main plot better and had some pretty straightforward resolutions that were a little disappointing considering how much the build up was throughout the series. I'm not sure why this happened but I feel like A Song of Ice and Fire did this considerably better but some of the plots were wrapped up a bit too neatly where I do like more messy resolutions with a lot of things going wrong and in unexpected directions.\\n\\nI did feel satisfied with a lot of the character arcs, but also some of them I wish had a little more complexity in the resolutions and in some ways I think another trilogy will be needed to make it completely satisfying which is a bit unfortunate.\\n\\nI loved a lot of the moral and political complexity here and the sequel series overall does a lot better in this aspect than Memory, Sorrow, Thorn. We get a lot of great perspectives from non human characters and get to grapple with their inhuman value systems and their differing political structures.\\n\\nOverall Tad is one of the best authors currently writing fantasy and the bar for this book and my expectations were sky high and this mostly delivers in a satisfying way.\\n\\nI love the world of Osten Ard and will happily return when Tad writes more books in the world, and I'm also expecting this will be the case. There are a few novellas already in the works but I also expect another trilogy will be possible in the future.\\n\\nHighly recommend the series and was so happy to read this early and be able to take my time immersing myself in this world.\\n\\nMy standards were insanely high and I'll be thinking about this series and world for a long time to come. I've re-read the original series right before continuing with Last King of Osten Ard and I can see myself easily re-reading everything again in the future.","highlightCount":141,"myGoodreadsRating":5,"myReviewRating":4.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1684819020l/60097938.jpg","asin":"0756418550","goodreadsUrl":"https://www.goodreads.com/book/show/60097938-the-navigator-s-children","kindleUrl":"","matchMethod":"title-author"},{"id":"berserk-38-e25bf0f1","readMonth":{"month":"Jul","year":"2024","day":"06","sort":"2024-07-06"},"title":"Berserk, Vol. 38","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500351046l/35697635.jpg","asin":"B073ZJR894","goodreadsUrl":"https://www.goodreads.com/book/show/35697635-berserk-vol-38","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-39-6ac95ae5","readMonth":{"month":"Jul","year":"2024","day":"07","sort":"2024-07-07"},"title":"Berserk, Vol. 39","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1521424429l/39318663.jpg","asin":"B07BJLG3LS","goodreadsUrl":"https://www.goodreads.com/book/show/39318663-berserk-vol-39","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-40-6203b253","readMonth":{"month":"Jul","year":"2024","day":"07","sort":"2024-07-07"},"title":"Berserk, Vol. 40","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1554616261l/44802857.jpg","asin":"B07Q3NHQQP","goodreadsUrl":"https://www.goodreads.com/book/show/44802857-berserk-vol-40","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-41-3b7ac4d5","readMonth":{"month":"Jul","year":"2024","day":"07","sort":"2024-07-07"},"title":"Berserk Volume 41","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1657826780l/61441592.jpg","asin":"B0B3D1YR9P","goodreadsUrl":"https://www.goodreads.com/book/show/61441592-berserk-volume-41","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"raft-8a4cabcf","readMonth":{"month":"Jul","year":"2024","day":"13","sort":"2024-07-13"},"title":"Raft","author":"Baxter, Stephen","series":"Xeelee Sequence, #1","review":"Really good old man sci-fi with cool ideas and some unexpected darkness in a few unique settings. Yes the characters are a little bit cardboard but I think they're serviceable. If this is the worst one in the series I'm excited to continue.\\n\\nSomeone recommended this to people who loved the Three Body Problem series and for the most part I do agree. The science does seem to be reasonably realistic to me but also is there to make a good story and explore humanity in interesting ways.\\n\\nThe sociological aspects were quite good and it avoids the pitfalls in some older sci-fi where humans are mostly smart and rational where here we do see panicked groups and cruelty between different groups of society that is recognizably human.\\n\\nThere might be a couple of gaps in the science but they're easy to overlook in order to get cool ideas going.\\n\\nThe pacing was also pretty good and the book was pretty consistent. I do think it peaked a bit in the middle with a couple of awesome chapters but there's also a number of cool moments throughout the book. This really put my imagination to the test and had some interesting ideas to think about.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1518530650l/38511347.jpg","asin":"1473224055","goodreadsUrl":"https://www.goodreads.com/book/show/38511347-raft","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"timelike-infinity-e0201767","readMonth":{"month":"Jul","year":"2024","day":"22","sort":"2024-07-22"},"title":"Timelike Infinity","author":"Baxter, Stephen","series":"Xeelee Sequence, #2","review":"This book is wild. So many \\"holy shit\\" moments from the crazy ideas. A big upgrade over Raft. The characters are also a lot better even though they're not the focus. Small book that packs a big punch and wastes no time getting to the good stuff. The writing also seems a bit better and I was highlighting quite a few passages.\\n\\nExcited to continue the series.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1346403688l/66795.jpg","asin":"000647618X","goodreadsUrl":"https://www.goodreads.com/book/show/66795.Timelike_Infinity","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"dungeon-crawler-carl-f6148813","readMonth":{"month":"Jul","year":"2024","day":"25","sort":"2024-07-25"},"title":"Dungeon Crawler Carl","author":"Dinniman, Matt","series":"Dungeon Crawler Carl, #1","review":"3.5/5 the audiobook performance is indeed amazing and I liked the humor, definitely will check out book 2! It definitely got better as it went, the rpg stuff in the beginning was a bit distracting and detracted from the story a bit.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1734203042l/56791389.jpg","asin":"B0DT38PQYW","goodreadsUrl":"https://www.goodreads.com/book/show/56791389-dungeon-crawler-carl","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"carls-doomsday-scenario-87b42ae5","readMonth":{"month":"Aug","year":"2024","day":"02","sort":"2024-08-02"},"title":"Carl's Doomsday Scenario","author":"Dinniman, Matt","series":"Dungeon Crawler Carl, #2","review":"The plot really went off the rails on this one and the momentum of the second half of book 1 felt lost here. Lots of side quests I don't really care about. Don't think I'll be continuing.","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1608612407l/56377548.jpg","asin":"B08PBCD9Y7","goodreadsUrl":"https://www.goodreads.com/book/show/56377548-carl-s-doomsday-scenario","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"needful-things-4cac89b0","readMonth":{"month":"Aug","year":"2024","day":"08","sort":"2024-08-08"},"title":"Needful Things","author":"King, Stephen","series":"","review":"Man, this rocked. Very underread King novel that plays to his strengths in big ways. I do have a couple of nitpicks and ideally would have been even longer and even more fleshed out but the small town dynamics are hugely impressive.\\n\\nKing just gets you to care about characters so fast and the back stories and histories of these ordinary people are so well done and interesting. The way their lives are interweaved makes for a feeling of epic scale in a small place.\\n\\nAlso some absolutely horrifying and disturbing moments, even for a King book and a lot of things that are implied that aren't shown that will stick with me and have me thinking about it. There's a lot to latch onto here in this small but busy town with a lot of angles to approach the story and I imagine different storylines will stick with people differently, even some of the smaller plot lines have a lot of power in a small amount of page time.\\n\\nThe themes are well crafted and timeless, this one aged really well, highly recommend a read through this and it makes me excited to read Under the Dome in a strange way to get those town dynamics again in another massive tome of a novel.","highlightCount":45,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1327868528l/411204.jpg","asin":"B018ER7JZ4","goodreadsUrl":"https://www.goodreads.com/book/show/411204.Needful_Things","kindleUrl":"https://amazon.com/dp/B018ER7JZ4","matchMethod":"title-candidate-author"},{"id":"absolution-gap-0373a92b","readMonth":{"month":"Aug","year":"2024","day":"12","sort":"2024-08-12"},"title":"Absolution Gap","author":"Reynolds, Alastair","series":"Revelation Space #3","review":"This one has really bad reviews online but I actually liked it quite a bit. Definitely a bit of a slower burn than others in the series and genre but the reveals and climax are exciting and interesting. I think the negative reception could be because this sort of is unconventional approach to a finale in the space opera genre and the story isn't what I would've expected after finishing the first book.\\n\\nThe character development and arcs are all quite good overall and we get satisfying conclusions to a lot of character's stories that are big differences from where they started.\\n\\nThe atmosphere of the settings is also well done and unique. We get some 40k reminiscent settings, eldritch horror, and even tropical and tundra type settings that feel very unique and well described. I could picture the settings and cool events happening pretty easily due to Reynolds descriptions.\\n\\nExcited to read the rest of the series as well as the Prefect books soon.","highlightCount":42,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1676862195l/50521624.jpg","asin":"B0819WBT95","goodreadsUrl":"https://www.goodreads.com/book/show/50521624-absolution-gap","kindleUrl":"https://amazon.com/dp/B0819WBT95","matchMethod":"title-author"},{"id":"angels-flight-536f0787","readMonth":{"month":"Aug","year":"2024","day":"12","sort":"2024-08-12"},"title":"Angels Flight","author":"Connelly, Michael","series":"Harry Bosch, #6; Harry Bosch Universe, #8","review":"This went to crazy and unexpected places from a fairly standard beginning, really enjoyed it","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1526264675l/40117052.jpg","asin":"B001GXF2YY","goodreadsUrl":"https://www.goodreads.com/book/show/40117052-angels-flight","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pilgrim-medieval-horror-fd3249ef","readMonth":{"month":"Aug","year":"2024","day":"15","sort":"2024-08-15"},"title":"Pilgrim: A Medieval Horror","author":"Lüthi, Mitchell","series":"","review":"The parts were better than the sum. Kind of tough to review but it never really grabbed me even though I liked the writing, the premise, and the backstory of the characters. You could shuffle the plot points around and nothing would change significantly which makes the horror not have impact.\\n\\nFelt like a bunch of disconnected short stories. I'd try Luthi again, maybe his short fiction. The premise and setting sounded awesome but the execution didn't keep me engaged unfortunately.","highlightCount":40,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1695469875l/199114861.jpg","asin":"B0CJNX7HXY","goodreadsUrl":"https://www.goodreads.com/book/show/199114861-pilgrim","kindleUrl":"https://amazon.com/dp/B0CJNX7HXY","matchMethod":"asin"},{"id":"galactic-north-3fbfa683","readMonth":{"month":"Aug","year":"2024","day":"20","sort":"2024-08-20"},"title":"Galactic North","author":"Reynolds, Alastair","series":"","review":"Glad I read this but the variability on the enjoyment of the stories was a bit high, overall liked more than the Diamond Dogs/Turquoise Days novellas, think the eponymous Galactic North story was a bit overhyped from what I had heard online. Overall still a big fan of Reynolds in general but yeah this isn't going to capstone the whole series in a way that it's a must read.","highlightCount":7,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1602303181l/48981331.jpg","asin":"B0819VGW5P","goodreadsUrl":"https://www.goodreads.com/book/show/48981331-galactic-north","kindleUrl":"https://amazon.com/dp/B0819VGW5P","matchMethod":"asin"},{"id":"of-war-and-ruin-f113fd9b","readMonth":{"month":"Aug","year":"2024","day":"29","sort":"2024-08-29"},"title":"Of War and Ruin","author":"Cahill, Ryan","series":"The Bound and the Broken, #3","review":"A little mixed on this even though overall I really liked it. Felt a bit uneven for me especially depending on the POV and what they're doing at the moment. The highs are high and the lows are low, the boring parts are a bit of a slog as well and a bit bloated, could have used some trimming down. Don't think this book needed to be 1500 pages for any reason. One of the storylines should have been completely cut as should the repeated training sections and there's a lot of repeated phrases sprinkled throughout the book.\\n\\nThat being said and how negative it sounds I did really like a lot of the big epic moments and some of the chapters and POVs were quite good and exciting. Overall this series is entertaining, I don't think it's that deep but it's a fun time and some of the world building and plot is a little under developed. I am looking forward to book 4, a lot was set up here that has a lot of potential, just wish we got even more here for how much of a squirrel squisher this book is.","highlightCount":58,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1640295790l/59919045.jpg","asin":"B09NVZ45TW","goodreadsUrl":"https://www.goodreads.com/book/show/59919045-of-war-and-ruin","kindleUrl":"https://amazon.com/dp/B09NVZ45TW","matchMethod":"asin"},{"id":"arthur-86f42e09","readMonth":{"month":"Aug","year":"2024","day":"31","sort":"2024-08-31"},"title":"Arthur","author":"Kristian, Giles","series":"The Arthurian Tales, #3","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697457495l/198678954.jpg","asin":"B0CHHZ2QTZ","goodreadsUrl":"https://www.goodreads.com/book/show/198678954-arthur","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"flux-40460ec6","readMonth":{"month":"Sep","year":"2024","day":"03","sort":"2024-09-03"},"title":"Flux","author":"Baxter, Stephen","series":"Xeelee Sequence, #3","review":"One of the craziest settings for a book that I've read. Definitely a bit challenging in the beginning trying to figure out what was going on and how the world worked and felt like if I had a firmer grasp on the science would maybe make a bit more sense, however as the book went on things made more sense in context and the story was actually fairly straightforward.\\n\\nThis ended up being a page turner and just when I was worried it would start getting stale something new would pop up and grab my interest. I think I liked this more in the context of the previous novels with the background that I know, in isolation maybe this is my least favorite Xeelee book so far. However, the imagination of this series remains to be pretty incredible and really stretches my brain and I feel engaged with the book and trying to make sense of what's going on, the science behind it, and has some really unique locations and vivid scenes that will stick with me.\\n\\nVery interested in reading Ring as these 3 books have alluded to the eponymous Ring and I want to see what it has in store for us.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1408926889l/100681.jpg","asin":"0006476201","goodreadsUrl":"https://www.goodreads.com/book/show/100681.Flux","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"xenos-6aaee05d","readMonth":{"month":"Sep","year":"2024","day":"06","sort":"2024-09-06"},"title":"Xenos","author":"Abnett, Dan","series":"E dleUrl":"","matchMethod":"goodreads-only"},{"id":"innocent-omnibus-2-b1efcd52","readMonth":{"month":"Oct","year":"2024","day":"15","sort":"2024-10-15"},"title":"Innocent Omnibus Volume 2","author":"Sakamoto, Shin'ichi","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1717052856l/205126711.jpg","asin":"B0CRYBMCBL","goodreadsUrl":"https://www.goodreads.com/book/show/205126711-innocent-omnibus-volume-2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"parable-of-sower-38b93436","readMonth":{"month":"Oct","year":"2024","day":"16","sort":"2024-10-16"},"title":"Parable of the Sower","author":"Butler, Octavia E.","series":"","review":"Loved this overall. Dystopian book that takes place in 2024-2027 so it was kind of cool to read it in the year it takes place and it's eerily prescient. Butler has an amazing authorial voice that is somehow simultaneously bleak, heavy, angry, but has glimmers of hope. I got Walking Dead and The Stand vibes from this.\\n\\nThe world building details kind of don't make 100% sense but they're not really the focus and it was easy for me to suspend my disbelief a bit but yeah, not completely bought into how the world ended up in this state of disrepair and didn't totally collapse, but that's mainly a background to a more zoomed in and personal narrative.","highlightCount":38,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1680154001l/123811792.jpg","asin":"B0BZHT26LV","goodreadsUrl":"https://www.goodreads.com/book/show/123811792-parable-of-the-sower","kindleUrl":"https://amazon.com/dp/B0BZHT26LV","matchMethod":"asin"},{"id":"service-model-f001c45c","readMonth":{"month":"Oct","year":"2024","day":"28","sort":"2024-10-28"},"title":"Service Model","author":"Tchaikovsky, Adrian","series":"","review":"This was entertaining but it was a bit aimless and overlong. Wish this was trimmed down a bit and had more of a thematic drive to it or went even more in the slapstick crazy direction, it sort of stayed in a middle ground here that didn't satisfy me completely in either direction. I liked this more than Murderbot though. Audiobook narration was good and Tchaikovsky overall is still one of my favorite authors.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1698554344l/195790861.jpg","asin":"1250290287","goodreadsUrl":"https://www.goodreads.com/book/show/195790861-service-model","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"return-of-crimson-guard-35737cee","readMonth":{"month":"Nov","year":"2024","day":"06","sort":"2024-11-06"},"title":"Return of the Crimson Guard","author":"Esslemont, Ian C.","series":"Novels of the Malazan Empire #2","review":"This book is a hot mess but I had fun with it for the most part. Showcases a lot of the best and worst of Malazan, definitely confusing as hell and way too many story lines with fast POV changes and too many hidden identities and written in a way where it actively hides information from you. This book is like drinking from a fire hose and can be a bit much at times.\\n\\nHowever there's a lot of cool stuff in it and it being complementary to the main series was really nice, it fleshes out some world building only touched on in the main series and continues some plot points with much needed resolutions.","highlightCount":108,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328313090l/8177029.jpg","asin":"B003FQM34M","goodreadsUrl":"https://www.goodreads.com/book/show/8177029-return-of-the-crimson-guard","kindleUrl":"https://amazon.com/dp/B003FQM34M","matchMethod":"asin"},{"id":"batman-killing-joke-450843f2","readMonth":{"month":"Nov","year":"2024","day":"13","sort":"2024-11-13"},"title":"Batman: The Killing Joke","author":"Moore, Alan","series":"","review":"Very good but a little too short imo. Wish it built up a bit more but what we got was great","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1614699888l/18675939.jpg","asin":"B009POHHRG","goodreadsUrl":"https://www.goodreads.com/book/show/18675939-batman","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"neuromancer-dbf8d3e9","readMonth":{"month":"Nov","year":"2024","day":"14","sort":"2024-11-14"},"title":"Neuromancer","author":"Gibson, William","series":"Sprawl, #1","review":"2.75/5 The atmosphere was good and I liked some parts but everything else was sort of poorly told and unclear in a way that hampered my enjoyment. Sort of felt similar to Phillip K Dick in some ways but I felt like the reveals were not that clear and it got very mixed up in what was happening in the real world or the matrix and what was happening in a dream so I wasn't that invested in the outcome.","highlightCount":16,"myGoodreadsRating":2,"myReviewRating":2.75,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1752514552l/6088007.jpg","asin":"B000O76ON6","goodreadsUrl":"https://www.goodreads.com/book/show/6088007-neuromancer","kindleUrl":"https://amazon.com/dp/B000O76ON6","matchMethod":"asin"},{"id":"vacuum-diagrams-5d38703f","readMonth":{"month":"Nov","year":"2024","day":"17","sort":"2024-11-17"},"title":"Vacuum Diagrams","author":"Baxter, Stephen","series":"","review":"Really good capstone to the end of the series, don't listen to reddit and read this first, I don't think this would make much sense without the context of the previous books. I think at a minimum Timelike Infinity and Ring are required reading in the series with the other books are somewhat optional but add additional info and flesh out the timeline more.\\n\\nThe ideas are consistently interesting but can be challenging to figure out what exactly is going on, definitely varied a bit how some of the stories landed and how important they are to the main timeline.","highlightCount":51,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1269909688l/6448293.jpg","asin":"B0012095DU","goodreadsUrl":"https://www.goodreads.com/book/show/6448293-vacuum-diagrams","kindleUrl":"https://amazon.com/dp/B0012095DU","matchMethod":"asin"},{"id":"pluto-urasawa-x-tezuka-1-95622985","readMonth":{"month":"Nov","year":"2024","day":"19","sort":"2024-11-19"},"title":"Pluto: Urasawa x Tezuka, Vol. 1","author":"Urasawa, Naoki","series":"","review":"This was great, bought the whole series and I will be reading it all.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1696991345l/199343630.jpg","asin":"B0CHWWNL1J","goodreadsUrl":"https://www.goodreads.com/book/show/199343630-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pluto-urasawa-x-tezuka-2-9471a7d6","readMonth":{"month":"Nov","year":"2024","day":"20","sort":"2024-11-20"},"title":"Pluto: Urasawa x Tezuka, Vol. 2","author":"Urasawa, Naoki","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697052605l/199414469.jpg","asin":"B0CHX2SLQ6","goodreadsUrl":"https://www.goodreads.com/book/show/199414469-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"grave-empire-7d0440a8","readMonth":{"month":"Nov","year":"2024","day":"25","sort":"2024-11-25"},"title":"Grave Empire","author":"Swan, Richard","series":"The Great Silence, #1","review":"4.5/5 Thank you to Netgalley and Orbit books for an advanced copy of this book in exchange for an honest review.\\n\\nI've read Empire of the Wolf last year and really enjoyed it beginning to end, so I was excited to see what Swan had in store for this world 200 years after the ending of the previous series. Swan met and in a lot of ways exceeded the previous series here, and if book 2 was out I'd pick it up immediately.\\n\\nHe did a great job switching from first person in the EOTW to third person with multiple POVs here and thought the story and pacing benefited from it massively, I was always engaged in what was going on and he was able to tease these big moments and revelations that kept me turning the pages wanting to know what would happen next. This book has a lot of surprising moments and goes in directions I didn't expect but also makes sense given what we know about the world from previous books. Also there's one character here who is such a scumbag and I loved it, easily one of my favorite characters of the year. I thought all of the POV perspectives were interesting and showed the depth and complexity of the world building as well as just having a lot of cool moments that have big implications for the rest of the series.\\n\\nThe horror elements are awesome, probably one of my favorite parts of the book, some truly horrific things happen and I was all for it, really separates this book from other fantasy series and he's really amplified this part from EOTW which I really enjoyed in that series as well.\\n\\nSwan is one of my favorite new authors in the fantasy genre and he consistently releases books every year, so I'm expecting to continue to get new entries in this series at a regular pace and looking forward to read them (hopefully early!). This is definitely a book 1 in a series but we do have a good stopping point with some but not all the answers and there's plenty to explore as the series continues.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":4.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1729793386l/214229274.jpg","asin":"B0D5X31X23","goodreadsUrl":"https://www.goodreads.com/book/show/214229274-grave-empire","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pluto-urasawa-x-tezuka-3-4f514ca5","readMonth":{"month":"Nov","year":"2024","day":"29","sort":"2024-11-29"},"title":"Pluto: Urasawa x Tezuka, Vol. 3","author":"Urasawa, Naoki","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697048588l/199406181.jpg","asin":"B0CHXDXYHS","goodreadsUrl":"https://www.goodreads.com/book/show/199406181-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pluto-urasawa-x-tezuka-4-0dc53608","readMonth":{"month":"Nov","year":"2024","day":"30","sort":"2024-11-30"},"title":"Pluto: Urasawa x Tezuka, Vol. 4","author":"Urasawa, Naoki","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697048588l/199406182.jpg","asin":"B0CHX5XCZK","goodreadsUrl":"https://www.goodreads.com/book/show/199406182-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"circe-80162a4a","readMonth":{"month":"Dec","year":"2024","day":"05","sort":"2024-12-05"},"title":"Circe","author":"Miller, Madeline","series":"","review":"Really good. Kind of yass queen witch power vibes but not overly so and good tying in of existing mythology. Lots of stuff happens but doesn't really build to a crescendo but was engaged by the plot. Also some of the writing is quite good and the audiobook performance is fantastic.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1565909496l/35959740.jpg","asin":"0316556343","goodreadsUrl":"https://www.goodreads.com/book/show/35959740-circe","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pluto-urasawa-x-tezuka-5-bce8b840","readMonth":{"month":"Dec","year":"2024","day":"08","sort":"2024-12-08"},"title":"Pluto: Urasawa x Tezuka, Vol. 5","author":"Urasawa, Naoki","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697048592l/199406185.jpg","asin":"B0CHXDQKYP","goodreadsUrl":"https://www.goodreads.com/book/show/199406185-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pluto-urasawa-x-tezuka-6-695af5f4","readMonth":{"month":"Dec","year":"2024","day":"11","sort":"2024-12-11"},"title":"Pluto: Urasawa x Tezuka, Vol. 6","author":"Urasawa, Naoki","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697048588l/199406180.jpg","asin":"B0CHXCXKYZ","goodreadsUrl":"https://www.goodreads.com/book/show/199406180-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"eye-of-world-92fc138c","readMonth":{"month":"Dec","year":"2024","day":"17","sort":"2024-12-17"},"title":"The Eye of the World","author":"Jordan, Robert","series":"The Wheel of Time, #1","review":"Surprised at just how much I enjoyed this. I actually read this book about 20 years ago after finishing what was published of A Song of Ice and Fire at the time and for some reason didn't continue. I didn't remember much about it and sort of ruled out this series as something I wouldn't like but I'm glad I gave it another shot as this is awesome classic fantasy with some really cool world building, high magic, and some epic moments.\\n\\nWheel of Time is sort of my last remaining \\"massive, hugely popular\\" fantasy series that I haven't read. Definitely will be continuing and excited to read book 2 soon!","highlightCount":74,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1647269483l/893760.jpg","asin":"B002U3CCYM","goodreadsUrl":"https://www.goodreads.com/book/show/893760.The_Eye_of_the_World","kindleUrl":"https://amazon.com/dp/B002U3CCYM","matchMethod":"title-candidate-author"},{"id":"leviathan-da7ad79c","readMonth":{"month":"Dec","year":"2024","day":"25","sort":"2024-12-25"},"title":"Leviathan","author":"McCammon, Robert","series":"","review":"Have some nitpicks with this entry but overall really enjoyed it, the series definitely fluctuates between intricate mysteries and adventure stories where I personally enjoy the mysteries more. The writing quality is pretty immaculate the whole way through the series and creates a high bar for McCammon to measure up to himself. Highly recommend the series overall and it also has great audiobooks.","highlightCount":13,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1724062571l/217035509.jpg","asin":"B0DHV2ZY72","goodreadsUrl":"https://www.goodreads.com/book/show/217035509-leviathan","kindleUrl":"https://amazon.com/dp/B0DHV2ZY72","matchMethod":"title-author"},{"id":"remains-of-day-61b1b484","readMonth":{"month":"Dec","year":"2024","day":"27","sort":"2024-12-27"},"title":"The Remains of the Day","author":"Ishiguro, Kazuo","series":"","review":"Masterpiece, amazing book. So much depth and weight to think about in such a short novel.\\n\\nI definitely have issues with people who describe this book as \\"nothing happens\\". It goes over Mr Stevens' whole life and questions what it means to have dignity and what is important in life. Also it looks at what happens when you feel like you may have took the wrong turns and worry about a life wasted.\\n\\nThe unraveling of the story was brilliant and how it chooses to reveal information to you as it progresses. There were many moments where I was questioning the life philosophy of the characters and the effects it has had on the lives they have chosen to live. The climax I was emotionally engaged, on edge, and heartbroken.\\n\\nIshiguro is a master in subtext here and there's a huge amount of the book that rewards a close read between the relationships between the characters but it also felt very accessible and realistic to me and I could vividly imagine the scenes and it's easier to see the shortcomings of these human relationships with the benefit of an outside perspective and Stevens looking back at events in hindsight.\\n\\nAmazing nuance in the personalities of the characters, how they have changed throughout their lives, and their relationships between one another and how social decorum can often get in the way. Also shows the challenges of capturing those moments to break through the social rituals and really connect with other human beings, especially in the context of pre World War 2 Britain but there's takeaways from this to apply to any situation.\\n\\nWill definitely be reading more Ishiguro very soon.","highlightCount":30,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1620064369l/57934597.jpg","asin":"B003VPWX6K","goodreadsUrl":"https://www.goodreads.com/book/show/57934597-the-remains-of-the-day","kindleUrl":"https://amazon.com/dp/B003VPWX6K","matchMethod":"asin"},{"id":"pale-view-of-hills-1bfc062e","readMonth":{"month":"Jan","year":"2025","day":"03","sort":"2025-01-03"},"title":"A Pale View of Hills","author":"Ishiguro, Kazuo","series":"","review":"This was alright, it was building up and I felt unsatisfied with the ending, there's not any clear answers to some of the mysteries. The Remains of the Day had a lot better payoff where this one felt more unfocused and the themes were a bit muddled to me. Could have used a bit more focus, but I was engaged with the first half of the book quite a bit, it just didn't follow through with something satisfying in the end.","highlightCount":16,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1372714028l/18144253.jpg","asin":"B008WOO7DM","goodreadsUrl":"https://www.goodreads.com/book/show/18144253-a-pale-view-of-hills","kindleUrl":"https://amazon.com/dp/B008WOO7DM","matchMethod":"asin"},{"id":"three-stigmata-of-palmer-eldritch-b0449658","readMonth":{"month":"Jan","year":"2025","day":"04","sort":"2025-01-04"},"title":"The Three Stigmata of Palmer Eldritch","author":"Dick, Philip K.","series":"","review":"The most approachable PKD I've read yet, but still has a really cool premise and execution. Will be thinking about this one for quite some time, highly recommend. Very mind melty.","highlightCount":38,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1337292070l/13327140.jpg","asin":"B005LVR6C8","goodreadsUrl":"https://www.goodreads.com/book/show/13327140-the-three-stigmata-of-palmer-eldritch","kindleUrl":"https://amazon.com/dp/B005LVR6C8","matchMethod":"asin"},{"id":"pluto-urasawa-x-tezuka-7-ddd1b7ee","readMonth":{"month":"Jan","year":"2025","day":"04","sort":"2025-01-04"},"title":"Pluto: Urasawa x Tezuka, Vol. 7","author":"Urasawa, Naoki","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1697048592l/199406186.jpg","asin":"B0CHX4G1N1","goodreadsUrl":"https://www.goodreads.com/book/show/199406186-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pluto-urasawa-x-tezuka-8-bd339e7a","readMonth":{"month":"Jan","year":"2025","day":"04","sort":"2025-01-04"},"title":"Pluto: Urasawa x Tezuka, Vol. 8","author":"Urasawa, Naoki","series":"","review":"Series review: Great sci-fi manga that packs a lot into it's succinct package. Don't be deceived by the covers and premise but there's a lot of deep sci-fi themes being explored as well as a lot of emotional and dark moments. Very cool exploration on what it means to be human and memory to name a few. It takes Astroboy and makes it a serious adult story. Urasawa is one of the best at this medium, great stuff.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1696991345l/199343631.jpg","asin":"B0CHX4K585","goodreadsUrl":"https://www.goodreads.com/book/show/199343631-pluto","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blood-work-303de9ec","readMonth":{"month":"Jan","year":"2025","day":"05","sort":"2025-01-05"},"title":"Blood Work","author":"Connelly, Michael","series":"Harry Bosch Universe, #7","review":"Really good hook and writing. Mechanically very strong police procedural and really dives deep into the evidence in a compelling manner. Have enjoyed every Connelly book I've read so far and wanting to continue Bosch this year. Mccaleb does feel a bit similar to Bosch at times but his motivation for being on this case is very good, his backstory and personal life isn't quite as good as Bosch though. Glad I read this because it is referenced in some of the Bosch books and he's featured in the next one next to Bosch so I wanted context on his book before I read that.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1442528004l/32504.jpg","asin":"0446690449","goodreadsUrl":"https://www.goodreads.com/book/show/32504.Blood_Work","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"great-hunt-e4779339","readMonth":{"month":"Jan","year":"2025","day":"16","sort":"2025-01-16"},"title":"The Great Hunt","author":"Jordan, Robert","series":"The Wheel of Time, #2","review":"Seriously impressive. Handles the fallout of the first book and bridges the series to something unique and special. So many great moments and plenty of surprises. Excited to continue. The Wheel weaves as the Wheel wills.","highlightCount":66,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1659905799l/233649.jpg","asin":"B002VBV1R2","goodreadsUrl":"https://www.goodreads.com/book/show/233649.The_Great_Hunt","kindleUrl":"https://amazon.com/dp/B002VBV1R2","matchMethod":"title-candidate-author"},{"id":"stonewielder-434a9a07","readMonth":{"month":"Jan","year":"2025","day":"17","sort":"2025-01-17"},"title":"Stonewielder","author":"Esslemont, Ian C.","series":"Novels of the Malazan Empire, #3","review":"2.5/5 man this dragged a lot. The set-up was interesting but the middle felt like a slog. The climax wasn't much of a convergence and I felt unsatisfied with where we ended up and a lot of the mysteries were not answered. Some good moments, but didn't want to pick this up very often and I was glad to be done.","highlightCount":56,"myGoodreadsRating":3,"myReviewRating":2.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328348721l/11936593.jpg","asin":"B0057QUU4I","goodreadsUrl":"https://www.goodreads.com/book/show/11936593-stonewielder","kindleUrl":"https://amazon.com/dp/B0057QUU4I","matchMethod":"asin"},{"id":"innocent-omnibus-3-e2f0a1fe","readMonth":{"month":"Jan","year":"2025","day":"17","sort":"2025-01-17"},"title":"Innocent Omnibus Volume 3","author":"Sakamoto, Shin'ichi","series":"","review":"This story is told in a very strange way and the effect is that you don't really sympathize with the characters and tension is not built up in an effective way. The art is very good though and that was enough to keep me going, but it often felt like an abridged version of the story that was missing huge chunks of context to make you care about the characters and the plot developments.\\n\\nNot sure if I'd read more from Sakamoto but I am interested in the Climber, if I treat this as sort of an art book I enjoy it more but that's not really what I go to this medium looking for.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1724762974l/218132614.jpg","asin":"B0DF4FYDDM","goodreadsUrl":"https://www.goodreads.com/book/show/218132614-innocent-omnibus-volume-3","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"foundation-f09be3dd","readMonth":{"month":"Jan","year":"2025","day":"25","sort":"2025-01-25"},"title":"Foundation","author":"Asimov, Isaac","series":"Foundation, #1","review":"Some ups and downs but overall really enjoyed it. Has more surprises than I thought and it's less dry than I was led to believe.\\n\\nLove the grand scale but yeah the characters are basically cameras but that's ok, not reading this for characters but for the ideas and the thinking about society at large and humanity.\\n\\nRequires a bit of suspension of disbelief but it's a cool thought experiment. Was really cool to see the influences this had on Dune and in many cases there's a lot of direct parallels.","highlightCount":46,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1301851340l/5996629.jpg","asin":"B000FC1PWA","goodreadsUrl":"https://www.goodreads.com/book/show/5996629-foundation","kindleUrl":"https://amazon.com/dp/B000FC1PWA","matchMethod":"title-author"},{"id":"never-let-me-go-4cac197f","readMonth":{"month":"Jan","year":"2025","day":"26","sort":"2025-01-26"},"title":"Never Let Me Go","author":"Ishiguro, Kazuo","series":"","review":"This book feels so mundane and boring as hell. The main characters don't act like human beings. There should be so much rage and emotion for their situation but they are more concerned with their day to day routines, I don't get it.\\n\\nThe concept and mystery behind this one is interesting but the execution is very subpar. Instead of this enhancing what the characters are experiencing it feels like a side note and doesn't introduce much depth in thinking about the ethics of the situation or even really thinking about life philosophy.\\n\\nIshiguro might just be a one hit author for me, not really sure how Remains of the Day and this are written by the same person.","highlightCount":4,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1598462660l/55132921.jpg","asin":"B000FCK2TW","goodreadsUrl":"https://www.goodreads.com/book/show/55132921-never-let-me-go","kindleUrl":"https://amazon.com/dp/B000FCK2TW","matchMethod":"asin"},{"id":"dragon-reborn-90eaaca2","readMonth":{"month":"Jan","year":"2025","day":"27","sort":"2025-01-27"},"title":"The Dragon Reborn","author":"Jordan, Robert","series":"The Wheel of Time, #3","review":"Rounds out a few of the weaknesses of the Great Hunt and gives the supporting characters a lot more depth. Feels a bit more deliberately paced and a slow burn but I actually enjoyed that aspect quite a bit and have no idea how someone can say \\"nothing happens\\". I was engaged by the book from beginning to end and thought the way things came together and mattered to be very well thought out, be exciting, and have some fun surprises.\\n\\nThe climax is super cool and the world building continues to be very deep and complex. Plenty left to explore and a lot of things left open but each resolution of the book has been really satisfying and built off the legwork of previous books as well as the set-up in the beginning of the books.\\n\\nThis feels like a decent spot for a break but really enjoying the series so far and hope it continues to be this high quality throughout.","highlightCount":74,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1647269611l/618158.jpg","asin":"B0030AF5DO","goodreadsUrl":"https://www.goodreads.com/book/show/618158.The_Dragon_Reborn","kindleUrl":"https://amazon.com/dp/B0030AF5DO","matchMethod":"title-candidate-author"},{"id":"foundation-and-empire-67a44c03","readMonth":{"month":"Feb","year":"2025","day":"06","sort":"2025-02-06"},"title":"Foundation and Empire","author":"Asimov, Isaac","series":"Foundation, #2","review":"Big step down from book 1 and very uneven for me. I did think the ending was strong and I'm interested enough to read book 3. There's also some chapters I thought were quite good but yeah some were very dull.\\n\\nThe characters were somehow worse than book 1 and they weren't well developed in the first book, instead of being shallow cameras as a mechanism for exploring ideas they're way more quirky and grating in this one and sort of blend together. They're often powerless and don't have agency so we learn about big events happening and often they're not directly involved in them which is lame and different from the first book.\\n\\nThe plot is actually interesting just not executed in a way that I had a lot of investment in and the stakes were muddled where the consequences of failure were fairly abstract and I didn't have a lot of conviction that I wanted the characters to actually succeed in their goals.\\n\\nThe mystery and twists were good, but not as regularly dispensed revelations as book 1 and there's definitely a big anticlimax moment that was a massive speedbump for me that hampered my enjoyment, although it ultimately recovers.\\n\\nIn summary, good ideas but the execution was not my favorite, the overall direction the series is going continues to be interesting though.","highlightCount":33,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1305080024l/5996631.jpg","asin":"B000FC1PWK","goodreadsUrl":"https://www.goodreads.com/book/show/5996631-foundation-and-empire","kindleUrl":"https://amazon.com/dp/B000FC1PWK","matchMethod":"title-author"},{"id":"die-with-zero-getting-all-you-can-from-your-money-and-your-life-ff70c24d","readMonth":{"month":"Feb","year":"2025","day":"06","sort":"2025-02-06"},"title":"Die with Zero: Getting All You Can from Your Money and Your Life","author":"Perkins, Bill","series":"","review":"Good introduction to this concept but a little bit shallow with a lot of anecdotes that aren't generally applicable as well as pretty light (almost non existent) material for how to implement this strategy.\\n\\nThis is probably only good for a certain type of person whose inclination is to hoard wealth and not actually use it in meaningful ways that measurably improve the quality of life at the time where it's most needed.\\n\\nI do think the sections talking about when most people receive inheritance and how much of an impact they have are interesting and important as well as thinking critically on phases of life and when to use the resources you have instead of waiting until health declines and you can no longer effectively enjoy the fruits of your labor.\\n\\nAs always though there's a massive amount of uncertainty especially when the time horizon is so long and no one has a simple or clear answer for how to actually have the perfect amount of savings for retirement. I think this is worth reading parts of this if you get it from the library like I did and treat it as sort of an extended blog post.","highlightCount":4,"myGoodreadsRating":null,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1569955650l/52181741.jpg","asin":"B07T5LSF1J","goodreadsUrl":"https://www.goodreads.com/book/show/52181741-die-with-zero","kindleUrl":"https://amazon.com/dp/B07T5LSF1J","matchMethod":"asin"},{"id":"short-stay-in-hell-d3a93ee6","readMonth":{"month":"Feb","year":"2025","day":"07","sort":"2025-02-07"},"title":"A Short Stay in Hell","author":"Peck, Steven L.","series":"","review":"*Existential dread intensifies*","highlightCount":30,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1338958997l/11003233.jpg","asin":"B007LQ81HK","goodreadsUrl":"https://www.goodreads.com/book/show/11003233-a-short-stay-in-hell","kindleUrl":"https://amazon.com/dp/B007LQ81HK","matchMethod":"asin"},{"id":"aurora-rising-d8836869","readMonth":{"month":"Feb","year":"2025","day":"14","sort":"2025-02-14"},"title":"Aurora Rising","author":"Reynolds, Alastair","series":"Prefect Dreyfus Emergency #1","review":"I think reading Revelation Space before this is sort of required as it ties into that quite a bit.\\n\\nSome of the mysteries weren't resolved in the most satisfying manner but I still really enjoyed the book overall. Was pretty engaged with the plot and there were plenty of dark moments, good sci-fi concepts, and it tied into Revelation Space really well.\\n\\nAlastair does have some issues with endings to be honest but I'm hoping to see more developments in the successive books in the series. Clearly above a 3/5 and a really good book overall.","highlightCount":75,"myGoodreadsRating":4,"myReviewRating":3,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1596853837l/50329893.jpg","asin":"B081YZY8YR","goodreadsUrl":"https://www.goodreads.com/book/show/50329893-aurora-rising","kindleUrl":"https://amazon.com/dp/B081YZY8YR","matchMethod":"asin"},{"id":"shadow-rising-56c05dd5","readMonth":{"month":"Feb","year":"2025","day":"16","sort":"2025-02-16"},"title":"The Shadow Rising","author":"Jordan, Robert","series":"The Wheel of Time, #4","review":"Really good. Felt a bit more uneven than the previous two books for me and did come the closest to overstaying its welcome but it did a great job expanding the scope of the series in unexpected ways and interweaving character storylines in interesting ways.\\n\\nThe world building and lore continues to be fantastic, but some of the series's quirks did get to me a bit at times and I felt varying levels of attachment to the storylines, lots of good stuff to explore as the series goes on and looking forward to continuing.","highlightCount":45,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1638239837l/9539.jpg","asin":"B00329UWL8","goodreadsUrl":"https://www.goodreads.com/book/show/9539.The_Shadow_Rising","kindleUrl":"https://amazon.com/dp/B00329UWL8","matchMethod":"title-candidate-author"},{"id":"bee-speaker-8f520650","readMonth":{"month":"Mar","year":"2025","day":"02","sort":"2025-03-02"},"title":"Bee Speaker","author":"Tchaikovsky, Adrian","series":"Dogs of War, #3","review":"4.25/5 I received a copy of this book in exchange for an honest review.\\n\\nBeing a big fan of the other two Bioform books (Dogs of War, Bear Head) I was excited to hear that Tchaikovsky was releasing a new entry in this series. These are pretty much standalone books and have pretty conclusive endings at the end of each entry. I was satisfied with the ending of Dogs of War and didn't feel like I *needed* another book but Bear Head was one of my biggest surprises, I thought it was hilarious and just a really fun time.\\n\\nThis book has more of a serious tone again and we get a mixture of Bioform, human, and a few other factions and races of characters that are thrown into conflict and testing the bounds of this broken world they find themselves in.\\n\\nI think the characters are all pretty well written, especially the Bioforms which are the strong point of the series, exploring animal hybrids and their internal monologues never ceases to be interesting.\\n\\nThe world building is pretty good in this one and builds off the previous two books, I did think some of the elements at the end needed a gentler and more gradual introduction, it felt like we got quite a lot right at the end and new conflicts sprung up only to be resolved fairly quickly. I was also hoping to see some Shadows of the Apt connections, maybe that's misguided but I could have seen that feasibly happening.\\n\\nOverall, happy I read this. I'm not sure it *needed* to be written and was sort of hoping for some bigger more definitive conclusions but this was a fun story in a well built world. I'd read another one in this world but also I'm fine if it ends here, but I do think if there is another book in the series I kind of want
