eries but this is a fun grimdark series and Spark is an author to watch for.","highlightCount":2,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1519087633l/38627423.jpg","asin":"B0776T7L74","goodreadsUrl":"https://www.goodreads.com/book/show/38627423-the-tower-of-living-and-dying","kindleUrl":"https://amazon.com/dp/B0776T7L74","matchMethod":"asin"},{"id":"saga-7-7e7cab35","readMonth":{"month":"Jul","year":"2022","day":"07","sort":"2022-07-07"},"title":"Saga, Volume 7","author":"Vaughan, Brian K.","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1642677871l/33560546.jpg","asin":"B01N9JR2Q4","goodreadsUrl":"https://www.goodreads.com/book/show/33560546-saga-volume-7","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"saga-8-bf6a284b","readMonth":{"month":"Jul","year":"2022","day":"07","sort":"2022-07-07"},"title":"Saga, Volume 8","author":"Vaughan, Brian K.","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1545625018l/43307890.jpg","asin":"1534303499","goodreadsUrl":"https://www.goodreads.com/book/show/43307890-saga-volume-8","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"saga-9-f89241a3","readMonth":{"month":"Jul","year":"2022","day":"07","sort":"2022-07-07"},"title":"Saga, Volume 9","author":"Vaughan, Brian K.","series":"","review":"💔😭. So good but I am not ok","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1636974466l/29237221.jpg","asin":"B07GL6ZJLF","goodreadsUrl":"https://www.goodreads.com/book/show/29237221-saga-volume-9","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"saga-10-800b2700","readMonth":{"month":"Jul","year":"2022","day":"10","sort":"2022-07-10"},"title":"Saga, Volume 10","author":"Vaughan, Brian K.","series":"","review":"I would like more please, k thx.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1648551390l/29237224.jpg","asin":"1534323341","goodreadsUrl":"https://www.goodreads.com/book/show/29237224-saga-volume-10","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"lancelot-9e1171d1","readMonth":{"month":"Jul","year":"2022","day":"11","sort":"2022-07-11"},"title":"Lancelot","author":"Kristian, Giles","series":"The Arthurian Tales, #1","review":"A character focused slow burn that packs in a lot of emotions. Really should be read after the Warlord Chronicles by Cornwell because while I loved this, those are much better and these books are inspired by them and offer an interesting contrast to the plot of the Warlord Chronicles. I just would wait awhile after reading those before this because there are definitely similar aspects.\\n\\nHas some absolutely gorgeous writing and is a very good coming of age story with some action interspersed.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1523279230l/36055895.jpg","asin":"1473543029","goodreadsUrl":"https://www.goodreads.com/book/show/36055895-lancelot","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"candide-008db2dd","readMonth":{"month":"Jul","year":"2022","day":"12","sort":"2022-07-12"},"title":"Candide","author":"Voltaire","series":"","review":"Candide had a real rough life, take that optimists 😂","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1499781540l/35652511.jpg","asin":"B073QR7YB9","goodreadsUrl":"https://www.goodreads.com/book/show/35652511-candide","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"queen-amid-ashes-9b8349cf","readMonth":{"month":"Jul","year":"2022","day":"12","sort":"2022-07-12"},"title":"Queen Amid Ashes","author":"Ruocchio, Christopher","series":"The Sun Eater, #2.5","review":"The side stuff in Sun Eater continues to just be ok for me even though I absolutely love the main series. Very solid story but it doesn't have the aspects that make me love the main series. Well written but the plot I thought was just ok.\\n\\nAlso felt a bit weird after reading Kingdoms of Death. Would recommend reading this after Howling Dark instead because the series changes so much after that.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1655313686l/61294903.jpg","asin":"B0B45DFRF6","goodreadsUrl":"https://www.goodreads.com/book/show/61294903-queen-amid-ashes","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"speaks-nightbird-08a9484d","readMonth":{"month":"Jul","year":"2022","day":"16","sort":"2022-07-16"},"title":"Speaks the Nightbird","author":"McCammon, Robert","series":"Matthew Corbett, #1","review":"A colonial mystery horror whodunnit witch trial with Sherlock Holmes vibes, what's not to like?\\n\\nMcCammon has written another masterpiece here, the atmosphere and environment that he builds here is nothing short of extraordinary, it really feels like you're in the age of the frontier colonial America; superstition is high and knowledge / trust in science is low and the horror of the ignorance of humanity is in full force as they see the Devil in every shadow and misread signs from God in day to day life.\\n\\nThe character work here is exceptional as well, Corbett is a great character and you get a lot of backstory from him, his mentor, and other characters as well in a way that's natural during the narrative.\\n\\nThe themes McCammon explores are very interesting and poignant, he uses his prose to delve beneath the surface of a great plot to elevate the narrative and ask the big questions of good vs evil and the folly of man. It's interesting what has changed and also frightening what has stayed the same, the horror found in the souls of our fellow humans can be scarier than the demons in the darkest of corners of the colonial swamps.\\n\\nI pretty much devoured this and the mysteries are very interesting and come together in a perfect way that is nothing short of genius, the way McCammon plots out his books works so well for me.\\n\\nHad to restrain myself from starting book 2 immediately. I can't wait to see what Mr Corbett will be up to next.","highlightCount":84,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1593618265l/18651820.jpg","asin":"B00F9H59Z0","goodreadsUrl":"https://www.goodreads.com/book/show/18651820-speaks-the-nightbird","kindleUrl":"https://amazon.com/dp/B00F9H59Z0","matchMethod":"title-author"},{"id":"speaking-bones-86c2f6e7","readMonth":{"month":"Jul","year":"2022","day":"17","sort":"2022-07-17"},"title":"Speaking Bones","author":"Liu, Ken","series":"The Dandelion Dynasty, #4","review":"Every book has been a 5/5 and it's easily one of my all time favorite series. I'm sad that it's over but thought the ending was fantastic and tied everything together from the series so well. Ken Liu is definitely an autobuy and read day one author for me now, his writing clicks with me so well. So glad I picked up this series.\\n\\nAt a certain point I stopped having any sort of criticism of the series and was just soaking it in and enjoying it, such a huge ambitious series that is unlike anything else I have read. I'm really in awe of what Liu has accomplished here, absolutely masterful stuff and he wrapped things up in such a satisfying and cohesive way with so much to think about going forward.\\n\\nThis is the perfect blend of philosophy, theme, characters, action, horror, technology this series really has it all and there's so much depth and meat to the series. Such an accomplishment that breaks out of any genre definition, my hats off to Mr Liu, will be reading everything that he's written or will write going forward.","highlightCount":181,"myGoodreadsRating":5,"myReviewRating":5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1638924573l/59771357.jpg","asin":"B09JPGX7S3","goodreadsUrl":"https://www.goodreads.com/book/show/59771357-speaking-bones","kindleUrl":"https://amazon.com/dp/B09JPGX7S3","matchMethod":"asin"},{"id":"sirens-of-titan-d3c98dd9","readMonth":{"month":"Jul","year":"2022","day":"18","sort":"2022-07-18"},"title":"The Sirens of Titan","author":"Vonnegut Jr., Kurt","series":"","review":"","highlightCount":39,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1621066898l/6588742.jpg","asin":"B0012RMVCK","goodreadsUrl":"https://www.goodreads.com/book/show/6588742-the-sirens-of-titan","kindleUrl":"https://amazon.com/dp/B0012RMVCK","matchMethod":"asin"},{"id":"vampireslayer-238e36f4","readMonth":{"month":"Jul","year":"2022","day":"19","sort":"2022-07-19"},"title":"Vampireslayer","author":"King, William","series":"Gotrek & Felix, #6","review":"This was an incredibly fun listen. Probably the least action in the whole series but that was a good thing. Interesting vampire and tomb king lore. A good change of pace after the other books and the huge climax in the last book.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1182096852l/1231589.jpg","asin":"184416053X","goodreadsUrl":"https://www.goodreads.com/book/show/1231589.Vampireslayer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"warhost-of-vastmark-78b4790e","readMonth":{"month":"Jul","year":"2022","day":"24","sort":"2022-07-24"},"title":"Warhost of Vastmark","author":"Wurts, Janny","series":"Wars of Light and Shadow, #3","review":"Going to pause the series, probably won't continue. The writing is very good but the plot progression is incredibly slow. I am interested in Wurts' other books though at some point.\\n\\nI didn't feel much connection with the characters. The overall plot is interesting but the majority of the page count does not focus on the plot points I am most interested in and the books have already tread similar ground for each book in the series so far.\\n\\nReally wanted to like this but it didn't click for me enough to continue this huge series.","highlightCount":50,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1588072404l/10482313.jpg","asin":"B004FPYX0Y","goodreadsUrl":"https://www.goodreads.com/book/show/10482313-warhost-of-vastmark","kindleUrl":"https://amazon.com/dp/B004FPYX0Y","matchMethod":"asin"},{"id":"fire-blood-1e95ec1e","readMonth":{"month":"Jul","year":"2022","day":"24","sort":"2022-07-24"},"title":"Fire & Blood","author":"Martin, George R.R.","series":"A Targaryen History, #1","review":"I don't think GRRM could have written this any better, it's great. The best history of the Targaryens that I could imagine. Really interesting, dark, and has a surprising amount of character moments even when told through the history retelling format.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1532828095l/39943621.jpg","asin":"152479628X","goodreadsUrl":"https://www.goodreads.com/book/show/39943621-fire-blood","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"we-8684e0d3","readMonth":{"month":"Jul","year":"2022","day":"25","sort":"2022-07-25"},"title":"We","author":"Zamyatin, Yevgeny","series":"","review":"This was fine, but every other dystopian book I've read has been much better.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1765882854l/76171.jpg","asin":"0140185852","goodreadsUrl":"https://www.goodreads.com/book/show/76171.We","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"queen-of-bedlam-a973749e","readMonth":{"month":"Jul","year":"2022","day":"26","sort":"2022-07-26"},"title":"The Queen of Bedlam","author":"McCammon, Robert","series":"Matthew Corbett, #2","review":"This series is amazing. McCammon does plotting and characters incredibly well. I'm pumped for the next book. I hope the whole series is just as good.\\n\\nLess horror aspects than the first book but still some creepy moments, the mystery and the plot and the way it comes together is masterful.","highlightCount":33,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1593618365l/5454083.jpg","asin":"B000VM9Z2G","goodreadsUrl":"https://www.goodreads.com/book/show/5454083-the-queen-of-bedlam","kindleUrl":"https://amazon.com/dp/B000VM9Z2G","matchMethod":"asin"},{"id":"howls-from-dark-ages-anthology-of-medieval-horror-009101fd","readMonth":{"month":"Jul","year":"2022","day":"31","sort":"2022-07-31"},"title":"Howls from the Dark Ages: An Anthology of Medieval Horror","author":"McMillan, P.L.","series":"","review":"There's some really good stuff in this short story collection. Really true to form medieval horror that exemplifies the genre. Evil priests, nuns, creepy castles and knights, horrible plagues, spooky forests; a lot of variety and some great themes as well, only a couple of stories that were just ok. Most were excellent and would like to read more from a few of these authors.","highlightCount":33,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1649217664l/60759453.jpg","asin":"B09X23S42F","goodreadsUrl":"https://www.goodreads.com/book/show/60759453-howls-from-the-dark-ages","kindleUrl":"https://amazon.com/dp/B09X23S42F","matchMethod":"asin"},{"id":"giantslayer-fc75ca0c","readMonth":{"month":"Aug","year":"2022","day":"01","sort":"2022-08-01"},"title":"Giantslayer","author":"King, William","series":"Gotrek & Felix, #7","review":"I'll never get tired of Gotrek saying how much he hates elves haha. We get a great elf character to accompany our heroes in this one, the dynamics of the group were very well done and fun. I loved all these Gotrek and Felix books by William King, hoping Nathan Long's hold up as well.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1255978524l/860009.jpg","asin":"1844162613","goodreadsUrl":"https://www.goodreads.com/book/show/860009.Giantslayer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"house-of-sacrifice-af207fbf","readMonth":{"month":"Aug","year":"2022","day":"02","sort":"2022-08-02"},"title":"The House of Sacrifice","author":"Spark, Anna Smith","series":"Empires of Dust Book 3","review":"This totally shit the bed. I really liked the second book and this drops the ball completely, unfortunately. I'm unclear why this series was written and didn't seem to be planned out well and it just sort of ends without any satisfying conclusions or character development. No thematic climax and some really odd choices about where the plot goes and the world building ends up being thin.\\n\\nThe writing style was overdone and actively worked against telling a good story, whereas the other books were much better.","highlightCount":8,"myGoodreadsRating":1,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1544738757l/43227061.jpg","asin":"B07L2TYY2N","goodreadsUrl":"https://www.goodreads.com/book/show/43227061-the-house-of-sacrifice","kindleUrl":"https://amazon.com/dp/B07L2TYY2N","matchMethod":"asin"},{"id":"picture-of-dorian-gray-0a988938","readMonth":{"month":"Aug","year":"2022","day":"03","sort":"2022-08-03"},"title":"The Picture of Dorian Gray","author":"Wilde, Oscar","series":"","review":"The philosophy, themes, and prose are quite good in this novel. The plot could have enhanced these aspects a bit more, the first half I thought had a compelling story and then there were a few strange asides that didn't build on what came before and it didn't quite ramp up in ways that would have been more satisfying and reinforced the themes a bit better.\\n\\nThe characters and dialogue were also pretty well done, the characters especially all are flawed and have strong philosophical views of the world that are often opposing and have a satirical Socratic dialog flair for viewpoints that at first can appear absurd and then become more logical which in turn causes the reader to question their own viewpoints.\\n\\nI'll probably be thinking about this book for a while, I think it could have been a bit stronger with some changes to the execution and how the story developed, but it's definitely worth a read.","highlightCount":33,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1496336840l/35113385.jpg","asin":"B071HDXV91","goodreadsUrl":"https://www.goodreads.com/book/show/35113385-the-picture-of-dorian-gray","kindleUrl":"https://amazon.com/dp/B071HDXV91","matchMethod":"asin"},{"id":"camelot-4e9909e9","readMonth":{"month":"Aug","year":"2022","day":"06","sort":"2022-08-06"},"title":"Camelot","author":"Kristian, Giles","series":"The Arthurian Tales, #2","review":"I might like this even more than the first book, but I'll have to think about it. The writing is incredible as are the themes tackled. The prose is interwoven so well into the plot as are the themes of being in the shadow of your father and the sins committed before you were born. Also the surviving characters have a huge amount of trauma and things to wrap their minds around after the events of the first book. Hope there's another entry in this series in the future, I really enjoyed this and looked forward to listening to it every day.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1569429553l/51820795.jpg","asin":"B07RDVMDYT","goodreadsUrl":"https://www.goodreads.com/book/show/51820795-camelot","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"no-country-for-old-men-32e784bf","readMonth":{"month":"Aug","year":"2022","day":"07","sort":"2022-08-07"},"title":"No Country for Old Men","author":"McCarthy, Cormac","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1443231179l/12497.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/12497.No_Country_for_Old_Men","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"terminal-list-7df158a1","readMonth":{"month":"Aug","year":"2022","day":"09","sort":"2022-08-09"},"title":"The Terminal List","author":"Carr, Jack","series":"Terminal List, #1","review":"3.5/5","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1520163970l/35297106.jpg","asin":"1501180819","goodreadsUrl":"https://www.goodreads.com/book/show/35297106-the-terminal-list","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"importance-of-being-earnest-c4b57eb7","readMonth":{"month":"Aug","year":"2022","day":"10","sort":"2022-08-10"},"title":"The Importance of Being Earnest","author":"Wilde, Oscar","series":"","review":"One of the wittiest things I've read, pretty hilarious.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1298438452l/92303.jpg","asin":"158049580X","goodreadsUrl":"https://www.goodreads.com/book/show/92303.The_Importance_of_Being_Earnest","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"eversion-ae4a2403","readMonth":{"month":"Aug","year":"2022","day":"10","sort":"2022-08-10"},"title":"Eversion","author":"Reynolds, Alastair","series":"","review":"4.5/5\\n\\nI received a copy of this book in exchange for an honest review.\\n\\nHighly recommend it for anyone looking for a sci-fi book that has some really intriguing mysteries. This was my first Reynolds and it won't be my last.\\n\\nThe less you know about this book going in the better. Going in blind is very satisfying, just make sure you have some patience with it as it won't be quite what you expect in the beginning, but things are slowly revealed and it's pretty mind blowing.\\n\\nThis kind of sci-fi is usually criticized for having weak characters but I connected with a number of them here and they're all fairly distinct and have interesting backgrounds. I was definitely invested in them and how they would fare in the challenges that come up throughout the story.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":4.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1637620277l/58727132.jpg","asin":"0316462829","goodreadsUrl":"https://www.goodreads.com/book/show/58727132-eversion","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"boys-life-7d11f058","readMonth":{"month":"Aug","year":"2022","day":"13","sort":"2022-08-13"},"title":"Boy's Life","author":"McCammon, Robert","series":"","review":"Man this got me good. Nostalgia distilled to a bitter sweet brew. Perfectly captures the magic of youth and harkens back to a simpler time. One of the best books I've read. You think I'd be tired of saying that after finishing another McCammon book. It's almost annoying how good he is at writing.\\n\\nEvery chapter is something new and interesting much like Swan Song and he incorporates a complex and intriguing mystery much like his Matthew Corbett series.\\n\\nA masterpiece.","highlightCount":89,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1509393911l/36505403.jpg","asin":"B005T54I2W","goodreadsUrl":"https://www.goodreads.com/book/show/36505403-boy-s-life","kindleUrl":"https://amazon.com/dp/B005T54I2W","matchMethod":"asin"},{"id":"long-way-to-small-angry-planet-4f3d5491","readMonth":{"month":"Aug","year":"2022","day":"16","sort":"2022-08-16"},"title":"The Long Way to a Small, Angry Planet","author":"Chambers, Becky","series":"Wayfarers, #1","review":"Basically the book version of chilling with your crew in Mass Effect and helping them solve their problems.\\n\\nSome really good characters, the stakes aren't too low either because the personal issues can be high consequence for the characters involved, which is good. Maybe needed a bit more of an overarching plot but was still interesting.\\n\\nAlso the galaxy isn't all happy go lucky, there's wars going on and some of the characters have trauma from wars on their home planets, genocide, etc, which I think this series can have a reputation where it's in an unrealistic reality, which isn't quite true.\\n\\nThe crew is all really nice to each other which is refreshing and wholesome, some really good found family dynamics.\\n\\nThe highlight of the book is learning about all the strange alien cultures and doing the side quests where you meet some of the crew's family on their alien planets.\\n\\nWill be continuing the series, I liked this more than I expected.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1626027352l/26042767.jpg","asin":"B00ZP64F28","goodreadsUrl":"https://www.goodreads.com/book/show/26042767-the-long-way-to-a-small-angry-planet","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"return-of-king-532d45eb","readMonth":{"month":"Aug","year":"2022","day":"17","sort":"2022-08-17"},"title":"The Return of the King","author":"Tolkien, J.R.R.","series":"The Lord of the Rings, #3","review":"It doesn't get any better than this. Loved this even more than the first time I read this many years ago. I appreciate it much more this time for what it has done for the genre which is still an amazing story on its own.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1574117762l/838729.jpg","asin":"0345240340","goodreadsUrl":"https://www.goodreads.com/book/show/838729.The_Return_of_the_King","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"purple-and-black-29bceb6e","readMonth":{"month":"Aug","year":"2022","day":"20","sort":"2022-08-20"},"title":"Purple and Black","author":"Parker, K.J.","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1398750070l/6402375.jpg","asin":"159606241X","goodreadsUrl":"https://www.goodreads.com/book/show/6402375-purple-and-black","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blue-and-gold-5360b939","readMonth":{"month":"Aug","year":"2022","day":"20","sort":"2022-08-20"},"title":"Blue and Gold","author":"Parker, K.J.","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347526880l/8291070.jpg","asin":"1596063270","goodreadsUrl":"https://www.goodreads.com/book/show/8291070-blue-and-gold","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"ashes-of-man-862147ee","readMonth":{"month":"Aug","year":"2022","day":"21","sort":"2022-08-21"},"title":"Ashes of Man","author":"Ruocchio, Christopher","series":"The Sun Eater, #5","review":"July 2025 review:\\nI appreciate what Ruocchio is doing here a lot more this time and reading this right after Kingdoms of Death helps a lot, as the beginning of the book is very much the falling action of KoD. Also I now know what happens in Disquiet Gods and this book makes it possible for that one to be my favorite in the series so far. Still peak sci-fi but definitely a different flavor to the rest of the series in this entry. So many hard hitting moments and even better on re-read, getting way more attached to the side characters this time around.\\n\\nAugust 2022 review:\\nI received a copy of this book in exchange for an honest review.\\n\\nThis is going to be as vague as possible and not have any spoilers.\\n\\nThis might be my least favorite Sun Eater book by a comfortable margin. However, since the bar is so high it's still an excellent entry and sets up the next (final?) book to be my favorite in the whole series.\\n\\nThere were a lot of things hinted at in this book that weren't involved in the plot but the ending definitely has a lot of interesting things set up for it.\\n\\nSince this was originally supposed to be the second half of Kingdoms of Death, I did prefer what happened in Kingdoms of Death by a fairly large margin because of the aspects of the series it dealt with and this book mainly deals with the fallout of Kingdoms of Death and set up for the last book.\\n\\nAlthough it definitely has some major events occur, I found myself hoping that the things this book hinted at would be tackled instead of what we got. That's not to say that the plot here isn't interesting but I'm highly anticipating the next entry because it's easy to imagine it being even better.\\n\\nOverall this is one of my favorite sci-fi series ever and I can't wait to see how it ends. Ruocchio continues to be a massive talent and is full of surprises.","highlightCount":53,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1644986472l/60427253.jpg","asin":"0756416604","goodreadsUrl":"https://www.goodreads.com/book/show/60427253-ashes-of-man","kindleUrl":"","matchMethod":"title-only-unique"},{"id":"three-body-problem-2b3fb185","readMonth":{"month":"Aug","year":"2022","day":"24","sort":"2022-08-24"},"title":"The Three-Body Problem","author":"Liu, Cixin","series":"Remembrance of Earth’s Past, #1","review":"Even though this has some rough edges, this is one of the best sci-fi books I've read and the ideas explored here are mind blowing.\\n\\nThis is probably the \\"hardest\\" sci-fi book I've read where Liu goes deep into the physics and some of the technical details about why the things explored here might be possible. I personally loved this aspect of the book but I could see it causing issues for others.\\n\\nAt times it feels like reading physics proofs and theorems, but in a dramatized way, he also takes interesting applications of computer science concepts that were pretty unexpected to me and that I appreciated a lot.\\n\\nThis book gets criticized for the thin characters which I think overall is fair; it definitely focuses on the ideas and sci-fi concepts, but I didn't think that the characters were poorly written, a couple are interesting and even funny. He definitely sort of puts this on the side about halfway through the book and focuses primarily on the ideas, which I'm ok with.\\n\\nReally looking forward to the next two books as I've heard they're even better. I'm really glad to have read this and kind of mad at myself for waiting so long. Definitely a unique style of sci-fi that is sort of a more technical version of Clarke in a lot of ways. Can't say I've read anything quite like this even though it uses familiar sci-fi concepts, the way they are blended together and executed is really interesting.","highlightCount":61,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1730036533l/58709846.jpg","asin":"B00IQO403K","goodreadsUrl":"https://www.goodreads.com/book/show/58709846-the-three-body-problem","kindleUrl":"https://amazon.com/dp/B00IQO403K","matchMethod":"asin"},{"id":"jonathan-strange-mr-norrell-27d11c80","readMonth":{"month":"Aug","year":"2022","day":"24","sort":"2022-08-24"},"title":"Jonathan Strange & Mr Norrell","author":"Clarke, Susanna","series":"","review":"This was good, but it's just too damn long and not really building towards anything.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1743119988l/14201.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/14201.Jonathan_Strange_Mr_Norrell","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"mister-slaughter-d8abcaa6","readMonth":{"month":"Aug","year":"2022","day":"26","sort":"2022-08-26"},"title":"Mister Slaughter","author":"McCammon, Robert","series":"Matthew Corbett #3","review":"","highlightCount":24,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1629073896l/58777614.jpg","asin":"B099N7XT93","goodreadsUrl":"https://www.goodreads.com/book/show/58777614-mister-slaughter","kindleUrl":"https://amazon.com/dp/B099N7XT93","matchMethod":"asin"},{"id":"redhands-daughter-b9817601","readMonth":{"month":"Aug","year":"2022","day":"29","sort":"2022-08-29"},"title":"Redhand's Daughter","author":"King, William","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1491582081l/34818314.jpg","asin":"B0DM1PJ44R","goodreadsUrl":"https://www.goodreads.com/book/show/34818314-redhand-s-daughter","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"providence-rider-51c38416","readMonth":{"month":"Aug","year":"2022","day":"30","sort":"2022-08-30"},"title":"The Providence Rider","author":"McCammon, Robert","series":"Matthew Corbett #4","review":"It's safe to say that this series is definitely one of my all time favorites now. McCammon really utilizes and pays off a lot of stuff he's been setting up in the past few books here. Just a masterful plot that has a lot of interesting threads that all tie together in a satisfying way. Highly recommend this series and this book is in the tier of the first two books which are some of McCammon's best.\\n\\nReally excited to continue this series, it's a ton of fun, has excellent writing, and interesting themes and characters that feel alive.","highlightCount":17,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1629254084l/58797716.jpg","asin":"B099MPWNTZ","goodreadsUrl":"https://www.goodreads.com/book/show/58797716-the-providence-rider","kindleUrl":"https://amazon.com/dp/B099MPWNTZ","matchMethod":"asin"},{"id":"gap-into-conflict-real-story-27373c9d","readMonth":{"month":"Sep","year":"2022","day":"02","sort":"2022-09-02"},"title":"The Gap Into Conflict: The Real Story","author":"Donaldson, Stephen R.","series":"The Gap Cycle #1","review":"The main character is one of the worst people you'll ever meet and the book is pretty damn bleak. Has a very pulpy feel and is absolutely grimdark. The story in this one is pretty basic and it's hard to tell what the overall series will be about. Some interesting world building and cool space battles. I'm interested enough to continue with the next one.","highlightCount":14,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1589771795l/8148691.jpg","asin":"B002SXIEJQ","goodreadsUrl":"https://www.goodreads.com/book/show/8148691-the-gap-into-conflict","kindleUrl":"https://amazon.com/dp/B002SXIEJQ","matchMethod":"asin"},{"id":"all-pretty-horses-27b7577b","readMonth":{"month":"Sep","year":"2022","day":"02","sort":"2022-09-02"},"title":"All the Pretty Horses","author":"McCarthy, Cormac","series":"The Border Trilogy, #1","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1706386113l/469571.jpg","asin":"0679744398","goodreadsUrl":"https://www.goodreads.com/book/show/469571.All_the_Pretty_Horses","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"dark-forest-1d18dca7","readMonth":{"month":"Sep","year":"2022","day":"05","sort":"2022-09-05"},"title":"The Dark Forest","author":"Liu, Cixin","series":"Remembrance of Earth’s Past, #2","review":"This book has definitely objectively weak points and some pretty bad character development... However I just love the ideas explored and some of the aspects I'll be thinking about for quite some time to come. Very different from the first book in many ways so the style can be a bit jarring, once I got into it though I really enjoyed it.","highlightCount":74,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1440156932l/24375664.jpg","asin":"B00R13OYU6","goodreadsUrl":"https://www.goodreads.com/book/show/24375664-the-dark-forest","kindleUrl":"https://amazon.com/dp/B00R13OYU6","matchMethod":"asin"},{"id":"wolves-of-calla-6d8bfb3f","readMonth":{"month":"Sep","year":"2022","day":"07","sort":"2022-09-07"},"title":"Wolves of the Calla","author":"King, Stephen","series":"The Dark Tower, #5","review":"I love the number 19","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387741073l/19721271.jpg","asin":"B0DLT6BQKW","goodreadsUrl":"https://www.goodreads.com/book/show/19721271-wolves-of-the-calla","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"gap-into-vision-forbidden-knowledge-7bf4756b","readMonth":{"month":"Sep","year":"2022","day":"09","sort":"2022-09-09"},"title":"The Gap Into Vision: Forbidden Knowledge","author":"Donaldson, Stephen R.","series":"The Gap Cycle #2","review":"So this is the most nihilistic and bleak series I've read so far, yep it's pretty rough to read at times. Donaldson roughly prioritizes\\n\\n1. Torturing and abusing his characters\\n2. Interpersonal politics\\n3. Cool sci-fi stuff\\n\\nin that order. The first half of the book is definitely some of the most hopeless and brutal stuff I've read, the second half prioritizes cool sci-fi stuff a lot more thankfully and has a lot of interesting setup for the rest of the series.","highlightCount":27,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1589772000l/9241437.jpg","asin":"B003V4BP1U","goodreadsUrl":"https://www.goodreads.com/book/show/9241437-the-gap-into-vision","kindleUrl":"https://amazon.com/dp/B003V4BP1U","matchMethod":"asin"},{"id":"silver-spike-1921adcd","readMonth":{"month":"Sep","year":"2022","day":"09","sort":"2022-09-09"},"title":"The Silver Spike","author":"Cook, Glen","series":"The Chronicles of the Black Company, #3.5","review":"Going to shelve this for now, Black Company isn't for me. Hard for me to care about it.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1767529129l/400914.jpg","asin":"0812502205","goodreadsUrl":"https://www.goodreads.com/book/show/400914.The_Silver_Spike","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"song-of-susannah-c203b068","readMonth":{"month":"Sep","year":"2022","day":"11","sort":"2022-09-11"},"title":"Song of Susannah","author":"King, Stephen","series":"The Dark Tower, #6","review":"Liked this maybe a little bit less than the other books but still really enjoyed it. Also the thing that bothers other people about this book I really enjoyed and it seemed to fit thematically with the rest of the series. Nervous about the last book because I know it doesn't land with a lot of people, but so far I'm a big fan of the series.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1624734846l/58370715.jpg","asin":"B000FC1QM4","goodreadsUrl":"https://www.goodreads.com/book/show/58370715-song-of-susannah","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"academic-exercises-f0949755","readMonth":{"month":"Sep","year":"2022","day":"18","sort":"2022-09-18"},"title":"Academic Exercises","author":"Parker, K.J.","series":"","review":"Really enjoyed this short story collection. He writes a great rougish smart asshole type character from first person really well and it doesn't get old even though his characters have similar personalities. He also understands military history very well and the fighting feels authentic.\\n\\nHis characters usually have unique careers that are outside what you're used to in other fantasy stories such as engineers, alchemists, scholars, and academics. Even his wizards are misunderstood philosophers and scientists.\\n\\nLooking forward to reading more by him in the future.","highlightCount":60,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1636810570l/20919846.jpg","asin":"B00M6BXQVQ","goodreadsUrl":"https://www.goodreads.com/book/show/20919846-academic-exercises","kindleUrl":"https://amazon.com/dp/B00M6BXQVQ","matchMethod":"title-author"},{"id":"dark-tower-ea2e716d","readMonth":{"month":"Sep","year":"2022","day":"22","sort":"2022-09-22"},"title":"The Dark Tower","author":"King, Stephen","series":"The Dark Tower, #7","review":"3.5/5\\n\\nI liked this one, didn't love it. It had a lot of strange decisions and wasted potential, King sort of just writes what he feels like writing at times and doesn't plan things out in a way that would be overall more satisfying. Some of the ideas are interesting but I felt like he needed to tie things up a bit more with previous books and the endings for many of the characters weren't satisfying, particularly for many of the antagonists.\\n\\nOverall probably my least favorite Dark Tower book. I did really enjoy the series overall and it's a very unique and interesting series that is weird and out there in many ways which makes it impossible to tell what direction it'll go into next.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1433530080l/6277040.jpg","asin":"B0DLT7G3HL","goodreadsUrl":"https://www.goodreads.com/book/show/6277040-the-dark-tower","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"paper-menagerie-and-other-stories-df03c949","readMonth":{"month":"Sep","year":"2022","day":"23","sort":"2022-09-23"},"title":"The Paper Menagerie and Other Stories","author":"Liu, Ken","series":"","review":"","highlightCount":52,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1425704955l/25089595.jpg","asin":"B00TBKYK60","goodreadsUrl":"https://www.goodreads.com/book/show/25089595-the-paper-menagerie-and-other-stories","kindleUrl":"https://amazon.com/dp/B00TBKYK60","matchMethod":"asin"},{"id":"column-of-fire-1567bafa","readMonth":{"month":"Sep","year":"2022","day":"25","sort":"2022-09-25"},"title":"A Column of Fire","author":"Follett, Ken","series":"Kingsbridge, #3","review":"4.5/5\\n\\nI liked this the least out of the other Kingsbridge books but it's still better than most other books I've read. I've become addicted to Follet's style of intricate plots powered by realistic characters that are important to historical events.\\n\\nThis one has a bit of a larger scale which caused the characters to be a bit less sharp and have moments that didn't hit as hard as some in the previous books. The conflict between the Protestants and Catholics in this book is really interesting and makes this one more about espionage and politics than the conflicts in the town of Kingsbridge itself. Follet's exploration of religion as a human organization is very interesting and I think he handles perspectives on both sides fairly.\\n\\nI'll definitely be reading more Follett in the near future and I hope to enjoy his work as much as I have this series, really top tier historical fiction that is very compelling and page turning despite their hefty size. Highly recommend.","highlightCount":15,"myGoodreadsRating":5,"myReviewRating":4.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1595748595l/40691185.jpg","asin":"B01N1U8IB3","goodreadsUrl":"https://www.goodreads.com/book/show/40691185-a-column-of-fire","kindleUrl":"https://amazon.com/dp/B01N1U8IB3","matchMethod":"asin"},{"id":"river-of-souls-9fa0b7e2","readMonth":{"month":"Sep","year":"2022","day":"26","sort":"2022-09-26"},"title":"The River of Souls","author":"McCammon, Robert","series":"Matthew Corbett #5","review":"","highlightCount":4,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1632242551l/58676070.jpg","asin":"B099MSPGHP","goodreadsUrl":"https://www.goodreads.com/book/show/58676070-the-river-of-souls","kindleUrl":"https://amazon.com/dp/B099MSPGHP","matchMethod":"asin"},{"id":"freedom-of-mask-ab82e1c6","readMonth":{"month":"Oct","year":"2022","day":"02","sort":"2022-10-02"},"title":"Freedom of the Mask","author":"McCammon, Robert","series":"Matthew Corbett #6","review":"Very good book that goes in interesting directions but also treads some similar ground to one of the previous books. Ends on a bit of a cliffhanger which is now two of these books in a row to do so, but sets up the next book well. Overall still enjoying this series a lot and the writing can be quite beautiful at times with great characters.","highlightCount":11,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1632242634l/58676071.jpg","asin":"B099MZ937J","goodreadsUrl":"https://www.goodreads.com/book/show/58676071-freedom-of-the-mask","kindleUrl":"https://amazon.com/dp/B099MZ937J","matchMethod":"asin"},{"id":"haunting-of-hill-house-2ef1d8fa","readMonth":{"month":"Oct","year":"2022","day":"05","sort":"2022-10-05"},"title":"The Haunting of Hill House","author":"Jackson, Shirley","series":"","review":"","highlightCount":16,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1624554054l/50534595.jpg","asin":"B004SS1MJI","goodreadsUrl":"https://www.goodreads.com/book/show/50534595-the-haunting-of-hill-house","kindleUrl":"https://amazon.com/dp/B004SS1MJI","matchMethod":"asin"},{"id":"deaths-end-d0dd2540","readMonth":{"month":"Oct","year":"2022","day":"07","sort":"2022-10-07"},"title":"Death's End","author":"Liu, Cixin","series":"Remembrance of Earth’s Past, #3","review":"I made this review very non-spoiler for those interested in the series as a whole.\\n\\nThis is definitely one of my favorite sci-fi books and series, Liu has a huge amount of really cool and often crazy ideas packed into this one. He could have gone the easy path for this final book but he went down the more interesting path and the story goes in directions you wouldn't expect after the end of book 2. This book is incredibly heavy and dark at times, I loved it but it took some time to chew on the ideas and the implications of the plot developments. There's a healthy dose of nihilism in this book, but often sci-fi is a bit too optimistic for my tastes and this has a good kick in the teeth for overly optimistic sci-fi. You could probably label parts as grimdark sci-fi as there's some definite bleak moments that are intense and graphic as well as existentially disturbing.\\n\\nI'll be thinking about this series for quite some time, I absolutely loved my time with it and this is the reason I read sci-fi in general. I can see why this wouldn't be for everyone but personally this is right up my alley. Will be interested in anything Liu comes out with in the future.","highlightCount":70,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1441485334l/25735618.jpg","asin":"B00WDVKZY0","goodreadsUrl":"https://www.goodreads.com/book/show/25735618-death-s-end","kindleUrl":"https://amazon.com/dp/B00WDVKZY0","matchMethod":"asin"},{"id":"skeleton-crew-2b3673bd","readMonth":{"month":"Oct","year":"2022","day":"08","sort":"2022-10-08"},"title":"Skeleton Crew","author":"King, Stephen","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1659066549l/30650041.jpg","asin":"1501143506","goodreadsUrl":"https://www.goodreads.com/book/show/30650041-skeleton-crew","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"sixteen-ways-to-defend-walled-city-9e691fdc","readMonth":{"month":"Oct","year":"2022","day":"13","sort":"2022-10-13"},"title":"Sixteen Ways to Defend a Walled City","author":"Parker, K.J.","series":"The Siege, #1","review":"KJP sort of writes the same protagonist every time, but the smart rougish engineer character Orhan does click with me and the narrative voice is light and amusing. KJP also has a great understanding of medieval warfare and siege weapons so the war and engagements all feel realistic and are often about things going sideways and how to overcome it. Overall a very enjoyable listen and I really enjoy his style of writing.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1553885082l/37946419.jpg","asin":"0316270792","goodreadsUrl":"https://www.goodreads.com/book/show/37946419-sixteen-ways-to-defend-a-walled-city","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"misery-46047b67","readMonth":{"month":"Oct","year":"2022","day":"14","sort":"2022-10-14"},"title":"Misery","author":"King, Stephen","series":"","review":"Absolutely loved it, definitely one of my favorite King books now. I really enjoy the lack of supernatural elements as well.\\n\\nWhat King can do with two characters in a single location is mind blowing, it stays interesting, exciting, and horrific until the end. Annie Wilkes is a great character and antagonist. Lots of disturbing stuff here to chew on.\\n\\nThe commentary and themes of an author's relationship with his fans, his work, and himself lands really well and you can tell it is almost autobiographical as some of the best stories are. A really unique horror story that I'll be thinking about for a long time, should have read this sooner.","highlightCount":40,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1632321032l/59053857.jpg","asin":"B018ER7K76","goodreadsUrl":"https://www.goodreads.com/book/show/59053857-misery","kindleUrl":"https://amazon.com/dp/B018ER7K76","matchMethod":"asin"},{"id":"priest-of-bones-4f3c72cf","readMonth":{"month":"Oct","year":"2022","day":"15","sort":"2022-10-15"},"title":"Priest of Bones","author":"McLean, Peter","series":"War for the Rose Throne, #1","review":"*Dies in mid*\\n\\nOne of the most aggressively average books I've read in quite some time. It was competently written but I didn't feel much reading it. I won't be continuing.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1517589565l/37884491.jpg","asin":"0451490215","goodreadsUrl":"https://www.goodreads.com/book/show/37884491-priest-of-bones","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"cloud-cuckoo-land-113f6076","readMonth":{"month":"Oct","year":"2022","day":"20","sort":"2022-10-20"},"title":"Cloud Cuckoo Land","author":"Doerr, Anthony","series":"","review":"I really liked this one and was engaged from beginning to end. I do think having this many storylines made each storyline progress a lot slower than I would have liked and I didn't connect with some of the characters as much as I hoped, but I still think it's mostly successful in hitting the feels.\\n\\nI also was a bit unsatisfied with the ending and was hoping things would tie together a bit more, they did in some aspects but for the amount of balls in the air across space and time was hoping for a larger payoff. Reminds me of Fredrik Backman but with less quirky characters (which can be a good thing if you're not in the mood for that). Will like to read Doerr's other book at some point in the future, he definitely intrigued me and glad I read this, but think he could write a different book that lands even better for me.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1618589128l/56783258.jpg","asin":"1982168439","goodreadsUrl":"https://www.goodreads.com/book/show/56783258-cloud-cuckoo-land","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"city-of-last-chances-52b786c0","readMonth":{"month":"Oct","year":"2022","day":"23","sort":"2022-10-23"},"title":"City of Last Chances","author":"Tchaikovsky, Adrian","series":"The Tyrant Philosophers, #1","review":"3.5/5\\n\\nI received a copy of this book in exchange for an honest review.\\n\\nTchaikovsky is one of my favorite science fiction writers and with his fantasy I don't have a great record with as I've DNFed Doors of Eden and had issues with Guns of the Dawn.\\n\\nThis book throws you in the deep end to start as there's a lot going on in the city of Ilmar with a lot of different POVs most of which are in different factions and parts of the city. The number of different characters is a strength and a weakness of the book where there's a lot of interesting things to keep track of and I really enjoyed the beginning to the middle of the book.\\n\\nOne thing that surprised me was the amount of horror elements. I really liked this aspect of the book and think Tchaikovsky does this well where it's unexpected and adds some cool elements of chaos to the book.\\n\\nThe ending is a bit weaker though for me as I didn't feel completely satisfied with how everything tied together and some of the mysteries that were set up in the beginning didn't pay off as much as I hoped.\\n\\nThe characters are all interesting and well done, they're sufficiently gray as are the rebel factions where it's a bit more complicated than rebels good, occupiers bad.\\n\\nOverall I think this was a bit too ambitious for a standalone and needed more time to incorporate the different elements of the book either by being much longer or a part of a series. Also cutting some aspects could have made what's there a bit stronger.\\n\\nI'm glad I read this book and there's a lot of good stuff in it, it's just a bit hard to review and think with a few changes it could have been much stronger.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1655508932l/60147395.jpg","asin":"1801108420","goodreadsUrl":"https://www.goodreads.com/book/show/60147395-city-of-last-chances","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"gap-into-power-dark-and-hungry-god-arises-939a1b63","readMonth":{"month":"Oct","year":"2022","day":"25","sort":"2022-10-25"},"title":"The Gap Into Power: A Dark and Hungry God Arises","author":"Donaldson, Stephen R.","series":"The Gap Cycle #3","review":"Easily the best in the series. Donaldson handles expanding the scope really well. This has to be one of the most complex political books I've read. Most of the characters have hidden agendas and their allegiances change depending on the advantages it brings them, makes for an exciting and dynamic read.\\n\\nThe climax of the book is awesome and the way everything ties together is exciting and has cool implications for the next books.","highlightCount":28,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1589772199l/8183835.jpg","asin":"B002SXIEW8","goodreadsUrl":"https://www.goodreads.com/book/show/8183835-the-gap-into-power","kindleUrl":"https://amazon.com/dp/B002SXIEW8","matchMethod":"asin"},{"id":"lesser-dead-3d3d36da","readMonth":{"month":"Oct","year":"2022","day":"30","sort":"2022-10-30"},"title":"The Lesser Dead","author":"Buehlman, Christopher","series":"","review":"This is a really fun first person vampire story set in New York City in the 1970s. Lots of brutality and visceral moments from our wise cracking narrator. Some really creepy moments as well, easy to read and I enjoyed this quite a bit. Buehlman's writing is great here, he knows what makes horror work.","highlightCount":37,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1400696149l/22249404.jpg","asin":"B00INIXKHQ","goodreadsUrl":"https://www.goodreads.com/book/show/22249404-the-lesser-dead","kindleUrl":"https://amazon.com/dp/B00INIXKHQ","matchMethod":"title-author"},{"id":"exorcist-1fc8eafb","readMonth":{"month":"Oct","year":"2022","day":"30","sort":"2022-10-30"},"title":"The Exorcist","author":"Blatty, William Peter","series":"","review":"I like the movie substantially more and it works better in a visual medium. The pacing was a bit wonky, some sections of dialog go on for too long. There's a lot of creepy stuff that was good so enjoyed some parts well enough.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1759597327l/32800812.jpg","asin":"B004V5180G","goodreadsUrl":"https://www.goodreads.com/book/show/32800812-the-exorcist","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"pandoras-star-06c7c43f","readMonth":{"month":"Nov","year":"2022","day":"02","sort":"2022-11-02"},"title":"Pandora's Star","author":"Hamilton, Peter F.","series":"Commonwealth Saga #1","review":"Biiiigggg sci-fi book. Actually amazed at how much I devoured this considering the size. It's not as dense as I thought and the prose is nice and readable with a good amount of descriptions of the world and landscapes. The characters are also very good and I ended up caring about a lot of them.\\n\\nThis isn't actually as idea heavy as some other sci-fi books, the focus is more about the plot, the world building, and the characters, although there are cool ideas a lot of them stem from the technology developed and how that affects society at large.\\n\\nReally happy I read this and starting the next big boi immediately.","highlightCount":50,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328303570l/6136470.jpg","asin":"B000FC1AFC","goodreadsUrl":"https://www.goodreads.com/book/show/6136470-pandora-s-star","kindleUrl":"https://amazon.com/dp/B000FC1AFC","matchMethod":"asin"},{"id":"judas-unchained-77685438","readMonth":{"month":"Nov","year":"2022","day":"11","sort":"2022-11-11"},"title":"Judas Unchained","author":"Hamilton, Peter F.","series":"Commonwealth Saga #2","review":"Wrapped up in a really satisfying way and a big climax to the end. The action is awesome and the plot and amount of POVs is really complex. Definitely a top tier space opera. The ideas aren't as focused on as other sci-fi novels which is good to know if you're looking for a particular style.\\n\\nWill definitely be following up with the Void trilogy in a few months and interested to see where the Commonwealth is headed. Hamilton is definitely on my radar in a big way now.","highlightCount":32,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328308952l/6336986.jpg","asin":"B000FCKPJ4","goodreadsUrl":"https://www.goodreads.com/book/show/6336986-judas-unchained","kindleUrl":"https://amazon.com/dp/B000FCKPJ4","matchMethod":"asin"},{"id":"mort-c0d975be","readMonth":{"month":"Nov","year":"2022","day":"13","sort":"2022-11-13"},"title":"Mort","author":"Pratchett, Terry","series":"Discworld, #4; Death, #1","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388181166l/386372.jpg","asin":"0061020680","goodreadsUrl":"https://www.goodreads.com/book/show/386372.Mort","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"how-to-rule-empire-and-get-away-with-it-f1e93112","readMonth":{"month":"Nov","year":"2022","day":"15","sort":"2022-11-15"},"title":"How to Rule an Empire and Get Away with It","author":"Parker, K.J.","series":"The Siege, #2","review":"The premise for the book is really good and different from the first book but it sort of loses steam about halfway through and the protagonist isn't as involved in the plot as he really should be.\\n\\nProbably my least favorite KJP story so far but there are moments that I liked and enjoyed the writing a bit, just didn't feel like it cohesively tied together that well. I'll read the last book and see what happens.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1600352528l/49088677.jpg","asin":"031649867X","goodreadsUrl":"https://www.goodreads.com/book/show/49088677-how-to-rule-an-empire-and-get-away-with-it","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"why-we-sleep-unlocking-power-of-sleep-and-dreams-39dc65e4","readMonth":{"month":"Nov","year":"2022","day":"17","sort":"2022-11-17"},"title":"Why We Sleep: Unlocking the Power of Sleep and Dreams","author":"Walker, Matthew","series":"","review":"This is a horror book. Horrifying if you're not completely satisfied with your sleep life. Basically lack of sleep is affecting most of the industrialized world and killing us and making us unhappy and unhealthy in a myriad of ways and this is scientifically proven.\\n\\nThere's not a lot of answers for how to fix this unfortunately but there's some suggestions that might be helpful. The world does need to change its relationship with sleep and this helps shed some light on the reality of how humans sleep and why they need to do so.\\n\\nA lot of the studies in the book are incredibly interesting and some are mind blowing with some of the implications including the ability to influence dreams and early ways to read brain waves and actually figure out what someone is dreaming about.\\n\\nHighly recommend this book, such an interesting read, but still figuring out how to apply the learnings to my own life.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1556604137l/34466963.jpg","asin":"","goodreadsUrl":"https://www.goodreads.com/book/show/34466963-why-we-sleep","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"shamans-crossing-979c9093","readMonth":{"month":"Nov","year":"2022","day":"19","sort":"2022-11-19"},"title":"Shaman's Crossing","author":"Hobb, Robin","series":"Soldier Son, #1","review":"I really liked the beginning and end of this book but the middle was a bit of a drag for me. I'll be reading the next book, there's enough plot hooks to make me think that I will like Forest Mage more than Shaman's Crossing.\\n\\nThe writing was pretty good, but definitely not at the levels of Return of the Elderlings which is my favorite fantasy series. This series is a lot more plot focused than ROTE and you don't get as much development into character relationships as that series which is where Hobb's strengths lie. I definitely didn't dislike this, but it did feel like a fairly standard story with some hints at deeper themes under the surface, they just don't appear that much here.","highlightCount":49,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1296245382l/6478048.jpg","asin":"B000FCKCWO","goodreadsUrl":"https://www.goodreads.com/book/show/6478048-shaman-s-crossing","kindleUrl":"https://amazon.com/dp/B000FCKCWO","matchMethod":"title-candidate-author"},{"id":"pushing-ice-efc0f85f","readMonth":{"month":"Nov","year":"2022","day":"24","sort":"2022-11-24"},"title":"Pushing Ice","author":"Reynolds, Alastair","series":"","review":"I really enjoyed this a lot. Reynolds grabs you right away with a couple interesting mysteries that have big implications for their scientific impact.\\n\\nThis book also was much different from what I was expecting, I was expecting something a bit more grounded and having harder scientific foundations, but I did really like what I ended up getting.\\n\\nWill be reading more Reynolds very soon, both of the standalone novels I've read have been hits with me.","highlightCount":7,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1599833343l/48991704.jpg","asin":"B0819W1L1W","goodreadsUrl":"https://www.goodreads.com/book/show/48991704-pushing-ice","kindleUrl":"https://amazon.com/dp/B0819W1L1W","matchMethod":"asin"},{"id":"blade-of-immortal-1-blood-of-thousand-575c70b9","readMonth":{"month":"Nov","year":"2022","day":"27","sort":"2022-11-27"},"title":"Blade of the Immortal, Volume 1: Blood of a Thousand","author":"Samura, Hiroaki","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347722950l/313419.jpg","asin":"1569712395","goodreadsUrl":"https://www.goodreads.com/book/show/313419.Blade_of_the_Immortal_Volume_1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blade-of-immortal-2-cry-of-worm-27e28537","readMonth":{"month":"Nov","year":"2022","day":"27","sort":"2022-11-27"},"title":"Blade of the Immortal, Volume 2: Cry of the Worm","author":"Samura, Hiroaki","series":"","review":"Way better than the first volume","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/comp
