and looking forward to reading more of his work.","highlightCount":29,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1419312967l/17406545.jpg","asin":"B009NF6Z2K","goodreadsUrl":"https://www.goodreads.com/book/show/17406545-nos4a2","kindleUrl":"https://amazon.com/dp/B009NF6Z2K","matchMethod":"title-candidate-author"},{"id":"beartown-a1fb8fdd","readMonth":{"month":"Dec","year":"2022","day":"09","sort":"2022-12-09"},"title":"Beartown","author":"Backman, Fredrik","series":"Beartown, #1","review":"","highlightCount":1,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1482108618l/33413128.jpg","asin":"B01KG5GQDS","goodreadsUrl":"https://www.goodreads.com/book/show/33413128-beartown","kindleUrl":"https://amazon.com/dp/B01KG5GQDS","matchMethod":"title-candidate-author"},{"id":"blade-of-immortal-5-on-silent-wings-ii-726e6e59","readMonth":{"month":"Dec","year":"2022","day":"10","sort":"2022-12-10"},"title":"Blade of the Immortal, Volume 5: On Silent Wings II","author":"Samura, Hiroaki","series":"","review":"This one was pretty good","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1403207163l/460588.jpg","asin":"1569714444","goodreadsUrl":"https://www.goodreads.com/book/show/460588.Blade_of_the_Immortal_Volume_5","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"us-against-you-39206817","readMonth":{"month":"Dec","year":"2022","day":"11","sort":"2022-12-11"},"title":"Us Against You","author":"Backman, Fredrik","series":"Beartown, #2","review":"This builds off the first book in the best ways. Some great characters and hard hitting moments. These aren't really standalone and feel like they should be read close together. Really love the town dynamics and the characters get even more depth here.\\n\\nBackman has some great writing and the themes and foreshadowing kept me really engaged. Felt like I binged this one and had to know what was going to happen.\\n\\nMuch pain, highly recommend.","highlightCount":2,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1516019348l/36373463.jpg","asin":"B078M5KLX9","goodreadsUrl":"https://www.goodreads.com/book/show/36373463-us-against-you","kindleUrl":"https://amazon.com/dp/B078M5KLX9","matchMethod":"title-candidate-author"},{"id":"orcslayer-5f633abb","readMonth":{"month":"Dec","year":"2022","day":"13","sort":"2022-12-13"},"title":"Orcslayer","author":"Long, Nathan","series":"Gotrek & Felix, #8","review":"Nathan Long does a great job, excited to continue. This one starts with a 20 year time skip. Very action heavy but some great lore and Dwarf shenanigans.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1389312653l/334409.jpg","asin":"1844163911","goodreadsUrl":"https://www.goodreads.com/book/show/334409.Orcslayer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"winners-5a6d3064","readMonth":{"month":"Dec","year":"2022","day":"17","sort":"2022-12-17"},"title":"The Winners","author":"Backman, Fredrik","series":"Beartown, #3","review":"What a great trilogy with well realized characters and relationships. This one is a bit less focused on the plot but it's great to hang out in Beartown and experience all the pain with the characters. I think I prefer Us Against You a little more but this one is also great.\\n\\nBackman can hurt you really well in beautiful ways. The ending stretch is absolutely unrelenting and emotionally crushing.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1645483248l/60318890.jpg","asin":"B09R2J1DXF","goodreadsUrl":"https://www.goodreads.com/book/show/60318890-the-winners","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"children-of-memory-0e477c1c","readMonth":{"month":"Dec","year":"2022","day":"20","sort":"2022-12-20"},"title":"Children of Memory","author":"Tchaikovsky, Adrian","series":"Children of Time, #3","review":"I received a copy of this book in exchange for an honest review.\\n\\nTchaikovsky could have just done a similar thing as the last two books with a new alien race and a tiny variation but here he gets weird with it and plays with the concepts of Time (and the Children of...?), Memory, and makes this a surprisingly h(H)uman-centric novel. It's clear he really challenged both himself and the reader which makes for an engaging read, but not often easy. There's also a bit more fantasy elements in this sci-fi and it's not as science based as it was in the previous books.\\n\\nHis writing here is some of his best, prose-wise. There's some great passages and allusions to other works as well as themes that work on multiple levels, but it's also challenging being in the middle of the book and sometimes you feel like you missed something or are confused when it's intentional.\\n\\nI can see this being a divisive entry in the series, but I personally loved it, although I can see some readers being frustrated with it, seems like a good idea to put this as the third entry to a trilogy for the readers that are already invested in this series and willing to \\"go on an adventure\\".\\n\\nI am very happy to say that he's one of my favorite authors who has astounding productivity and throughput. Highly recommend this series and he's an author that I drop everything to read a new one of his books and have my mind expanded.","highlightCount":29,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1655929460l/60850767.jpg","asin":"B09ZFBFWN9","goodreadsUrl":"https://www.goodreads.com/book/show/60850767-children-of-memory","kindleUrl":"","matchMethod":"title-author"},{"id":"and-every-morning-way-home-gets-longer-and-longer-18e66a01","readMonth":{"month":"Dec","year":"2022","day":"20","sort":"2022-12-20"},"title":"And Every Morning the Way Home Gets Longer and Longer","author":"Backman, Fredrik","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1472074835l/31373633.jpg","asin":"B01INMZKD8","goodreadsUrl":"https://www.goodreads.com/book/show/31373633-and-every-morning-the-way-home-gets-longer-and-longer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"streets-of-laredo-0990a4a3","readMonth":{"month":"Dec","year":"2022","day":"25","sort":"2022-12-25"},"title":"Streets of Laredo","author":"McMurtry, Larry","series":"Lonesome Dove #2","review":"Not the masterpiece that Lonesome Dove is, but still really good and I enjoyed all my time with this book. Really happy to see some of the character arcs continue from Lonesome Dove and McMurtry is brutal and unforgiving with how he treats these people. Will definitely continue with the other books, some great writing and moments that will stick with me.","highlightCount":87,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1623885010l/58357037.jpg","asin":"B003NE6HJ8","goodreadsUrl":"https://www.goodreads.com/book/show/58357037-streets-of-laredo","kindleUrl":"https://amazon.com/dp/B003NE6HJ8","matchMethod":"title-candidate-author"},{"id":"gap-into-ruin-this-day-all-gods-die-0f33aeb6","readMonth":{"month":"Dec","year":"2022","day":"26","sort":"2022-12-26"},"title":"The Gap Into Ruin: This Day All Gods Die","author":"Donaldson, Stephen R.","series":"The Gap Cycle #5","review":"Really liked it overall, thought the climax was great, just some of the retreading wasn't my favorite. Donaldson has the habit of fully fleshing out scenes of characters learning about events that you already knew about which makes it feel a bit bloated.\\n\\nSome of the writing was really good and he does a great job of bringing the threads together to a satisfying end. Great series if you are interested in sci-fi grimdark, haven't read anything like it before. Of course the content is gruesome especially in the beginning of the series but ends on a hopeful note.","highlightCount":20,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1589772605l/8705855.jpg","asin":"B003TSEL78","goodreadsUrl":"https://www.goodreads.com/book/show/8705855-the-gap-into-ruin","kindleUrl":"https://amazon.com/dp/B003TSEL78","matchMethod":"asin"},{"id":"norwegian-wood-10f4a53d","readMonth":{"month":"Dec","year":"2022","day":"29","sort":"2022-12-29"},"title":"Norwegian Wood","author":"Murakami, Haruki","series":"","review":"Japanese Catcher in the Rye for better or worse.\\n\\nThis is a hard book to rate, I did really enjoy a lot of parts of the book but there's definitely some weirdness to it that gets in the way of it being a fully cohesively satisfying novel. Some of the writing was quite good and I got sucked into the slice of life in Japan narrative.\\n\\nThere's quite a bit of weird sex stuff, so yeah, be prepared for that. Some of it I thought added to the narrative / themes and some was borderline disturbing erotica.\\n\\nSome of the writing captures the human condition really well with the awkwardness, humor, and search for meaning that we all find ourselves in, although as the book went on I felt like the characters actually had less depth. The characters are often very self centered and don't have great healthy relationships with each other which is pretty strange and can come off a little stilted and awkward where it's hard to tell if that's the main character's personality or a shortcoming of the writing.\\n\\nI do think that I'll enjoy other Murakami books more since this is primarily a romance book and there's not much magical realism to be found.","highlightCount":31,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1443842245l/21411194.jpg","asin":"B003XT603Q","goodreadsUrl":"https://www.goodreads.com/book/show/21411194-norwegian-wood","kindleUrl":"https://amazon.com/dp/B003XT603Q","matchMethod":"title-author"},{"id":"golden-compass-bb940bdf","readMonth":{"month":"Dec","year":"2022","day":"29","sort":"2022-12-29"},"title":"The Golden Compass","author":"Pullman, Philip","series":"His Dark Materials, #1","review":"This was ok, I expected more. Lyra bumbles around, gets captured, exposition dump, something happens that's too dark for children, Lyra escapes and somehow ends up where she's supposed to be, repeat. Some interesting world building and sci-fi elements, but I'm not sure if I'm motivated to continue.\\n\\nLots of telling over showing and something like Harry Potter which is for similar ages does a lot better job in immersing you in events instead of telling you about what the plot is and why it matters.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1505766203l/119322.jpg","asin":"B001NAR73E","goodreadsUrl":"https://www.goodreads.com/book/show/119322.The_Golden_Compass","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"subtle-knife-6d5bf28f","readMonth":{"month":"Jan","year":"2023","day":"02","sort":"2023-01-02"},"title":"The Subtle Knife","author":"Pullman, Philip","series":"His Dark Materials, #2","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1535965085l/41637836.jpg","asin":"B00SSJYF8S","goodreadsUrl":"https://www.goodreads.com/book/show/41637836-the-subtle-knife","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"fire-upon-deep-ed04a85d","readMonth":{"month":"Jan","year":"2023","day":"04","sort":"2023-01-04"},"title":"A Fire Upon the Deep","author":"Vinge, Vernor","series":"Zones of Thought, #1","review":"Was sort of hoping for a bit more in either ideas, plot, or characters but there was some good stuff in here. Don't think I'm really chomping at the bit for the next book but maybe in time I will be.\\n\\nHighlight of the book was probably the different alien races and the world building is very interesting and well thought out. The different zones is a really cool idea, wish it was utilitized a bit more but it made for a good justification for why the universe is set up the way it is.","highlightCount":55,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1592229527l/53984167.jpg","asin":"B000FBJAGO","goodreadsUrl":"https://www.goodreads.com/book/show/53984167-a-fire-upon-the-deep","kindleUrl":"https://amazon.com/dp/B000FBJAGO","matchMethod":"asin"},{"id":"shining-7a769148","readMonth":{"month":"Jan","year":"2023","day":"06","sort":"2023-01-06"},"title":"The Shining","author":"King, Stephen","series":"The Shining #1","review":"The film is one of my all time favorite horror movies and hadn't read the book before. This shows how great King is with character development, non supernatural horror, and writing about addiction and isolation. The Overlook is hard to beat as one of the best haunted houses, excellent setting that's a character of its own.","highlightCount":4,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1693686319l/6324651.jpg","asin":"B001BANK32","goodreadsUrl":"https://www.goodreads.com/book/show/6324651-the-shining","kindleUrl":"https://amazon.com/dp/B001BANK32","matchMethod":"title-author"},{"id":"twenty-thousand-leagues-under-sea-b824dba7","readMonth":{"month":"Jan","year":"2023","day":"08","sort":"2023-01-08"},"title":"Twenty Thousand Leagues Under the Sea","author":"Verne, Jules","series":"","review":"","highlightCount":2,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1577198922l/49826655.jpg","asin":"B0819YK55Y","goodreadsUrl":"https://www.goodreads.com/book/show/49826655-twenty-thousand-leagues-under-the-sea","kindleUrl":"https://amazon.com/dp/B0819YK55Y","matchMethod":"asin"},{"id":"permutation-city-b8c22a84","readMonth":{"month":"Jan","year":"2023","day":"14","sort":"2023-01-14"},"title":"Permutation City","author":"Egan, Greg","series":"","review":"","highlightCount":35,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1385107840l/18883652.jpg","asin":"B00FDWCPV2","goodreadsUrl":"https://www.goodreads.com/book/show/18883652-permutation-city","kindleUrl":"https://amazon.com/dp/B00FDWCPV2","matchMethod":"asin"},{"id":"dreaming-void-4c63f4f2","readMonth":{"month":"Jan","year":"2023","day":"15","sort":"2023-01-15"},"title":"The Dreaming Void","author":"Hamilton, Peter F.","series":"Void, #1","review":"Couldn't put this down, binged it until I finished. The world building coming off the last series was fantastic and it goes in an interesting and mysterious new direction. I also liked the fantasy POV that a lot of people struggle with.","highlightCount":18,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1451587419l/8161930.jpg","asin":"B000UZJQLE","goodreadsUrl":"https://www.goodreads.com/book/show/8161930-the-dreaming-void","kindleUrl":"https://amazon.com/dp/B000UZJQLE","matchMethod":"asin"},{"id":"cardinal-black-c0824e4a","readMonth":{"month":"Jan","year":"2023","day":"18","sort":"2023-01-18"},"title":"Cardinal Black","author":"McCammon, Robert","series":"Matthew Corbett #7","review":"This is a really fun adventure story with some great writing and layers of thematic depth. I was completely engaged from beginning to end and highly recommend the series overall.\\n\\nThere's usually some plot element in these books that make me scratch my head a bit and aren't believable but wasn't too egregious in this one. Looking forward to the next one and at that point I'll be completely caught up with the series.","highlightCount":23,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1632242705l/58676072.jpg","asin":"B099MCC6SN","goodreadsUrl":"https://www.goodreads.com/book/show/58676072-cardinal-black","kindleUrl":"https://amazon.com/dp/B099MCC6SN","matchMethod":"asin"},{"id":"temporal-void-e06b588d","readMonth":{"month":"Jan","year":"2023","day":"27","sort":"2023-01-27"},"title":"The Temporal Void","author":"Hamilton, Peter F.","series":"Void #2","review":"Still a good book but definitely the weakest Hammy book I've read so far. Lots of pacing issues and the fantasy sections were way too long and took up way too much of the book. Still really excited to read the final book of the trilogy.","highlightCount":25,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1451588363l/8161929.jpg","asin":"B001NLL9FA","goodreadsUrl":"https://www.goodreads.com/book/show/8161929-the-temporal-void","kindleUrl":"https://amazon.com/dp/B001NLL9FA","matchMethod":"asin"},{"id":"man-from-st-petersburg-09e441c9","readMonth":{"month":"Jan","year":"2023","day":"28","sort":"2023-01-28"},"title":"The Man From St. Petersburg","author":"Follett, Ken","series":"","review":"Solid political thriller and espionage story on the cusp of WW1. Definitely prefer Follet's historical epics but glad to have read this.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1578592071l/50371995.jpg","asin":"B0024CEY36","goodreadsUrl":"https://www.goodreads.com/book/show/50371995-the-man-from-st-petersburg","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vagabond-1-8052e31a","readMonth":{"month":"Jan","year":"2023","day":"29","sort":"2023-01-29"},"title":"Vagabond, Vol. 1","author":"Inoue, Takehiko","series":"","review":"This was awesome, excited to continue. Great characters, art, and themes. The pacing also turned this into quite the page turner.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388734973l/3175995.jpg","asin":"1421520540","goodreadsUrl":"https://www.goodreads.com/book/show/3175995-vagabond-vol-1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vagabond-2-8e7b85ef","readMonth":{"month":"Feb","year":"2023","day":"01","sort":"2023-02-01"},"title":"Vagabond, Vol. 2","author":"Inoue, Takehiko","series":"","review":"Never pick a fight with a monk","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388734977l/4481995.jpg","asin":"1421522446","goodreadsUrl":"https://www.goodreads.com/book/show/4481995-vagabond-vol-2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"new-york-1e0ff2b5","readMonth":{"month":"Feb","year":"2023","day":"02","sort":"2023-02-02"},"title":"New York","author":"Rutherfurd, Edward","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1320424062l/8258519.jpg","asin":"0345497422","goodreadsUrl":"https://www.goodreads.com/book/show/8258519-new-york","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"and-put-away-childish-things-f69cbc70","readMonth":{"month":"Feb","year":"2023","day":"03","sort":"2023-02-03"},"title":"And Put Away Childish Things","author":"Tchaikovsky, Adrian","series":"","review":"I received a copy of this book in exchange for an honest review.\\n\\nReally interesting and compact Tchaikovsky novella that mixes portal fantasy fairytale with horror and a bit of sci-fi thrown in for spice. I did enjoy the beginning and middle of this quite a bit more than the ending and think it could have been fleshed out a bit more but overall this was really entertaining and quite funny. Definitely a lighthearted read when characters aren't getting brutally impaled.\\n\\nTchaikovsky is one of my favorite authors and this really showcases his range, I've read 4 books of his in the past six months and they've all been very different and tackle varying genres and ideas. Highly recommend this one for a fun quick read that subverts existing tropes in entertaining ways.","highlightCount":12,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1657045409l/61273440.jpg","asin":"1786188791","goodreadsUrl":"https://www.goodreads.com/book/show/61273440-and-put-away-childish-things","kindleUrl":"","matchMethod":"title-only-unique"},{"id":"vagabond-3-08aa7f7c","readMonth":{"month":"Feb","year":"2023","day":"08","sort":"2023-02-08"},"title":"Vagabond, Vol. 3","author":"Inoue, Takehiko","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347732417l/6410661.jpg","asin":"1421522454","goodreadsUrl":"https://www.goodreads.com/book/show/6410661-vagabond-vol-3","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"evolutionary-void-09e517e5","readMonth":{"month":"Feb","year":"2023","day":"10","sort":"2023-02-10"},"title":"The Evolutionary Void","author":"Hamilton, Peter F.","series":"Void, #3","review":"This was an awesome sci-fi trilogy. Overall I did like this a little less from a character perspective than Pandora's Star / Judas Unchained but there's still a lot of cool sci-fi moments, action, and technology.\\n\\nDefinitely will dig into more Hammy this year, he's a hit with me and is very consistently good overall.\\n\\nHe's also quite unique within the genre and has a good blend of both old and new sci-fi that is very readable and interesting.","highlightCount":13,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1451588211l/9230082.jpg","asin":"B003F3PMEI","goodreadsUrl":"https://www.goodreads.com/book/show/9230082-the-evolutionary-void","kindleUrl":"https://amazon.com/dp/B003F3PMEI","matchMethod":"asin"},{"id":"forest-mage-764d54f9","readMonth":{"month":"Feb","year":"2023","day":"15","sort":"2023-02-15"},"title":"Forest Mage","author":"Hobb, Robin","series":"Soldier Son, #2","review":"Incredibly painful, highly recommend. Hobb is my favorite author, Realm of the Elderlings is my favorite series, and the first Soldier Son book I was lukewarm on. Forest Mage has some of her best writing and she's a master at her craft.\\n\\nSo many beautiful and deep passages that work on multiple thematic levels, just some awe inspiring stuff, I highlighted quite a bit. Also she goes in such an unexpected and interesting direction in this book that I really needed after book 1 felt a bit predictable and boring.\\n\\nThis book is quite slow and she takes her time to immerse you in the world and build up the relationships between the characters. Hobb is probably the most skilled at immersing me in her worlds that I have read, you really feel like you are there with Nevare and experiencing his pain.\\n\\nThis book took me a month to read which is pretty slow, but it is heavy and rich and I definitely appreciated it and processed what was going on by taking it slow.\\n\\nOverall this series doesn't have the most involved plot in the world but Hobb elevates it as a master of her craft, interested to see how this ends and will be reading the rest of her bibliography.","highlightCount":101,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1296245041l/6426419.jpg","asin":"B000JMKSZQ","goodreadsUrl":"https://www.goodreads.com/book/show/6426419-forest-mage","kindleUrl":"https://amazon.com/dp/B000JMKSZQ","matchMethod":"asin"},{"id":"bloodchild-and-other-stories-715decb0","readMonth":{"month":"Feb","year":"2023","day":"18","sort":"2023-02-18"},"title":"Bloodchild and Other Stories","author":"Butler, Octavia E.","series":"","review":"Multiple of these are masterpieces imo. Fantastic set of short stories that do a ton within a short page count.\\n\\nDeeply rich in themes and subtext that also use sci-fi to its fullest extent to look inward at the human condition, our world around us, and ponder on if it's possible for life to be better and what it means to be human.\\n\\nAlso these are incredibly dark and often bleak that feel like realistic futuristic scenarios. Excited to read more from her, they really resonated with me very well.","highlightCount":18,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1527803712l/40274755.jpg","asin":"B008HALO0U","goodreadsUrl":"https://www.goodreads.com/book/show/40274755-bloodchild-and-other-stories","kindleUrl":"https://amazon.com/dp/B008HALO0U","matchMethod":"asin"},{"id":"ordinary-grace-b3224498","readMonth":{"month":"Feb","year":"2023","day":"22","sort":"2023-02-22"},"title":"Ordinary Grace","author":"Krueger, William Kent","series":"","review":"If you haven't read Boy's Life, I'd recommend reading that first since I liked that a lot more, but this was still very good and had a lot of heart. The elements of religion and racism are the big differentiators as well as the events hitting closer to home.\\n\\nThe more I think about the plot though the less I think it's tied up very well and am a bit unsatisfied with how the revelations in the mystery are encountered where in Boy's Life McCammon is the master of plotting and tying things together. I think it's perfectly fair to compare these two because they are so similar but McCammon is also one of my favorite authors so he's hard to match up with.\\n\\nOverall happy I read this and it had some good emotional moments and beautiful, thoughtful passages. Gets a recommend from me 👍","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1358264094l/15803059.jpg","asin":"1451645821","goodreadsUrl":"https://www.goodreads.com/book/show/15803059-ordinary-grace","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"closed-and-common-orbit-58d60f59","readMonth":{"month":"Feb","year":"2023","day":"22","sort":"2023-02-22"},"title":"A Closed and Common Orbit","author":"Chambers, Becky","series":"Wayfarers, #2","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1626027284l/29808780.jpg","asin":"B01CNLOZ3G","goodreadsUrl":"https://www.goodreads.com/book/show/29808780-a-closed-and-common-orbit","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"long-walk-ce783b62","readMonth":{"month":"Feb","year":"2023","day":"28","sort":"2023-02-28"},"title":"The Long Walk","author":"Bachman, Richard","series":"","review":"Top tier King for me. It definitely showcases his writing chops in ways his other books don't often do and takes a very simple concept for a plot and elevates it with some amazing characters and pacing.\\n\\nIt's sort of mind blowing that this was written in the 70s before dystopian young adult sci-fi was a thing and it's just as good or better than most stories in the genre.\\n\\nI'll be thinking about this for a while, captures so much of the beauty, hopelessness, and brutality of being alive.","highlightCount":42,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1449723878l/28165439.jpg","asin":"B018ER7IPK","goodreadsUrl":"https://www.goodreads.com/book/show/28165439-the-long-walk","kindleUrl":"https://amazon.com/dp/B018ER7IPK","matchMethod":"title-only-unique"},{"id":"this-tender-land-e211673b","readMonth":{"month":"Mar","year":"2023","day":"03","sort":"2023-03-03"},"title":"This Tender Land","author":"Krueger, William Kent","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1565526433l/25813942.jpg","asin":"1476749299","goodreadsUrl":"https://www.goodreads.com/book/show/25813942-this-tender-land","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"headtaker-8b392b9d","readMonth":{"month":"Mar","year":"2023","day":"04","sort":"2023-03-04"},"title":"Headtaker","author":"Guymer, David","series":"Warhammer Heroes #9","review":"Queek is absolutely unhinged, you love to see it.\\n\\nMy expectations for this were really low and it exceeded them greatly. Such a fun book with probably my favorite Warhammer character. So many hilarious Skaven moments and great action sequences between Dwarves, Orcs, and Skaven all fighting in Eight Peaks.\\n\\nThe writing was way better than I thought it would be too and the descriptions of the various locations, battles, and creatures were immersive and interesting.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1353320810l/16130415.jpg","asin":"184970404X","goodreadsUrl":"https://www.goodreads.com/book/show/16130415-headtaker","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"empire-in-black-and-gold-31ad32df","readMonth":{"month":"Mar","year":"2023","day":"05","sort":"2023-03-05"},"title":"Empire in Black and Gold","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #1","review":"Really good! I had tempered expectations since this is one of Tchaikovsky's earliest works but the quality of the writing was excellent and at close to the level I've grown to expect from him even when reading his latest releases.\\n\\nThe world building, lore, and history of this series is really interesting so far and there seems to be a lot of depth as well as mystery to uncover and I'm here for it.\\n\\nProbably one of the most unique series I've read so far. There's bug people! That's really weird and out there, but it makes sense in the world that he's built.\\n\\nThe plot is exciting and the action is well written and easy to visualize. Definitely leans on the side of military fantasy with a lot of assassination attempts, battles, and ambushes. Lots of variety in the action as well with varying races, technology, and unique and interesting locations being fought over.\\n\\nThe characters are also very good and well fleshed out with a lot of complex motivations and morally gray decisions that they are forced to make during war time. I'd have preferred this to maybe be a bit darker but there are some horror elements as well as some meditations on the consequences of violence.","highlightCount":46,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1614020350l/57175436.jpg","asin":"B003GK21XK","goodreadsUrl":"https://www.goodreads.com/book/show/57175436-empire-in-black-and-gold","kindleUrl":"https://amazon.com/dp/B003GK21XK","matchMethod":"asin"},{"id":"fall-of-giants-7a7551d4","readMonth":{"month":"Mar","year":"2023","day":"13","sort":"2023-03-13"},"title":"Fall of Giants","author":"Follett, Ken","series":"The Century Trilogy, #1","review":"","highlightCount":1,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1564091364l/51856034.jpg","asin":"B0052RDHTM","goodreadsUrl":"https://www.goodreads.com/book/show/51856034-fall-of-giants","kindleUrl":"https://amazon.com/dp/B0052RDHTM","matchMethod":"asin"},{"id":"knight-of-seven-kingdoms-51391137","readMonth":{"month":"Mar","year":"2023","day":"17","sort":"2023-03-17"},"title":"A Knight of the Seven Kingdoms","author":"Martin, George R.R.","series":"The Tales of Dunk and Egg, #1-3","review":"","highlightCount":10,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1693445229l/18635622.jpg","asin":"B00S3R6HAE","goodreadsUrl":"https://www.goodreads.com/book/show/18635622-a-knight-of-the-seven-kingdoms","kindleUrl":"https://amazon.com/dp/B00S3R6HAE","matchMethod":"title-author"},{"id":"under-heaven-27ed12a4","readMonth":{"month":"Mar","year":"2023","day":"19","sort":"2023-03-19"},"title":"Under Heaven","author":"Kay, Guy Gavriel","series":"Under Heaven, #1","review":"The prose is probably the best GGK has written so far, some gorgeous passages. The plot in general GGK style is about some of the littler people in larger conflicts who overlap with those in authority positions, I never usually read GGK for the plot and this one is serviceable but not one of his best; the Sarantine Mosaic probably has my favorite plot that he's written.\\n\\nThe characters are pretty good as well and primarily revolves around a single family and the siblings that are spread across the country.\\n\\nThe themes are great and what I come back to GGK for. Some great meditations on mysticism, spirituality, politics, war and power that are integrated well into the narrative.\\n\\nGGK really cannot be beat in terms of writing beautiful sections that I want to highlight beginning to end.","highlightCount":10,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1557037131l/9688286.jpg","asin":"B003NX7NEM","goodreadsUrl":"https://www.goodreads.com/book/show/9688286-under-heaven","kindleUrl":"https://amazon.com/dp/B003NX7NEM","matchMethod":"asin"},{"id":"dawn-4f394664","readMonth":{"month":"Mar","year":"2023","day":"20","sort":"2023-03-20"},"title":"Dawn","author":"Butler, Octavia E.","series":"Xenogenesis, #1","review":"Great sci-fi horror with really interesting, otherworldly disturbing aliens. Really interested in continuing the series and seeing where Butler goes with this. She really respects your time as a reader and packs a lot into the page count with a lot of compelling ideas and complex characters.","highlightCount":33,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1717091024l/60929.jpg","asin":"B008HALOEQ","goodreadsUrl":"https://www.goodreads.com/book/show/60929.Dawn","kindleUrl":"https://amazon.com/dp/B008HALOEQ","matchMethod":"title-author"},{"id":"i-robot-276c005a","readMonth":{"month":"Mar","year":"2023","day":"25","sort":"2023-03-25"},"title":"I, Robot","author":"Asimov, Isaac","series":"Robot, #0.1","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1609035271l/41804.jpg","asin":"0553803700","goodreadsUrl":"https://www.goodreads.com/book/show/41804.I_Robot","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"legend-b2ffd5aa","readMonth":{"month":"Mar","year":"2023","day":"29","sort":"2023-03-29"},"title":"Legend","author":"Gemmell, David","series":"Drenai Saga, #1","review":"What does it mean to have courage? How do you become and stay a good man? What happens when your Legend has outgrown who you are?\\n\\nGreat heroic fantasy story with a ton of heart that's also deeper than I expected. The writing was good, not flowery but conveyed the story well.\\n\\nWill definitely be continuing with Drenai and excited to read more from Gemmell.","highlightCount":74,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1327935404l/11720877.jpg","asin":"B00513F9S4","goodreadsUrl":"https://www.goodreads.com/book/show/11720877-legend","kindleUrl":"https://amazon.com/dp/B00513F9S4","matchMethod":"asin"},{"id":"iron-gold-65f2800b","readMonth":{"month":"Mar","year":"2023","day":"30","sort":"2023-03-30"},"title":"Iron Gold","author":"Brown, Pierce","series":"Red Rising Saga, #4","review":"Easily my favorite in the series by a large margin. The series really matures and gets a lot darker and more complex.\\n\\nAdding more POVs made a huge difference. Seeing more of the galaxy and from different perspectives solidifies how cool the world building and the social structure that Brown built way back in the first book.\\n\\nI was grabbed by the plot and had a hard time putting it down, it took a little bit to establish the new characters and the storylines but my patience was rewarded and there's a lot of great moments and action, along with a lot of surprises.\\n\\nReally engaging read and Brown's writing has evolved into something special. Most likely jumping right into Dark Age, really want to know what happens, I'm hooked.","highlightCount":20,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1482475132l/33361943.jpg","asin":"B01NAC6QVU","goodreadsUrl":"https://www.goodreads.com/book/show/33361943-iron-gold","kindleUrl":"https://amazon.com/dp/B01NAC6QVU","matchMethod":"asin"},{"id":"dragonfly-falling-d7c30a5e","readMonth":{"month":"Apr","year":"2023","day":"08","sort":"2023-04-08"},"title":"Dragonfly Falling","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #2","review":"The bugs must flow. Great book 2. Tchaikovsky challenges and develops the characters really well and places them in difficult situations where they change greatly. The world and lore also reveals further depths. Hyped to continue next month.","highlightCount":32,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1638202197l/59723505.jpg","asin":"B003GK223Y","goodreadsUrl":"https://www.goodreads.com/book/show/59723505-dragonfly-falling","kindleUrl":"https://amazon.com/dp/B003GK223Y","matchMethod":"asin"},{"id":"adulthood-rites-b58d2bec","readMonth":{"month":"Apr","year":"2023","day":"09","sort":"2023-04-09"},"title":"Adulthood Rites","author":"Butler, Octavia E.","series":"Xenogenesis, #2","review":"I sort of don't know what to rate this but I think this series is incredible. It is very unique and has some great themes as well as some interesting characters delivered in a compact bleak and dark package. Butler's view of humanity is pretty pessimistic and I love it. However, there's always a sliver of hope.","highlightCount":44,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1390116834l/116249.jpg","asin":"B008HALPTU","goodreadsUrl":"https://www.goodreads.com/book/show/116249.Adulthood_Rites","kindleUrl":"https://amazon.com/dp/B008HALPTU","matchMethod":"title-author"},{"id":"dark-age-b822c8cb","readMonth":{"month":"Apr","year":"2023","day":"11","sort":"2023-04-11"},"title":"Dark Age","author":"Brown, Pierce","series":"Red Rising Saga #5","review":"The Storm of Swords of the series and honestly has even more crazy shit happening than even that jam packed book. This was so damn good. A huge roller-coaster from beginning to end. Big climaxes for half a dozen complex storylines and has some shockingly brutally bleak moments. That was intense, yo.","highlightCount":23,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1525464466l/37562956.jpg","asin":"B078G2YS3N","goodreadsUrl":"https://www.goodreads.com/book/show/37562956-dark-age","kindleUrl":"https://amazon.com/dp/B078G2YS3N","matchMethod":"asin"},{"id":"entangled-life-how-fungi-make-our-worlds-change-our-minds-shape-our-futures-7a7e1dc5","readMonth":{"month":"Apr","year":"2023","day":"13","sort":"2023-04-13"},"title":"Entangled Life: How Fungi Make Our Worlds, Change Our Minds & Shape Our Futures","author":"Sheldrake, Merlin","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1575341220l/52668915.jpg","asin":"0525510311","goodreadsUrl":"https://www.goodreads.com/book/show/52668915-entangled-life","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"imago-e432af95","readMonth":{"month":"Apr","year":"2023","day":"23","sort":"2023-04-23"},"title":"Imago","author":"Butler, Octavia E.","series":"Xenogenesis, #3","review":"This one was pretty frustrating. She spent all this time creating good characters, an interesting plot, and deep themes and sort of discarded it all to tell an unrelated story in the same world. Doesn't make sense as the conclusion of the trilogy. I still like and recommend the first two books.","highlightCount":8,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1389478182l/60934.jpg","asin":"B008HALNJW","goodreadsUrl":"https://www.goodreads.com/book/show/60934.Imago","kindleUrl":"https://amazon.com/dp/B008HALNJW","matchMethod":"title-author"},{"id":"renegades-magic-9d80303a","readMonth":{"month":"Apr","year":"2023","day":"30","sort":"2023-04-30"},"title":"Renegade's Magic","author":"Hobb, Robin","series":"Soldier Son, #3","review":"","highlightCount":43,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328313046l/8176950.jpg","asin":"B000UZNQNS","goodreadsUrl":"https://www.goodreads.com/book/show/8176950-renegade-s-magic","kindleUrl":"https://amazon.com/dp/B000UZNQNS","matchMethod":"asin"},{"id":"blindsight-ad94abda","readMonth":{"month":"May","year":"2023","day":"01","sort":"2023-05-01"},"title":"Blindsight","author":"Watts, Peter","series":"Firefall, #1","review":"The first 75% I really liked and the last 25% I got completely lost and don't think I understood the twists very well or they kind of came out of nowhere. Had some good horror elements and hard sci-fi concepts, did feel a bit let down with the characters a bit and they're really not developed and basically had no attachment to them.\\n\\nThe plot also just sort of starts going and you get almost no backstory about how the world has developed which forces you to read between the lines a lot. I enjoyed this a majority of the time but the end makes me feel like I didn't get it that well or it just wasn't communicated well within the story.\\n\\nI'm interested in his underwater sci-fi series at some point. I feel like I might not like the sequel to this book but may give it a try eventually.","highlightCount":59,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1386924412l/48484.jpg","asin":"0765312182","goodreadsUrl":"https://www.goodreads.com/book/show/48484.Blindsight","kindleUrl":"","matchMethod":"title-author"},{"id":"vagabond-4-7cd3796b","readMonth":{"month":"May","year":"2023","day":"08","sort":"2023-05-08"},"title":"Vagabond, Vol. 4","author":"Inoue, Takehiko","series":"","review":"","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347733473l/6297845.jpg","asin":"1421522462","goodreadsUrl":"https://www.goodreads.com/book/show/6297845-vagabond-vol-4","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"blood-of-mantis-832231f5","readMonth":{"month":"May","year":"2023","day":"09","sort":"2023-05-09"},"title":"Blood of the Mantis","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #3","review":"I was sort of mixed for a majority of the book but man, the climax and the way everything was threaded together was awesome. Tchaikovsky continues to build a deeper and more interesting world that has a lot of complexity.\\n\\nThe weak points of the book are that it goes so wide instead of deep with POVs split all across the world and many are brand new locations we've never heard about before. It's sort of a tradeoff because we don't really get as much character development with the existing characters and instead get a grander and more epic setting.\\n\\nA majority of the book is setting up the conclusion to the final book in the first arc but there's also some good action sequences and tension. Felt like there could have been a little more and I was getting a bit overwhelmed with all the new characters, locations, and factions, but I have a feeling this will pay off for the conclusion of the first arc as well as the 6 other books and all the side books to come.\\n\\nReally happy to be reading the series and excited to continue. Trust in Tchaikovsky!","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1624721148l/54954579.jpg","asin":"1529050308","goodreadsUrl":"https://www.goodreads.com/book/show/54954579-blood-of-the-mantis","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vagabond-5-a612240f","readMonth":{"month":"May","year":"2023","day":"11","sort":"2023-05-11"},"title":"Vagabond, Vol. 5","author":"Inoue, Takehiko","series":"","review":"Incredible, one of the best storylines I've read in a comic.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347734546l/6434061.jpg","asin":"1421522470","goodreadsUrl":"https://www.goodreads.com/book/show/6434061-vagabond-vol-5","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"salute-dark-23501bb9","readMonth":{"month":"May","year":"2023","day":"14","sort":"2023-05-14"},"title":"Salute the Dark","author":"Tchaikovsky, Adrian","series":"Shadows of the Apt, #4","review":"Really good military and political fantasy with bugs. Satisfyingly wraps up the first arc. Tchaikovsky has built an interesting and complex world that has a lot of directions it could go.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1603551527l/54954580.jpg","asin":"1529050324","goodreadsUrl":"https://www.goodreads.com/book/show/54954580-salute-the-dark","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"king-beyond-gate-aa93bb92","readMonth":{"month":"May","year":"2023","day":"16","sort":"2023-05-16"},"title":"The King Beyond the Gate","author":"Gemmell, David","series":"The Drenai Saga #2","review":"I liked the book and it had a lot of great quotes but it did tread similar ground to Legend. I also was hoping to be more connected to the characters and plot, but still enjoyed it. Will be continuing with Drenai.","highlightCount":70,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328344629l/11720879.jpg","asin":"B004ZZFO9S","goodreadsUrl":"https://www.goodreads.com/book/show/11720879-the-king-beyond-the-gate","kindleUrl":"https://amazon.com/dp/B004ZZFO9S","matchMethod":"asin"},{"id":"vagabond-6-b47a79ac","readMonth":{"month":"May","year":"2023","day":"21","sort":"2023-05-21"},"title":"Vagabond, Vol. 6","author":"Inoue, Takehiko","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347788925l/6434062.jpg","asin":"1421522802","goodreadsUrl":"https://www.goodreads.com/book/show/6434062-vagabond-vol-6","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"light-bringer-e22c63bc","readMonth":{"month":"May","year":"2023","day":"28","sort":"2023-05-28"},"title":"Light Bringer","author":"Brown, Pierce","series":"Red Rising Saga, #6","review":"I was lucky enough to get a copy of this book in exchange for an honest review. I hate spoilers and this will have none of them. General impressions and vibes below.\\n\\nMan this was intense. The bar for this book was already incredibly high after loving both Iron Gold and Dark Age being one of the biggest roller coasters since Storm of Swords.\\n\\nPierce Brown continues to impress me with his writing growth. We get some of the best imagery in this book that we've had for the whole series. As well as some visceral combat both large and small scale which is hard to do and make it feel tense where anything can happen.\\n\\nI do think this book has a little bit of inconsistency both within itself and as the larger part of the series. This one is more focused on a smaller number of POVs and goes deeper into the storylines than both Iron Gold and Dark Age.\\n\\nThis can make it so you get less of a well rounded perspective on events and makes it feel closer to the original trilogy than any of the other sequel books so far, however we do get major plot movement and huge things definitely do happen which is great as the penultimate entry in the series. It sets us up for an epic finale as well as respecting everything that came before.\\n\\nThere's also a bit of inconsistency within the book itself where I felt like the highs are very high. There's not really lows, but there are some parts of the book that had less tension or I was hoping tied into the climax a bit more.\\n\\nOverall I'm really loving the series, was so happy to read an advanced copy of the book, and I'm dying to know how everything ends. Probably my favorite epic political war series since a Song of Ice and Fire with as many twists and jaw dropping moments.\\n\\nLooking forward to the ending and anything else Pierce Brown writes going forward.","highlightCount":121,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1667655583l/29227774.jpg","asin":"1473646804","goodreadsUrl":"https://www.goodreads.com/book/show/29227774-light-bringer","kindleUrl":"","matchMethod":"title-author"},{"id":"vagabond-7-f2578f84","readMonth":{"month":"Jun","year":"2023","day":"04","sort":"2023-06-04"},"title":"Vagabond, Vol. 7","author":"Inoue, Takehiko","series":"","review":"Very compelling read with converging storylines and great characters. There's also a lot of thematic complexity with how samurai are handled and their relation to honor when it comes to the endless cycle of violence and killing.\\n\\nEven new characters are fleshed out immediately and folded into the narrative. Definitely hooked and want to know what happens next","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347789998l/6759357.jpg","asin":"1421522810","goodreadsUrl":"https://www.goodreads.com/book/show/6759357-vagabond-vol-7","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"winter-of-world-7b06108b","readMonth":{"month":"Jun","year":"2023","day":"05","sort":"2023-06-05"},"title":"Winter of the World","author":"Follett, Ken","series":"The Century Trilogy #2","review":"A fascinating look into how the icy claws of fascism gripped the world prior to WW2 and swept the world into a deadly Winter. I thought I knew a fair bit about WW2 but Follett excels at giving us a view from the ground around the world and how fascism tempted every country and how everyday people fought against it.\\n\\nIt's frightening how relevant this still is and has obvious echoes in modern day that makes one question the nature of humanity.\\n\\nMaybe my favorite Follett book and I've already read multiple 5 star masterpieces by him. This one does a better job than Fall of Giants at giving you characters to love and hate and builds up masterfully a new set of characters descended from the original cast.\\n\\nNo one does historical generational epics better.","highlightCount":0,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1369453743l/12959233.jpg","asin":"0525952926","goodreadsUrl":"https://www.goodreads.com/book/show/12959233-winter-of-the-world","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vagabond-8-08cc9045","readMonth":{"month":"Jun","year":"2023","day":"05","sort":"2023-06-05"},"title":"Vagabond, Vol. 8","author":"Inoue, Takehiko","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347791180l/7651478.jpg","asin":"1421522829","goodreadsUrl":"https://www.goodreads.com/book/show/7651478-vagabond-vol-8","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"vagabond-9-ecfb047b","readMonth":{"month":"Jun","year":"2023","day":"11","sort":"2023-06-11"},"title":"Vagabond, Vol. 9","author":"Inoue, Takehiko","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1347880847l/8065805.jpg","asin":"1421523132","goodreadsUrl":"https://www.goodreads.com/book/show/8065805-vagabond-vol-9","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"witchwood-crown-e9dc0625","readMonth":{"month":"Jun","year":"2023","day":"12","sort":"2023-06-12"},"title":"The Witchwood Crown","author":"Williams, Tad","series":"The Last King of Osten Ard, #1","review":"No spoilers.\\n\\nThis is a really interesting one. In a lot of ways I feel like *more* should have happened than it did but that really isn't Tad's style and there's a deliberate slow burn as are most of his books.\\n\\nIt feels like a distorted reflection of the Dragonbone Chair and comes perilously close to retreading similar ground but I think this is very intentional and is done so to explore deep themes on the nature of war and humanity.\\n\\nThis is epic fantasy and there's a lot of new POVs, characters, and locations being setup here as well as thirty years since the end of To Green Angel Tower. The world hasn't stood still. Quite the opposite.\\n\\nThere's also a lot of dark things that happen that I'm a fan of. Feels like a more mature and modern Memory Sorrow and Thorn where he doesn't shy away from violent and complex morality.\\n\\nIf Tad executes well on everything he's set up and the promises he's made this will end up being one of the best fantasy series. Taking a little break from the series but wanting this to marinate in my brain a bit before continuing on to Empire of Grass.","highlightCount":96,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1487523588l/31185918.jpg","asin":"B01IAUG3FM","goodreadsUrl":"https://www.goodreads.com/book/show/31185918-the-witchwood-crown","kindleUrl":"https://amazon.com/dp/B01IAUG3FM","matchMethod":"asin"},{"id":"vagabond-10-f5143cfe","readMonth":{"month":"Jun","year":"2023","day":"13","sort":"2023-06-13"},"title":"Vagabond, Vol. 10","author":"Inoue, Takehiko","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1388734772l/8065810.jpg","asin":"1421529157","goodreadsUrl":"https://www.goodreads.com/book/show/8065810-vagabond-vol-10","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-31-94ab2ebe","readMonth":{"month":"Jun","year":"2023","day":"14","sort":"2023-06-14"},"title":"Berserk Volume 31","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500646874l/35717359.jpg","asin":"B0743HD1WV","goodreadsUrl":"https://www.goodreads.com/book/show/35717359-berserk-volume-31","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"berserk-30-2948a8c1","readMonth":{"month":"Jun","year":"2023","day":"14","sort":"2023-06-14"},"title":"Berserk, Vol. 30","author":"Miura, Kentaro","series":"","review":"","highlightCount":0,"myG ultiple genres and build unique characters. Also, evil vampires rule.","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1377002067l/15847330.jpg","asin":"B005T54I9K","goodreadsUrl":"https://www.goodreads.com/book/show/15847330-they-thirst","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"crossing-9323344c","readMonth":{"month":"Jun","year":"2023","day":"28","sort":"2023-06-28"},"title":"The Crossing","author":"McCarthy, Cormac","series":"The Border Trilogy, #2","review":"Probably my favorite McCarthy book. The aimlessness and anti climatic tendencies of McCarthy work really well here and give you a lot to think about as there's a lot of thematic complexity in the novel. I keep waffling between a 4 and 5 rating, his books are hard to measure compared to most normal books but I keep coming back for more, so I'm definitely a fan.\\n\\nSome of it can end up being unsatisfying but that seems like the goal, still getting used to that. Really gorgeous writing and some of the digressions here from the strangers Billy meets through his travels I'll be thinking about for a while.","highlightCount":54,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1381479912l/8889450.jpg","asin":"B003XT60JU","goodreadsUrl":"https://www.goodreads.com/book/show/8889450-the-crossing","kindleUrl":"https://amazon.com/dp/B003XT60JU","matchMethod":"asin"},{"id":"perdido-street-station-3d43fd32","readMonth":{"month":"Jun","year":"2023","day":"28","sort":"2023-06-28"},"title":"Perdido Street Station","author":"Miéville, China","series":"New Crobuzon, #1","review":"","highlightCount":46,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1646968041l/60589353.jpg","asin":"B000FBFO8C","goodreadsUrl":"https://www.goodreads.com/book/show/60589353-perdido-str l. 2","author":"Urasawa, Naoki","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1397767579l/21412476.jpg","asin":"1421569078","goodreadsUrl":"https://www.goodreads.com/book/show/21412476-monster","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"red-mars-9f970825","readMonth":{"month":"Jul","year":"2023","day":"10","sort":"2023-07-10"},"title":"Red Mars","author":"Robinson, Kim Stanley","series":"Mars Trilogy, #1","review":"Mixed. I really liked the first half of this book and then the length, the direction it was going in, and what it focused on got to me. The characters felt pretty flat and inconsistent to me. Sometimes they were unbearably petty and didn't show much growth or depth, but there were glimpses of some great moments. I didn't really feel much tension in the plot or excited about what was going to happen next.\\n\\nThe science part was probably the highlight, very well researched book and the landscape descriptions were very nice and vivid. Also the terraforming felt based in science and feasible. Some of the other science did seem a bit easy for them to create and not really have ramifications, was hoping for a bit more there. Also showed its age a little bit with how science has advanced since written, but nothing deal breaking there.","highlightCount":39,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1500664839l/35720284.jpg","asin":"B000QCS914","goodreadsUrl":"https://www.goodreads.com/book/show/35720284-red-mars","kindleUrl":"https://amazon.com/dp/B000QCS914","matchMethod":"asin"},{"id":"parasyte-1-94ecad00","readMonth":{"month":"Jul","year":"2023","day":"10","sort":"2023-07-10"},"title":"Parasyte, Volume 1","author":"Iwaaki, Hitoshi","series":"","review":"Funny, weird, good art","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1448989506l/28053938.jpg","asin":"B0184RTEMU","goodreadsUrl":"https://www.goodreads.com/book/show/28053938-parasyte-volume-1","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"parasyte-2-9e7a6861","readMonth":{"month":"Jul","year":"2023","day":"11","sort":"2023-07-11"},"title":"Parasyte, Volume 2","author":"Iwaaki, Hitoshi","series":"","review":"","highlightCount":0,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1449997054l/28184542.jpg","asin":"B0184T6TNK","goodreadsUrl":"https://www.goodreads.com/book/show/28184542-parasyte-volume-2","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"black-leopard-red-wolf-63d7d6e3","readMonth":{"month":"Jul","year":"2023","day":"14","sort":"2023-07-14"},"title":"Black Leopard, Red Wolf","author":"James, Marlon","series":"The Dark Star Trilogy #1","review":"I only read the first part of this book, but I do feel like it's earned a review warning away everyone from it. This is the most depraved and disgusting book I've read and I don't really feel like there's a deeper meaning to any of it. I've read some very dark books and series but usually they have a point behind the darkness or at least give you moments of reprieve, this book really doesn't and there's some new level of depravity it finds every chapter / page / sentence that is really uncomfortable and is seemingly forgotten in a short amount of time and has no impact on the characters and setting.\\n\\nNicest thing I can say about this book is I thought the writing at points was quite good and there were some weird dreamlike sequences that were interesting.\\n\\nI don't know, maybe I don't get it, but I feel like as an enjoyer of dark weird books if I don't really like this book I'd want to heavily discourage anyone else from reading it.","highlightCount":20,"myGoodreadsRating":1,"myReviewRating":null,"imageUrl":"ht ay":"29","sort":"2023-07-29"},"title":"The Road to Jerusalem","author":"Guillou, Jan","series":"","review":"Definitely a bit of a setup book but interested in where the series goes. Book is fairly zoomed out and a bit of a history book at times that can make it feel impersonal but it also gives you more context of the historical period it takes place in.\\n\\nThis is pre Crusading but there's compelling thoughts on the contradiction of religion that preaches love and crusading against non believers and how the standards for masculinity are vastly different from what we know today. Also good stuff on how actual medieval Swedish settlements were run and the varying standards of food and drink have changed.","highlightCount":45,"myGoodreadsRating":4,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1404699701l/6650313.jpg","asin":"B0026772PQ","goodreadsUrl":"https://www.goodreads.com/book/show/6650313-the-road-to-jerusalem","kindleUrl":"https://amazon.com/dp/B0026772PQ","matchMethod":"asin"},{"id":"waylander-1956c9db","readMonth":{"month":"Jul","year":"2023","day":"29","sort":"2023-07-29"},"title":"Waylander","author":"Gemmell, David","series":"Drenai Tales, #3","review":"","highlightCount":27,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1328344628l/11720878.jpg","asin":"B0052FE61W","goodreadsUrl":"https://www.goodreads.com/book/show/11720878-waylander","kindleUrl":"https://amazon.com/dp/B0052FE61W","matchMethod":"asin"},{"id":"parasyte-3-6c7ec90c","readMonth":{"month":"Jul","year":"2023","day":"31","sort":"2023-07-31"},"title":"Parasyte, Volume 3","author":"Iwaaki, Hitoshi","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1450634257l/28252798.jpg","asin":"B0184T6U20","goodreadsUrl":"https://www.goodreads.com/book/show my highlights of the year.\\n\\nIf I have any shred of criticism it is that it does feel like the penultimate book of the series and we don't get things wrapped up here at all, but it runs with the events of Grass really well.\\n\\nTad is vastly under appreciated and hope with this series being completed more people pick these up!","highlightCount":43,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1655175797l/59538689.jpg","asin":"B09JBCZ7VW","goodreadsUrl":"https://www.goodreads.com/book/show/59538689-into-the-narrowdark","kindleUrl":"https://amazon.com/dp/B09JBCZ7VW","matchMethod":"asin"},{"id":"pariah-cf11fb59","readMonth":{"month":"Sep","year":"2023","day":"09","sort":"2023-09-09"},"title":"The Pariah","author":"Ryan, Anthony","series":"Covenant of Steel, #1","review":"","highlightCount":65,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1612524943l/56229688.jpg","asin":"B08PV49R1G","goodreadsUrl":"https://www.goodreads.com/book/show/56229688-the-pariah","kindleUrl":"https://amazon.com/dp/B08PV49R1G","matchMethod":"asin"},{"id":"templar-knight-epic-medieval-adventure-of-faith-and-war-in-holy-land-36f3d3c1","readMonth":{"month":"Sep","year":"2023","day":"15","sort":"2023-09-15"},"title":"The Templar Knight: An Epic Medieval Adventure of Faith and War in the Holy Land","author":"Guillou, Jan","series":"","review":"","highlightCount":17,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1387732367l/19736127.jpg","asin":"B003H4I5TO","goodreadsUrl":"https://www.goodreads.com/book/show/19736127-the-templar-knight","kindleUrl":"https://amazon.com/dp/B003H4I5TO","matchMethod":"title-candidate-author"},{"id":"manslayer-3fe7db9d","readMonth":{"month":"Sep","year":"2023","day":"22","sort":"2023-09-22"},"title":"Manslayer","author":"Long, Nathan","series":"Gotrek & Felix, #9","review":"Definitely the weakest plot in the series so far, but still having a lot of fun with the series and the audiobooks read by Jonathan Keeble are fantastic.\\n\\nAlso very happy with Nathan Long continuing the series, just wish Gotrek and Felix had more interesting stuff to do in this one. Some good returning characters and get a good look at the Empire from the inside.","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1348295148l/1090244.jpg","asin":"1844165094","goodreadsUrl":"https://www.goodreads.com/book/show/1090244.Manslayer","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"reality-dysfunction-3be7b956","readMonth":{"month":"Sep","year":"2023","day":"27","sort":"2023-09-27"},"title":"The Reality Dysfunction","author":"Hamilton, Peter F.","series":"Night's Dawn, #1","review":"It says a lot that I finished a book 1 that clocks in at 1200 pages and want to pick up the next book immediately. This book is big, bold, complex, dense, and unapologetically dark; like really dark man. Would call this sci-fi horror easily since the darkness and disturbing events are so pervasive. As a fan of dark horror books, really liked this aspect and we don't see it enough in sci-fi.\\n\\nPeter F Hamilton is cemented as one of my favorite sci-fi authors after loving his Commonwealth Saga series. He continues to impress with his unique blend of sci-fi that balances ideas, characters, technology, and vivid worlds - among many other things.\\n\\nAlso, even though I'd classify this as a space opera and the scale is indeed big, we do get a lot of page time on a single planet which is refreshing for the genre as we get a lot of time experiencing the richness of this one world and the people, the aliens, and the strange wildlife that lives there.\\n\\nThis book is also really weird and isn't afraid to have crazy stuff happen. There's a lot of mystery for why this weird stuff is happening and there seems to be some unrevealed logic to why these things are happening.\\n\\nI don't think I'd recommend this book to most people, but if you're brave enough to commit to these giant tomes he writes you'll be rewarded with a very rich and interesting portal into one of sci-fi's greatest imaginations.\\n\\nThe book also seemed to fly by and I was always interested in what was going to happen next, the pacing is very good and never felt like any part really overstayed its welcome. Lots of POVs that all feel distinct and interesting.\\n\\nI honestly have no idea where this series is going to go, but I have some tinfoil hat theories and excited to continue and experience the ride.","highlightCount":99,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1482358232l/11281977.jpg","asin":"B004VO4J0I","goodreadsUrl":"https://www.goodreads.com/book/show/11281977-the-reality-dysfunction","kindleUrl":"https://amazon.com/dp/B004VO4J0I","matchMethod":"asin"},{"id":"killers-of-flower-moon-osage-murders-and-birth-of-fbi-f2f1ea77","readMonth":{"month":"Oct","year":"2023","day":"04","sort":"2023-10-04"},"title":"Killers of the Flower Moon: The Osage Murders and the Birth of the FBI","author":"Grann, David","series":"","review":"3.5/5 the content of the book was definitely interesting but felt like it could have been told in a more engaging way at times.\\n\\nAnticipating the film coming out this month, I think Scorsese will adapt this in a more dramatized, compelling way.\\n\\nDefinitely a very dark string of murders and conspiracy. This book also felt a little too short and you don't really end up feeling connected with many of the victims and instead the investigators end up getting more of the spotlight.\\n\\nI did enjoy the look into Hoover and some of the early days of the FBI, I previously didn't know that much about it and thought that aspect was really interesting and I want to learn more about it.\\n\\nThe amount of lawlessness and corruption is really disturbing but makes a compelling read especially in the context of bringing law and order to the frontier of the west and how that affects the native people living there. Reality can be stranger than fiction so I appreciated the presentation of the facts here even though it could come off a bit dry at times.","highlightCount":36,"myGoodreadsRating":4,"myReviewRating":3.5,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1592236025l/54102733.jpg","asin":"B01CWZFBZ4","goodreadsUrl":"https://www.goodreads.com/book/show/54102733-killers-of-the-flower-moon","kindleUrl":"https://amazon.com/dp/B01CWZFBZ4","matchMethod":"title-author"},{"id":"one-piece-5-for-whom-bell-tolls-af15844b","readMonth":{"month":"Oct","year":"2023","day":"05","sort":"2023-10-05"},"title":"One Piece, Vol. 5: For Whom the Bell Tolls","author":"Oda, Eiichiro","series":"","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1572272681l/19196693.jpg","asin":"B00F3HGEPK","goodreadsUrl":"https://www.goodreads.com/book/show/19196693-one-piece-vol-5","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"one-piece-4-black-cat-pirates-e53bcd63","readMonth":{"month":"Oct","year":"2023","day":"05","sort":"2023-10-05"},"title":"One Piece, Vol. 4: The Black Cat Pirates","author":"Oda, Eiichiro","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1572272670l/19196795.jpg","asin":"B00F3HGC5W","goodreadsUrl":"https://www.goodreads.com/book/show/19196795-one-piece-vol-4","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"one-piece-6-oath-1fe7438e","readMonth":{"month":"Oct","year":"2023","day":"07","sort":"2023-10-07"},"title":"One Piece, Vol. 6: The Oath","author":"Oda, Eiichiro","series":"","review":"","highlightCount":0,"myGoodreadsRating":2,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1572272692l/19012413.jpg","asin":"B00J00ZQHS","goodreadsUrl":"https://www.goodreads.com/book/show/19012413-one-piece-vol-6","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"parasyte-4-e81a0b9f","readMonth":{"month":"Oct","year":"2023","day":"07","sort":"2023-10-07"},"title":"Parasyte, Volume 4","author":"Iwaaki, Hitoshi","series":"","review":"","highlightCount":0,"myGoodreadsRating":3,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1451077697l/28340312.jpg","asin":"B0184T6U16","goodreadsUrl":"https://www.goodreads.com/book/show/28340312-parasyte-volume-4","kindleUrl":"","matchMethod":"goodreads-only"},{"id":"stand-753bc79b","readMonth":{"month":"Oct","year":"2023","day":"08","sort":"2023-10-08"},"title":"The Stand","author":"King, Stephen","series":"","review":"A flawed masterpiece. Has some of the highest highs from one of my favorite authors and the lows aren't as bad as I've heard, I was bracing myself for a way worse ending and ended up pleasantly surprised.\\n\\nThe first 60 percent or so is definitely a lot stronger, but also found some really good moments in the rest of the book. I do think this book requires a lot of suspension of disbelief and it works better when you're riding the wave of the slice of life moments instead of trying to think critically on if the plot logically fits together as a whole.\\n\\nThis has been on my bucket list reads for ages and am very happy I read it.","highlightCount":66,"myGoodreadsRating":5,"myReviewRating":null,"imageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/books/1776617243l/56793452.jpg","asin":"B001C4NXKM","goodreadsUrl":"https://www.goodreads.com/book/show/56793452-the-stand","kindleUrl":"https://amazon.com/dp/B001C4NXKM","matchMethod":"asin"},{"id":"san
