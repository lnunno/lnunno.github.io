---
layout: page
title: Apps
permalink: /apps/
---

<section class="apps-grid">
  {% for app in site.data.apps %}
  <a class="apps-card" href="{{ app.url }}">
    <h2>
      {% if app.emoji %}
      <span class="apps-emoji" aria-hidden="true">{{ app.emoji }}</span>
      {% elsif app.icon %}
      <i class="{{ app.icon }} apps-icon" aria-hidden="true"{% if app.icon_color %} style="color: {{ app.icon_color }};"{% endif %}></i>
      {% endif %}
      {{ app.name }}
    </h2>
    <p>{{ app.description }}</p>
    <span class="apps-link">
      Open app <i class="fa fa-arrow-right"></i>
    </span>
  </a>
  {% endfor %}
</section>
