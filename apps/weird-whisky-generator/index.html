<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weird Whisky Generator</title>
  <style>
    :root{--bg:#0b0f12;--card:#12171c;--muted:#9fb0c0;--text:#e6eef6;--accent:#39d98a;--accent2:#8a8fff;--danger:#ff7a7a}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(180deg,#0b0f12,#0d1016 40%,#0b0f12);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
    .wrap{max-width:980px;margin:32px auto;padding:0 18px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .logo{width:40px;height:40px;border-radius:10px;background:radial-gradient(100% 100% at 20% 10%,#3cf 0,#8a8fff 32%,#39d98a 70%,#111 100%);box-shadow:0 10px 30px rgba(138,143,255,.25)}
    h1{font-size:26px;margin:0}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.35);overflow:hidden}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:18px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.00))}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
    input[type="text"], select{background:#0c1116;border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:10px;padding:10px 12px;min-width:160px}
    .btn{appearance:none;border:none;background:var(--accent);color:#07130b;font-weight:700;border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:0 6px 18px rgba(57,217,138,.35);transition:transform .08s ease}
    .btn.secondary{background:#1b2330;color:var(--text);box-shadow:none;border:1px solid rgba(255,255,255,.08)}
    .btn.primary-action{width:100%;padding:16px;font-size:16px;border-radius:12px;margin-bottom:18px;opacity:0.92}
    .btn:hover{transform:translateY(-1px)}
    .btn.primary-action:hover{opacity:1}
    .btn:active{transform:translateY(0)}
    .result{padding:22px}
    .title{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
    .badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#151c25;border:1px solid rgba(255,255,255,.08);color:var(--muted)}
    .name{font-size:28px;font-weight:800;margin:6px 0}
    .meta{color:var(--muted);font-size:13px;margin-bottom:14px}
    .notes{display:grid;grid-template-columns:1fr;gap:14px}
    .note{background:#0e141b;border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:14px}
    .note h3{margin:0 0 6px;font-size:13px;color:var(--accent2)}
    .muted{color:var(--muted)}
    .footer{padding:18px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
    .danger{color:var(--danger)}
    @media(min-width:760px){.notes{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>Weird Whisky Generator</h1>
        <div class="muted">Experimental tasting notes from the outer limits of flavor.</div>
      </div>
    </header>

    <button class="btn primary-action" id="btnGen">Generate Whisky</button>

    <section class="card" role="region" aria-labelledby="controls">
      <div class="result" id="result" aria-live="polite"></div>

      <div class="toolbar" id="controls">
        <div>
          <label for="seed">Seed</label>
          <input id="seed" type="text" placeholder="random" />

        <div>

            <option value="entomological">🦗 Entomological & Insect</option>

          </select>
        </div>
        <div><label>&nbsp;</label><button class="btn secondary" id="btnCopyMD">Copy as Markdown</button></div>

        <div><label>&nbsp;</label><button class="btn secondary" id="btnExportJSON">Export .json</button></div>
      </div>
    </section>
  </div>

function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pick(rand, arr){return arr[Math.floor(rand()*arr.length)]}

  {id:'deepsea', emoji:'🐙', name:'Deep Sea & Abyssal'},
  {id:'prehistoric', emoji:'🦴', name:'Prehistoric & Paleontological'},
  {id:'haunted', emoji:'👻', name:'Haunted Domestic'},
  {id:'arcade', emoji:'🕹️', name:'Arcade & Retro Gaming'},
  {id:'entomological', emoji:'🦗', name:'Entomological & Insect'},
  {id:'corporeal', emoji:'🫀', name:'Corporeal & Fleshy'}
];

// Helpers
function uniquePick(rand, arr, used, maxTry=24){
  for(let i=0;i<maxTry;i++){
    const v = pick(rand, arr);
    if(!used.has(v)){ used.add(v); return v; }
  }
  // Fallback if exhausted: return a marked variation
  const v = pick(rand, arr) + '*';
  used.add(v);
  return v;
}

function phrase(rand, catPool, used){
  const adj = uniquePick(rand, catPool.adj, used);
  const mat = uniquePick(rand, catPool.material, used);
  const conn = pick(rand, vocab.connectors);
  const det = uniquePick(rand, catPool.detail, used);
  return `${adj} ${mat} ${conn} ${det}`;
}

function makeCaskNo(rand){
  const distillery = pick(rand, smwsDistilleries);
  const caskNum = Math.floor(rand()*999)+1;
  return {
    code: `${distillery.code}.${caskNum.toString().padStart(3,'0')}`,
    distillery: distillery.name,
    region: distillery.region
  };
}
function makeTitle(rand, pool){return `${pick(rand,pool.titleLeft)} ${pick(rand,pool.titleRight)}`}
function pickCategory(rand, style){ if(style && style!=='any'){return categories.find(c=>c.id===style)} return pick(rand,categories) }

function generate(seedStr, style='any'){
  const seed = seedStr && seedStr.trim()!=='' ? strHash(seedStr) : crypto.getRandomValues(new Uint32Array(1))[0];
  const rand = mulberry32(seed);
  const cat = pickCategory(rand, style);
  const pool = vocab[cat.id];
  const used = new Set();

  // Build sections with enforced uniqueness across sections
  const nose = [phrase(rand,pool,used), phrase(rand,pool,used)].join('; ') + '.';
  const palate = [phrase(rand,pool,used), phrase(rand,pool,used)].join('; ') + '.';
  const finish = phrase(rand,pool,used) + '.';

  const cask = makeCaskNo(rand);

  const record = {
    seed, category:cat, caskNo:cask.code, distillery:cask.distillery, region:cask.region, name:makeTitle(rand, pool),
    nose, palate, finish,
    disclaimer:'Experimental tasting notes. Not an official release.'
  };
  return record;
}

function toMarkdown(rec){
  return `## ${rec.category.emoji} Cask No. ${rec.caskNo} — ${rec.distillery} (${rec.region})\n### "${rec.name}"\n\n`+
         `**Nose:** ${rec.nose}\n`+
         `**Palate:** ${rec.palate}\n`+
         `**Finish:** ${rec.finish}\n\n`+
         `> _${rec.disclaimer}_\n`;
}
function toJSON(rec){return JSON.stringify(rec,null,2)}

function render(rec){
  const el=document.getElementById('result');
  el.innerHTML=`
    <div class="title">
      <span class="badge">${rec.category.emoji} ${rec.category.name}</span>
      <span class="badge">Seed: ${rec.seed}</span>
      <span class="badge">Cask No. ${rec.caskNo}</span>
      <span class="badge">${rec.distillery} — ${rec.region}</span>
    </div>
    <div class="name">${rec.name}</div>
    <div class="notes">
      <div class="note"><h3>Nose</h3><div>${rec.nose}</div></div>
      <div class="note"><h3>Palate</h3><div>${rec.palate}</div></div>
      <div class="note"><h3>Finish</h3><div>${rec.finish}</div></div>
    </div>
  `;
  window.__lastWhisky = rec;
}

// Utilities
function copy(text){
  navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard'),()=>toast('Copy failed', true));
}
function toast(msg, err=false){
  const t=document.createElement('div');
  t.textContent=msg; t.style.position='fixed'; t.style.bottom='22px'; t.style.right='22px';
  t.style.background=err?'#3a1014':'#0f1a12'; t.style.border='1px solid rgba(255,255,255,.15)';
  t.style.color='var(--text)'; t.style.padding='10px 14px'; t.style.borderRadius='10px';
  t.style.boxShadow='0 10px 24px rgba(0,0,0,.4)'; t.style.opacity='0'; t.style.transition='opacity .15s ease';
  document.body.appendChild(t); requestAnimationFrame(()=>t.style.opacity='1');
  setTimeout(()=>{t.style.opacity='0'; setTimeout(()=>t.remove(),200)},1200)
}
function download(filename, content, type='text/plain'){
  const blob = new Blob([content], {type}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}

// Wire up controls
document.getElementById('btnGen').onclick=()=>{
  const s=document.getElementById('seed').value; const st=document.getElementById('style').value;
  render(generate(s, st));
};
document.getElementById('btnCopyMD').onclick=()=>{
  if(!window.__lastWhisky){ toast('Generate a whisky first!', true); return; }
  copy(toMarkdown(window.__lastWhisky));
};
document.getElementById('btnCopyJSON').onclick=()=>{
  if(!window.__lastWhisky){ toast('Generate a whisky first!', true); return; }
  copy(toJSON(window.__lastWhisky));
};
document.getElementById('btnExportMD').onclick=()=>{
  if(!window.__lastWhisky){ toast('Generate a whisky first!', true); return; }
  const rec = window.__lastWhisky;
  download(`whisky_${rec.caskNo.replace('.','-')}.md`, toMarkdown(rec), 'text/markdown');
};
document.getElementById('btnExportJSON').onclick=()=>{
  if(!window.__lastWhisky){ toast('Generate a whisky first!', true); return; }
  const rec = window.__lastWhisky;
  download(`whisky_${rec.caskNo.replace('.','-')}.json`, toJSON(rec), 'application/json');
};

// First render
render(generate('', 'any'));
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
