<style>
    .advent-reveal {
        --bg: #f7f1e6;
        --paper: #fffaf2;
        --ink: #23160c;
        --muted: #6f5a49;
        --line: rgba(35, 22, 12, 0.12);
        --accent: #9e6a2f;
        --accent-deep: #6f4215;
        --card-shadow: 0 18px 40px rgba(55, 31, 12, 0.12);
        color: var(--ink);
        margin: 0 auto;
        max-width: 1100px;
    }

  .advent-reveal * {
    box-sizing: border-box;
  }

  .advent-reveal [hidden] {
    display: none !important;
  }

    .advent-reveal a {
        color: inherit;
    }

    .advent-shell {
        background:
            radial-gradient(
                circle at top left,
                rgba(158, 106, 47, 0.18),
                transparent 32%
            ),
            linear-gradient(180deg, #f9f2e5 0%, var(--bg) 100%);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
    }

    .advent-hero {
        display: grid;
        gap: 1.5rem;
        padding: 1.5rem;
        background: linear-gradient(
            135deg,
            rgba(111, 66, 21, 0.08),
            rgba(255, 255, 255, 0.4)
        );
        border-bottom: 1px solid var(--line);
    }

    .advent-hero img {
        width: 100%;
        display: block;
        border-radius: 20px;
        border: 1px solid var(--line);
    }

    .advent-kicker {
        margin: 0 0 0.35rem;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent-deep);
    }

    .advent-title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1;
    }

    .advent-subtitle {
        margin: 0.85rem 0 0;
        max-width: 48rem;
        color: var(--muted);
        font-size: 1rem;
    }

    .advent-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.25rem;
    }

    .advent-button {
        appearance: none;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: var(--accent);
        color: #fff8ef;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0.8rem 1.1rem;
        transition:
            transform 0.14s ease,
            box-shadow 0.14s ease,
            background 0.14s ease;
    }

    .advent-button:hover,
    .advent-button:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(111, 66, 21, 0.14);
    }

    .advent-button.secondary {
        background: transparent;
        color: var(--accent-deep);
    }

    .advent-grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        padding: 1.5rem;
    }

    .advent-card {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(73, 48, 27, 0.08);
    }

    .advent-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1rem 0;
    }

    .advent-day {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-deep);
    }

    .advent-status {
        padding: 0.28rem 0.6rem;
        border-radius: 999px;
        background: rgba(158, 106, 47, 0.12);
        color: var(--accent-deep);
        font-size: 0.75rem;
        font-weight: 700;
    }

    .advent-card-body {
        display: grid;
        gap: 0.9rem;
        padding: 1rem;
        flex: 1;
    }

  .advent-door {
    position: relative;
    min-height: 18rem;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    perspective: 1800px;
    background:
            linear-gradient(
                135deg,
                rgba(111, 66, 21, 0.9),
                rgba(158, 106, 47, 0.8)
            ),
            repeating-linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.06) 0,
                rgba(255, 255, 255, 0.06) 12px,
                transparent 12px,
                transparent 24px
            );
        color: #fff8ef;
    }

  .advent-door-face,
  .advent-door-reveal {
    width: 100%;
    height: 100%;
  }

  .advent-door-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.25rem;
    transform-origin: left center;
    backface-visibility: hidden;
    transition: transform 0.95s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    box-shadow: inset -18px 0 28px rgba(0, 0, 0, 0.12);
  }

    .advent-door-face strong {
        display: block;
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 0.6rem;
    }

  .advent-door-reveal {
    display: block;
    background: #fffdf8;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transform: scale(0.94) translateY(18px);
    transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .advent-card.is-revealed .advent-door-face {
    display: none;
  }

  .advent-card.is-revealed .advent-door-reveal {
    display: block;
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

  .advent-card.is-revealed .advent-door {
    cursor: default;
  }

  .advent-card.is-animating .advent-door-face {
    transform: rotateY(-128deg) translateX(-10px) scale(0.98);
    opacity: 0;
  }

  .advent-card.is-animating .advent-door-reveal,
  .advent-card.is-revealed .advent-door-reveal {
    opacity: 1;
    transform: scale(1);
  }

  .advent-bottle {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: contain;
    display: block;
    padding: 0.75rem;
    background: linear-gradient(180deg, #efe2cf, #fbf6ee);
  }

  .advent-bottle-link {
    display: block;
  }

  .advent-name-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.4rem;
  }

  .advent-name {
    margin: 0;
    font-size: 1.45rem;
    line-height: 1.25;
    font-weight: 700;
    flex: 1;
  }

  .advent-search {
    flex: 0 0 auto;
    padding: 0.42rem 0.65rem;
    border: 1px solid rgba(158, 106, 47, 0.32);
    border-radius: 999px;
    background: rgba(158, 106, 47, 0.12);
    color: var(--accent-deep);
    font-size: 0.76rem;
    font-weight: 700;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }

  .advent-search:hover,
  .advent-search:focus-visible {
    background: rgba(158, 106, 47, 0.18);
    border-color: rgba(158, 106, 47, 0.42);
    color: var(--accent-deep);
  }

    @media (min-width: 900px) {
        .advent-hero {
            grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
            align-items: center;
            padding: 2rem;
        }

        .advent-hero-copy {
            order: 1;
        }

        .advent-hero-media {
            order: 2;
        }
    }
</style>

<section class="advent-reveal">
    <div class="advent-shell">
        <div class="advent-hero">
            <div class="advent-hero-copy">
                <p class="advent-kicker">Scotch Club Source Remake</p>
                <h1 class="advent-title">Advent Calendar 2025</h1>
                <p class="advent-subtitle">
                    Same lineup text and original image assets from the source
                    page, but each day starts hidden so you can reveal the
                    bottle and name on demand.
                </p>
                <div class="advent-toolbar">
                    <button class="advent-button" type="button" id="reveal-all">
                        Reveal All
                    </button>
                    <button
                        class="advent-button secondary"
                        type="button"
                        id="hide-all"
                    >
                        Hide All
                    </button>
                </div>
            </div>
            <div class="advent-hero-media">
                <img
                    src="https://scotchclub.com/wp-content/uploads/2025/11/2025adventheader.jpg"
                    alt="Scotch Club Advent Calendar 2025 header"
                />
            </div>
        </div>

        <div class="advent-grid" id="advent-grid"></div>
    </div>
</section>

    const grid = document.getElementById("advent-grid");

    function revealMarkup(item) {
        if (item.image) {
            return (
                '<a class="advent-bottle-link" href="' +
                item.image +
                '" target="_blank" rel="noopener noreferrer">' +
                '<img class="advent-bottle" src="' +
                item.image +
                '" alt="' +
                item.name.replace(/"/g, "&quot;") +
                '">' +
                "</a>"
            );
        }

        return "";
    }

    function renderCards() {
        grid.innerHTML = bottles
            .map((item) => {
                const searchUrl = "https://www.google.com/search?q=" + encodeURIComponent(item.name);
                return (
                    '<article class="advent-card" data-day="' +
                    item.day +
                    '">' +
                    '<div class="advent-card-head">' +
                    '<div class="advent-day">Day ' +
                    item.day +
                    "</div>" +
                    '<div class="advent-status" data-status>Hidden</div>' +
                    "</div>" +
                    '<div class="advent-card-body">' +
                    '<div class="advent-name-row" data-name-row hidden>' +
                    '<h2 class="advent-name" data-name>' +
                    item.name +
                    "</h2>" +
                    '<a class="advent-search" href="' +
                    searchUrl +
                    '" target="_blank" rel="noopener noreferrer">Google</a>' +
                    "</div>" +
                    '<div class="advent-door">' +
                    '<div class="advent-door-face">' +
                    "<div><strong>" +
                    item.day +
                    "</strong><div>Hidden bottle and name</div></div>" +
                    "</div>" +
                    '<div class="advent-door-reveal">' +
                    revealMarkup(item) +
                    "</div>" +
                    "</div>" +
                    '<button class="advent-button secondary" type="button" data-toggle>Reveal</button>' +
                    "</div>" +
                    "</article>"
                );
            })
            .join("");
    }

    function setCardState(card, revealed) {
        const nameRow = card.querySelector("[data-name-row]");
        const button = card.querySelector("[data-toggle]");
        const status = card.querySelector("[data-status]");

        card.classList.toggle("is-revealed", revealed);
        card.classList.remove("is-animating");
        nameRow.hidden = !revealed;
        button.textContent = revealed ? "Hide" : "Reveal";
        status.textContent = revealed ? "Revealed" : "Hidden";
    }

    function animateReveal(card) {
        const nameRow = card.querySelector("[data-name-row]");
        const button = card.querySelector("[data-toggle]");
        const status = card.querySelector("[data-status]");

        if (card.classList.contains("is-revealed") || card.classList.contains("is-animating")) {
            return;
        }

        card.classList.add("is-animating");
        nameRow.hidden = false;
        button.textContent = "Hide";
        status.textContent = "Opening";

        window.setTimeout(function () {
            card.classList.remove("is-animating");
            card.classList.add("is-revealed");
            status.textContent = "Revealed";
        }, 780);
    }

    renderCards();

  grid.addEventListener("click", function (event) {
    const button = event.target.closest("[data-toggle]");
    if (button) {
      const card = button.closest(".advent-card");
      if (card.classList.contains("is-revealed")) {
        setCardState(card, false);
      } else {
        animateReveal(card);
      }
      return;
    }

    const door = event.target.closest(".advent-door");
    if (!door) {
      return;
    }

    const card = door.closest(".advent-card");
    if (!card.classList.contains("is-revealed")) {
      animateReveal(card);
    }
  });

    document
        .getElementById("reveal-all")
        .addEventListener("click", function () {
            document.querySelectorAll(".advent-card").forEach(function (card) {
                setCardState(card, true);
            });
        });

    document.getElementById("hide-all").addEventListener("click", function () {
        document.querySelectorAll(".advent-card").forEach(function (card) {
            setCardState(card, false);
        });
    });
</script>
